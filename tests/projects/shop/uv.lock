version = 1
revision = 3
requires-python = ">=3.11"

[manifest]
members = [
    "shop-api",
    "shop-lib",
]

[[package]]
name = "shop-api"
version = "0.1.0"
source = { virtual = "api" }
dependencies = [
    { name = "shop-lib" },
]

[package.metadata]
requires-dist = [{ name = "shop-lib", virtual = "lib" }]

[[package]]
name = "shop-lib"
version = "0.1.0"
source = { virtual = "lib" }
