id = "ruff-09"
request = """
`ruff check --verbose` aborts (SIGABRT) when stderr is a pipe that closes early

## Summary

When `--verbose` log output goes to a stderr pipe whose reader exits early, ruff aborts with SIGABRT (exit 134) instead of exiting cleanly. Closing stdout early is handled correctly; only the stderr/log path aborts.

## Reproduction (Linux, ruff 0.17.1 and 0.17.4)

```sh
d=$(mktemp -d); cd "$d"
for i in $(seq 1 3000); do printf 'import os\\nx = %d\\n' "$i" > "m$i.py"; done

ruff check --verbose --no-cache . 2>&1 | head -n 3 >/dev/null; echo "rc=${PIPESTATUS[0]}"
# rc=134 (SIGABRT), and systemd-coredump records a core

ruff check --verbose --no-cache . 2>/dev/null | head -n 1 >/dev/null; echo "rc=${PIPESTATUS[0]}"
# rc=0: closing stdout early is handled
```

This happens every time on 0.17.1 (Arch package) and 0.17.4 (`uvx --from ruff==0.17.4`).

## What happens (strace of the repro)

```
write(2, "[2026-11-06][18:44:44]", 22) = -1 EPIPE (Broken pipe)
write(2, "Error performing logging.\\n\\tattempted to log: ", 45) = -1 EPIPE (Broken pipe)
write(2, "\\n", 1)               = -1 EPIPE (Broken pipe)
write(2, "panicked at ", 12)    = -1 EPIPE (Broken pipe)
write(2, "Error performing logging.\\n\\tattempted to log: ", 45) = -1 EPIPE (Broken pipe)
write(2, "\\n", 1)               = -1 EPIPE (Broken pipe)
write(2, "panicked at ", 12)    = -1 EPIPE (Broken pipe)
-> SIGABRT
```

The first log write after `head` exits gets EPIPE. fern's (0.7.1) fallback, "Error performing logging…", also writes to the closed stderr, and the process panics. While the panic is being reported, the fallback runs again and fails again, so Rust aborts ("thread panicked while processing panic. aborting."). The core dump agrees: the crashing worker thread has two nested copies of the same frame sequence ending in `abort()`. The Arch build ships no debug symbols, so I can't name the frames.

## Expected

Exit quietly (or with a non-zero status) when stderr is closed, the way the stdout path already does. Related issues fixed earlier for other commands: #13442, #13483, #15586.

## Context

Found because an agent ran `ruff check --verbose . 2>&1 | head -n 30` and the machine's crash notifier reported a ruff core dump."""
