# ruff-24: The formatter must flip string-literal quotes inside interpolations nested in an f-string format spec, as
# it does for ordinary interpolations, so output stays valid before Python 3.12.
# issue opened 2026-09-01, fix opened 2026-09-02, squash (or single commit); source files:
# crates/ruff_python_formatter/src/context.rs, crates/ruff_python_formatter/src/other/f_string.rs,
# crates/ruff_python_formatter/src/other/interpolated_string_element.rs,
# crates/ruff_python_formatter/src/other/t_string.rs, crates/ruff_python_formatter/src/string/implicit.rs (81 lines);
# request from oldest of 2 edit records.
# reading notes: Issue offers flipping inner quotes or keeping the outer quote; tests pin flipping, the issue's first
# and consistent option. Small doubt.
# added to the candidate's hidden tests:
# crates/ruff_python_formatter/resources/test/fixtures/ruff/expression/nested_string_quote_style.py
[[situation]]
id = "ruff-24"
request = """
Formatter reuses outer quote in f-string format-spec interpolations, emitting pre-3.12 invalid syntax with target-version py311

## Summary

`ruff format` changes an f-string's outer quotes from `'` to `"` and correctly flips the quotes of string literals in normal interpolations, but string literals in interpolations nested **inside a format spec** keep their `"` quotes. The result reuses the outer quote character inside the f-string, which is a syntax error before Python 3.12 (PEP 701) — even when targeting Python 3.11.

## Reproduction (ruff 0.16.5)

```console
$ cat mini.py
a = f'x {d["k"]} y'
b = f'x {v:,.{d["n"]}f} y'
$ ruff format --isolated --target-version py311 mini.py
1 file reformatted
$ cat mini.py
a = f"x {d['k']} y"
b = f"x {v:,.{d["n"]}f} y"
```

`a` is handled correctly (inner quotes flipped to `'`). In `b`, the interpolation inside the format spec keeps `"` and now reuses the outer quote.

ruff's own parser rejects the output:

```console
$ ruff check --isolated --target-version py311 --select E9 mini.py
invalid-syntax: Cannot reuse outer quote character in f-strings on Python 3.11 (syntax was added in Python 3.12)
```

CPython 3.11 rejects it the same way. Also reproduces without an explicit `--target-version` when `pyproject.toml` has `requires-python = ">=3.11"`.

## Expected

Per the formatter docs (quote alternation for nested literals when targeting < 3.12; "Ruff prioritizes preventing syntax errors"), the inner quotes should be flipped to `'` — as already happens for interpolations outside format specs — or the outer quote left unchanged.

## Environment

ruff 0.16.5, macOS (arm64), also reproduced via `uv tool run ruff@0.16.5`."""
