id = "ruff-13"
request = """
[Panic] ruff format --check crashes on files starting with a UTF-8 BOM

## Summary

`ruff format --check` panics inside `ruff_annotate_snippets` on Python files that start with a UTF-8 BOM, whenever the rendered annotation reaches the end of the file. Regression introduced in **0.16.1** — 0.16.0 and earlier report the file normally.

## Minimal reproduction

A file containing only a UTF-8 BOM (3 bytes) is enough, with default settings:

```bash
python -c "open('repro.py','wb').write(b'\\xef\\xbb\\xbf')"
ruff format --check repro.py
```

Actual output:

```
thread 'main' (NNNN) panicked at crates\\ruff_annotate_snippets\\src\\renderer\\source_map.rs:185:13:
Annotation range `0..3` is beyond the end of buffer `0`
note: run with `RUST_BACKTRACE=1` environment variable to display a backtrace
```

Expected (ruff 0.16.0): `Would reformat: repro.py`.

## Real-world trigger

It also fires on ordinary BOM'd files whose `--check` annotation covers the end of the file. From a real repo, a 185-line test file panics with:

```
Annotation range `0..6618` is beyond the end of buffer `6615`
```

The consistent 3-byte overflow suggests the byte range is computed over the raw source (BOM included) while the rendered buffer has the 3 BOM bytes stripped — so any annotation touching the tail overflows by exactly 3.

## Version bisect

| Version | Result |
|---|---|
| 0.15.0 | ok |
| 0.16.0 | ok |
| 0.16.1 | **panic** |
| 0.16.5 | **panic** |
| 0.16.10 | **panic** |

## Scope

- `ruff format --check` — panics (this report)
- `ruff format --diff` — unaffected (plain unified-diff renderer)
- `ruff format` (write mode) — unaffected; correctly strips the BOM
- `ruff check` (lint) — unaffected

## Environment

- ruff 0.16.1–0.16.10 via `uv` (`uvx ruff@<version>`)
- Windows 11, x86_64 — the panic site looks platform-independent, but I haven't verified other OSes."""
