# from: .github/workflows/ci.yaml@eb4e0b24cb job cargo-test-linux (`cargo insta test --all-features`), the same at d297b16535;
#   crates/ruff_mdtest/tests/mdtest.rs@eb4e0b24cb (datatest harness: test names `mdtest::<path under
#   crates/ruff_linter/resources/mdtest>`), crates/ruff_python_formatter/tests/fixtures.rs@eb4e0b24cb
#   (`format::<fixture>`, `black_compatibility::<fixture>`), insta's default snapshot names (CRATE__MODULE__NAME.snap)
# unverified: never run on ruff itself. The runner (rust-test-files.py plus the ruff hook below) was run against a
#   synthetic workspace shaped like ruff (linter lib with snapshots and fixtures, an mdtest harness=false target, the
#   formatter's fixtures target with required-features, the CLI's tests/cli/main.rs) with cargo 1.98.
test_files = '''
set -euo pipefail
export INSTA_UPDATE=no CI=true CARGO_INCREMENTAL=0 MDTEST_UPDATE_SNAPSHOTS=0
unset INSTA_FORCE_PASS MDTEST_TEST_FILTER MDTEST_EXTERNAL RUFF_UPDATE_SCHEMA
python3 - {files} <<'PY'
# bench: run only the given Rust test files. Each .rs file goes to the cargo target that compiles it (read from
# `cargo metadata`): an integration test target (--test NAME), the library (--lib) or a binary (--bin NAME), with a
# libtest filter for the file's module path (or its test function names), so only that file's tests run. Data files
# and helper modules with no test in them travel but are not run. Exits non-zero when a file can't be placed, when
# nothing in the list can run, or when a run executes no test (an empty run would pass vacuously).
import json, os, re, subprocess, sys

files = [f for f in sys.argv[1:] if f]
meta = json.loads(subprocess.run(["cargo", "metadata", "--no-deps", "--offline", "--format-version", "1"],
                                 check=True, capture_output=True, text=True).stdout)
root = meta["workspace_root"]
members = set(meta["workspace_members"])
TARGETS = []  # dicts: pid, pkg, sel (cargo args), src, dir (the crate root's folder); paths relative to root
for p in meta["packages"]:
    if p["id"] not in members:
        continue
    for t in p["targets"]:
        kinds = set(t["kind"])
        if "test" in kinds:
            sel = ["--test", t["name"]]
        elif kinds & {"lib", "rlib", "proc-macro", "cdylib", "staticlib", "dylib"}:
            sel = ["--lib"]
        elif "bin" in kinds:
            sel = ["--bin", t["name"]]
        else:
            continue  # build scripts, examples, benches
        if t.get("required-features"):
            sel += ["--features", ",".join(t["required-features"])]
        src = os.path.relpath(t["src_path"], root)
        TARGETS.append({"pid": p["id"], "pkg": p["name"], "sel": sel, "src": src, "dir": os.path.dirname(src)})


def read(path):
    try:
        with open(os.path.join(root, path), errors="replace") as f:
            return f.read()
    except OSError:
        return ""


def place(path):
    """The targets compiling `path`: the target whose crate root it is, else those whose crate root folder is the
    deepest one holding it; among several, those whose root declares the file's top module, a library before a
    binary."""
    exact = [t for t in TARGETS if t["src"] == path]
    if exact:
        return exact
    holding = [t for t in TARGETS if t["dir"] == "" or path.startswith(t["dir"] + "/")]
    if not holding:
        return []
    deepest = max(len(t["dir"]) for t in holding)
    cands = [t for t in holding if len(t["dir"]) == deepest]
    if len(cands) > 1:
        top = os.path.relpath(path, cands[0]["dir"]).split("/")[0]
        top = top[:-3] if top.endswith(".rs") else top
        declaring = [t for t in cands if re.search(rf"\bmod\s+{re.escape(top)}\b|#\[path\s*=\s*\"[^\"]*{re.escape(top)}",
                                                    read(t["src"]))]
        cands = declaring or cands
        libs = [t for t in cands if t["sel"][0] == "--lib"]
        cands = libs or cands
    return cands


TEST_ATTR = re.compile(r"#\[\s*(?:[\w:]+::)?(?:test|tokio::test|test_case|rstest|case|quickcheck|proptest)\b")


def test_fns(path):
    """Test function names in a file: a `fn` soon after an attribute naming a test."""
    names, armed = [], 0
    for line in read(path).splitlines():
        s = line.strip()
        if TEST_ATTR.search(s):
            armed = 8
        m = re.match(r"(?:pub(?:\([^)]*\))?\s+)?(?:async\s+)?fn\s+(\w+)", s)
        if m and armed:
            names.append(m.group(1))
            armed = 0
        elif armed and s and not s.startswith(("#", "//")):
            armed -= 1
    return names


def module_path(path, t):
    rel = os.path.relpath(path, t["dir"])[:-3].split("/")
    if rel[-1] == "mod":
        rel = rel[:-1]
    return "::".join(rel)


# --- ruff: snapshots, fixtures and mdtest files -------------------------------------------------------------
# CI runs `cargo insta test --all-features`; ruff_linter's `test-rules` feature gates some of its tests.
PKG_ARGS = {"ruff_linter": ["--all-features"]}
LATE = []  # fixture folders, resolved once every listed file is placed


def target_of(pkg, sel0, name=None):
    for t in TARGETS:
        if t["pkg"] == pkg and t["sel"][0] == sel0 and (name is None or t["sel"][1] == name):
            return t
    return None


def add(runs, t, filt):
    key = (t["pid"], t["pkg"], tuple(t["sel"]))
    if filt is None:
        runs[key] = None
    elif runs.get(key, ()) is not None:
        runs[key] = set(runs.get(key, ())) | set(filt)


def snap(path, runs):
    """An insta snapshot: the test module (or datatest fn) that writes it."""
    stem = os.path.basename(path)[:-len(".snap")]
    if "@" in stem and "__" not in stem.split("@")[0]:
        # datatest fixtures (formatter `format@...`, `black_compatibility@...`, parser `valid_syntax@...`): the test
        # fn before the `@`, in the crate's integration test that defines it
        fn = stem.split("@")[0]
        crate = path.split("/tests/")[0] if "/tests/" in path else path.split("/src/")[0]
        ts = [t for t in TARGETS if t["sel"][0] == "--test" and t["dir"].startswith(crate + "/")
              and re.search(rf"\bfn\s+{re.escape(fn)}\s*\(", read(t["src"]))]
        for t in ts:
            add(runs, t, [fn + "::"])
        return bool(ts)
    # insta's default name: CRATE__MODULE__PATH__NAME.snap in a snapshots/ folder beside the module's file
    segs = stem.split("__")
    folder = os.path.dirname(os.path.dirname(path))
    ts = [t for t in place(folder + "/__snapshot__.rs")
          if (t["sel"][0] == "--test" and t["sel"][1] == segs[0]) or (t["sel"][0] != "--test" and
                                                                      t["pkg"].replace("-", "_") == segs[0])]
    for t in ts:
        mods, cur = [], t["dir"]
        for s in segs[1:]:
            if s and (os.path.isdir(os.path.join(root, cur, s)) or os.path.isfile(os.path.join(root, cur, s + ".rs"))):
                mods.append(s)
                cur = os.path.join(cur, s)
            else:
                break
        rest = segs[1 + len(mods):]
        if len(rest) > 1 and rest[0] == "tests":
            mods.append("tests")
        add(runs, t, ["::".join(mods) + "::"] if mods else None)
    return bool(ts)


def project_hook(path, runs, other):
    if "/resources/mdtest/snapshots/" in path:
        return False  # an mdtest's external snapshot: data, travels with its .md
    m = re.match(r"crates/ruff_linter/resources/mdtest/(.+\.md)$", path)
    if m and target_of("ruff_mdtest", "--test", "mdtest"):
        add(runs, target_of("ruff_mdtest", "--test", "mdtest"), ["mdtest::" + m.group(1)])
        return True
    m = re.match(r"crates/ty_python_semantic/resources/mdtest/(.+\.md)$", path)
    if m and target_of("ty_python_semantic", "--test", "mdtest"):
        add(runs, target_of("ty_python_semantic", "--test", "mdtest"), ["mdtest::" + m.group(1)])
        return True
    if path.endswith(".snap"):
        return snap(path, runs)
    m = re.match(r"crates/ruff_linter/resources/test/fixtures/([^/]+)/", path)
    if m:
        LATE.append(("ruff_linter", "--lib", None, "rules::" + m.group(1) + "::", "crates/ruff_linter/src/rules/" + m.group(1), path))
        return True
    m = re.match(r"crates/ruff_python_formatter/resources/test/fixtures/(ruff|black)/", path)
    if m:
        fn = "format" if m.group(1) == "ruff" else "black_compatibility"
        LATE.append(("ruff_python_formatter", "--test", "fixtures", fn + "::", None, path))
        return True
    return False


def project_finish(runs):
    """A fixture runs the tests that read it, unless a listed snapshot already runs them."""
    for pkg, sel0, name, filt, need, path in LATE:
        t = target_of(pkg, sel0, name)
        if t is None or (need and not os.path.isdir(os.path.join(root, need))):
            print(f"bench: {path} is a data file: it travels, it is not run", flush=True)
            continue
        have = runs.get((t["pid"], t["pkg"], tuple(t["sel"])), ())
        if have is None or any(f.startswith(filt) or filt.startswith(f) for f in have):
            continue
        add(runs, t, [filt])


runs = {}    # (pid, pkg, sel) -> set of filters, or None for the whole target
other = []   # commands a project hook adds: lists of argv
placed, errors = [], []
for f in files:
    if project_hook(f, runs, other):
        continue
    if not f.endswith(".rs"):
        print(f"bench: {f} is a data file: it travels, it is not run", flush=True)
        continue
    ts = place(f)
    if not ts:
        errors.append(f"{f}: no cargo target of this workspace compiles it")
        continue
    placed.append((f, ts))
listed = {}
for f, ts in placed:
    for t in ts:
        listed.setdefault((t["pid"], t["pkg"], tuple(t["sel"])), set()).add(f)
for f, ts in placed:
    fns = test_fns(f)
    for t in ts:
        key = (t["pid"], t["pkg"], tuple(t["sel"]))
        if f == t["src"]:
            if t["sel"][0] == "--test" and len(listed[key]) == 1 and (fns or re.search(r"^\s*(pub\s+)?mod\s+\w+\s*;",
                                                                                      read(f), re.M)):
                runs[key] = None          # the test target is this file (and the modules it declares): all of it
                continue
            filt = fns                    # a crate root: its own test functions only
        elif fns:
            filt = [module_path(f, t) + "::"]
        else:
            filt = []
        if not filt:
            print(f"bench: {f} holds no test of {t['pkg']} {' '.join(t['sel'])}: it travels, it is not run", flush=True)
            continue
        if runs.get(key, ()) is not None:
            runs[key] = set(runs.get(key, ())) | set(filt)
project_finish(runs)
for e in errors:
    print(f"bench: {e}", flush=True)
if errors:
    sys.exit(2)
if not runs and not other:
    print("bench: nothing in the list can run", flush=True)
    sys.exit(2)


def stream(cmd, cwd):
    """Run cmd, echo its output, return (exit code, tests run)."""
    proc = subprocess.Popen(cmd, cwd=cwd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, errors="replace")
    ran = 0
    for line in proc.stdout:
        sys.stdout.write(line)
        # passed + failed from libtest's (and libtest-mimic's, kitest's) summary: `running N` counts ignored tests too
        m = re.search(r"test result: (?:\x1b\[[\d;]*m)*\w+(?:\x1b\[[\d;]*m)*\. (\d+) passed; (\d+) failed", line)
        if m:
            ran += int(m.group(1)) + int(m.group(2))
    sys.stdout.flush()
    return proc.wait(), ran


status = 0
for (pid, pkg, sel), filt in sorted(runs.items(), key=lambda kv: (kv[0][1], kv[0][2])):
    cmd = ["cargo", "test", "-p", pid, *sel, *PKG_ARGS.get(pkg, []), "--no-fail-fast", "--", *sorted(filt or [])]
    print("bench: " + " ".join(["cargo", "test", "-p", pkg, *cmd[4:]]), flush=True)
    code, ran = stream(cmd, root)
    if code != 0:
        status = 1
    elif ran == 0:
        print(f"bench: no test ran for {pkg} {' '.join(sel)} {sorted(filt or [])}", flush=True)
        status = 1
for cmd in other:
    print("bench: " + " ".join(cmd), flush=True)
    code, _ = stream(cmd, root)
    if code != 0:
        status = 1
sys.exit(status)
PY
'''
# from: ci.yaml@eb4e0b24cb (`--all-features`; ruff_linter's test-rules feature gates some tests), rust-common.md 5
# unverified: never run; the `.` fallback (ruff_linter + ruff_mdtest) is this file's choice, not the project's.
test_package = '''
