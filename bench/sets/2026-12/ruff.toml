request = """
RUF065 false positive with unpacked argument

### Summary

[`logging-eager-conversion` (RUF065)](https://docs.astral.sh/ruff/rules/logging-eager-conversion/) emits a false positive when the argument with the putatively unnecessary conversion follows an unpacked argument. The rule assumes the unpacked argument corresponds to exactly one format specifier, but it might not. The suggested fix can change the program’s behavior. [Example](https://play.ruff.rs/2559d0e5-776b-4974-a991-f297581202fa):
```console
$ cat >ruf065.py <<'# EOF'
import logging
logging.warning("%s%s%s%s %r", *"1234", str(5))
# EOF

$ python ruf065.py
WARNING:root:1234 '5'

$ ruff --isolated check --preview --select RUF065 ruf065.py 
logging-eager-conversion: Unnecessary `str()` conversion when formatting with `%s`
 --> ruf065.py:2:41
  |
1 | import logging
2 | logging.warning("%s%s%s%s %r", *"1234", str(5))
  |                                         ^^^^^^
  |

Found 1 error.

$ sed -i.bak 's/str//' ruf065.py  # This is implied to be the fix

$ python ruf065.py
WARNING:root:1234 5
```

### Version

