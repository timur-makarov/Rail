[project]
name = "ruff"
repo = "https://github.com/astral-sh/ruff"
language = "rust"
package = "ruff"
tests = [
    "crates/*/tests/*",
    "crates/*/src/*/snapshots/*.snap",
    "crates/*/src/*/tests.rs",
    "crates/*/resources/mdtest/*.md",
]
clash = "path"

[commands]
# from: rust-toolchain.toml@eb4e0b24cb (pin 1.100.0; 1.97.0 at d297b16535), CONTRIBUTING.md@eb4e0b24cb, rust-common.md
# unverified: rustup on the bench's PATH, and the toolchain install, were not run; read from the pin files only.
setup = '''
set -euo pipefail
command -v rustup >/dev/null || { echo "bench: rustup is not on PATH"; exit 1; }
mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
read -r tc comps tgts < <(python3 - <<'PY'
