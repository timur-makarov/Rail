id = "ruff-18"
request = """
`runtime-evaluated-decorators` incorrectly applies runtime semantics to annotation assignments in function body

### Summary

The initial implementation of applying `runtime-evaluated-decorators` to function signatures in #9317 was flawed, which was subsequently fixed by #10091, however the fix didn't remove the flawed branch that was introduced by #9317.

Annotation assignments inside function scopes never result in any actual code for the annotation expressions, they get silently dropped by the compiler and are missing completely from the resulting byte code, so they can never be anything other than typing only.

```py
from pydantic import validate_call

if TYPE_CHECKING:
    from .foo import Foo

@validate_call
def baz() -> None:
    x: Foo = ...

```

```toml
[lint]
select = [ "TC" ]

[lint.flake8-type-checking]
runtime-evaluated-decorators = [ "pydantic.validate_call" ]
```

[Playground](https://play.ruff.rs/65b49094-2d51-4456-baad-2978b241860d)




