[[situation]]
id = "ruff-06"
request = """
RUF072 fix introduces a syntax error when the `try` body is on the same line as `try:`

### Summary

The fix for [`useless-finally` (RUF072)](https://docs.astral.sh/ruff/rules/useless-finally/) introduces a syntax error when the statement is a bare `try`/`finally` and the `try` body is on the same line as `try:`. This is a safe fix, so plain `--fix` hits it.

```python
try: foo()
finally: pass
```

```console
$ ruff check --isolated --preview --select RUF072 --fix example.py
error: Fix introduced a syntax error. Reverting all changes.

This indicates a bug in Ruff. If you could open an issue at:

    https://github.com/astral-sh/ruff/issues/new?title=%5BFix%20error%5D

...quoting the contents of `example.py`, the rule codes RUF072, along with the `pyproject.toml` settings and executed command, we'd be very appreciative!

useless-finally: Empty `finally` clause
 --> example.py:2:1
  |
1 | try: foo()
2 | finally: pass
  | ^^^^^^^^^^^^^
help: Remove the `finally` clause
  |
1 | try: foo()
  - finally: pass
  |

Found 1 error.
[*] 1 fixable with `--fix`.
```

As the diff in the help shows, the fix only removes the `finally` line and leaves `try: foo()` with no handler. The expected result is `foo()`.

Other inputs that hit the same error:

```python
try: pass
finally: ...
```

```python
try: a(); b()
finally: pass
```

```python
def f():
    try: return 1
    finally: pass
```

These work as expected:

- `try:` with the body on its own line (`try:\\n    foo()\\nfinally: pass` becomes `foo()`)
- a one-line body with an `except` clause (`try: foo()\\nexcept ValueError: pass\\nfinally: pass` only drops the `finally` line)

I think the cause is in the bare `try`/`finally` branch of `useless_finally.rs`. It takes the body text from `source.line_start(first_body_stmt.start())`. When the body is on the `try:` line, that line start is the start of the `try:` line itself, so the "unwrapped" body is `try: foo()`. That text then replaces the whole statement.

I found this by running the rule on CPython's test suite: `Lib/test/test_grammar.py` (lines 1408 and 1431) and `Lib/test/test_opcodes.py` (line 19) both contain `try: pass` / `finally: pass`.

### Version

ruff 0.17.4 (Windows). The fix logic in `useless_finally.rs` on `main` is unchanged since this release."""
