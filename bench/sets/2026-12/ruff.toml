# ruff-36: Generated Ruff suppression comments (RUF105 fix, docs) should be written as `# ruff: ignore[...]` with a
# space after the colon.
# issue opened 2026-07-22, fix opened 2026-07-23, squash (or single commit); source files: crates/ruff/src/args.rs,
# crates/ruff_linter/src/noqa.rs, crates/ruff_linter/src/rules/ruff/rules/noqa_comments.rs,
# crates/ruff_linter/src/rules/ruff/rules/rule_codes_in_suppression_comments.rs, crates/ruff_linter/src/suppression.rs
# (104 lines); request from body (never edited).
# reading notes: Tests also change --add-ignore output and diagnostic messages; server test is in-process LSP, not a
# browser. Issue states the exact form.
[[situation]]
id = "ruff-36"
request = """
Inconsistent spacing in new `# ruff:{ignore,file-ignore,disable,enable}` comments

### Summary

I was testing out the following rules:

- `RUF105` (`noqa-comments`)
- `RUF106` (`rule-codes-in-suppression-comments`)

I've noticed that `RUF105` will convert to the new suppression comment without a space after the colon, i.e. `# ruff:ignore[...]`. This lack of space character seems to be consistent with the documentation for the rules linked above, one example showing:

> This rule applies to `ruff:ignore`, `ruff:file-ignore`, `ruff:disable`, and `ruff:enable` comments.

But this is not consistent with the documentation on suppression and action comments in general for both ruff and ty:

- https://docs.astral.sh/ruff/linter/#error-suppression
- https://docs.astral.sh/ruff/linter/#isort-action-comments
- https://docs.astral.sh/ruff/formatter/#format-suppression
- https://docs.astral.sh/ty/suppression/

We see the following:

- `# noqa: ...`, `# ruff: noqa: ...`
- `# isort: skip_file`, `# isort: on`, `# isort: off`, `# isort: skip`, and `# isort: split`
- `# fmt: on`, `# fmt: off`, `# fmt: skip`
- `# ty: ignore[...]`, `# type: ignore[ty:...]`, `# type: ignore[...]`

Many other existing tools typically also have a space after the colon as the standard form (while accepting it being missing): `black`, `isort`, `mypy`, `pyrefly`, `pyright`, etc.

Would it be possible to make this consistent before these rules are released out of preview? This would mean:

1. Update any documentation to change the following:
  - `# ruff:ignore[...]` → `# ruff: ignore[...]`
  - `# ruff:file-ignore[...]` → `# ruff: file-ignore[...]`
  - `# ruff:disable[...]` → `# ruff: disable[...]`
  - `# ruff:enable[...]` → `# ruff: enable[...]`
2. Update `RUF105` to write `# ruff: ignore[...]` and `# ruff: file-ignore[...]`

### Version

ruff 0.15.22"""
