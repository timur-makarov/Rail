redundant-numeric-union (PYI041) --fix incorrect fix for functools.singledispatch registered function

### Summary

Applying PYI041 --fix will replace a numeric union like `int | float` with `float`, but this is an incorrect fix for a method that is annotated with `@func.dispatch` for a functools.singledispatch function.
Minimal example code:
```
import functools

@functools.singledispatch
def int_or_float(value: object) -> str:
