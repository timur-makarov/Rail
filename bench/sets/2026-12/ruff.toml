# ruff-01: FAST003 should not report a path parameter as missing when it is supplied by a class injected via `param:
# Class = Depends()`.
# issue opened 2026-11-16, fix opened 2026-11-19, squash (or single commit); source files:
# crates/ruff_linter/src/rules/fastapi/rules/fastapi_unused_path_parameter.rs (19 lines); request from body (never
# edited).
# reading notes: Snapshot only adds a context line; the assertion is the absence of a new diagnostic for the added
# fixture case.
# added to the candidate's hidden tests: crates/ruff_linter/resources/test/fixtures/fastapi/FAST003.py
[[situation]]
id = "ruff-01"
request = """
[FAST003] False positive when dependency shortcut is used with default argument: `param: Class = Depends()`

### Summary

### Summary

Rule `FAST003` (`fast-api-unused-path-parameter`) raises a false positive when a path parameter is declared inside a dependency class and injected using FastAPI's standard dependency shortcut as a default value: `param: Class = Depends()`.

FastAPI's [documentation on Classes as Dependencies](https://fastapi.tiangolo.com/tutorial/dependencies/classes-as-dependencies/#shortcut) notes that:
> `commons: CommonQueryParams = Depends()`
> You declare the dependency as the type of the parameter, and you use `Depends()` without any parameter.

Ruff recognizes `Depends()` without arguments inside `Annotated[Class, Depends()]`, but does not resolve the class when it is declared as a typed default parameter (`param: Class = Depends()`).

### Example Code

```python
from fastapi import FastAPI, Depends

app = FastAPI()

class ItemParams:
    def __init__(self, item_id: int):
        self.item_id = item_id

# False positive: FAST003 Parameter `item_id` appears in route path, but not in `read_item` signature
@app.get("/items/{item_id}")
def read_item(params: ItemParams = Depends()):
    return {"item_id": params.item_id}
```

### Expected Behavior

Ruff should inspect the type annotation of `params` (`ItemParams`) when `Depends()` has no arguments, extract `item_id` from `ItemParams.__init__`, and avoid emitting `FAST003`.

### Actual Behavior

Ruff emits:
```text
FAST003 Parameter `item_id` appears in route path, but not in `read_item` signature
```

### Version

ruff 0.17.4"""
start = "eb4e0b24cbeca03c309ee8afd38e5fdd492e3e3f"
fix = "6006216e29e03693550deef8157b3237e17234d1"
hidden_tests = ["crates/ruff_linter/resources/test/fixtures/fastapi/FAST003.py", "crates/ruff_linter/src/rules/fastapi/snapshots/ruff_linter__rules__fastapi__tests__fast-api-unused-path-parameter_FAST003.py.snap"]
