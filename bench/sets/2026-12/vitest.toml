# packages/vitest/src/runtime/workers/watchdog.ts (96 lines); request from body (never edited).
# reading notes: text suggests a watchdog thread; process-kill e2e with a 5s liveness poll, POSIX-leaning; test also
# covers vmForks
[[situation]]
id = "vitest-04"
request = """
forks pool: worker survives a killed vitest process while a test runs a synchronous loop

When the main vitest process dies (SIGKILL, a closed terminal, a cancelled CI step) while a test in a `forks` worker is stuck in a synchronous loop, the worker keeps running indefinitely. It only notices the dead parent on its next IPC send, which a blocked event loop never reaches, and `testTimeout` can't fire either. Found one such worker that had been running at 100% CPU for 3.5 h.

Seen on vitest 5.0.5. On `main` ([`f21f224ba`](https://github.com/vitest-dev/vitest/commit/f21f224ba)), [`init-forks.ts`](https://github.com/vitest-dev/vitest/blob/main/packages/vitest/src/runtime/workers/init-forks.ts) still exits only from `onError` on `ERR_IPC_CHANNEL_CLOSED` / `EPIPE`, i.e. after a failed send. A `disconnect` listener wouldn't help either, since the main thread's event loop is blocked.

### Reproduction

```ts
// loop.test.ts
import { test } from 'vitest'
test(`spins`, () => { while (true) {} })
```

1. `vitest run loop.test.ts` (default `pool: 'forks'`)
2. `kill -9 <vitest main pid>`
3. `ps -o pid,ppid,etime,%cpu,command | grep vitest`: the fork is still running, reparented to PID 1

Expected: the fork exits when its parent dies.

### Workaround

A `node:worker_threads` thread in a setup file polls `process.ppid` and SIGKILLs the process when it changes:

```ts
import { Worker } from 'node:worker_threads'
if (process.send) {
  const watchdog = `const ppid = process.ppid
setInterval(() => process.ppid !== ppid && process.kill(process.pid, 'SIGKILL'), 1000)`
  new Worker(watchdog, { eval: true }).unref()
}
```

Something like this could live in the forks child itself."""
