# vitest-08: Failures from expect.soft combined with .resolves/.rejects lose their stack location in the report.
# issue opened 2026-10-30, fix opened 2026-10-30, squash (or single commit); source files:
# packages/expect/src/utils.ts, packages/vitest/src/integrations/snapshot/chai.ts (8 lines); request from oldest of 13
# edit records.
# reading notes: filed by fixer; links point to local paths; text names the cause and a fix
[[situation]]
id = "vitest-08"
request = """
`expect.soft` + `.resolves`/`.rejects` failures lose their location


When an assertion fails under `expect.soft(…)` combined with `.resolves` or `.rejects`, the error has no stack frames. The report prints no `❯ file:line:col` and no code frame. This happens with any matcher, not just snapshots. `expect.soft` alone and `.rejects` alone both keep the location.

## Repro

[repro/](repro/) is a standalone project pinned to the beta. It has [repro.test.ts](repro/repro.test.ts), a `.snap` file with outdated values, and `update: 'none'`.

```bash
cd ~/.local/share/ho-dev-notes/vitest/soft-rejects-snapshot-stack/repro && npm install && npx vitest run
```

Each test failed on purpose. This is where its reported location pointed ([full output](repro.out.txt)):

| Test | Assertion | Location |
|---|---|---|
| rejects snapshot | `expect(p).rejects.toMatchSnapshot()` | `repro.test.ts:4:49` |
| rejects toThrow | `expect(p).rejects.toThrow('old')` | `repro.test.ts:24:49` |
| soft sync toBe | `expect.soft('new').toBe('old')` | `repro.test.ts:28:22` |
| soft rejects snapshot | `expect.soft(p).rejects.toMatchSnapshot()` | **none** |
| soft resolves snapshot | `expect.soft(p).resolves.toMatchSnapshot()` | **none** |
| soft rejects toThrow | `expect.soft(p).rejects.toThrow('old')` | **none** |
| soft rejects toThrowErrorMatchingSnapshot | `expect.soft(p).rejects.toThrowErrorMatchingSnapshot()` | **none** |
| soft rejects, promise resolves | `expect.soft(Promise.resolve('new')).rejects.toThrow('old')` | `repro.test.ts:32:44` |

Same assertion, with and without `.soft`:

- 🟢 `rejects` only

```text
 FAIL  repro.test.ts > rejects snapshot
Error: Snapshot `rejects snapshot 1` mismatched

Expected: "[Error: old]"
Received: "[Error: new]"

 ❯ repro.test.ts:4:49
      2|
      3| test('rejects snapshot', async () => {
      4|   await expect(Promise.reject(new Error('new'))).rejects.toMatchSnapsh…
       |                                                 ^
```

- 🔴 `soft` + `rejects`

```text
 FAIL  repro.test.ts > soft rejects snapshot
Error: Snapshot `soft rejects snapshot 1` mismatched

Expected: "[Error: old]"
Received: "[Error: new]"

⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯[2/7]⎯
```

The earlier e2e probe ([rejects-stack-probe.test.ts](../pr-11325-snapshot-review/rejects-stack-probe.test.ts)) shows the same thing in browser mode (Chromium), on a workspace build whose snapshot matcher code matches `main`.

## Cause

Code links are to `main` at 54a2bdb81, in the main worktree.

The matcher runs inside a promise callback, so the error it throws has only internal frames in its stack. Vitest filters those out, which leaves `stacks` empty. `.resolves` and `.rejects` have a fix for this: the getter creates an `Error` when it is accessed, at the user's line ([jest-expect.ts:972](../../../../../code/others/vitest/packages/expect/src/jest-expect.ts#L972), [:1035](../../../../../code/others/vitest/packages/expect/src/jest-expect.ts#L1035)). A `.catch` on the promise chain then rewrites the failing error's stack to that one ([:1013](../../../../../code/others/vitest/packages/expect/src/jest-expect.ts#L1013), [:1080](../../../../../code/others/vitest/packages/expect/src/jest-expect.ts#L1080)).

`expect.soft` bypasses that fix. Under `.soft`, the matcher called at [:1000](../../../../../code/others/vitest/packages/expect/src/jest-expect.ts#L1000) and [:1075](../../../../../code/others/vitest/packages/expect/src/jest-expect.ts#L1075) is `wrapAssertion`'s soft wrapper ([utils.ts:95](../../../../../code/others/vitest/packages/expect/src/utils.ts#L95)). The wrapper catches the matcher's error itself and calls `handleTestError` ([utils.ts:136](../../../../../code/others/vitest/packages/expect/src/utils.ts#L136)), which runs `processError` and records the error on the test right away. So:

1. The error is recorded with its original stack, which has no user frames.
2. The wrapper returns normally, so the promise chain resolves and the `.catch` that would have rewritten the stack never runs.

```text
expect.soft(p).rejects.toThrow('old')
  rejects getter: error = new Error('rejects')       ← user's line, kept for later
  promise.then(err => matcher())                     ← runs in a microtask
    soft wrapper: try { toThrow() } catch (e) {
      handleTestError(test, e)                       ← recorded here, original stack
    }                                                ← no rethrow
  .catch(err => err.stack = error.stack)             ← skipped, nothing rejected
```

The "promise resolves" row confirms this. There the promise resolves, so `.rejects` throws its own "promise resolved … instead of rejecting" error before any matcher runs. That error does reach the `.catch` and gets the user's stack. The soft handler in `recordAsyncExpect` records it afterwards ([utils.ts:48](../../../../../code/others/vitest/packages/expect/src/utils.ts#L48)), and the location is kept. Only errors from the matcher itself lose it.

A fix could rewrite the stack before recording: in the soft wrapper, when the `error` flag is set, copy its stack onto the caught error ahead of `handleTestError`. Another option is to skip the soft wrapper inside `.resolves`/`.rejects`, so the error flows through the existing `.catch` and then `recordAsyncExpect`'s soft handler. Either way, the fix covers every matcher, not just snapshots.

## Relation to PR 11325

PR 11325 copies the `.resolves`/`.rejects` stack (the chai `error` flag) onto the thrown error inside the snapshot matchers' `assertMatchResult`. Non-soft async snapshot failures already get the right stack from the `.catch` above, so that copy only changes anything under `expect.soft`. This is why its review screen shows "Source:" for `expect.soft(…).rejects.toThrowErrorMatchingSnapshot(…)`. It doesn't help other matchers, such as `soft rejects toThrow` above. The fix belongs in the soft wrapper or in the `.resolves`/`.rejects` getters, not in the snapshot matchers."""
