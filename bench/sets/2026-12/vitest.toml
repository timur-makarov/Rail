`preTransformRequests` disabled on browser mode

I just realized config and server unification https://github.com/vitest-dev/vitest/pull/10554 now forces this disabled on client environment and this can affect perf on browser mode. The following is an AI write up:

--- 

[PR #10554](https://github.com/vitest-dev/vitest/pull/10554) unified each browser project's separate browser Vite server with its project server. This appears to have changed `preTransformRequests` for browser mode as a side effect.

Before #10554, the [separate browser server options](https://github.com/vitest-dev/vitest/blob/b4dddb1d2ed04b552f7a493c7e0f8b5e45697531/packages/browser/src/node/index.ts#L76-L83) disabled HMR and watching but did not set `preTransformRequests`, so Vite's client default remained enabled. The separate root Vitest server independently [set it to `false`](https://github.com/vitest-dev/vitest/blob/b4dddb1d2ed04b552f7a493c7e0f8b5e45697531/packages/vitest/src/node/plugins/index.ts#L90).

After the servers were unified, browser mode inherited the shared server's [`preTransformRequests: false`](https://github.com/vitest-dev/vitest/blob/6198fd2e5ee2ca0d3256920aeb06a5d9c69ba0c3/packages/vitest/src/node/plugins/server.ts#L29-L34). The environment plugin also [forces it to `false` for every environment](https://github.com/vitest-dev/vitest/blob/6198fd2e5ee2ca0d3256920aeb06a5d9c69ba0c3/packages/vitest/src/node/plugins/runnerTransform.ts#L67-L84), including the native browser `client` environment."""
