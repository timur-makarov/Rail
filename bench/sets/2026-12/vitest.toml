# vitest-29: clearCache() deletes the fsModuleCache _metadata.json, so after a second lockfile change the cache is not
# reset and stale modules break vi.mock with the deps optimizer.
# issue opened 2026-09-08, fix opened 2026-09-08, squash (or single commit); source files:
