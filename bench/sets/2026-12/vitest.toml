# vitest-12: After --changed/related filtering, isolate:false workers should still re-run setup files before every
# test file, including from the fs module cache.
# issue opened 2026-10-14, fix opened 2026-10-16, squash (or single commit); source files:
# packages/vitest/src/node/cache/fsModuleCache.ts, packages/vitest/src/node/environments/transformService.ts (11
