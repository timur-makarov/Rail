ReferenceError: process is not defined - Issue on vitest@5 teardown during unfinished async operations

### Describe the bug

On vitest 5, running a project unit tests through vitest's vm pool (used automatically for jsdom/happydom for example) intermittently throws `ReferenceError: process is not defined` as an unhandled rejection, even though every test passes.

This error comes from the repro repository linked below:
```
⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯Unhandled Rejection ⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯
ReferenceError: process is not defined
 ❯ file003.test.ts:14:3
     12|   }
     13|
     14|   mockedAsyncCall(110).then(() => {
       |   ^
     15|     process.on('exit', () => {});
     16|   });

This error originated in "file001.test.ts" test file. It doesn't mean the error was thrown inside the file itself, but while it was running.
```

This happens when a test (or code that passes through the test) kicks off async work it does not await and that work resolves after the file batch teardown runs.

`runVmTests()`'s teardown (added in #10854) calls `stripDisposedContext()`, which deletes every global added to the vm context after an initial snapshot — including `process`, `global`, `setImmediate`, and `clearImmediate`, since all four get assigned after that snapshot is taken. The PR's body says:

> Additionally, runVmTests now clears a disposed context on teardown: globals added by the test file are deleted and document.body/document.head are emptied. Pristine globals are kept so that work queued before the teardown (jsdom events, worker fixture cleanups) still runs.

`process` and the timer globals aren't file-specific state, so they don't look like they were meant to land in the removable set.

I believe this is an issue on vitest specifically as many async operations are outside the control of the developer authoring the tests, they can be v8 internals (garbage collection), specific libraries internals or angular/RxJS operations.

For what is worth on a big monorepo I'm working on, this is a blocker from migrating to v5 as we have an average of 489 failures across 23 unrelated project all of which are outside our control.

