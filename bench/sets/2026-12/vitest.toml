detectAsyncLeaks reports process.stdin as a leaked PIPEWRAP in 5.0

### Describe the bug

With `detectAsyncLeaks: true`, accessing `process.stdin` anywhere in a test file, including indirectly at module load, is reported as an async leak on Vitest 5.0.1. Vitest 4.1.11 does not report it.

`process.stdin` is created lazily by Node and lives for the whole process, so it is not something a test can or should close. In practice it is reached through dependencies. For example, `vfile` (used by `unified`, `remark` and `react-markdown`) imports `node:process` in its Node build, which is enough to trigger it. In our suite that produced one leak per test file that rendered markdown (26 files), each pointing at the `import Markdown from 'react-markdown'` line.

It happens with both `environment: 'node'` and `environment: 'jsdom'`, and whether stdin is a pipe or `/dev/null`.

### Reproduction

```ts
// vitest.config.ts
import { defineConfig } from 'vitest/config'
export default defineConfig({ test: { detectAsyncLeaks: true } })
```

```ts
// stdin.test.ts
import { test } from 'vitest'

void process.stdin

test('touches process.stdin', () => {})
```

```
$ npx vitest run
⎯⎯⎯⎯⎯⎯⎯ Async Leaks 1 ⎯⎯⎯⎯⎯⎯⎯⎯
PIPEWRAP leaking in stdin.test.ts
