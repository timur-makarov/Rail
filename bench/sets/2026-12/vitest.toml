# vitest-14: The /@vite/client stub's hot context should expose a per-module import.meta.hot.data object.
# issue opened 2026-10-08, fix opened 2026-10-15, squash (or single commit); source files:
# packages/vitest/src/runtime/moduleRunner/moduleEvaluator.ts (29 lines); request from body (never edited).
[[situation]]
id = "vitest-14"
request = """
/@vite/client stub's createHotContext returns a hot context without the documented "data" property

### Describe the bug

**I am doing**: running unit tests with `environment: 'happy-dom'`. Vite's `importAnalysis`
plugin rewrites any module whose source references `import.meta.hot` by prepending

```js
import { createHotContext as __vite__createHotContext } from "/@vite/client";
import.meta.hot = __vite__createHotContext("…")`,
```

and Vitest serves the `/@vite/client` id with a hard-coded stub (`defaultClientStub` in
`packages/vitest/src/runtime/moduleRunner/moduleEvaluator.ts`).

**What I expect is**: the stub's hot context to honor the documented `ViteHotContext` contract
(https://vite.dev/guide/api-hmr `readonly data`, "Vite creates one `import.meta.hot.data`
object for each module path"). The stub already replicates the rest of the surface
(`accept`, `prune`, `dispose`, `decline`, `invalidate`, `on`, `send`).

**What actually happens is**: `import.meta.hot` is the stub object (truthy, so `if (import.meta.hot)`
guards pass) but `import.meta.hot.data` is `undefined`, so any legitimate `hot.data[key]` reader
crashes. Real-world example: `@lexical/extension`'s HMRExtension (wired with the documented
`configExtension(HMRExtension, { hot: import.meta.hot ?? null })` pattern) throws
`TypeError: Cannot read properties of undefined (reading 'lexicalHMR:…')` in every unit test
