id = "vitest-29"
request = """
cache bug with both fsModuleCache and deps.optimizer.ssr enabled

### Describe the bug

`ensureCacheIntegrity()` compares the lockfile hash against `_metadata.json` and wipes the cache when it differs. But `clearCache()` removes the whole directory, `_metadata.json` included, and the file is never rewritten. On the next lockfile change there is no metadata, so it takes the "just store a new one, don't reset the cache" branch and stale entries survive.

When the deps optimizer is active, transformed modules embed `?v=<browserHash>` on every node_modules import, and that hash is derived from the lockfile. Stale entries import `left-pad?v=<old>` while `vi.mock('left-pad')` registers against `?v=<new>`: different module id, mock never applies, no error.

Affects 4.1.x and 5.0.0.

### Reproduction

 ```
   mkdir repro && cd repro && mkdir src
   pnpm add -D vitest left-pad@1.3.0 tiny-invariant@1.3.1

   # vitest.config.js
   import { defineConfig } from 'vitest/config';
   export default defineConfig({
     test: {
       fsModuleCache: true,                       // v4: experimental: { fsModuleCache: true }
       deps: { optimizer: { ssr: { enabled: true, include: ['tiny-invariant'] } } },
     },
   });

   # src/pad.js
   import leftPad from 'left-pad';
   export const pad = (s) => leftPad(s, 3);

   # src/pad.test.js
   import { expect, it, vi } from 'vitest';
   import { pad } from './pad.js';
   vi.mock('left-pad', () => ({ default: () => 'MOCKED' }));
   it('mocks left-pad', () => expect(pad('x')).toBe('MOCKED'));
 ```

 ```
   pnpm vitest run                     # ✓ 1 passed
   pnpm add -D tiny-invariant@1.3.3    # lockfile change #1
   pnpm vitest run                     # ✓ 1 passed  — cache wiped, _metadata.json now ABSENT
   pnpm add -D tiny-invariant@1.3.1    # lockfile change #2
   pnpm vitest run                     # ✗ expected '  x' to be 'MOCKED'
 ```

