# vitest-02: After a timeout aborts the test context signal, later retry or repeat attempts reuse the aborted signal;
# each attempt should get a new one.
# issue opened 2026-11-11, fix opened 2026-11-17, squash (or single commit); source files:
# packages/vitest/src/runtime/runner/context.ts, packages/vitest/src/runtime/runner/run.ts,
# packages/vitest/src/runtime/runner/suite.ts (38 lines); request from body (never edited).
# reading notes: filed by fixer; text names the cause; tests use 100ms timeouts
[[situation]]
id = "vitest-02"
request = """
`context.signal` stays aborted in retries after a timeout

### Describe the bug

The test context `signal` is created once for each test. When an attempt times out, Vitest aborts it, and every later attempt of the same test (`retry` or `repeats`) gets the same aborted signal. Code that stops on `signal.aborted`, or that passes the signal to `fetch`, fails at once in the retry.

### Reproduction

```ts
import { expect, test } from 'vitest'

let attempt = 0

test('the retry gets a new signal', { retry: 1, timeout: 100 }, async ({ signal }) => {
  attempt++
  if (attempt === 1) {
    // the first attempt times out
    await new Promise((resolve) => setTimeout(resolve, 200))
  }
  expect(signal.aborted).toBe(false)
})
```

```
 FAIL  signal.test.js > the retry gets a new signal (initial run)
Error: Test timed out in 100ms.

 FAIL  signal.test.js > the retry gets a new signal (1st retry)
AssertionError: expected true to be false // Object.is equality
```

### Expected behavior

Each attempt gets its own `signal`, so the retry passes.

### Notes

`createTestContext` creates one `AbortController` for each test context (`packages/vitest/src/runtime/runner/context.ts`), and `runTest` uses the same context for every retry and repeat. Reproduced on `main` (5.1.0)."""
start = "016581e5382aa79615c290096205d4296f44420f"
fix = "77a306757d6291a0ce6f6adb7142e39886f08ffe"
hidden_tests = ["test/e2e/test/signal.test.ts"]
closed = 2026-11-17
kind = "wrong-result"
half = "work"
issue = "https://github.com/vitest-dev/vitest/issues/11938"
pull = 11998
self_filed = true
bot_filed = false
security_trap = false

# vitest-03: The JSON reporter marks a test file as passed with success true when its worker crashes before the file
# finishes.
# issue opened 2026-11-14, fix opened 2026-11-14, squash (or single commit); source files:
# packages/vitest/src/node/reporters/json.ts (28 lines); request from oldest of 2 edit records.
# reading notes: filed by fixer
