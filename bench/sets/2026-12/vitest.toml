[[situation]]
id = "vitest-10"
request = """
automocking a generator function changes the original function's prototype chain

### Describe the bug

when the automocker mocks a generator or async generator function, the mock gets the original's `prototype` object instead of its own. `mockReset()` or `mockImplementation()` on the mock then calls `Object.setPrototypeOf` on that shared object, which changes the real function: its generators lose `next` and `Symbol.asyncIterator`

in one test file this quietly breaks the real module. when the original is shared with other code (node builtins, external deps) that breaks too. we hit it through an external dep

`spy: true` has the same problem via `mockImplementation()`. any function whose `prototype` isnt a plain object and has no methods is affected, e.g. `F.prototype = new Map()`

where: `mockObject` in `packages/mocker/src/automocker.ts` copies values that arent plain objects as-is, including a function's `prototype`. `reparentMockPrototype` in `packages/spy/src/index.ts` then re-parents `mock.prototype` when it has no methods. #11195 stopped this creating a cycle under `spy: true`, but the original still gets changed

fix: dont copy a `prototype` like that onto the mock, so the mock keeps its own. branch with the fix and tests, id like to send it as a PR:
https://github.com/vitest-dev/vitest/compare/main...maschwenk:vitest:fix/automock-shared-prototype

### Reproduction

https://github.com/maschwenk/vitest-automock-prototype-repro

```js
import { setInterval } from 'node:timers/promises'
import { expect, test, vi } from 'vitest'

vi.mock(import('node:timers/promises'))

test('mocking does not change the real setInterval', async () => {
  vi.mocked(setInterval).mockReset()

  const actual = await vi.importActual('node:timers/promises')
  for await (const _ of actual.setInterval(1)) break
})

test('vi.mockObject does not change the original', () => {
  async function* gen() {}
  const parent = Object.getPrototypeOf(gen.prototype)

  vi.mockObject({ gen }).gen.mockReset()

  expect(Object.getPrototypeOf(gen.prototype)).toBe(parent)
})
```

expected: both pass, the real `setInterval` and `gen` are untouched

actual: the first throws `TypeError: actual.setInterval(...) is not a function or its return value is not async iterable`. the second fails because `gen.prototype` now inherits from `Object.prototype`

