# vitest: vitest-dev/vitest, typescript, reserve project of set 2026-12 (fulltest PLAN sections 3 and 4).
# Settings: written by reading the project's CI and docs at the oldest and newest start commit, nothing run;
# every command marked `unverified` is for the admission session to try and fix. Notes: notes/vitest.md.
# Situations: every candidate of bench-candidates/vitest.toml (REPORT-window-rule.md, 2026-11-26), in its order,
# all 35 of them.
# half is `work` for every candidate until the split after admission and the hardness runs (cloud/README.md).
# hidden_tests: the fix's changed files (start..fix, compare API) that match [project] tests or the travel
# globs ["test/**", "packages/ui/client/**/__snapshots__/**"],
# and not []; deleted files left out.
# self_filed: the issue's author opened the fix. bot_filed: the issue's author is an automation account
# (a login ending in bot or -ci, or turso-github-handyman, roboturso). security_trap: the reading pass's
# flag for a request whose natural fix invites a flaw. kind race is the race flag.

# vitest-dev/vitest for Rail's bench: [project], [commands], [rail.config.commands]. No [[situation]] tables here.
# Read at the oldest start d758b4755dc7534118fa0f62f16758881a8a6123 (vitest-35, pnpm 11.6.0, eslint) and the newest
# start 68dc42ccc9ac8ee74b71416b659630296ee97e9b (vitest-01, pnpm 11.28.6, oxlint). See vitest.md.
#
# Shape of every test command: (1) use the pnpm that package.json pins, installed by setup into $BENCH_CACHE/pnpm/V;
# (2) if pnpm-lock.yaml differs from HEAD, install offline from the store; (3) rebuild packages/*/dist when the
# packages/ tree differs from the last build (tests run the BUILT packages, never src); (4) run vitest from the
# suite's own folder test/SUITE with CI=true, as CI and AGENTS.md do; ANSI colour is stripped from the output only.

[project]
name = "vitest"
repo = "https://github.com/vitest-dev/vitest"
language = "typescript"
package = "vitest"
tests = [
  "test/**/*.test.ts", "test/**/*.test.mts", "test/**/*.test.cts", "test/**/*.test.js", "test/**/*.test.mjs",
  "test/**/*.test.cjs", "test/**/*.test.tsx", "test/**/*.test.jsx", "test/**/*.test-d.ts", "test/**/*.spec.ts",
  "test/**/*.spec.js", "test/**/*.spec.tsx", "packages/ui/client/**/*.spec.ts",
]
# default typescript build_dirs (node_modules dist) are enough: no tracked file lives in a folder named dist; two
# fixture folders named node_modules ARE tracked (see vitest.md). Do not add "coverage" or ".cache": tracked source
# lives in packages/vitest/src/integrations/coverage and test/e2e/fixtures/dotted-files/**/.cache.

[commands]
# from: .github/workflows/ci.yml@68dc42ccc9 (pnpm i --filter '!docs'; setup-playwright: playwright install chromium
#   --only-shell; pnpm run build) and the same steps at d758b4755d; CONTRIBUTING.md and AGENTS.md@68dc42ccc9
# unverified: installing the pinned pnpm with npm into $BENCH_CACHE, the --store-dir, and `playwright install-deps`
#   as root on Ubuntu 24.04 (CI's ubuntu runner has the libraries already) were not run anywhere.
setup = '''
set -euo pipefail
unset CLAUDECODE CLAUDE_CODE AI_AGENT
V=$(node -p 'require("./package.json").packageManager.split("@")[1].split("+")[0]')
P="$BENCH_CACHE/pnpm/$V"
if [ ! -x "$P/bin/pnpm" ]; then
  mkdir -p "$BENCH_CACHE/pnpm"
  rm -rf "$P.tmp.$$"
  npm_config_cache="$BENCH_CACHE/npm-cache" npm install -g --no-fund --no-audit --prefix "$P.tmp.$$" "pnpm@$V"
  mv -T "$P.tmp.$$" "$P" 2>/dev/null || rm -rf "$P.tmp.$$"
fi
export PATH="$P/bin:$PATH" PLAYWRIGHT_BROWSERS_PATH="$BENCH_CACHE/ms-playwright"
[ "$(pnpm --version)" = "$V" ] || { echo "bench: pnpm on PATH is not $V"; exit 1; }
pnpm install --frozen-lockfile --store-dir "$BENCH_CACHE/pnpm-store" --filter '!docs'
pw=test/e2e/node_modules/playwright/cli.js
[ -f "$pw" ] || pw=test/browser/node_modules/playwright/cli.js
if [ "$(id -u)" = 0 ] && command -v apt-get >/dev/null; then
  node "$pw" install-deps chromium || echo "bench: playwright install-deps failed; browser-mode tests may fail"
fi
env -u PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD node "$pw" install chromium --only-shell
rm -f node_modules/.bench-build node_modules/.bench-build.log
pnpm run build > node_modules/.bench-build.log 2>&1 || { tail -n 80 node_modules/.bench-build.log; exit 1; }
st=$( { git rev-parse HEAD:packages; git diff HEAD --binary -- packages; git ls-files -o --exclude-standard -z -- packages | xargs -0r sha256sum; } | sha256sum | cut -c1-64 )
printf '%s\n' "$st" > node_modules/.bench-build
echo "bench: files setup left visible to git (should be none):"
git status --porcelain --untracked-files=all | head -n 20
'''

# from: AGENTS.md@68dc42ccc9 ("CI=true cd test/<test-folder> && pnpm test <test-file>"; "Tests execute built output
#   ... rebuild before re-running tests"), test/*/package.json "test" scripts (vitest; node --test for node-runner)
# unverified: the stamp-gated rebuild, the offline install when pnpm-lock.yaml changed, running vitest.mjs by path,
#   the fixture->importer fallback (vitest-27 hides only test/unit/test/fixtures/timers.suite.ts) and node --test's
#   tap reporter were not run; the build step itself is CI's (`pnpm run build`, about 18 s on CI's 4-core runner).
test_files = '''
set -o pipefail
unset CLAUDECODE CLAUDE_CODE AI_AGENT NO_COLOR FORCE_COLOR GITHUB_ACTIONS
R=$PWD
V=$(node -p 'require("./package.json").packageManager.split("@")[1].split("+")[0]')
export PATH="$BENCH_CACHE/pnpm/$V/bin:$PATH" PLAYWRIGHT_BROWSERS_PATH="$BENCH_CACHE/ms-playwright"
[ "$(pnpm --version 2>/dev/null)" = "$V" ] || { echo "bench: pnpm $V is not in \$BENCH_CACHE/pnpm (run setup)"; exit 2; }
if ! git diff --quiet HEAD -- pnpm-lock.yaml; then
  pnpm install --offline --frozen-lockfile --ignore-scripts --store-dir "$BENCH_CACHE/pnpm-store" --filter '!docs' || exit 2
fi
st=$( { git rev-parse HEAD:packages; git diff HEAD --binary -- packages; git ls-files -o --exclude-standard -z -- packages | xargs -0r sha256sum; } | sha256sum | cut -c1-64 )
if [ ! -f packages/vitest/dist/cli.js ] || [ "$(cat node_modules/.bench-build 2>/dev/null)" != "$st" ]; then
  rm -f node_modules/.bench-build node_modules/.bench-build.log
  pnpm run build > node_modules/.bench-build.log 2>&1 || { tail -n 60 node_modules/.bench-build.log; echo "bench: build failed"; exit 2; }
  printf '%s\n' "$st" > node_modules/.bench-build.tmp && mv -f node_modules/.bench-build.tmp node_modules/.bench-build
fi
L=""
for f in {files}; do
  case "$f" in
    test/*/*) s=${f#test/}; s=${s%%/*}; r=${f#test/$s/} ;;
    packages/ui/*) s=@ui; r=${f#packages/ui/} ;;
    *) continue ;;
  esac
  k=x
  case "/$r" in
    */fixtures/*|/deps/*|*/__snapshots__/*) ;;
    *) case "$r" in *.test.[cm][jt]s|*.test.[jt]s|*.test.[jt]sx|*.test-d.ts|*.spec.[jt]s|*.spec.[jt]sx) k=t ;; esac ;;
  esac
  L="$L$s $k $r
"
done
rc=0; n=0
for s in $(printf '%s' "$L" | awk 'NF{print $1}' | sort -u); do
  if [ "$s" = @ui ]; then d=packages/ui; else d=test/$s; fi
  T=$(printf '%s' "$L" | awk -v s="$s" '$1==s && $2=="t"{print $3}' | sort -u)
  if [ -z "$T" ]; then
    for r in $(printf '%s' "$L" | awk -v s="$s" '$1==s && $2=="x"{print $3}'); do
      case "$r" in *.ts|*.js|*.mts|*.mjs|*.cts|*.cjs|*.tsx|*.jsx) ;; *) continue ;; esac
      b=${r##*/}; b=${b%.*}
      T="$T $(cd "$d" && grep -rlF --include='*.test.*' --include='*.spec.*' --exclude-dir=node_modules --exclude-dir=fixtures -e "$b" . | sed 's|^\./||')"
    done
    T=$(printf '%s\n' $T | sort -u)
  fi
  [ -n "$(printf '%s' "$T" | tr -d '[:space:]')" ] || continue
  n=$((n+1))
  echo "bench: $d:" $T
  case "$s" in
    node-runner) (cd "$d" && node --test --test-reporter=tap $T) || rc=1 ;;
    ui|browser|workspaces-browser) echo "bench: $d needs Playwright Test or every browser: not run"; rc=1 ;;
    *) (cd "$d" && CI=true node "$R/packages/vitest/vitest.mjs" run $T 2>&1 | sed -u -e 's/\x1b\[[0-9;]*[A-Za-z]//g' -e 's/\r$//') || rc=1 ;;
  esac
done
[ "$n" -gt 0 ] || { echo "bench: no runnable test file among the given files"; exit 1; }
exit $rc
'''

# from: .github/workflows/ci.yml@68dc42ccc9 (test:ci:unit, test:ci:e2e, test:ci:coverage run each suite whole;
#   CI times on a 4-core runner: test/unit 63 s, test/e2e 355 s, test/coverage-test 199 s; build 18 s)
# unverified: which suites stand for which package is a choice made here (vitest's tests all live in test/*);
#   typical run for packages/vitest (unit + e2e) is 8 to 12 minutes on 4 cores.
test_package = '''
set -o pipefail
unset CLAUDECODE CLAUDE_CODE AI_AGENT NO_COLOR FORCE_COLOR GITHUB_ACTIONS
R=$PWD
V=$(node -p 'require("./package.json").packageManager.split("@")[1].split("+")[0]')
export PATH="$BENCH_CACHE/pnpm/$V/bin:$PATH" PLAYWRIGHT_BROWSERS_PATH="$BENCH_CACHE/ms-playwright"
[ "$(pnpm --version 2>/dev/null)" = "$V" ] || { echo "bench: pnpm $V is not in \$BENCH_CACHE/pnpm (run setup)"; exit 2; }
if ! git diff --quiet HEAD -- pnpm-lock.yaml; then
  pnpm install --offline --frozen-lockfile --ignore-scripts --store-dir "$BENCH_CACHE/pnpm-store" --filter '!docs' || exit 2
fi
st=$( { git rev-parse HEAD:packages; git diff HEAD --binary -- packages; git ls-files -o --exclude-standard -z -- packages | xargs -0r sha256sum; } | sha256sum | cut -c1-64 )
if [ ! -f packages/vitest/dist/cli.js ] || [ "$(cat node_modules/.bench-build 2>/dev/null)" != "$st" ]; then
  rm -f node_modules/.bench-build node_modules/.bench-build.log
  pnpm run build > node_modules/.bench-build.log 2>&1 || { tail -n 60 node_modules/.bench-build.log; echo "bench: build failed"; exit 2; }
  printf '%s\n' "$st" > node_modules/.bench-build.tmp && mv -f node_modules/.bench-build.tmp node_modules/.bench-build
fi
p={package}
case "$p" in
  packages/coverage-v8|packages/coverage-istanbul) S="coverage-test" ;;
  packages/ui) S="@ui" ;;
  packages/*) S="unit e2e" ;;
  test/unit|test/e2e|test/coverage-test|test/node-runner|test/typescript|test/workspaces) S=${p#test/} ;;
  *) S="unit" ;;
esac
rc=0
for s in $S; do
  if [ "$s" = @ui ]; then d=packages/ui; else d=test/$s; fi
  echo "bench: $d: every test"
  case "$s" in
    node-runner) (cd "$d" && node --test --test-reporter=tap test/*.test.js) || rc=1 ;;
    typescript|workspaces) (cd "$d" && CI=true pnpm run test 2>&1 | sed -u -e 's/\x1b\[[0-9;]*[A-Za-z]//g' -e 's/\r$//') || rc=1 ;;
    *) (cd "$d" && CI=true node "$R/packages/vitest/vitest.mjs" run 2>&1 | sed -u -e 's/\x1b\[[0-9;]*[A-Za-z]//g' -e 's/\r$//') || rc=1 ;;
  esac
done
exit $rc
'''

package_of = 'regex:^((?:packages|test)/[^/]+)/'

# from: the "Failed Tests" summary of packages/vitest/src/node/reporters/base.ts@68dc42ccc9 (printTaskErrors:
#   " FAIL " + formatProjectName + full name + optional " (attempts)" + " [ file ]" for a file-level error) and the
#   line ` FAIL   main  test/fs-module-cache-resiliency.test.ts:234 > parallel runs ...` in CI job 139492536662
#   (colour stripped); the second branch is node --test's TAP (`not ok N - name`), unverified against a log.
# The name keeps vitest's `:LINE` (includeTaskLocation is on in every suite config).
failed = '^(?: ?FAIL +(?:\|[^|\n]+\| |[\w.-]+  )?| *not ok \d+ - (?!.*# (?:TODO|SKIP)))(\S.*?)(?: \((?:[^()\n]*(?:initial run|retry|repeat|times)[^()\n]*)\))?(?: \[ [^\]\n]+ \])? *$'
timeout_minutes = 40

[commands.env]
BASH_DEFAULT_TIMEOUT_MS = "1800000"
BASH_MAX_TIMEOUT_MS = "7200000"
npm_config_manage_package_manager_versions = "false"
pnpm_config_pm_on_fail = "ignore"
PNPM_CONFIG_TRUST_LOCKFILE = "true"
PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN = "false"
PNPM_CONFIG_CONFIRM_MODULES_PURGE = "false"
COREPACK_ENABLE_STRICT = "0"
COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"
PUPPETEER_SKIP_DOWNLOAD = "1"
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
SKIP_SIMPLE_GIT_HOOKS = "1"
HUSKY = "0"

[rail.config.commands]
# from: the bench brief's worktree rule (copy from the main checkout) and CONTRIBUTING.md@68dc42ccc9 ("pnpm run build
#   to build all monorepo packages")
# unverified: cp -al of every node_modules folder of the main checkout, then an offline build in the worktree
#   (about 20 to 60 s); never run.
setup = '''
set -euo pipefail
unset CLAUDECODE CLAUDE_CODE AI_AGENT
main=$(cd "$(git rev-parse --path-format=absolute --git-common-dir)/.." && pwd -P)
if [ "$main" != "$(pwd -P)" ]; then
  while IFS= read -r -d '' d; do
    [ -e "$d" ] && continue
    [ -d "$(dirname "$d")" ] || continue
    cp -al "$main/$d" "$d" 2>/dev/null || { rm -rf "$d"; cp -a "$main/$d" "$d"; }
  done < <(cd "$main" && find . -path ./.claude -prune -o -type d -name node_modules -prune -print0)
fi
V=$(node -p 'require("./package.json").packageManager.split("@")[1].split("+")[0]')
export PATH="$BENCH_CACHE/pnpm/$V/bin:$PATH"
[ "$(pnpm --version 2>/dev/null)" = "$V" ] || { echo "bench: pnpm $V is not in \$BENCH_CACHE/pnpm"; exit 2; }
if [ ! -d node_modules ] || ! git diff --quiet HEAD -- pnpm-lock.yaml; then
  pnpm install --offline --frozen-lockfile --ignore-scripts --store-dir "$BENCH_CACHE/pnpm-store" --filter '!docs'
fi
st=$( { git rev-parse HEAD:packages; git diff HEAD --binary -- packages; git ls-files -o --exclude-standard -z -- packages | xargs -0r sha256sum; } | sha256sum | cut -c1-64 )
if [ ! -f packages/vitest/dist/cli.js ] || [ "$(cat node_modules/.bench-build 2>/dev/null)" != "$st" ]; then
  rm -f node_modules/.bench-build node_modules/.bench-build.log
  pnpm run build > node_modules/.bench-build.log 2>&1 || { tail -n 60 node_modules/.bench-build.log; echo "bench: build failed"; exit 2; }
  printf '%s\n' "$st" > node_modules/.bench-build.tmp && mv -f node_modules/.bench-build.tmp node_modules/.bench-build
fi
'''

# from: .github/workflows/ci.yml@68dc42ccc9 lint job (build, `pnpm run lint`, `pnpm run typecheck`) and test job
#   (test:ci:unit / e2e / coverage); same steps at d758b4755d, where lint is eslint instead of oxlint+oxfmt
# unverified: the affected-suite choice; start commit with no change runs build + lint + typecheck + test/unit
#   (about 5 to 7 min); a change under packages/ adds test/e2e (6 to 9 min), coverage packages add test/coverage-test.
verify = '''
set -euo pipefail
unset CLAUDECODE CLAUDE_CODE AI_AGENT NO_COLOR FORCE_COLOR GITHUB_ACTIONS
R=$PWD
V=$(node -p 'require("./package.json").packageManager.split("@")[1].split("+")[0]')
export PATH="$BENCH_CACHE/pnpm/$V/bin:$PATH" PLAYWRIGHT_BROWSERS_PATH="$BENCH_CACHE/ms-playwright"
[ "$(pnpm --version 2>/dev/null)" = "$V" ] || { echo "bench: pnpm $V is not in \$BENCH_CACHE/pnpm"; exit 2; }
if ! git diff --quiet HEAD -- pnpm-lock.yaml; then
  pnpm install --offline --frozen-lockfile --ignore-scripts --store-dir "$BENCH_CACHE/pnpm-store" --filter '!docs'
fi
st=$( { git rev-parse HEAD:packages; git diff HEAD --binary -- packages; git ls-files -o --exclude-standard -z -- packages | xargs -0r sha256sum; } | sha256sum | cut -c1-64 )
if [ ! -f packages/vitest/dist/cli.js ] || [ "$(cat node_modules/.bench-build 2>/dev/null)" != "$st" ]; then
  rm -f node_modules/.bench-build node_modules/.bench-build.log
  pnpm run build > node_modules/.bench-build.log 2>&1 || { tail -n 60 node_modules/.bench-build.log; echo "bench: build failed"; exit 2; }
  printf '%s\n' "$st" > node_modules/.bench-build.tmp && mv -f node_modules/.bench-build.tmp node_modules/.bench-build
fi
pnpm run lint
pnpm run typecheck
base="${RAIL_BASE:-refs/heads/main}"
ch=$( { git diff --name-only "$base" --; git ls-files --others --exclude-standard; } | sort -u )
S="unit"
if grep -qE '^packages/coverage-(v8|istanbul)/' <<<"$ch"; then S="$S coverage-test"; fi
if awk '/^packages\// && !/^packages\/(coverage-v8|coverage-istanbul|ui)\//{f=1} END{exit !f}' <<<"$ch"; then S="$S e2e"; fi
if grep -q '^packages/ui/' <<<"$ch"; then S="$S @ui"; fi
for t in e2e coverage-test node-runner; do
  if grep -q "^test/$t/" <<<"$ch"; then S="$S $t"; fi
done
rc=0
for s in $(printf '%s\n' $S | awk '!seen[$0]++'); do
  if [ "$s" = @ui ]; then d=packages/ui; else d=test/$s; fi
  echo "bench: $d: every test"
  case "$s" in
    node-runner) (cd "$d" && node --test --test-reporter=tap test/*.test.js) || rc=1 ;;
    *) (cd "$d" && CI=true node "$R/packages/vitest/vitest.mjs" run 2>&1 | sed -u -e 's/\x1b\[[0-9;]*[A-Za-z]//g' -e 's/\r$//') || rc=1 ;;
  esac
done
exit $rc
'''
timeout_secs = 900
setup_timeout_secs = 900
verify_timeout_secs = 1800

# The bench's additions, the same for every project file of this set:
# - [commands] env BASH_DEFAULT_TIMEOUT_MS and BASH_MAX_TIMEOUT_MS: the Bash tool limits Rail's own
#   .claude/settings.json gives its worker, given to every child, so a plain arm's Bash tool is not cut at
#   two minutes while Rail's runs for thirty.
# - [rail.config.worker] ladder: the Rail arm of the first run (PLAN section 6, owner 2026-11-25): Sonnet 5.5
#   medium, then Opus 5.5 medium. It sits here because an arm file can give only one rung (bench/arms.py);
#   person_ladder and contract stay as Rail's seed has them.
# - [rail.config.claim] stale_minutes: above the longest Rail command's limit plus save_minutes (10), as
#   `rail docs config` asks.
[rail.config.worker]
ladder = ["claude-sonnet-5-5:medium", "claude-opus-5-5:medium"]

[rail.config.claim]
stale_minutes = 45

