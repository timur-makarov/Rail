# vitest-05: Asks for environment variables (VITEST_FS_MODULE_CACHE, VITEST_FS_MODULE_CACHE_PATH) to disable or
# relocate fsModuleCache, with config and CLI keeping priority.
# issue opened 2026-11-03, fix opened 2026-11-03, squash (or single commit); source files:
# packages/vitest/src/node/config/resolveConfig.ts (11 lines); request from body (never edited).
# reading notes: variable names were given as examples in the issue and match the tests
[[situation]]
id = "vitest-05"
request = """
Allow configuring fsModuleCache from an environment variable

### Clear and concise description of the problem

`fsModuleCache` can only be disabled or relocated from the project config or the CLI (`fsModuleCache`, `fsModuleCachePath`, `--no-fsModuleCache`, `--fsModuleCachePath`). There is no way to do it from the environment.

That matters when the environment owner and the project owner are different people. We run an online course platform: each exercise is a container built from a shared base image, the exercise directory is not writable by the test user, and the exercise authors own `vitest.config.*` and `package.json`. Since #11781 (fix for #11777) the run no longer fails, but every `vitest` invocation now prints

```
fsModuleCache is enabled, but its directory "/usr/src/app/node_modules/.vitest-cache" could not be created (EACCES: permission denied, ...). Continuing without caching modules on disk. Set `fsModuleCache: false` to disable the cache and this warning.
```

so students see the warning on every test run, in hundreds of exercises we cannot edit one by one.

What we do today: the base image rewrites `vitest/vitest.mjs` to inject `--no-fsModuleCache` into `process.argv`. A wrapper earlier in `PATH` does not help, because `npx vitest` resolves the package bin directly. The patch breaks as soon as the entry file changes.

### Suggested solution

An environment variable read when the config is resolved, for example:

- `VITEST_FS_MODULE_CACHE_PATH=/var/tmp/vitest-cache` to relocate the cache, and/or
- `VITEST_FS_MODULE_CACHE=false` to disable it.

An explicit value in the config or on the CLI keeps priority over the variable. This follows what Vitest already does for the API token, which honors `XDG_DATA_HOME`.

### Alternative

- #11691 (default the cache to a subdirectory of Vite's `cacheDir`) would help only where `cacheDir` points somewhere writable, which again lives in the project config.
- Falling back to a writable location (for example `os.tmpdir()`) instead of warning when the default directory cannot be created.
- Printing the warning once per machine or only with `--reporter=verbose`.

### Additional context

Follow-up to #11777. Measured on a small exercise, the cache makes no difference for us (1.7–1.9 s per run either way), so disabling it is fine; the request is only about doing it without touching each project.

### Validations

- [x] Follow our Code of Conduct
- [x] Read the Contributing Guidelines.
- [x] Read the docs.
- [x] Check that there isn't already an issue that requests the same feature to avoid creating a duplicate."""
