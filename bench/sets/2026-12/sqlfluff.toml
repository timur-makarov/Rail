# sqlfluff-07: RF06 should keep quotes on identifiers like "user" whose unquoted form is a bare function in the
# dialect, while still unquoting ordinary identifiers.
# issue opened 2026-10-30, fix opened 2026-10-30, squash (or single commit); source files:
# src/sqlfluff/rules/references/RF06.py (6 lines); request from body (never edited).
# reading notes: filed by fixer; AI-drafted; text names the fix (consult bare_functions set)
[[situation]]
id = "sqlfluff-07"
request = """
RF06 silently changes PostgreSQL column references into bare functions

### Search before asking

I searched existing issues and PRs for `RF06 user`, `RF06 current_user`, `RF06 bare function` and `RF06 unquote postgres`. The closest match is #7288 (T-SQL quoted aliases), a different cause; #7274 is a related required-quoting precedent. The proposed fix changes only RF06 and does not touch the keyword files that open #8906 reworks.

### What Happened

With PostgreSQL and default RF06 settings, SQLFluff changes:

```sql
SELECT "user" FROM events;
```

into:

```sql
SELECT user FROM events;
```

PostgreSQL interprets the second query as its USER expression rather than a reference to the column. A query that originally returned stored values can therefore return the current role name for every row.

The same unsafe unquoting affects `"current_user"` and `"system_user"`. These names already appear in SQLFluff's PostgreSQL `bare_functions` set, but RF06 does not consult that set before removing quotes.

### Expected Behaviour

Preserve quotes when removing them changes a column reference into a bare function. Continue removing unnecessary quotes from ordinary identifiers such as `"events"`.

### Observed Behaviour

RF06 reports `Unnecessary quoted identifier "user".` and removes the quotes.

`"session_user"` is already protected by the reserved-keyword check and serves as a preservation control.

Known remaining cases include DuckDB `"describe"`, `"qualify"`, `"show"`, and `"summarize"`, and PostgreSQL `"table"`. Those required-quoting cases need separate follow-up and are not claimed fixed by the proposed bare-function guard.

### How to reproduce

On the affected base revision, run:

```sh
printf '%s
' 'SELECT "user" FROM events;' | sqlfluff fix --dialect postgres --rules RF06 --ignore-local-config -
```

The output is:

```sql
SELECT user FROM events;
```

The semantic difference can be demonstrated in PostgreSQL with:

```sql
CREATE TEMP TABLE events ("user" text);
INSERT INTO events VALUES ('alice'), ('bob');

SELECT "user" FROM events;
-- Returns alice and bob.

SELECT user FROM events;
-- Returns the current role name for both rows.
```

### Dialect

PostgreSQL.

### Version

SQLFluff 4.5.0, base commit `0a7c69840`; Python 3.12.13 on Windows.

### Configuration

Default RF06 settings. The reproduction explicitly selects PostgreSQL and RF06 and ignores local configuration.

`case_sensitive = True` is the default. Setting it to False does not prevent this defect.

### Are you willing to work on and submit a PR to address the issue?

Yes.

