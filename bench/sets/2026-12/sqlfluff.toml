# sqlfluff-12: ST06 should not reorder select targets whose positions are bound by an explicit column list (CTE,
# derived table, LATERAL, CREATE TABLE AS).
# issue opened 2026-10-19, fix opened 2026-10-19, squash (or single commit); source files:
# src/sqlfluff/rules/structure/ST06.py (24 lines); request from body (never edited).
# reading notes: filed by fixer; AI-drafted; tests require no violation (matches ST06's existing skip for positional
# contexts; small doubt)
[[situation]]
id = "sqlfluff-12"
request = """
ST06 fixes change query results bound by explicit column lists

### What Happened

Running `sqlfluff fix --dialect ansi --rules ST06 example.sql` on a CTE with an explicit column list changes which expression supplies each named column:

```sql
WITH c (x, y) AS (SELECT a + 1, b FROM t) SELECT x, y FROM c
```

The fixed SQL is:

```sql
WITH c (x, y) AS (SELECT b, a + 1 FROM t) SELECT x, y FROM c
```

With rows `(a, b) = (1, 100), (2, 200)`, SQLite returns `[(2, 100), (3, 200)]` before the fix and `[(100, 2), (200, 3)]` after it. The explicit names bind by position, so the fix silently swaps their values.

### Expected Behaviour

Fixing target order should preserve the expressions bound to explicit column names and preserve query results.

### Observed Behaviour

ST06 moves the simple target `b` ahead of `a + 1`, while leaving the explicit column list `(x, y)` in place. The same reordering occurs for derived tables, LATERAL subqueries with alias column lists, and PostgreSQL CREATE TABLE AS:

```sql
SELECT s.x, s.y FROM (SELECT a + 1, b FROM t) AS s (x, y);
SELECT s.x, s.y FROM LATERAL (SELECT a + 1, b FROM t) AS s (x, y);
CREATE TABLE t2 (x, y) AS SELECT a + 1, b FROM t;
```

These statements parse successfully. The relevant grammar classes are ANSI `CTEDefinitionSegment` and `CTEColumnList` (`common_table_expression` / `cte_column_list`), `AliasExpressionSegment` (`alias_expression`, including a bracketed `SingleIdentifierListSegment`), and PostgreSQL `CreateTableAsStatementSegment` (`create_table_as_statement`).

### How to reproduce

1. Save the CTE query above in `example.sql`.
2. Run `sqlfluff fix --ignore-local-config --dialect ansi --rules ST06 example.sql`.
3. Observe that the CTE body becomes `SELECT b, a + 1 FROM t`.
4. Compare the original and fixed queries using Python's SQLite module:

```python
import sqlite3

original = 'WITH c (x, y) AS (SELECT a + 1, b FROM t) SELECT x, y FROM c'
fixed = 'WITH c (x, y) AS (SELECT b, a + 1 FROM t) SELECT x, y FROM c'
