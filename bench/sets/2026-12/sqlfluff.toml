### Search before asking

- [x] I searched the [issues](https://github.com/sqlfluff/sqlfluff/issues) and found no similar issues.


### What Happened

SQLFluff's numeric literal parsing does not match SQLite.

### Expected Behaviour

SQLFluff should parse numeric literals the same way SQLite does (when using `--dialect=sqlite` obviously).

### Observed Behaviour

SQLFluff rejects some valid SQLite numeric literals, and also accepts some invalid ones.

### How to reproduce

repro.sql:

```sql
/*
SQLite numeric literals can contain single underscores ('_') since version 3.46.0 (2024-05-23), to
aid in human readability [0]. They can be used, for example, as thousands separators.

SQLFluff as of version 4.4.0 does not parse numeric literals containing underscores correctly. It
rejects a lot of valid numeric literals, while accepting some invalid ones that it should not.

[0]: https://www.sqlite.org/lang_expr.html#literal_values_constants_
*/

/*
The following are all valid SQLite numeric literals. Of these 5, only a single one is parsed
correctly, all others give parsing errors, despite being valid and working correctly in SQLite.
*/

SELECT 1_000;   -- parsing error
SELECT 1.000_1; -- parsing error
SELECT 1e1_000;
SELECT .000_1;  -- parsing error
SELECT 0xff_00; -- parsing error

/*
The following are all invalid, and should give some kind of error. However, some of them are
accepted by SQLFluff, while being invalid according to the documentation, and correctly being
rejected by SQLite itself.
*/

-- consecutive '_' are forbidden
SELECT 1__000;
SELECT 1.000__1;
SELECT 1e1__000; -- parses successfully, should be rejected
SELECT .000__1;
SELECT 0xff__00;

SELECT _001;   -- cannot start with '_'
SELECT 1._001; -- decimal part cannot start with '_'
SELECT 1e_100; -- exponent cannot start with '_'; parses successfully, should be rejected
SELECT ._001;  -- decimal-only literals also cannot start with '_'
SELECT 0x_ff;  -- hex literals cannot start with '_' either; parses successfully, should be rejected
