# sqlfluff-01: RF03 should not auto-qualify a correlated-subquery reference when the outer query's source is an
# UNNEST/generate_series table function alias; report but leave unfixed.
# issue opened 2026-11-12, fix opened 2026-11-12, squash (or single commit); source files:
# src/sqlfluff/rules/references/RF03.py (45 lines); request from body (never edited).
# reading notes: text names the fix approach (treat outer standalone_aliases as visible targets)
[[situation]]
id = "sqlfluff-01"
request = """
RF03 fix qualifies a reference to an outer UNNEST/generate_series alias with the subquery's table

### Search before asking

- [x] I searched the [issues](https://github.com/sqlfluff/sqlfluff/issues) and found no similar issues.


### What Happened


With `single_table_references = consistent`, `sqlfluff fix` qualifies an unqualified column in a correlated subquery with the subquery's own table alias, even though the column comes from a table function (`unnest`, `generate_series`) in the outer query. The fixed query refers to a column that does not exist, or to a different column.

### Expected Behaviour


Report the violation but don't fix it, as already happens when the outer FROM is an ordinary table:

```sql
SELECT o.k FROM outer_t AS o
WHERE NOT EXISTS (SELECT 1 FROM widget AS w WHERE w.id = k)
```

Here `sqlfluff fix` leaves the query unchanged ("Unfixable violations detected"). Without a schema, RF03 cannot know whether `k` belongs to `widget` or to the outer query, so adding a qualifier is unsafe.


### Observed Behaviour


```sql
SELECT k FROM unnest(ARRAY[1, 2]) AS k
WHERE NOT EXISTS (SELECT 1 FROM widget AS w WHERE w.id = k)
```

`sqlfluff lint` reports:

```
L:   2 | P:  58 | RF03 | Unqualified reference 'k' found in single table select.
L:   2 | P:  58 | RF03 | Unqualified reference 'k' found in single table select
                       | which is inconsistent with previous references.
```

and `sqlfluff fix` rewrites it to:

```sql
SELECT k FROM unnest(ARRAY[1, 2]) AS k
WHERE NOT EXISTS (SELECT 1 FROM widget AS w WHERE w.id = w.k)
```

`k` is the column of the outer `unnest(...) AS k` (PostgreSQL names the single column of a scalar table function after its alias), not a column of `widget`. After the fix PostgreSQL fails with `column w.k does not exist`; if `widget` happens to have a column `k`, the query silently compares against that column instead.

Same result with:

```sql
SELECT k FROM generate_series(1, 3) AS k
WHERE NOT EXISTS (SELECT 1 FROM widget AS w WHERE w.id = k)

SELECT k FROM unnest(ARRAY[1, 2]) AS u (k)
WHERE NOT EXISTS (SELECT 1 FROM widget AS w WHERE w.id = k)
```

Likely cause: postgres lists `UNNEST` and `GENERATE_SERIES` in `value_table_functions`, so `get_aliases_from_select` (`src/sqlfluff/utils/analysis/select.py`, via `_has_value_table_function`) puts their alias in `standalone_aliases` instead of `table_aliases`. In `RF03.py`, `_iter_available_targets` (and so `_outer_visible_aliases`, added in #8627) only yields `table_aliases`. The outer query therefore looks like it has no tables, `possible_ref_tables` has a single entry, and the subquery is treated as fixable. Treating an enclosing query's `standalone_aliases` as visible outer targets (making the fix unsafe) would cover all three forms. Skipping references by name would not cover `unnest(...) AS u (k)`, where the column is not named after the alias.


### How to reproduce


`test.sql`:

```sql
SELECT k FROM unnest(ARRAY[1, 2]) AS k
WHERE NOT EXISTS (SELECT 1 FROM widget AS w WHERE w.id = k)
```

```
sqlfluff fix --dialect postgres --rules RF03 test.sql
```


### Dialect

postgres

### Version

sqlfluff, version 4.5.0 (Python 3.12.15). `RF03.py` is unchanged on `main`. 4.2.1 behaves the same.

### Configuration


None beyond the command line (`--dialect postgres --rules RF03`); `single_table_references` is the default `consistent`.


### Are you willing to work on and submit a PR to address the issue?

- [x] Yes I am willing to submit a PR!

### Code of Conduct

- [x] I agree to follow this project's [Code of Conduct](https://github.com/sqlfluff/sqlfluff/blob/main/CODE_OF_CONDUCT.md)"""
start = "11d4de0a2be0c51690d2ae77088048150551f866"
fix = "df64902bd195770aee62cbb918fd9cd7fbd95843"
hidden_tests = ["test/fixtures/rules/std_rule_cases/RF03.yml"]
closed = 2026-11-22
kind = "wrong-result"
half = "work"
issue = "https://github.com/sqlfluff/sqlfluff/issues/9134"
pull = 9139
self_filed = false
bot_filed = false
security_trap = false

# sqlfluff-02: Postgres CREATE DATABASE should parse STRATEGY, LOCALE_PROVIDER, ICU_LOCALE, BUILTIN_LOCALE, ICU_RULES,
# COLLATION_VERSION, OID and numeric ENCODING options.
# issue opened 2026-11-16, fix opened 2026-11-16, squash (or single commit); source files:
# src/sqlfluff/dialects/dialect_postgres.py, src/sqlfluff/dialects/dialect_postgres_keywords.py (97 lines); request
# from body (never edited).
# reading notes: AI-drafted report; yml fixture pins option values as naked_identifier (keyword choice is a small
# doubt); test also has LOCALE = C unquoted
[[situation]]
id = "sqlfluff-02"
request = """
Postgres: CREATE DATABASE strategy and locale-provider options are unparsable

### Search before asking

- [x] Searched open and closed issues and PRs for the affected database options.

### What Happened

PostgreSQL `CREATE DATABASE` statements using documented strategy and locale-provider options are marked unparsable. This affects provisioning SQL using ICU or builtin locales, as well as explicit database-copy strategies.

### Expected Behaviour

The following valid statements should parse without violations:

```sql
CREATE DATABASE app STRATEGY = file_copy;
CREATE DATABASE app LOCALE_PROVIDER = icu ICU_LOCALE = 'en-US';
CREATE DATABASE app TEMPLATE = template0 LOCALE_PROVIDER = builtin BUILTIN_LOCALE = 'C.UTF-8';
```

The current PostgreSQL synopsis also includes `ICU_RULES`, `COLLATION_VERSION`, `OID`, and numeric encoding IDs, which the current grammar does not handle.

### Observed Behaviour

```text
Line 1, Position 21: Found unparsable section: 'STRATEGY = file_copy;'.
```

### How to reproduce

```python
from sqlfluff.core import Linter

result = Linter(dialect="postgres").parse_string(
    "CREATE DATABASE app STRATEGY = file_copy;"
)
print([error.desc() for error in result.violations])
```

PostgreSQL documentation: https://www.postgresql.org/docs/current/sql-createdatabase.html

### Dialect

postgres

### Version

SQLFluff 4.5.0, main at `b3669f122e8f05630ed6ac56b72fc9cd39f8e917`; Python 3.13.9.

### Configuration

No custom configuration; dialect supplied explicitly through `Linter`.

### Contribution

A grammar fix and positive SQL/YAML regression fixtures are prepared. Investigation, implementation, and local testing used OpenAI Codex (GPT-6). No independent human testing is claimed.

### Code of Conduct

- [x] I agree to follow the project's Code of Conduct."""
