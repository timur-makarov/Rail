# sqlfluff: sqlfluff/sqlfluff, python, reserve project of set 2026-12 (fulltest PLAN sections 3 and 4).
# Settings: written by reading the project's CI and docs at the oldest and newest start commit, nothing run;
# every command marked `unverified` is for the admission session to try and fix. Notes: notes/sqlfluff.md.
# Situations: every candidate of bench-candidates/sqlfluff.toml (REPORT-window-rule.md, 2026-11-26), in its order,
# all 40 of them.
# half is `work` for every candidate until the split after admission and the hardness runs (cloud/README.md).
# hidden_tests: the fix's changed files (start..fix, compare API) that match [project] tests or the travel
# globs [],
# and not []; deleted files left out.
# self_filed: the issue's author opened the fix. bot_filed: the issue's author is an automation account
# (a login ending in bot or -ci, or turso-github-handyman, roboturso). security_trap: the reading pass's
# flag for a request whose natural fix invites a flaw. kind race is the race flag.

# sqlfluff/sqlfluff for Rail's bench (a reserve). Read-only work of 2026-11-26: nothing here was run; see sqlfluff.md.
# Oldest start read: 4d335e9cfb3de272cbd943cd4861fffba7167a12 (2026-07-09); newest: 11d4de0a2be0c51690d2ae77088048150551f866
# (2026-11-22). Shorthand below: OLD = 4d335e9c, NEW = 11d4de0a.
#
# A src/ layout whose rules, dialects and templaters are found through its own entry points (group "sqlfluff" in
# pyproject.toml), so the package must be INSTALLED for its metadata, yet import the copy's code. As for the other
# Python projects: the venv lives in $BENCH_CACHE/venvs/KEY, the copy holds a symlink `.venv`, the editable installs'
# .pth files are rewritten to relative paths (../../../../src), and commands also set PYTHONPATH to the copy's src.
# Most hidden "tests" are fixture files (.sql/.yml) that parametrized test modules pick up by directory listing;
# test_files turns them into pytest -k selections of exactly those parameters.

[project]
name = "sqlfluff"
repo = "https://github.com/sqlfluff/sqlfluff"
language = "python"
package = "sqlfluff"
tests = ["test/**", "plugins/*/test/**"]

[commands]
# unverified: CI installs through tox (non-editable sqlfluff, plus plugins/sqlfluff-plugin-example) into a fresh env
#   per Python version; here one editable compat install with its .pth made relative.
# from: tox.ini@NEW [testenv] (deps = -r requirements_dev.txt; "python -m pip install
#   {toxinidir}/plugins/sqlfluff-plugin-example"; setenv SQLFLUFF_TESTENV = 1), tox.ini@OLD (same),
#   .github/workflows/ci-test-python.yml@NEW ("tox -e py3XX -- -n 4 test -m ..."), pyproject.toml@both
#   (requires-python >=3.10, setuptools backend, entry points).
setup = '''
set -euo pipefail
# Network is on only here. Every later command runs offline.
unset UV_OFFLINE UV_PYTHON_DOWNLOADS
export UV_CACHE_DIR="$BENCH_CACHE/uv" UV_PYTHON_INSTALL_DIR="$BENCH_CACHE/python" UV_PYTHON_PREFERENCE=only-managed \
       UV_LINK_MODE=hardlink UV_COMPILE_BYTECODE=1 UV_NO_PROGRESS=1
root=$PWD
uv python install 3.13
py=$(uv python find 3.13)
# Packages as they were on the start commit's day: git archive stamped every file with the commit's time.
newer=$(date -u -d "@$(stat -c %Y pyproject.toml)" +%Y-%m-%dT%H:%M:%SZ)
plugin=plugins/sqlfluff-plugin-example
key=$( { echo "sqlfluff-venv-1 $py $newer"; cat pyproject.toml requirements_dev.txt "$plugin/pyproject.toml"; } | sha256sum | cut -c1-16)
venv="$BENCH_CACHE/venvs/$key"
mkdir -p "$BENCH_CACHE/venvs"
exec 9>"$venv.lock"
flock 9
if [ ! -f "$venv/.bench-ok" ]; then
  rm -rf "$venv"
  uv venv -q --python "$py" "$venv"
  pip=(uv pip install -q --no-config --python "$venv/bin/python" --exclude-newer "$newer")
  "${pip[@]}" -r requirements_dev.txt
  "${pip[@]}" -e . -e "$plugin" --config-settings editable_mode=compat
  # The editable installs wrote this copy's absolute path into .pth files; make them relative to site-packages.
  "$venv/bin/python" - "$root" <<'PY'
import os, sys, sysconfig
roots = {sys.argv[1], os.path.realpath(sys.argv[1])}
sp = sysconfig.get_paths()["purelib"]
for name in sorted(os.listdir(sp)):
    if not name.endswith(".pth"):
        continue
    path = os.path.join(sp, name)
    with open(path) as f:
        lines = f.read().splitlines()
    out, hit = [], False
    for line in lines:
        s = line.strip()
        for r in roots:
            if s == r or s.startswith(r + os.sep):
                out.append(os.path.normpath(os.path.join("..", "..", "..", "..", os.path.relpath(s, r))))
                hit = True
                break
        else:
            out.append(line)
    if hit:
        os.unlink(path)
        with open(path, "w") as f:
            f.write("\n".join(out) + "\n")
        print("bench: made", name, "relative:", out)
    elif any(r in l for l in lines for r in roots):
        sys.exit(f"bench: {name} still names the setup path")
PY
  touch "$venv/.bench-ok"
fi
flock -u 9
ln -sfn "$venv" .venv
grep -qxF '/.venv' .git/info/exclude || echo '/.venv' >> .git/info/exclude
# Smoke: this copy's sqlfluff is imported, and its core plugin (rules, dialects) loads through the entry points.
export PYTHONPATH="$root/src:$root/$plugin/src"
.venv/bin/python -c 'import sqlfluff, sys; assert sqlfluff.__file__.startswith(sys.argv[1]), sqlfluff.__file__; print(len(sqlfluff.list_rules()), "rules")' "$root"
df -h "$BENCH_CACHE" . || true
'''
# unverified: the fixture-to-test mapping is mine, read from test/dialects/dialects_test.py, test/conftest.py
#   (get_parse_fixtures), test/rules/yaml_test_cases_test.py with src/sqlfluff/utils/testing/rules.py
#   (load_test_cases ids "RULE_case") and test/rules/std_fix_auto_test.py@NEW (ids "dialect-folder").
# A test module (*_test.py) runs whole; test/fixtures/dialects/D/NAME.sql|.yml selects the three parametrized dialect
# tests of D/NAME.sql; test/fixtures/rules/std_rule_cases/X.yml selects every case of the rule it names;
# test/fixtures/linter/autofix/D/CASE/* selects that autofix case. Other fixture files ride along unused.
test_files = '''
set -o pipefail
export PYTHONPATH="$PWD/src:$PWD/plugins/sqlfluff-plugin-example/src"
mods=(); keys=(); drivers=()
for f in {files}; do
  case "$f" in
    test/fixtures/dialects/*/*.sql|test/fixtures/dialects/*/*.yml)
      r=${f#test/fixtures/dialects/}; dia=${r%%/*}; n=${f##*/}; n=${n%.*}; n=${n%_nc}
      keys+=("[$dia-$n.sql"); drivers+=(test/dialects/dialects_test.py) ;;
    test/fixtures/rules/std_rule_cases/*.yml)
      rule=$(sed -n 's/^rule:[[:space:]]*//p' "$f" | head -n 1 | tr -d "\"' \r" | tr , _)
      [ -n "$rule" ] || { n=${f##*/}; rule=${n%.yml}; }
      keys+=("[${rule}_"); drivers+=(test/rules/yaml_test_cases_test.py) ;;
    test/fixtures/linter/autofix/*/*/*)
      r=${f#test/fixtures/linter/autofix/}; dia=${r%%/*}; r=${r#*/}
      keys+=("[$dia-${r%%/*}]"); drivers+=(test/rules/std_fix_auto_test.py) ;;
    *_test.py) case "$f" in test/*|plugins/*/test/*) mods+=("$f") ;; esac ;;
  esac
done
if [ ${#mods[@]} -eq 0 ] && [ ${#keys[@]} -eq 0 ]; then echo "bench: no tests among the given files"; exit 1; fi
rc=0
if [ ${#mods[@]} -gt 0 ]; then
  .venv/bin/python -m pytest -p no:cacheprovider -rfE -n 0 "${mods[@]}" || rc=1
fi
if [ ${#keys[@]} -gt 0 ]; then
  k=$(printf '%s\n' "${keys[@]}" | sort -u | sed 's/.*/(&)/' | paste -sd '|' - | sed 's/|/ or /g')
  mapfile -t drv < <(printf '%s\n' "${drivers[@]}" | sort -u)
  .venv/bin/python -m pytest -p no:cacheprovider -rfE -n 0 "${drv[@]}" -k "$k" || rc=1
fi
exit $rc
'''
# unverified: folder choice by walking up from the source path is mine; CI runs all of test/ with -n 4. test/dialects
#   (about 10,000 parametrized cases) or test/rules take about 5-8 minutes on 4 cores; most other folders under 2.
# from: .github/workflows/ci-test-python.yml@NEW ("-n 4 test"), tox.ini@NEW ("pytest -vv -rsfE ...").
test_package = '''
set -o pipefail
export PYTHONPATH="$PWD/src:$PWD/plugins/sqlfluff-plugin-example/src"
p={package}
d=test; [ "$p" = . ] || d="test/$p"
while [ "$d" != test ] && [ ! -d "$d" ]; do d=${d%/*}; done
if [ "$d" = test ]; then set -- test/api test/core/config; else set -- "$d"; fi
exec .venv/bin/python -m pytest -p no:cacheprovider -rfE -n 4 "$@"
'''
# src/sqlfluff/dialects/dialect_oracle.py -> dialects (test/dialects); src/sqlfluff/rules/structure/ST03.py ->
# rules/structure (walks up to test/rules); src/sqlfluff/core/linter/patch.py -> core/linter; anything else ("."):
# test/api and test/core/config.
package_of = 'regex:^src/sqlfluff/(.+)/[^/]+$'
failed = '^(?:FAILED|ERROR) (\S.*?)(?: - .*)?$'
timeout_minutes = 30
env = { UV_OFFLINE = "1", UV_PYTHON_DOWNLOADS = "never", SQLFLUFF_TESTENV = "1", BASH_DEFAULT_TIMEOUT_MS = "1800000", BASH_MAX_TIMEOUT_MS = "7200000" }
[rail.config.commands]
# unverified: no project source; links the venv the bench built (nothing else is generated).
setup = '''
set -euo pipefail
main="$(git rev-parse --path-format=absolute --git-common-dir)/.."
[ -e .venv ] || ln -s "$(readlink "$main/.venv")" .venv
'''
# unverified: ruff check is the project's own linter (requirements_dev.txt, .pre-commit-config.yaml); the test selection
#   is mine: test/api always, plus the folders of the changed source and fixture files, plus changed test modules.
verify = '''
set -o pipefail
export PYTHONPATH="$PWD/src:$PWD/plugins/sqlfluff-plugin-example/src"
base="${RAIL_BASE:-refs/heads/main}"
mapfile -t changed < <( { git diff --name-only "$base" --; git ls-files --others --exclude-standard; } | grep . | sort -u)
py=(); targets=(test/api)
for f in "${changed[@]}"; do
  case "$f" in *.py) [ -f "$f" ] && py+=("$f") ;; esac
  case "$f" in
    src/sqlfluff/*/*)
      d="test/${f#src/sqlfluff/}"; d=${d%/*}
      while [ "$d" != test ] && [ ! -d "$d" ]; do d=${d%/*}; done
      [ "$d" = test ] || targets+=("$d") ;;
    test/fixtures/dialects/*) targets+=(test/dialects) ;;
    test/fixtures/rules/*) targets+=(test/rules) ;;
    test/fixtures/linter/*) targets+=(test/rules/std_fix_auto_test.py test/core/linter) ;;
    test/*_test.py|plugins/*/test/*_test.py) [ -f "$f" ] && targets+=("$f") ;;
  esac
done
if [ ${#py[@]} -gt 0 ]; then .venv/bin/python -m ruff check --force-exclude --quiet "${py[@]}" || exit 1; fi
mapfile -t targets < <(printf '%s\n' "${targets[@]}" | sort -u)
exec .venv/bin/python -m pytest -p no:cacheprovider -rfE -n 4 "${targets[@]}"
'''
timeout_secs = 900
setup_timeout_secs = 300
verify_timeout_secs = 1500

