id = "sqlfluff-16"
request = """
AL05 removes aliases still referenced in WINDOW and other SELECT clauses

### Search before asking

- [x] I searched existing issues and pull requests for this alias-removal behavior. The related closed issue #735 concerns named-window parsing; its example does not demonstrate this table-alias removal.

### What Happened

AL05 removes `AS t` from this named-window query even though the window still references `t.k` and `t.ts`:

```sql
SELECT x, SUM(y) OVER w AS s
FROM a AS t
WINDOW w AS (PARTITION BY t.k ORDER BY t.ts)
```

Using SQLite 3.53.1 to execute this query over the sample data below, the original returns `[(1, 2), (2, 5)]`. After `sqlfluff fix --dialect postgres --rules AL05`, execution raises `no such column: t.ts`.

### Expected Behaviour

Keep the table alias when a clause in the query references it.

### Observed Behaviour

AL05 reports `Alias 't' is never used in SELECT statement.` and produces:

```sql
SELECT x, SUM(y) OVER w AS s
FROM a
WINDOW w AS (PARTITION BY t.k ORDER BY t.ts)
```

The following eight dialect/clause combinations were reproduced with the real parser and rule:

| Dialect | Clause containing the alias reference |
| --- | --- |
| PostgreSQL | Named `WINDOW` |
| BigQuery | Named `WINDOW` |
| PostgreSQL | `FOR UPDATE OF t` |
| Snowflake | `START WITH` / `CONNECT BY` |
| SparkSQL | `LATERAL VIEW` |
| SparkSQL | `DISTRIBUTE BY` |
| ClickHouse | `PREWHERE` |
| ClickHouse | `ARRAY JOIN` |

The fix applies where dialects emit the covered segment types. MySQL’s `FOR UPDATE OF` targets are naked identifiers and remain outside this fix.

### How to reproduce

On the affected revision, save the named-window SQL above as `query.sql`, then run:

```sh
sqlfluff lint query.sql --dialect postgres --rules AL05
sqlfluff fix query.sql --dialect postgres --rules AL05
```

For a self-contained execution check on the affected revision:

```python
import sqlite3
import subprocess

sql = ""\"SELECT x, SUM(y) OVER w AS s
FROM a AS t
WINDOW w AS (PARTITION BY t.k ORDER BY t.ts)
""\"
conn = sqlite3.connect(":memory:")
conn.executescript(""\"
CREATE TABLE a(x INTEGER, y INTEGER, k INTEGER, ts INTEGER);
INSERT INTO a VALUES (1, 2, 1, 1), (2, 3, 1, 2);
""\")
print(conn.execute(sql).fetchall())
fixed = subprocess.run(
    ["sqlfluff", "fix", "-", "--dialect", "postgres", "--rules", "AL05"],
    input=sql, text=True, capture_output=True, check=True,
).stdout
print(fixed)
print(conn.execute(fixed).fetchall())
```

The final line raises `sqlite3.OperationalError: no such column: t.ts`.

### Dialect

PostgreSQL for the primary reproduction. The table above lists the other reproduced combinations. SQLite is used only for the executable named-window check.

### Version

SQLFluff 4.4.0, upstream revision `62864d781536c5e8cc04d056e089884ec6be3571`, Python 3.12.15. SQLite execution check: 3.53.1. No dbt templater.

### Configuration

CLI options `--dialect postgres --rules AL05`; default alias case handling.

