# sqlfluff-04: ST07 should keep reporting but not rewrite USING joins when converting to ON would break a later USING
# join or change SELECT * output.
# issue opened 2026-10-30, fix opened 2026-11-12, squash (or single commit); source files:
# src/sqlfluff/rules/structure/ST07.py (71 lines); request from body (never edited).
# reading notes: AI-assisted report; tests require precision (first join still fixed when later join uses other keys),
# consistent with the issue wording
[[situation]]
id = "sqlfluff-04"
request = """
ST07 breaks chained USING joins and changes SELECT * output

### Search before asking

- [x] I searched the issues and pull requests for an existing report of these cases.

I searched for `ST07 USING join`, `ST07 USING`, `ST07 ambiguous`, `structure.using partial fix`, and `ST07 second join ambiguous`.

The closest related work is #7230 and #8175, which protect explicit references to merged USING columns. These reproductions concern two other consumers: a later USING join and an unqualified SELECT wildcard. #8822 concerns hyphenated table names and ASOF joins, which have different causes.

### What Happened

ST07 can rewrite a valid USING join into an ON condition even when another part of the query needs USING's merged output columns.

A later USING join can become ambiguous. An unqualified SELECT * can silently return an additional join-key column.

### Expected Behaviour

ST07 should continue reporting the USING clauses but leave them unchanged when rewriting would make the query invalid or change its output columns.

### Observed Behaviour

For the chained-join input:

```sql
SELECT a.id, c.v FROM a LEFT JOIN b USING (id) LEFT JOIN c USING (id);
```

ST07 produces:

```sql
SELECT a.id, c.v FROM a LEFT JOIN b ON a.id = b.id LEFT JOIN c USING (id);
```

The first ON join now exposes both copies of `id`. DuckDB rejects the remaining USING clause with:

```text
Binder Error: Ambiguous reference to column name "id"
```

The equivalent PostgreSQL 16 reproduction fails with:

```text
ERROR: common column name "id" appears more than once in left table
```

For the wildcard input:

```sql
SELECT * FROM a JOIN b USING (id);
```

ST07 produces:

```sql
SELECT * FROM a JOIN b ON a.id = b.id;
```

USING exposes one merged `id`; ON exposes both copies. For tables `a(id, x)` and `b(id, y)`, the output columns change from `id, x, y` to `id, x, id, y`.

Both failures result from removing USING's merged-column behavior.

### How to reproduce

Run each one-line Bash reproduction against the affected revision.

Chained USING joins:

```bash
printf '%s\\n' 'SELECT a.id, c.v FROM a LEFT JOIN b USING (id) LEFT JOIN c USING (id);' | sqlfluff fix --ignore-local-config --dialect duckdb --templater raw --rules ST07 -
```

Unqualified wildcard:

```bash
printf '%s\\n' 'SELECT * FROM a JOIN b USING (id);' | sqlfluff fix --ignore-local-config --dialect postgres --templater raw --rules ST07 -
```

These commands reproduce the SQL rewrites without requiring a database connection.

### Dialect

`duckdb` for the chained-join reproduction and `postgres` for the wildcard reproduction. The chained-join failure was also confirmed on PostgreSQL 16.

### Version

SQLFluff 4.5.0, reproduced on upstream main commit `0bbacd2c3`.

Python 3.12.13 on Windows.

### Configuration

No custom configuration. The reproductions ignore local configuration, use the raw templater, and enable only ST07.

