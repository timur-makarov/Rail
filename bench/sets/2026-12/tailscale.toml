# tailscale-13: The cert refresh loop should only fetch certificates for serve web entries actually served over HTTPS,
# not plain-HTTP ones.
# issue opened 2026-10-07, fix opened 2026-10-10, squash (or single commit); source files: feature/acme/refresh.go (64
# lines); request from body (never edited).
# reading notes: text names the fix
[[situation]]
id = "tailscale-13"
request = """
serve: cert refresh loop fetches Let's Encrypt certificates for plain-HTTP serve entries

### What is the issue?

Since the background cert refresh loop was added in #19915, a node that serves only plain HTTP with `tailscale serve` also fetches a Let's Encrypt certificate for the served name, and keeps renewing it.

#19915 describes the loop as enumerating "Serve and Funnel HTTPS hostnames", but the code doesn't check whether a web entry is HTTPS:

- `serveConfigUsesACMECerts` (`feature/acme/refresh.go`) returns true for any entry in `sc.Webs()`, so the loop starts for an HTTP-only serve config.
- `refreshApplicableCerts` adds the host of every entry in `sc.Webs()` to the set it calls `getCertPEMWithValidity` for, whether that port is served as HTTP or HTTPS.

Whether a web entry is HTTPS is on the port's TCP handler (`TCPPortHandler.HTTPS`), which neither function looks at. The same applies to Service web entries (`sc.Services()[svc].Web`), since `Webs()` includes them.

This matters most for ephemeral nodes, such as containers run by an orchestrator: each new node gets a new name, so each one issues a new certificate. They all draw on Let's Encrypt's limit of 50 new certificates per registered domain per week, and because `ts.net` is on the Public Suffix List, that limit applies per tailnet. Nodes that serve no HTTPS at all can exhaust it, and then nodes that do serve HTTPS can't get certificates.

### Steps to reproduce

1. On a tagged node hosting a Tailscale Service, in a tailnet with HTTPS certificates enabled, serve plain HTTP only:
   `tailscale serve --service=svc:example --http=80 127.0.0.1:8080`
   (From the code, `tailscale serve --bg --http=80 127.0.0.1:8080` on a node's own name should behave the same; I
   observed the Service case.)
2. Watch tailscaled's log. Within seconds (or at the next hourly refresh, if the name wasn't yet in the netmap's `CertDomains`) it starts an ACME order for the served name:

```text
health(warnable=tls-cert-pending): error: Fetching TLS certificate via ACME for: example.tailnet-name.ts.net
cert("example.tailnet-name.ts.net"): already had ACME account.
cert("example.tailnet-name.ts.net"): acme: using dns-01: Funnel is not enabled for example.tailnet-name.ts.net:443
```

When the attempt fails, the error is logged as `cert refresh: example.tailnet-name.ts.net: ...`, so it comes from the refresh loop, not from a TLS handshake or `tailscale cert`. The node's serve config has only an `"HTTP": true` handler. Observed on Service hosts serving `--service=svc:... --http=80` only.

Expected: no certificate is fetched unless an entry is served as HTTPS (or with `--tls-terminated-tcp`).

### Are there any recent changes that introduced the issue?

#19915 (ipn/ipnlocal, cmd/tailscale/cli: auto-renew TLS certs and warn while pending), first released in 1.100 (in `ipn/ipnlocal/cert.go`; the code moved to `feature/acme/refresh.go` in 1.102). Before that, certificates were only fetched on an inbound TLS handshake or `tailscale cert`, so an HTTP-only node never fetched one.

A possible fix: in both functions, consider a web entry only if the TCP handler for its port, in the node's or the Service's config, has `HTTPS` set.


### OS

Linux

### OS version

Ubuntu 24.04

### Tailscale version

1.102.5 (the code is unchanged on main as of 2026-10-07)

### Other software

tailscaled runs in containers' network namespaces, started by a Docker network plugin; each container is an ephemeral node.

### Bug report

BUG-39cd9abf1526367b9093b7019f7cb026c15be20fa185c125ef25c9acd7a7fedb-20261007144309Z-90702dc393ac4da0"""
