releases `b.mu` around `tkaSyncIfNeeded` and does not check again, so it can apply the old client's
netmap after `Logout` has reset the backend.

Hit this intermittently in automated tests where a tsnet client logs out shortly after reaching `Running`. It shows up more often on slower (Android) devices."""
