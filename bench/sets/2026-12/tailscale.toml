# tailscale-08: The UPnP root device fetch timeout should allow routers that take just over one second to answer, such
# as the NETGEAR RS700.
# issue opened 2026-10-20, fix opened 2026-10-21, squash (or single commit); source files: net/portmapper/upnp.go (9
# lines); request from body (never edited).
# reading notes: text names the fix (raise the 1s timeout to 2-3s); test uses synctest fake time with a 1.5s delay
[[situation]]
id = "tailscale-08"
request = """
net/portmapper: UPnP fails on NETGEAR RS700; router takes ~1.003s to answer HTTP but the root device fetch times out at 1s

### What is the issue?

UPnP port mapping almost never works behind a NETGEAR RS700 (Nighthawk BE19000) on its latest firmware, V1.0.11.8. `tailscale netcheck` shows `PortMapping: UPnP`, but nodes behind the router never end up with a UPnP mapping. When a peer is on a hard-NAT network (`MappingVariesByDestIP: true`, in my case a café guest network), it can't reach them directly and stays on DERP.

`tailscale debug portmap -type upnp -log-http` on a Mac behind the router:

```
Probe: {PCP:false PMP:false UPnP:true}
no mapping
portmapper: fetching http://192.168.1.1:56688/Public_UPNP_gatedesc.xml
portmapper: request[1]: GET "http://192.168.1.1:56688/Public_UPNP_gatedesc.xml" body=""
portmapper: getUPnPRootDevice: loc=<nil> err=error requesting root device details from "http://192.168.1.1:56688/Public_UPNP_gatedesc.xml": Get "http://192.168.1.1:56688/Public_UPNP_gatedesc.xml": context deadline exceeded
portmapper: fallback to UPnP due to PCP and PMP being disabled failed
```

The router's HTTP server doesn't respond until the client half-closes the connection or about one second has passed. `getUPnPRootDevice` gives the fetch exactly one second ([upnp.go#L274-L278](https://github.com/tailscale/tailscale/blob/db03d4e19da508fe29c96043e5fd49156e577f60/net/portmapper/upnp.go#L274-L278)), so it loses by a few milliseconds nearly every time.

Timings from a wired client on the same LAN, all requests to `http://192.168.1.1:56688/Public_UPNP_gatedesc.xml`:

| Request | TCP connect | First byte |
|---|---|---|
| curl (13 runs over two days) | 3–9 ms | 1.005–1.015 s (one run 1.55 s) |
| Raw socket, Go-style HTTP/1.1 GET | | 1.002–1.004 s |
| Raw socket, HTTP/1.0 GET | | 1.002–1.003 s |
| Raw socket, HTTP/1.1 GET with `Connection: close` | | 1.003 s |
| Raw socket, same GET, then `shutdown(SHUT_WR)` | | 0.002–0.003 s |

The router's admin web server on port 80 behaves the same way (about 1.04 s to first byte), so this looks like a firmware HTTP server that reads until EOF or a 1 s timeout. It isn't a load problem, and router DNS is answering in 30–70 ms.

Two side observations:
- The router's UPnP table had 30 `tailscale-portmap` UDP entries pointing at port 41641 on two Macs, all with lease 0, and the nodes weren't advertising any of them. My guess is they come from the occasional attempts that won the race.
- `Probe` itself reported `UPnP:false` in 2 of 6 debug runs. I haven't looked into why.

Possible fix: raise the timeout in `getUPnPRootDevice` to 2–3 s. `createMapping` already runs in its own goroutine with a 5 s budget ([portmapper.go#L502-L510](https://github.com/tailscale/tailscale/blob/db03d4e19da508fe29c96043e5fd49156e577f60/net/portmapper/portmapper.go#L502-L510)), so a slower fetch shouldn't block anything.

### Steps to reproduce

1. Put a node behind a NETGEAR RS700 on firmware V1.0.11.8 with UPnP on (the default).
2. Run `tailscale debug portmap -type upnp -log-http`. The root device fetch fails with `context deadline exceeded`.
3. To see the router's delay directly: `curl -s -o /dev/null -w '%{time_connect} %{time_starttransfer}\\n' http://192.168.1.1:56688/Public_UPNP_gatedesc.xml`

### Are there any recent changes that introduced the issue?

Not that I know of. The router is on its latest firmware.

### OS

macOS

### OS version

macOS 27.0.1

### Tailscale version

1.104.1 (Mac App Store build); also seen on 1.102.4"""
