id = "tailscale-16"
request = """
ipn/ipnlocal: peerAPI DNS debug mode panics on an over-long ?q= name

### What is the issue?

`dnsQueryForName` in `ipn/ipnlocal/peerapi.go` builds the DNS query for the peerAPI's
interactive debug mode (`GET /dns-query?q=<name>`) with `dnsmessage.MustNewName`. The
name is whatever the peer put in the query string, and the only thing done to it is
appending a trailing dot. `dnsmessage.NewName` fails once the name is longer than 255
bytes, so `MustNewName` panics:

```
panic: creating name: insufficient data for calculated length type

golang.org/x/net/dns/dnsmessage.MustNewName({_, _})
	golang.org/x/net@v0.59.0/dns/dnsmessage/message.go:1943 +0x1d4
tailscale.com/ipn/ipnlocal.dnsQueryForName({0x12cc48822371, 0xff}, {0x0?, 0x130?})
	ipn/ipnlocal/peerapi.go:934 +0x152
tailscale.com/ipn/ipnlocal.(*peerAPIHandler).handleDNSQuery(...)
	ipn/ipnlocal/peerapi.go:837 +0x175
```

The panic happens before the query reaches the resolver, so the `nameAllowed` filter
returned by `isPeerAPIDNSAllowed` never gets a say; only `sourceAllowed` has to be
true. That covers any of the user's own untagged devices, and any peer an extension
hook lets through, such as a client using this node as an exit node with DNS proxying
allowed.

`http.Server` recovers the panic, so tailscaled itself survives. The peer gets its
connection dropped instead of a 400, and the node logs a full panic trace for every
such request.

The same input is also mishandled just under the limit: a 255-byte name (254 plus the
dot) is accepted by `NewName` but rejected by `Question` when it packs the name, and
that error is dropped, so `b.Finish()` returns a well-formed query with no question in
it, which is then sent to the resolver.

### Steps to reproduce

From a peer that is allowed to use the node's DNS proxy:

```
curl "http://<node-100.x-addr>:<peerapi-port>/dns-query?q=$(python3 -c 'print("a"*255)')"
```

I reproduced it in-tree with a test built on the existing `TestPeerAPIPrettyReplyCNAME`
harness, calling `handleDNSQuery` with `/dns-query?q=` + `strings.Repeat("a", 255)`.

### Tailscale version

main, at 8b5a870.

I have a fix ready and will send a PR referencing this issue.

Found by a defect-hunting pipeline I build and run ([Dev-next-gen](https://github.com/Dev-next-gen)), using Claude Code with Anthropic's Claude Opus 5."""
