# tailscale-10: With a shared ACME account, renewals of certs with no account-fingerprint stamp should omit the ARI
# replaces field so Let's Encrypt does not reject them.
# issue opened 2026-10-28, fix opened 2026-10-29, squash (or single commit); source files:
