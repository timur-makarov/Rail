# tailscale-06: client.reset() in conn25 should drain queued address assignments so stale ones are not sent after a
# profile switch.
# issue opened 2026-11-04, fix opened 2026-11-04, squash (or single commit); source files: feature/conn25/client.go
# (14 lines); request from oldest of 2 edit records.
# reading notes: filed by fixer; text names cause
[[situation]]
id = "tailscale-06"
request = """
feature/conn25: client.reset() leaves stale address assignments in the send queue

 `client.reset()` (`feature/conn25/client.go`) clears the client's internal state — IP pools, `assignments`, `byConnKey` — but leaves the `addrsCh` send queue untouched. That channel is buffered (64 entries) and is drained asynchronously by `extension.sendLoop`.

So any assignment queued but not yet sent at reset time survives the reset and gets delivered afterwards, describing state that no longer exists.

### Why it matters

`reset()` is called from `extension.profileStateChange` only when `!sameNode`, i.e. the node switched profiles and identities. After the reset, `sendLoop` keeps draining the stale entries and, for each one:
1. POSTs `/v0/connector/transit-ip` to a connector from the *old* profile, registering a transit IP that this client has already forgotten about. The connector holds that mapping until it expires on its own.
2. Then fails in `addTransitIPForConnector` → `insertTransitConnMapping` with `"transit IP is not already known"`, because the assignment is gone from `c.assignments`. The error is logged by `sendLoop` and nothing else happens.

The send is both useless (step 2 can never succeed) and wrong (step 1 leaks a mapping to a connector under the previous identity). Worst case is one stale POST per buffered entry, up to the channel capacity."""
