id = "tailscale-21"
request = """
Connecting to a Service (VIP) IP reaches non-served ports on the underlying host

When a node hosts a Tailscale Service with tailscale serve, connecting to the service's VIP IP on a port the service does not serve reaches whatever is listening on that port on the underlying host machine. e.g. svc:hello is configured to serve only tcp:443, but connecting to <serviceIP>:80 (or any other port) connects to a listener on the host (e.g. an nginx on 0.0.0.0:80).

This is security-relevant when combined with grants. A peer granted access only to the service:
`{` "src": ["eristation"], "dst": ["svc:irc"], "ip": ["*"] }`
can reach arbitrary ports on the host machine via the service IP — ports it has no ACL access to through the machine's regular Tailscale IP. Granting access to a service unexpectedly grants access to the underlying host through the service IP."""
