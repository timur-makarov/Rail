# tailscale-11: tailscale serve set-config should accept tls-terminated-tcp endpoints like the equivalent serve flag
# does, instead of failing on the scheme.
# issue opened 2026-10-14, fix opened 2026-10-14, squash (or single commit); source files:
# cmd/tailscale/cli/serve_v2.go (9 lines); request from body (never edited).
# reading notes: text names the fix (use tcp scheme in runServeSetConfig); untested side mention of PROXY protocol
[[situation]]
id = "tailscale-11"
request = """
serve set-config: tls-terminated-tcp endpoints fail with "must be a URL starting with one of the supported schemes: [tcp unix]"

### What is the issue?

`tailscale serve set-config` rejects every `tls-terminated-tcp` endpoint, while the equivalent `tailscale serve --service=svc:<name> --tls-terminated-tcp=<port> tcp://localhost:<port>` works.

Service config:

```json
{
  "version": "0.0.1",
  "services": {
    "svc:obs-query": {
      "endpoints": {
        "tcp:443": "tls-terminated-tcp://localhost:9481"
      }
    }
  }
}
```

`tailscale serve set-config --all config.json` fails with:

```
service "svc:obs-query": failed to apply TCP serve: unable to expand target: must be a URL starting with one of the supported schemes: [tcp unix]
```

Expected: the endpoint is applied as `--tls-terminated-tcp=443 tcp://localhost:9481` is.

**Cause.** `ipn/conffile` parses and serializes `tls-terminated-tcp` targets (`ProtoTLSTerminatedTCP`). But `runServeSetConfig` in `cmd/tailscale/cli/serve_v2.go` builds every non-file target as `fmt.Sprintf("%s://%s", ep.Protocol, ...)`, giving `tls-terminated-tcp://localhost:9481`. `applyTCPServe` then calls `ipn.ExpandProxyTargetValue(target, []string{"tcp", "unix"}, "tcp")`, which refuses the `tls-terminated-tcp` scheme. Unix-socket targets don't hit this, because they pass `ep.Destination` through unchanged and skip the scheme check.

**Suggested fix.** In `runServeSetConfig`, build the target with the `tcp` scheme when `ep.Protocol` is `ProtoTLSTerminatedTCP`. The serve type (`serveTypeTLSTerminatedTCP`) already carries the TLS termination. Alternatively, `applyTCPServe` could accept the `tls-terminated-tcp` scheme.

Related gap: the services config file has no way to ask for PROXY protocol on a `tcp` endpoint, which the CLI's TCP forwarding supports, so a Service that needs it can't be declared with set-config either.

### Steps to reproduce

1. Write the config above (any Service with a `tls-terminated-tcp` endpoint).
2. Run `tailscale serve set-config --all config.json` (or `--service=svc:obs-query`).
3. It fails with the error above.

Reproduced on main (fd1cc09) as a unit test of `cmd/tailscale/cli`:

```go
func TestSetConfigTLSTerminatedTCP(t *testing.T) {
	e := &serveEnv{}
	err := e.setServe(new(ipn.ServeConfig), "svc:obs-query", serveTypeTLSTerminatedTCP, 443, "/",
		"tls-terminated-tcp://localhost:9481", false, "example.ts.net", nil, 0)
	if err != nil {
		t.Fatal(err) // fails: unable to expand target ... [tcp unix]
	}
}
```

With the suggested fix (use the `tcp` scheme for a `tls-terminated-tcp` endpoint in `runServeSetConfig`), the endpoint applies with `TerminateTLS` set and the existing `cmd/tailscale/cli` tests pass.

### Are there any recent changes that introduced the issue?

_No response_

### OS

_No response_

### OS version

_No response_

### Tailscale version

1.104.1 (also main at fd1cc09, 1.105.0-dev)

### Other software

_No response_

### Bug report

_No response_"""
