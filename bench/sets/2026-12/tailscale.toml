# tailscale-19: derper's GetCertificate wrapper appends the meta cert to the provider's shared cached certificate on
# every handshake; it must return a copy.
# issue opened 2026-07-06, fix opened 2026-07-15, squash (or single commit); source files: cmd/derper/cert.go,
# cmd/derper/derper.go, derp/derpserver/derpserver.go (40 lines); request from oldest of 3 edit records.
# reading notes: Text names the fix. Test targets the existing derpserver.ModifyTLSConfigToAddMetaCert, which has the
# same bug, not the derper.go code the issue quotes.
[[situation]]
id = "tailscale-19"
request = """
cmd/derper: GetCertificate mutates the shared cached *tls.Certificate per handshake (data race, unbounded chain growth)

### What is the issue?

The HTTPS setup in `cmd/derper/derper.go` wraps the cert provider's `GetCertificate` and appends the DERP meta-cert to the returned certificate:

```go
getCert := httpsrv.TLSConfig.GetCertificate
httpsrv.TLSConfig.GetCertificate = func(hi *tls.ClientHelloInfo) (*tls.Certificate, error) {
	cert, err := getCert(hi)
	if err != nil {
		return nil, err
	}
	cert.Certificate = append(cert.Certificate, s.MetaCert())
	return cert, nil
}
```

`getCert` (`autocert.Manager.GetCertificate`, and the manual cert provider) returns a pointer to a cached, shared `*tls.Certificate`. This callback runs concurrently for every TLS handshake and mutates that shared object in place. Two consequences:

1. Data race: concurrent `append(cert.Certificate, ...)` on the shared slice with no synchronization. `go build -race` flags it. It can tear the slice header, panic, or serve a malformed chain.
2. Unbounded growth: every handshake appends another meta-cert to the same cached slice, so the cached cert's chain grows by one entry per handshake. Steady traffic keeps growing the served chain and leaking memory.

### Steps to reproduce

1. Run derper with TLS (autocert, or `--certmode manual`).
2. Drive many concurrent TLS handshakes (parallel `openssl s_client`, or a `-race` test around the wrapper).
3. The race detector reports a data race on `cert.Certificate`. Under sustained load the served chain length keeps increasing.

### Are there any recent changes that introduced the issue?

No. The in-place mutation of the provider's returned certificate is long-standing.

### OS

Linux (platform-independent; derper runs on Linux).

### Proposed fix

Copy the certificate before appending so the shared cached object is never mutated:

```go
cert, err := getCert(hi)
if err != nil {
	return nil, err
}
c := *cert
c.Certificate = append(c.Certificate[:len(c.Certificate):len(c.Certificate)], s.MetaCert())
return &c, nil
```

The three-index slice forces a fresh backing array so the append never touches the cached slice. Happy to send a PR with this plus a `-race` regression test."""
