# tailscale-22: A deleted egress ProxyGroup EndpointSlice is never recreated; the reconciler should ensure it exists
# on every reconcile.
# issue opened 2026-07-02, fix opened 2026-07-06, squash (or single commit); source files:
# cmd/k8s-operator/egress-services.go (53 lines); request from body (never edited).
# reading notes: filed by fixer; issue suggests two fixes.
