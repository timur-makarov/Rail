[[situation]]
id = "tailscale-10"
request = """
k8s-operator: renewals fail for unstamped certs with a shared ACME account

With a shared ACME account (#20493), kubestore only puts the ARI `replaces` field on a renewal when the current account key matches the `acme-account-fingerprint` stamped on the cert Secret. Cert Secrets from before v1.104 have no stamp. For those, kubestore assumes the current key issued the cert unless the Pod started with a per-pod key that differs from the shared one.

If an ingress ProxyGroup is recreated while an older Ingress cert Secret is kept, and that ProxyGroup then fills `tailscale-acme-accounts` with its new key or adopts a shared key that didn't issue the cert, the renewal still names the old cert in `replaces`. Let's Encrypt then rejects every renewal until the cert is deleted:

```
403 urn:ietf:params:acme:error:unauthorized: Could not validate ARI 'replaces' field :: requester account did not request the certificate being replaced by this order
```

It reproduces on main against Let's Encrypt staging. Issue a cert for an HA Ingress, remove `acme-account-fingerprint` from its Secret, recreate the ProxyGroup, set `tailscale.com/share-acme-account: "true"` on it, then renew.

This is the shared-account case of #18251."""
