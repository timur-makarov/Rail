# tailscale: tailscale/tailscale, go, reserve project of set 2026-12 (fulltest PLAN sections 3 and 4).
# Settings: written by reading the project's CI and docs at the oldest and newest start commit, nothing run;
# every command marked `unverified` is for the admission session to try and fix. Notes: notes/tailscale.md.
# Situations: every candidate of bench-candidates/tailscale.toml (REPORT-window-rule.md, 2026-11-26), in its order,
# all 23 of them.
# half is `work` for every candidate until the split after admission and the hardness runs (cloud/README.md).
# hidden_tests: the fix's changed files (start..fix, compare API) that match [project] tests or the travel
# globs ["testdata/*", "*/testdata/*", "*.golden", "*/golden/*"],
# and not ["*/depaware*.txt", "depaware*.txt", "go.mod", "go.sum", "go.toolchain.*", "*.go.tmpl"]; deleted files left out.
# self_filed: the issue's author opened the fix. bot_filed: the issue's author is an automation account
# (a login ending in bot or -ci, or turso-github-handyman, roboturso). security_trap: the reading pass's
# flag for a request whose natural fix invites a flaw. kind race is the race flag.

# tailscale/tailscale for Rail's bench: project, commands and Rail's commands (situations are added elsewhere).
# Read at the oldest start 74235b46c1e435ac90fb0d962efd7b77bd205224 (tailscale-23) and the newest start
# da6276d77025ee2bce288c4ccf07b35e14f253a7 (tailscale-02). See tailscale.md for what each command rests on.
#
# Go toolchain: every command uses ./tool/go, the repo's own wrapper, which runs Tailscale's Go fork
# (github.com/tailscale/go, release build-$(cat go.toolchain.rev)) from $HOME/.cache/tsgo/REV. Setup downloads the fork
# into $BENCH_CACHE/tsgo/REV (content-addressed by REV); $BENCH_CACHE/go-env.sh, sourced by every bash through
# BASH_ENV, links it into whatever HOME the shell has, so ./tool/go works offline in agent runs too. Setup also fetches
# the stock toolchain go.mod asks for (GOTOOLCHAIN=auto) so a bare `go` works offline as well.

[project]
name = "tailscale"
repo = "https://github.com/tailscale/tailscale"
language = "go"
package = "tailscale.com"
tests = ["*_test.go"]
# path, not the Go default dir: tailscale packages share helpers across many _test.go files (ipn/ipnlocal's
# local_test.go holds newLocalBackendWithMockEngineAndControl and friends). With dir, an arm that added a test to such a
# file would have the whole file moved away, and the package, hidden tests included, would stop compiling.
clash = "path"

[commands]
# from: .github/workflows/test.yml@da6276d7 (gomod-cache job: go mod download; "build all"; cross job warms by building tests)
# from: tool/gocross/gocross-wrapper.sh@da6276d7 (fork URL and layout: build-REV/linux-amd64.tar.gz, --strip-components=1)
# unverified: the download into $BENCH_CACHE, the go-env.sh/BASH_ENV link trick and the offline toolchain switch are
# the bench's own; not run anywhere yet.
setup = '''
set -euo pipefail
mkdir -p "$BENCH_CACHE/tsgo"
t=$(mktemp "$BENCH_CACHE/.go-env.XXXXXX")
cat > "$t" <<'EOF'
# Go settings for the bench (tailscale). Sourced by every bash through BASH_ENV; written by the project's setup.
export GOMODCACHE="$BENCH_CACHE/gomod"
export GOCACHE="$BENCH_CACHE/gocache"
export STATICCHECK_CACHE="$BENCH_CACHE/staticcheck"
# ./tool/go runs Tailscale's Go fork from $HOME/.cache/tsgo/REV; link the forks setup fetched into this HOME.
if [ -n "${HOME:-}" ] && [ -d "$BENCH_CACHE/tsgo" ]; then
  for _m in "$BENCH_CACHE"/tsgo/*.extracted; do
    [ -f "$_m" ] || continue
    _r=${_m##*/}; _r=${_r%.extracted}
    if [ ! -f "$HOME/.cache/tsgo/$_r.extracted" ]; then
      mkdir -p "$HOME/.cache/tsgo" 2>/dev/null && rm -rf "$HOME/.cache/tsgo/$_r" 2>/dev/null &&
        ln -s "$BENCH_CACHE/tsgo/$_r" "$HOME/.cache/tsgo/$_r" 2>/dev/null &&
        cp "$_m" "$HOME/.cache/tsgo/$_r.extracted" 2>/dev/null
    fi
  done
  unset _m _r
fi
EOF
mv -f "$t" "$BENCH_CACHE/go-env.sh"
export GOPROXY=https://proxy.golang.org,direct
read -r rev < go.toolchain.rev
case "$rev" in /*|"") echo "go.toolchain.rev holds '$rev', not a fork commit" >&2; exit 1 ;; esac
if [ ! -f "$BENCH_CACHE/tsgo/$rev.extracted" ]; then
  case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; *) arch=$(uname -m) ;; esac
  d=$(mktemp -d "$BENCH_CACHE/tsgo/.dl.XXXXXX")
  curl --retry 3 -fsSL -o "$d/go.tar.gz" "https://github.com/tailscale/go/releases/download/build-$rev/linux-$arch.tar.gz"
  mkdir "$d/go"
  tar -C "$d/go" --strip-components=1 -xzf "$d/go.tar.gz"
  rm -rf "$BENCH_CACHE/tsgo/$rev"
  mv "$d/go" "$BENCH_CACHE/tsgo/$rev"
  rm -rf "$d"
  echo "$rev" > "$BENCH_CACHE/tsgo/$rev.extracted"
fi
. "$BENCH_CACHE/go-env.sh"
./tool/go version
go version
./tool/go mod download
./tool/go list -deps -test ./... > /dev/null
./tool/go build -o /dev/null ./cmd/vet
./tool/go build -o /dev/null honnef.co/go/tools/cmd/staticcheck
# compile every package and test variant into GOCACHE without linking 600 test binaries (warm-up; errors show later)
./tool/go list -e -export -deps -test ./... > /dev/null || true
if [ -n "$(git status --porcelain)" ]; then git status --porcelain; git checkout -- .; git clean -fdq; fi
'''
# from: .github/workflows/test.yml@da6276d7 ("test all": PATH=$PWD/tool:$PATH testwrapper ./..., i.e. go test via ./tool/go)
# unverified: the per-folder -run selection of the hidden files' Test/Fuzz/Example functions is the bench's own.
test_files = '''
. "$BENCH_CACHE/go-env.sh"
sel=""
for f in {files}; do
  case "$f" in (*_test.go) ;; (*) continue ;; esac
  [ -f "$f" ] || continue
  n=$(grep -ohE '^func (Test|Fuzz|Example)[A-Za-z0-9_]*\(' "$f" | sed -E 's/^func //; s/\($//' | paste -sd'|' -)
  sel="$sel$(dirname "$f") ${n:-.}
"
done
[ -n "$sel" ] || { echo "no Go test file among the given files"; exit 1; }
rc=0
for d in $(printf '%s' "$sel" | cut -d' ' -f1 | sort -u); do
  names=$(printf '%s' "$sel" | awk -v d="$d" '$1 == d {print $2}' | paste -sd'|' -)
  case "|$names|" in (*"|.|"*) re=. ;; (*) re="^($names)\$" ;; esac
  PATH="$PWD/tool:$PATH" ./tool/go test -count=1 -run "$re" "./$d" || rc=1
done
exit $rc
'''
# from: .github/workflows/test.yml@da6276d7 (go test per package through ./tool/go)
# unverified: the walk up to the nearest folder holding .go files is the bench's own.
test_package = '''
. "$BENCH_CACHE/go-env.sh"
p={package}
while [ "$p" != . ] && ! compgen -G "$p/*.go" > /dev/null; do p=$(dirname "$p"); done
PATH="$PWD/tool:$PATH" ./tool/go test -count=1 "./$p"
'''
# The folder of the changed file, cut at testdata; a file at the root gives ".".
package_of = 'regex:^(.*?)(?:/testdata/.*|/[^/]*)$'
# go test prints "--- FAIL: TestName (0.00s)", subtests indented, also before a panic's trace.
failed = '^\s*--- FAIL: (\S+)'
# setup's first cold build (modules, two toolchains, compiling ~600 packages and their tests) is the long one
timeout_minutes = 45

[commands.env]
BASH_DEFAULT_TIMEOUT_MS = "1800000"
BASH_MAX_TIMEOUT_MS = "7200000"
GOMODCACHE = "/srv/rail-bench/cache/tailscale/gomod"
GOCACHE = "/srv/rail-bench/cache/tailscale/gocache"
GOTOOLCHAIN = "auto"
GOPROXY = "off"
GOSUMDB = "sum.golang.org"
GOFLAGS = "-mod=mod"
BASH_ENV = "$BENCH_CACHE/go-env.sh"
# from: cmd/testwrapper/flakytest/flakytest.go@da6276d7: tests marked flaky skip themselves; CI retries them instead.
TS_SKIP_FLAKY_TESTS = "true"

[rail.config.commands]
# Offline, in a new worktree: nothing to install (modules, both toolchains and the build cache are in $BENCH_CACHE);
# check the toolchain is there and the tree builds.
# from: .github/workflows/test.yml@da6276d7 ("build all": ./tool/go build ./...)
# unverified: not run offline in a worktree yet.
setup = '''
. "$BENCH_CACHE/go-env.sh"
./tool/go version
./tool/go build ./...
'''
# Fixed part: gofmt of the changed .go files and ./tool/go build ./...; then, for the packages the branch changes
# against $RAIL_BASE: Tailscale's vet tool, staticcheck and go test.
# from: .github/workflows/vet.yml@da6276d7 (./tool/go build -o vettool tailscale.com/cmd/vet; go vet -vettool=...)
# from: Makefile@da6276d7 (staticcheck: ./tool/go run honnef.co/go/tools/cmd/staticcheck -- PKGS)
# from: .github/workflows/test.yml@da6276d7 (build all; test all)
# unverified: the affected-package selection and the time on 4 cores are the bench's own.
verify = '''
. "$BENCH_CACHE/go-env.sh"
export PATH="$PWD/tool:$PATH"
base="${RAIL_BASE:-refs/heads/main}"
changed=$({ git diff --name-only "$base" --; git ls-files --others --exclude-standard; } | grep -vE '^\.(rail|claude)/' | sort -u)
rc=0
gofiles=$(for f in $changed; do case "$f" in (*.go) [ -f "$f" ] && echo "$f" ;; esac; done)
if [ -n "$gofiles" ]; then
  bad=$("$(./tool/go env GOROOT)/bin/gofmt" -l $gofiles)
  [ -z "$bad" ] || { echo "gofmt needed: $bad"; rc=1; }
fi
./tool/go build ./... || rc=1
pkgs=$(for f in $changed; do
  p=$(dirname "$f"); p=${p%%/testdata*}
  while [ "$p" != . ] && ! compgen -G "$p/*.go" > /dev/null; do p=$(dirname "$p"); done
  echo "./$p"
done | sort -u)
if [ -n "$pkgs" ]; then
  vt=$(mktemp -d)
  { ./tool/go build -o "$vt/vettool" ./cmd/vet && ./tool/go vet -vettool="$vt/vettool" $pkgs; } || rc=1
  rm -rf "$vt"
  sc=$(echo "$pkgs" | grep -v '^\./tempfork/' || true)
  if [ -n "$sc" ]; then
    PATH="$(./tool/go env GOROOT)/bin:$PATH" ./tool/go run honnef.co/go/tools/cmd/staticcheck -- $sc || rc=1
  fi
  ./tool/go test -count=1 $pkgs || rc=1
fi
exit $rc
'''
timeout_secs = 1800
setup_timeout_secs = 1200
verify_timeout_secs = 1800

# The bench's additions, the same for every project file of this set:
# - [commands] env BASH_DEFAULT_TIMEOUT_MS and BASH_MAX_TIMEOUT_MS: the Bash tool limits Rail's own
#   .claude/settings.json gives its worker, given to every child, so a plain arm's Bash tool is not cut at
#   two minutes while Rail's runs for thirty.
# - [commands] env GOMODCACHE and GOCACHE: the paths go-env.sh exports, written out for the store
#   /srv/rail-bench (BENCH_STORE), so a child's Go finds the cached modules and toolchain even if its shell
#   does not read BASH_ENV.
# - [rail.config.worker] ladder: the Rail arm of the first run (PLAN section 6, owner 2026-11-25): Sonnet 5.5
#   medium, then Opus 5.5 medium. It sits here because an arm file can give only one rung (bench/arms.py);
#   person_ladder and contract stay as Rail's seed has them.
# - [rail.config.claim] stale_minutes: above the longest Rail command's limit plus save_minutes (10), as
#   `rail docs config` asks.
[rail.config.worker]
ladder = ["claude-sonnet-5-5:medium", "claude-opus-5-5:medium"]

[rail.config.claim]
stale_minutes = 45

# tailscale-01: A config file reload that changes AdvertiseServices should also update netstack's set of active
# Tailscale Services.
# issue opened 2026-11-18, fix opened 2026-11-19, squash (or single commit); source files: ipn/ipnlocal/local.go (15
# lines); request from body (never edited).
# reading notes: text names cause and code locations
[[situation]]
id = "tailscale-01"
request = """
ipn/ipnlocal: config file reload does not update netstack's active Tailscale Services

This was found by the Kubernetes team while testing the reliability of Tailscale Service failover.

When tailscaled reloads its config file (as ProxyGroup proxies do when the operator updates their config Secret), a change to `AdvertiseServices` updates the prefs but not netstack's set of active Tailscale Services. The reload path sets prefs through `setPrefsLocked`, while netstack is only updated from `onEditPrefsLocked` and from `setNetMapLocked`.

https://github.com/tailscale/tailscale/blob/7b2c32b9138b0ab2321910c7eaa8e81b24919dce/ipn/ipnlocal/local.go#L1126-L1135
https://github.com/tailscale/tailscale/blob/7b2c32b9138b0ab2321910c7eaa8e81b24919dce/ipn/ipnlocal/local.go#L5686-L5690
https://github.com/tailscale/tailscale/blob/7b2c32b9138b0ab2321910c7eaa8e81b24919dce/ipn/ipnlocal/local.go#L7799-L7801

Until the next netmap arrives, netstack uses the old set for traffic that the node itself sends to a Service IP. After a Service is withdrawn, the node still handles that traffic locally instead of sending it to another host. After a Service is added, the node does not handle it locally.

https://github.com/tailscale/tailscale/blob/7b2c32b9138b0ab2321910c7eaa8e81b24919dce/wgengine/netstack/netstack.go#L865-L874"""
start = "0422c46eb04d6a33879edf697ecef3cdc7f8f5d8"
fix = "fcef8e2384c5d9f925fdd60b59d992cdb2e83cf0"
hidden_tests = ["wgengine/netstack/netstack_test.go"]
closed = 2026-11-24
kind = "wrong-result"
half = "work"
issue = "https://github.com/tailscale/tailscale/issues/22498"
pull = 22517
self_filed = false
bot_filed = false
security_trap = false

# tailscale-02: An HA LoadBalancer Service should publish the Tailscale VIP for each IP family that has a forwarding
# mapping, not only IPv4.
# issue opened 2026-10-29, fix opened 2026-10-29, squash (or single commit); source files:
# cmd/k8s-operator/svc-for-pg.go (17 lines); request from body (never edited).
# reading notes: filed by fixer; reads AI-drafted; test expects IPv4 VIP first even for IPv6-primary dual-stack
# (follows VIP order, small doubt)
[[situation]]
id = "tailscale-02"
request = """
Kubernetes HA Service status advertises IPv4 VIP for IPv6-only backends

An HA Kubernetes Service backed by an IPv6-only ClusterIP receives only the IPv4 Tailscale VIP in `status.loadBalancer.ingress`. The HA reconciler creates only an IPv6 forwarding mapping for that Service, so consumers of Kubernetes Service status receive a VIP with no corresponding backend mapping.

Reproduced with the operator reconciler at v1.104.4, commit `27047635f237d1f3e0b08c0f487674757f30d2f7`:

1. Reconcile a LoadBalancer Service assigned to an ingress ProxyGroup, with only an IPv6 ClusterIP.
2. Mark a backend as advertising the Tailscale Service using the existing operator state contract.
3. Inspect the generated forwarding configuration and Kubernetes Service status.

The forwarding configuration contains an IPv6 mapping. The Service status contains only the IPv4 VIP. A dual-stack Service likewise advertises only IPv4 despite having both mappings.

Expected: Service status should include the VIP for each family with a configured forwarding mapping. The existing readiness behavior should continue to withdraw status when no backend advertises the Service.

The reproduction uses the existing fake-client reconciler test harness, not a live deployment. A patch that derives status from the actual forwarding mappings passes IPv4, IPv6, both dual-stack orderings, and readiness-withdrawal tests. The IPv6 and dual-stack tests fail against the unmodified release.

Related to #17726, but narrower: this report concerns Kubernetes LoadBalancer status, not the addresses returned by Tailscale's own DNS."""
start = "da6276d77025ee2bce288c4ccf07b35e14f253a7"
fix = "6dce0b211825c52461325f914f842e9521e41e48"
hidden_tests = ["cmd/k8s-operator/svc-for-pg_test.go"]
closed = 2026-11-24
kind = "wrong-result"
half = "work"
issue = "https://github.com/tailscale/tailscale/issues/22060"
pull = 22061
self_filed = true
bot_filed = false
security_trap = false

