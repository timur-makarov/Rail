# tailscale-04: tstime.ParseDuration should reject fractional day and week values instead of returning a wrong
# duration.
# issue opened 2026-09-29, fix opened 2026-09-30, rebase (2 commits); source files: tstime/tstime.go (9 lines);
# request from body (never edited).
# reading notes: text names the fix (return an error)
[[situation]]
id = "tailscale-04"
request = """
tstime: ParseDuration("0.5d") returns 7m12s without an error

## What is the issue?

`tstime.ParseDuration` accepts `d` and `w` units on top of
`time.ParseDuration`. It rewrites the digits immediately before the unit as
hours, but it does not check what precedes those digits. For a fractional
value only the digits after the decimal point are converted:

| Input    | Result   | Expected                     |
|----------|----------|------------------------------|
| `0.5d`   | `7m12s`  | 12h, or an error             |
| `1.5d`   | `1h7m12s`| 36h, or an error             |
| `1.5w`   | `1h50m24s`| 252h, or an error           |

The value is silently wrong and no error is returned.

## Steps to reproduce

```go
d, err := tstime.ParseDuration("0.5d")
fmt.Println(d, err) // 7m12s <nil>
```

## Expected behavior

Either the correct duration or an error. The proposed fix returns an error,
since supporting fractional days and weeks would extend the syntax.

## Version

Current main."""
start = "a2da5fbcaa53b7bd35f40b0557cac87e51c9fa32"
fix = "e3ecbb9894cdcb3805e4ffc1c63c08aecb454316"
hidden_tests = ["tstime/tstime_test.go"]
closed = 2026-11-12
