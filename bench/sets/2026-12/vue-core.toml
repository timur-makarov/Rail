2. The same, with `<Transition name="fade" appear>` between the teleport and the `v-if`.
3. The same, plus named slots passed in from a consumer, `defineOptions({ inheritAttrs: false })` with `v-bind="$attrs"` on the teleported root, and a function `ref`.

Only the version above - where the owner disappears because its dynamic-named slot left the `v-for` - leaves the node behind. That is what made this hard to reduce: every reduction of the *component* passes.

This may share a root cause with a second symptom on the same shape, which I have seen but not reduced: mutating the list behind a `v-for` that carries a dynamic slot name can throw `Failed to execute 'removeChild' on 'Node'` from `DynamicFragment.update` inside `renderSlot`. In both cases a subtree that should be torn down is not; a teleport is simply the loudest way to notice, because its content is the one part that does not live where the fragment is being removed.

Possibly related to #15221, which was a different failure mode in the teleport's own disposal path.

Found while migrating a real app: a confirm dialog whose buttons did nothing, because the overlay on screen belonged to a component instance that had already unmounted while its panel was being rebuilt."""
