Vapor: class on a component is not normalized, so a declared class: String prop receives an Array

### Vue version

3.6.0-rc.2

### Link to minimal reproduction

https://play.vuejs.org/#

### Steps to reproduce

Open the reproduction (pinned to 3.6.0-rc.2). It is two files.

`Child.vue` - a component that declares `class` as a prop, which is what a design
system does when the root class is part of its public API:

```vue
<script setup vapor>
defineProps({ class: { type: String, required: false } })
</script>

<template><div>child</div></template>
```

`App.vue` - an ordinary call site with both a static and a dynamic class:

```vue
<template>
  <Child class="a" :class="skin" />
</template>
```

### What is expected?

The declared `class` prop receives a normalized **string**, the way it does under the
VDOM renderer, so `class: { type: String }` stays a true declaration.

### What is actually happening?

The prop receives the raw array and the runtime prop check fails:

```
[Vue warn]: Invalid prop: type check failed for prop "class".
Expected String with value "a,b", got Array
  at <Child class=a,b>
```

### Additional comments

Compiling the same template both ways with `@vue/compiler-sfc` 3.6.0-rc.2:

```js
// vdom
class: _normalizeClass(["a", skin])

// vapor
_createComponent(Child, { class: () => (["a", skin]) })
```

Under the VDOM renderer this is normalized regardless of whether the child declares
`class` as a prop, because `createBaseVNode` normalizes `props.class` while building
the vnode. Vapor has no vnode, so there is no equivalent normalization point and the
array reaches the child as-is.

The same template is emitted correctly for a plain element - `_setClass(n1, ["a", skin])`
handles the array - so only the component-prop path is affected.

Two things make this awkward to live with rather than merely noisy:

- The declaration was TRUE under VDOM and silently became false at the flip. Nothing
  in the component or the call site changed; only what the renderer delivers did.
- The call site is completely ordinary Vue. `class="a" :class="skin"` is the documented
  way to combine a static and a dynamic class, so every such site on a component with a
  declared `class` prop warns.

We worked around it by widening the declared type to `ClassValue`, which is what our
`cn()` helper already accepts. That is fine for us either way, but I wanted to check
whether the array is the intended contract for Vapor or an oversight, since aligning
with the VDOM behaviour would keep existing `class: String` declarations valid."""
