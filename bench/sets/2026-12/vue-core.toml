# v-for), as it does for single roots.
# issue opened 2026-11-12, fix opened 2026-11-12, squash (or single commit); source files:
# packages/compiler-ssr/src/transforms/ssrInjectCssVars.ts, packages/runtime-core/src/hydration.ts (33 lines); request
