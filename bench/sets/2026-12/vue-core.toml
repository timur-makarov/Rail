# vue-core-01: An async setup rejection from a component already unmounted should be dropped instead of reaching a
# still-mounted ancestor's onErrorCaptured.
# issue opened 2026-11-19, fix opened 2026-11-19, squash (or single commit); source files:
# packages/runtime-core/src/components/Suspense.ts (8 lines); request from body (never edited).
# reading notes: text names the fix (early return when the failing instance is unmounted); tests rewrite existing
# Suspense expectations accordingly.
[[situation]]
id = "vue-core-01"
request = """
Async setup error from an unmounted component reaches a mounted parent's onErrorCaptured (regression in 3.5.45)

### Vue version

3.5.45

### Link to minimal reproduction

[3.5.45 playground](https://play.vuejs.org/#)

Same code on 3.5.44, for comparison: [3.5.44 playground](https://play.vuejs.org/#)

### Steps to reproduce

Click "Unmount, then reject the pending setup".

This unmounts a subtree containing an error boundary, a `<Suspense>` and a child whose async setup is still pending. The child's setup then rejects.

### What is expected?

The error is dropped because the component that threw is already unmounted. The outer `onErrorCaptured` is not called. This is what 3.5.44 does.

### What is actually happening?

The outer, still-mounted component's `onErrorCaptured` receives `stale setup error`.

### System Info

```shell
Reproduces in the SFC playground (any browser). Also seen with Node 26 SSR + hydration.
```

### Any additional comments?

This started with #16061. `handleError` now skips error boundaries that are unmounted, but it keeps walking up to the next mounted ancestor. Before, the unmounted boundary next to the failing component handled the error and propagation stopped there.

We hit this in TanStack Router's Vue integration. A deferred `<Await>` that rejects during hydration belongs to a subtree that was already replaced, and its error now reaches the root error boundary. That replaces the whole page with an error screen instead of showing the route's own error component.

Returning early when the failing component itself is unmounted fixes both cases for us:

```ts
if (isAsyncError && instance && instance.isUnmounted) return
```"""
start = "096dc120aeccc4fed4056b32413c1868c7f70857"
fix = "da101a4caf8476a1c863d2471079dc03023d4684"
hidden_tests = ["packages/runtime-core/__tests__/components/Suspense.spec.ts"]
closed = 2026-11-19
kind = "wrong-result"
half = "work"
issue = "https://github.com/vuejs/core/issues/16349"
pull = 16350
self_filed = false
bot_filed = false
security_trap = false

# vue-core-02: compiler-sfc type resolution should apply generic type parameter defaults, forwarded type parameters
# and mapped types so props get the right runtime types (e.g. Boolean) instead of null.
# issue opened 2026-11-12, fix opened 2026-11-13, squash (or single commit); source files:
# packages/compiler-sfc/src/script/resolveType.ts (302 lines); request from body (never edited).
# reading notes: AI-assisted report listing many cases; large fix (302 lines); one test checks defaults are resolved
# in the declaring file's scope, a correctness detail not spelled out; defineModel snapshot output is the obvious one.
[[situation]]
id = "vue-core-02"
request = """
compiler-sfc: props typed by a generic type parameter default or a forwarded type parameter get type: null

### Vue version

3.5.45 (also `main` at 7c8a0f7)

### Link to minimal reproduction

https://play.vuejs.org/#

### Steps to reproduce

`Comp.vue`:

```vue
<script setup lang="ts">
type Flags<T = boolean> = { a?: T }
interface Base<U> { b?: U }
interface Props<T> extends Base<T> {}
const props = defineProps<Flags & Props<boolean>>()
</script>

<template>
  <p>a: {{ JSON.stringify(props.a) }}, b: {{ JSON.stringify(props.b) }}</p>
</template>
```

`App.vue` renders `<Comp a b />`.

### What is expected?

Both props are `boolean`, so the compiler generates `{ type: Boolean }` for them, and `<Comp a b />` renders `a: true, b: true`.

### What is actually happening?

The compiler generates `a: { type: null, required: false }` and `b: { type: null, required: false }`. Boolean casting is lost, so `<Comp a b />` renders `a: "", b: ""`.

The type is also `null` in these cases:

- `interface P<T = boolean> { a?: T }` used as `P`, and `type P<A, B = boolean>` used as `P<string>` (`b` is `null`)
- a default that refers to an earlier parameter: `type P<A, B = A>` used as `P<boolean>` (`b` is `null`)
- a type parameter passed on under another name: `type Outer<T> = Inner<T>` with `type Inner<U> = { a?: U }`
- a generic type used inside a member: `interface Props<T> { value?: MaybeArray<T> }` with `type MaybeArray<X> = X | X[]`
- `defineModel<Flag>('flag')` with `type Flag<T = boolean> = T`, and `defineProps<import('./types').P<boolean>>()`

When the inner type uses the same parameter name, the outer type argument replaces an explicit one. Here `a` gets `type: String` instead of `Boolean`:

```ts
type Inner<T> = { a?: T }
type Props<T> = Inner<boolean> & { b?: T }
defineProps<Props<string>>()
```

A mapped type over a type parameter fails to compile with `Unsupported type when resolving index type`:

```ts
type Flags<K extends string> = { [P in K]?: boolean }
defineProps<Flags<'a' | 'b'>>()
```

### System Info

```shell
Windows 11, Node.js 24.22.1, vue 3.5.45
```

### Any additional comments?

`resolveType.ts` maps type arguments to type parameters only when the reference has explicit type arguments, and never reads the parameter's default. A type argument that names a type parameter of the outer type is passed on unresolved, so it only works when the inner type uses the same name, and then the outer argument wins even over an explicit one. `resolveMappedType` doesn't pass the type arguments on to the key and value types. I'm opening a PR with tests.

AI-assisted: found and reproduced with an AI coding agent; the example above was run locally."""
start = "21738b527bac4a91eef9cbdfc2cc5ac1f3dbdec9"
fix = "cbd95955a5362b44060908f6e28ad447c3031b8a"
hidden_tests = ["packages/compiler-sfc/__tests__/compileScript/__snapshots__/defineModel.spec.ts.snap", "packages/compiler-sfc/__tests__/compileScript/defineModel.spec.ts", "packages/compiler-sfc/__tests__/compileScript/defineProps.spec.ts", "packages/compiler-sfc/__tests__/compileScript/resolveType.spec.ts"]
closed = 2026-11-13
kind = "wrong-result"
half = "work"
issue = "https://github.com/vuejs/core/issues/16248"
pull = 16253
self_filed = false
bot_filed = false
security_trap = false

# vue-core-03: looseEqual should compare prototype-less objects (Object.create(null)) structurally instead of
# throwing, so a :style update with such an object works.
# issue opened 2026-11-12, fix opened 2026-11-12, squash (or single commit); source files:
# packages/shared/src/looseEqual.ts (27 lines); request from body (never edited).
# reading notes: filed by fixer; text names the cause; vModel tests guard custom toString/Symbol.toPrimitive coercion,
# likely pass pre-fix.
[[situation]]
id = "vue-core-03"
request = """
looseEqual throws on objects without a prototype (Object.create(null))

### Vue version

3.5.45

Also present on current `main` (the two problematic lines have been there since 3.0).

### Link to minimal reproduction

https://play.vuejs.org/#

### Steps to reproduce

1. Open the playground link above
2. Click the "change color" button

The component receives a `:style` binding whose value is an object without a prototype (`Object.create(null)`), e.g. produced by a library helper or a dictionary-style API. On the update, the whole update crashes with a `TypeError`.

The same thing at the util level:

```js
import { looseEqual } from '@vue/shared'

looseEqual(Object.assign(Object.create(null), { foo: 1 }), { foo: 1 })
// TypeError: a.hasOwnProperty is not a function  (looseEqual.ts:57)
```

And the user-facing path — `:style` on a component reaches `looseEqual` through `hasPropValueChanged` during the update check:

```vue
<script setup>
import { ref } from 'vue'

const Child = { template: '<div>child</div>' }
const color = ref('red')
// e.g. style objects coming from a library that uses Object.create(null)
const makeStyle = () => Object.assign(Object.create(null), { color: color.value })
</script>

<template>
  <Child :style="makeStyle()" />
  <button @click="color = 'green'">change color</button>
</template>
```

Clicking the button throws during the component update (stack from a source-mapped run against current `main`):

```
TypeError: a.hasOwnProperty is not a function
    at looseCompareObjects (packages/shared/src/looseEqual.ts:57:23)
    at looseCompareNested (packages/shared/src/looseEqual.ts:85:17)
    at looseEqual (packages/shared/src/looseEqual.ts:116:12)
    at hasPropValueChanged (packages/runtime-core/src/componentRenderUtils.ts:472:13)
    at hasPropsChanged (packages/runtime-core/src/componentRenderUtils.ts:455:8)
    at shouldUpdateComponent (packages/runtime-core/src/componentRenderUtils.ts:436:12)
    at updateComponent (packages/runtime-core/src/renderer.ts:1313:9)
    ...
```

### What is expected?

`looseEqual` should compare prototype-less objects structurally (same keys and values → equal), so the `:style` update goes through instead of crashing.

### What is actually happening?

`looseCompareObjects` calls `a.hasOwnProperty(key)` / `b.hasOwnProperty(key)` directly, and objects created via `Object.create(null)` don't have that method, so any comparison involving such an object throws. Even if those two lines are patched, the trailing `return String(a) === String(b)` throws for the same reason (no `toString` / `valueOf` to coerce with).

Side note: objects that went through `reactive()` don't hit this because the proxy special-cases `hasOwnProperty`, so it takes raw objects (fresh helper output, dictionaries handed over from libraries, etc.) to run into it — which is exactly what makes it confusing to debug.

### System Info

```shell
System:
  OS: macOS 27
Binaries:
  Node: 26.13.0
```

Reproduces in the SFC playground (any browser) and in jsdom via vitest — the failure is environment-independent.

### Any additional comments?

A previous attempt in this area (#15057) was closed before the September looseEqual rework (#15328 / #15499), but the two `a.hasOwnProperty` lines survived it, so this looks like a leftover from that hardening pass rather than a regression."""
start = "e5a217390d1b3be17a76253bbc32f06df2d9b1a7"
fix = "6782586546cfe580ef7b5c18d692199d52f13e77"
hidden_tests = ["packages/runtime-core/__tests__/rendererComponent.spec.ts", "packages/runtime-dom/__tests__/directives/vModel.spec.ts", "packages/shared/__tests__/looseEqual.spec.ts"]
closed = 2026-11-13
