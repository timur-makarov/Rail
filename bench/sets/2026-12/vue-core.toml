# reading notes: AI-assisted report; text names the cause; ssrInjectCssVars tests are inline codegen snapshots, but
# the expected form follows the existing mergeProps(_cssVars) injection; hydration test runs renderToString in jsdom.
[[situation]]
id = "vue-core-04"
request = """
SSR: CSS v-bind() variables are missing on root elements rendered with v-for

### Vue version

3.5.45 (also `main` at 7ef6817)

### Link to minimal reproduction

https://play.vuejs.org/#eNpNjs0KwjAQhF9lyaUKtkWPNQ34HK6H2kQIppvQpIES8u7SH8XbzvDN7CR2c66Kk2IN474ftQvgVZicQOot+QC9NXaEFopRyeJr6qAGDy3czye4PJB4vWUFEhIPanCmC0ogAXCpI8TyZccW2ZIDTVseGTRvNe82MuhN5/1PipRWDnLmtdRRLG/+qpG4D7NZzmrl0ra1gVg+NcnDqo5XyOu+HWX5AyghVL4=

### Steps to reproduce

1. Open the playground link and look at the "SSR" output tab. The component root is `<div v-for="item in items" :key="item" class="item">`, and the `<style>` block uses `color: v-bind(color)`.
2. Note that `_cssVars` is created at the top of `ssrRender`, but `_ssrRenderList` does not use it.
3. Change the root to a single `<div class="item">` without `v-for`: now the element gets `_ssrRenderAttrs(_mergeProps(_attrs, _cssVars))`.

I also checked this with a real SSR setup: `renderToString` from vue@3.5.45 in Node, then hydration in Chromium with the 3.5.45 `esm-browser` build.

### What is expected?

Each root element rendered by `v-for` has the CSS variable in the SSR HTML, like a single root element or a multi-root component:

```html
<!--[--><div class="item" style="--7ba5bd90-color:red;">1</div><div class="item" style="--7ba5bd90-color:red;">2</div><!--]-->
```

### What is actually happening?

The SSR HTML has no CSS variable on the `v-for` root elements:

```html
<!--[--><div class="item">1</div><div class="item">2</div><!--]-->
```

The client (`useCssVars`) sets the variable on each element after hydration, so the `v-bind()` style is missing until JavaScript runs. Value of `--7ba5bd90-color` on the elements, measured in Chromium:

| Component root | Before hydration (SSR HTML) | After hydration |
| --- | --- | --- |
| `<div class="item">` | `red` | `red` |
| `<div v-for="..." class="item">` | empty | `red` |

When the `v-for` element also has a `:style` binding, dev hydration reports "Hydration style mismatch" for each item, because the client expects the variable on the root fragment's children.

### System Info

```shell
Windows 11, Node.js 24.22.1, vue 3.5.45, Chromium 156 (Playwright)
```

### Any additional comments?

`ssrInjectCssVars` in compiler-ssr only injects `_cssVars` into root elements without `v-for` (`!findDir(node, 'for')`). Also, a root `v-for` element is already a `FOR` node when this transform runs, so its elements are never reached. `<template v-for>` roots have the same problem. I'm opening a PR with tests.

