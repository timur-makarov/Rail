Vapor: a teleported node is left in the DOM when its owner unmounts via a dynamic slot name leaving a v-for

### Vue version

3.6.0-rc.2

### Link to minimal reproduction

https://play.vuejs.org/#

### Steps to reproduce

Three SFCs, all `<script setup vapor>`:

- `Modal.vue` renders `<Teleport to="body"><div v-if="open" id="teleported">`.
- `Host.vue` renders one `<slot :name="c">` per item of the `cats` array it receives.
- `App.vue` fills those outlets with a **dynamic slot name inside a `v-for`**, and puts the modal in one of them:

```vue
<Host :cats="cats">
  <template
    v-for="c in cats"
    :key="c"
    #[c]
  >
    <Modal v-if="c === 'a'" />
  </template>
</Host>
```

1. Open the reproduction.
2. Click **drop category "a" from the list** - this sets `cats` to `['b']`, so `Modal` unmounts.
3. Click **count #teleported in body**.

### What is expected?

`#teleported nodes still in body: 0` - the component that teleported the node has unmounted, so its teleported content should go with it.

### What is actually happening?

`#teleported nodes still in body: 1`.

The teleported element stays in `body` indefinitely. It is still painted and still on top, but every listener on it belongs to a scope that has already been disposed, so it silently swallows clicks; and mounting the component again renders a second, live copy *behind* the dead one.

### System Info

```shell
Reproduced in the SFC Playground on 3.6.0-rc.2, vapor mode.
Compiled output confirmed vapor rather than a silent vdom fallback: the JS panel shows
createComponent / createIf / renderEffect / template(...) and contains no createVNode,
openBlock, createBlock or createElementBlock.
```

### Any additional comments?

**The trigger is the teardown path, not the component.** I built the same `Modal.vue` into three progressively closer variants, each unmounted by a plain `v-if` on the parent instead of by the `v-for` slot. All three reclaim the node correctly on 3.6.0-rc.2:

