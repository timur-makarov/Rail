# vue-core: vuejs/core, typescript, proposed project of set 2026-12 (fulltest PLAN sections 3 and 4).
# Settings: written by reading the project's CI and docs at the oldest and newest start commit, nothing run;
# every command marked `unverified` is for the admission session to try and fix. Notes: notes/vue-core.md.
# Situations: every candidate of bench-candidates/vue-core.toml (REPORT-window-rule.md, 2026-11-26), in its order,
# all 34 of them.
# half is `work` for every candidate until the split after admission and the hardness runs (cloud/README.md).
# hidden_tests: the fix's changed files (start..fix, compare API) that match [project] tests or the travel
# globs ["**/__snapshots__/**", "scripts/setup-vitest.ts", "packages-private/dts-built-test/**", "packages-private/vapor-e2e-test/**"],
# and not ["packages/*/src/**", "packages/*/package.json", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "vitest.config.ts", "vite.config.ts"]; deleted files left out.
# self_filed: the issue's author opened the fix. bot_filed: the issue's author is an automation account
# (a login ending in bot or -ci, or turso-github-handyman, roboturso). security_trap: the reading pass's
# flag for a request whose natural fix invites a flaw. kind race is the race flag.

# vuejs/core for Rail's bench. Written by reading only (2026-11-26); nothing here has been run.
# The candidates sit on TWO branches with different toolchains (see vue-core.md):
#   main  (3.5.x): vitest 4 + vitest.config.ts, eslint + prettier, pnpm 11.9.0 .. 12.16.1
#   minor (3.6 beta/rc, vapor): Vite+ (`vp`), vite.config.ts, vitest 5 (or vite-plus-test 0.1.x), oxlint/oxfmt through vp,
#          pnpm 11.5.2 .. 12.4.2
# Every command below works on both: it reads the pnpm pin from the copy and calls the tools by their node entry
# (node_modules/vitest/vitest.mjs exists in vitest 4, vitest 5 and @voidzero-dev/vite-plus-test 0.1.22).

[project]
name = "vue-core"
repo = "https://github.com/vuejs/core"
language = "typescript"
package = "vue"
tests = [
  "packages/*/__tests__/**",
  "packages-private/dts-test/**",
  "packages-private/vapor-e2e-test/__tests__/**",
]
clash = "path"
# node_modules and dist are the language default; temp/ is build-dts's and tsc's output folder (gitignored).
build_dirs = ["temp"]

[commands]
# from: .github/workflows/test.yml@096dc120ae (unit-test: `pnpm install`, PUPPETEER_SKIP_DOWNLOAD) and
#       .github/workflows/test.yml@b55f3b92a1 (`vp install` through setup-vp, which runs the pinned pnpm)
# unverified: the pnpm pin is installed with npm into $BENCH_CACHE (CI uses pnpm/action-setup or setup-vp);
#   --ignore-scripts and --store-dir are ours (CI runs the dependency builds esbuild, @swc/core, puppeteer, unrs-resolver,
#   @parcel/watcher, vue-demi and the root preinstall `npx only-allow pnpm` and postinstall/prepare git hooks; the unit
#   tests need none of them); the smoke run is ours.
setup = '''
set -euo pipefail
V=$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '').split('+')[0]")
P="$BENCH_CACHE/pnpm/$V"
if [ ! -x "$P/bin/pnpm" ]; then
  mkdir -p "$BENCH_CACHE/pnpm"
  rm -rf "$P.tmp.$$"
  npm_config_cache="$BENCH_CACHE/npm-cache" npm install -g --prefix "$P.tmp.$$" --no-audit --no-fund "pnpm@$V"
  mv -T "$P.tmp.$$" "$P" 2>/dev/null || rm -rf "$P.tmp.$$"
fi
"$P/bin/pnpm" --version
"$P/bin/pnpm" install --frozen-lockfile --ignore-scripts --store-dir "$BENCH_CACHE/pnpm-store"
# pnpm 11+ may write placeholders into pnpm-workspace.yaml; nothing tracked may change and nothing unignored may appear
git checkout -- . 2>/dev/null || true
test -f node_modules/vitest/vitest.mjs
unset CLAUDECODE CLAUDE_CODE AI_AGENT
CI=true node node_modules/vitest/vitest.mjs run --project 'unit*' --reporter=default packages/shared/__tests__/
left=$(git status --porcelain)
if [ -n "$left" ]; then echo "setup left files git does not ignore:"; echo "$left"; exit 1; fi
'''
# from: package.json@096dc120ae "test-unit": "vitest --project unit*", CI runs it with CI=true (test.yml unit-test);
#       package.json@b55f3b92a1 "test-unit": "vp test --project unit*" (vp test runs vitest 5.0.3, CI log job 138939029760);
#       package.json "build-dts" + "test-dts-only" for type tests (*.test-d.ts under packages-private/dts-test).
# unverified: calling vitest directly instead of `vp test` on the minor branch; the file sorting; `node --run`.
# Snapshots (__snapshots__/X.spec.ts.snap) run the spec they belong to; other non-test files are left out with a note;
# a helper under __tests__ with no spec of its package in the list runs that package's __tests__ folder.
test_files = '''
unset CLAUDECODE CLAUDE_CODE AI_AGENT
specs=(); helpers=(); dts=0
for f in {files}; do
  case "$f" in
    *.test-d.ts|*.test-d.tsx|packages-private/dts-test/*|packages-private/dts-built-test/*) dts=1 ;;
    */__snapshots__/*.snap) s="${f%.snap}"; s="${s%/__snapshots__/*}/${s##*/}"; if [ -f "$s" ]; then specs+=("$s"); else echo "note: no spec for snapshot $f"; fi ;;
    *.spec.ts|*.spec.tsx|*.test.ts|*.test.tsx|*.spec.js|*.test.js) specs+=("$f") ;;
    packages/*/__tests__/*) helpers+=("${f%%/__tests__/*}/__tests__/") ;;
    *) echo "note: not a test file, left out of the run: $f" ;;
  esac
done
if [ ${#specs[@]} -eq 0 ] && [ ${#helpers[@]} -gt 0 ]; then specs=("${helpers[@]}"); fi
uniq=(); for s in "${specs[@]}"; do case " ${uniq[*]} " in *" $s "*) ;; *) uniq+=("$s") ;; esac; done
specs=("${uniq[@]}")
if [ ${#specs[@]} -eq 0 ] && [ $dts -eq 0 ]; then echo "no runnable test file in the list"; exit 1; fi
rc=0
if [ ${#specs[@]} -gt 0 ]; then
  CI=true node node_modules/vitest/vitest.mjs run --project 'unit*' --reporter=default "${specs[@]}" || rc=1
fi
if [ $dts -eq 1 ]; then
  { node --run build-dts && node --run test-dts-only; } || rc=1
fi
exit $rc
'''
# from: package.json "test-unit" (as above); `vitest run --project unit* FILTER` with FILTER a folder prefix.
# unverified: the per-package filter and "." running the whole unit suite (about 1 to 3 minutes; CI: 41 s on main,
#   102 s on minor, job logs 137457563410 and 138939029760).
test_package = '''
unset CLAUDECODE CLAUDE_CODE AI_AGENT
pkg={package}
if [ "$pkg" = "." ]; then
  CI=true node node_modules/vitest/vitest.mjs run --project 'unit*' --reporter=default
else
  CI=true node node_modules/vitest/vitest.mjs run --project 'unit*' --reporter=default --passWithNoTests "packages/$pkg/"
fi
'''
# The package folder under packages/ (runtime-core, compiler-sfc, runtime-vapor, ...); anything else (packages-private,
# scripts, root config) gives "." and runs the whole unit suite.
package_of = 'regex:^packages/([^/]+)/'
# from: vitest's failure summary, CI job log 139034997207 (vuejs/core, vitest 4.1.11):
#   " FAIL   e2e-browser (chromium)  packages/vue/__tests__/e2e/Transition.spec.ts > e2e: Transition > ..." (colour badge);
#   with NO_COLOR the label is "|unit| ", a file-level failure ends in " [ path ]". The name starts at the path, so the
#   project label (unit / unit-gc / unit-jsdom) never splits one test into two names.
failed = '^ *FAIL\b[^\n]*?\s((?:packages|packages-private|scripts)/[^\s\[]+?\.[cm]?[jt]sx?(?: > [^\n]*?)?)(?: \[ [^\n]*\])?[ \t]*$'
# setup: install ~1-3 min; test_files: ~10-30 s per run, ~2-3 min with type tests; Rail verify ~5-8 min and the bench's
# admission runs Rail's verify under this timeout too.
timeout_minutes = 20

[commands.env]
BASH_DEFAULT_TIMEOUT_MS = "1800000"
BASH_MAX_TIMEOUT_MS = "7200000"
NO_COLOR = "1"
npm_config_manage_package_manager_versions = "false"
pnpm_config_pm_on_fail = "ignore"
COREPACK_ENABLE_STRICT = "0"
COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"
PUPPETEER_SKIP_DOWNLOAD = "1"
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
SKIP_SIMPLE_GIT_HOOKS = "1"
HUSKY = "0"

[rail.config.commands]
# unverified: ours. A new worktree gets the main checkout's node_modules folders as hard links (cp -al; pnpm's links
# inside are relative, so @vue/* workspace links resolve to the worktree's own packages). Nothing else is needed: the
# unit tests run from source through scripts/aliases.js. In the main checkout itself (admission) it does nothing.
setup = '''
set -euo pipefail
main="$(cd "$(git rev-parse --path-format=absolute --git-common-dir)/.." && pwd -P)"
here="$(pwd -P)"
if [ "$main" = "$here" ]; then echo "main checkout: node_modules already in place"; exit 0; fi
if [ -d "$main/node_modules/.pnpm" ]; then
  (cd "$main" && find . \( -path ./.git -o -path ./.claude \) -prune -o -type d -name node_modules -prune -print) |
  while IFS= read -r d; do
    [ -d "$here/$(dirname "$d")" ] || continue
    rm -rf "$here/$d"
    cp -al "$main/$d" "$here/$d"
  done
else
  V=$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '').split('+')[0]")
  "$BENCH_CACHE/pnpm/$V/bin/pnpm" install --offline --frozen-lockfile --ignore-scripts --store-dir "$BENCH_CACHE/pnpm-store"
  git checkout -- pnpm-workspace.yaml 2>/dev/null || true
fi
test -f node_modules/vitest/vitest.mjs
'''
# from: .github/workflows/test.yml@096dc120ae lint-and-test-dts (lint, format-check, check, test-dts) and unit-test
#       (test-unit); test.yml@b55f3b92a1 the same through vp (vp run lint / format-check / check / test-dts / test-unit).
# unverified: ours. Lint and format only the changed files plus one fixed file (so the tools run on the start commit
# too); the type check, the type tests and the WHOLE unit suite always run, because the packages import each other and
# the whole unit suite takes 1-3 minutes. No e2e (puppeteer, playwright browsers).
verify = '''
set -uo pipefail
unset CLAUDECODE CLAUDE_CODE AI_AGENT
base="${RAIL_BASE:-refs/heads/main}"
fail=0
step() { echo "== $*"; "$@" || { echo "!! failed: $*"; fail=1; }; }
code=()
while IFS= read -r f; do
  case "$f" in *.ts|*.tsx|*.js|*.mjs|*.cjs) [ -f "$f" ] && code+=("$f") ;; esac
done < <({ git diff --name-only "$base" -- ; git ls-files --others --exclude-standard; } | sort -u)
code+=("packages/shared/src/index.ts")
if [ -x node_modules/.bin/vp ]; then
  step node_modules/.bin/vp lint "${code[@]}"
  step node_modules/.bin/vp fmt --check "${code[@]}"
else
  step node node_modules/eslint/bin/eslint.js --no-warn-ignored "${code[@]}"
  step node node_modules/prettier/bin/prettier.cjs --check --ignore-unknown "${code[@]}"
fi
step node node_modules/typescript/bin/tsc --incremental --noEmit
step node --run build-dts
step node --run test-dts-only
step env CI=true node node_modules/vitest/vitest.mjs run --project 'unit*' --reporter=default
exit $fail
'''
timeout_secs = 900
setup_timeout_secs = 600
verify_timeout_secs = 1500

# The bench's additions, the same for every project file of this set:
# - [commands] env BASH_DEFAULT_TIMEOUT_MS and BASH_MAX_TIMEOUT_MS: the Bash tool limits Rail's own
#   .claude/settings.json gives its worker, given to every child, so a plain arm's Bash tool is not cut at
#   two minutes while Rail's runs for thirty.
# - [rail.config.worker] ladder: the Rail arm of the first run (PLAN section 6, owner 2026-11-25): Sonnet 5.5
#   medium, then Opus 5.5 medium. It sits here because an arm file can give only one rung (bench/arms.py);
#   person_ladder and contract stay as Rail's seed has them.
# - [rail.config.claim] stale_minutes: above the longest Rail command's limit plus save_minutes (10), as
#   `rail docs config` asks.
[rail.config.worker]
ladder = ["claude-sonnet-5-5:medium", "claude-opus-5-5:medium"]

[rail.config.claim]
