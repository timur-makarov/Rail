# vue-core-15: Watcher callback cleanups should not run when a getter source re-evaluates to an unchanged value; they
# should run before the next callback or on stop.
# issue opened 2026-10-04, fix opened 2026-10-04, squash (or single commit); source files:
# packages/reactivity/src/watch.ts (31 lines); request from body (never edited).
