id = "vue-core-20"
request = """
[Vapor] a bound prop whose value equals the element's default property value writes no attribute (e.g. :type="text" on <input>)

### Vue version

3.6.0-rc.5

### Link to minimal reproduction

https://play.vuejs.org/#

### Steps to reproduce

Inspect the rendered `#vapor` and `#vdom` subtrees.

### What is expected?

Both runtimes write the `type` attribute in all four cases, as vdom does.

### What is actually happening?

vapor omits the attribute in exactly the two cases where the bound value equals the element's
default property value:

| bound value | equals `el.type` default? | vapor | vdom |
| --- | --- | --- | --- |
| `<input :type="'text'">` | yes | *absent* | `text` |
| `<input :type="'checkbox'">` | no | `checkbox` | `checkbox` |
| `<button :type="'submit'">` | yes | *absent* | `submit` |
| `<button :type="'button'">` | no | `button` | `button` |

### System Info

```shell

```

### Any additional comments?

The same template is compiled twice in one app — once with `vapor`, once without — so the two
runtimes can be compared side by side:

```vue
<template>
  <div>
    <input :type="a" class="same-as-default" />
    <input :type="b" class="differs" />
    <button :type="c" class="btn-same">x</button>
    <button :type="d" class="btn-differs">y</button>
  </div>
</template>
```

with `a = "text"`, `b = "checkbox"`, `c = "submit"`, `d = "button"`.

`setProp` sends `type` to `setDOMProp` because `'type' in el`, and `setDOMProp` returns early on

```ts
const prev = el[key]
if (value === prev) {
  return
}
```

A fresh `<input>` already reports `el.type === "text"` and a fresh `<button>` reports
`"submit"`, so the assignment is skipped. `type` is a reflected IDL attribute — the content
attribute only comes into existence via that assignment — so nothing is written. The
`checkbox` / `button` rows confirm this: as soon as the bound value differs from the default,
the attribute appears.

The property reads back correctly either way, so this stays invisible until something depends
on the attribute: an `input[type="text"]` selector in CSS or `querySelector` does not match,
and serialized markup differs between the runtimes.

Same file and same class of divergence as #15186."""
