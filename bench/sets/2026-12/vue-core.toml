# vue-core-31: A vapor functional component's own root attribute binding is dropped when the parent passes the same
# key as a fallthrough attr.
# issue opened 2026-07-22, fix opened 2026-07-22, squash (or single commit); source files:
# packages/runtime-core/src/componentRenderUtils.ts, packages/runtime-core/src/index.ts,
# packages/runtime-vapor/src/component.ts, packages/runtime-vapor/src/dom/prop.ts (29 lines); request from body (never
# edited).
# reading notes: text names the fix (skip only keys functional fallthrough re-applies).
[[situation]]
id = "vue-core-31"
request = """
Vapor: functional component's own root attribute binding is dropped when the same key arrives as a fallthrough attr

### Vue version

3.6.0-rc.2 (also reproduces on 3.6.0-rc.1)

### Link to minimal reproduction

https://gist.github.com/doodlewind/894691dae0f8807dbfad7efbcb2bdd1e

### Steps to reproduce

```sh
npm i vue@3.6.0-rc.2 happy-dom
node repro.mjs
```

(happy-dom only supplies a spec-compliant `document` for Node — nothing else in the environment is custom.)

The essence: a **functional** vapor component — a bare function, no props declaration — whose compiled template binds an attribute on its root element, while the parent passes a same-named attr:

```js
// compiled shape of: <div :title="props.title">hello</div>
const t0 = template("<div>hello</div>", true);
const Functional = (props) => {
  const el = t0();
  renderEffect(() => setProp(el, "title", props.title));
  return el;
};
Functional.__vapor = true;

createVaporApp({
  setup: () => createComponentWithFallback(Functional, { title: () => "from-props" }),
}).mount(root);
```

### What is expected?

`<div title="from-props">hello</div>` — matching both vdom functional components and vapor object components. Full matrix from the repro:

| case | result |
|---|---|
| vapor object component (`defineVaporComponent`), no props declared | `<div title="from-props">` ✅ |
| vapor object component, `props: ["title"]` declared | `<div title="from-props">` ✅ |
| **vapor functional component (bare function)** | **`<div>` — attribute gone** ❌ |
| vdom functional component (bare function), no props declared | `<div title="from-props">` ✅ |

### What is actually happening?

The attribute is written by nobody:

1. With no props declaration, `title` lands in `instance.attrs` and `hasFallthrough` is true.
2. The component's **own** `renderEffect(() => setProp(el, "title", …))` is suppressed by `shouldSkipFallthroughKey` (`runtime-vapor/src/dom/prop.ts`): it skips any root-element key present in `instance.attrs`, on the assumption that fallthrough will own that key.
3. But because `isFunction(component)`, fallthrough uses `getFunctionalFallthrough`, which forwards **only `class` / `style` / `on*`** — `title` is filtered out and never applied.

Step 2's assumption ("fallthrough will re-apply this key") is broken exactly for functional components: any non-class/style/event key that is both passed by the parent and bound by the component's own template silently disappears. Object components take the same path safely because their `getFallthroughAttrs` is the unfiltered `() => instance.attrs`.

A possible direction: `shouldSkipFallthroughKey` could skip only keys the fallthrough will actually re-apply — for function-typed components that's `class`/`style`/`isOn(key)` rather than `key in instance.attrs`.

Workarounds we use meanwhile: declare props (or wrap with `defineVaporComponent(fn, { props })`), or avoid prop names that collide with attributes the component binds on its own root.

### Any additional comments?

How we hit this: we're building **Pocket Vapor**, an experimental project that treats Vue Vapor as a compile target for very small machines — a strict TypeScript subset of Vue Vapor that runs **unmodified** on the real `runtime-with-vapor` build *and* compiles ahead-of-time to a Game Boy Advance ROM (no JS engine on device; reactivity lowered to compile-time dependency masks). The real Vue build is the semantics oracle: one tape of button inputs drives both executions and asserts cell-identical rendered output after every input. Vapor's runtime is effectively differential-tested against an independent compiler there, which is how this surfaced.

The affected authoring path is [vue-jsx-vapor](https://github.com/vuejs/vue-jsx-vapor)'s functional components: it keeps them as bare functions (proxying the function and reporting `__vapor` through a `get` trap), so any JSX functional component binding a prop-named attribute on its root hits this. In our case a `line`-position prop originally named `y`, bound to the root's `y` attribute, made every list row lose its position on screen.

Context (the same `todo.tsx` running on real Vue Vapor and, compiled, on GBA hardware emulation — oracle/device parity is what caught the dropped attribute):
https://github.com/pocket-stack/pocketjs/pull/147

![Pocket Vapor todo — boot](https://raw.githubusercontent.com/pocket-stack/pocketjs/feat/pocket-vapor/vapor/docs/todo-boot.png)
![Pocket Vapor todo — editor](https://raw.githubusercontent.com/pocket-stack/pocketjs/feat/pocket-vapor/vapor/docs/todo-edit.png)"""
