$ npx tsc -p .
index.ts(1,1): error TS5115: Instantiations of the following types appear infinitely circular: 'MethodOrProperty', 'MaybeCallableProvider'.
```

`7.1.0-dev.20261111.1` prints the same error. In a bigger program the same cause also makes the result of a call on a `DurableObjectStub<T>` (RPC types from the same package) become `any`, which then gives TS7006 on callback parameters.

