# typescript-go-05: Downlevel &&=, ||= and ??= on a private accessor should short-circuit and not call the setter when
# no assignment is due.
# issue opened 2026-11-05, fix opened 2026-11-05, squash (or single commit); source files:
# tsc/internal/transformers/estransforms/classfields.go (25 lines); request from oldest of 2 edit records.
# reading notes: AI-assisted differential testing report; text names the fix shape (get && set(...)). Emit baselines
# pin receiver caching and comment placement.
[[situation]]
id = "typescript-go-05"
request = """
Downlevel `this.#x &&= v` / `||=` / `??=` on a private accessor always calls the setter

### 🔎 Search Terms

private logical assignment, &&= private, ||= private, ??= private, __classPrivateFieldSet short-circuit, es2021 private accessor

### 🕗 Version & Regression Information

Same behavior in 5.9.3, 7.0.2 and 7.1.0-dev.20261105.1 (typescript@next). Only affects targets that lower `#private` (es2021 and below); `--target es2022` is correct.

### ⏯ Playground Link

_No response_

### 💻 Code

```ts
var log: string[] = [];
class C {
  get #f() { log.push("get"); return 0; }
  set #f(v: number) { log.push("set " + v); }
  run() { this.#f &&= 1; return log.join(); }
}
console.log(new C().run());
```

### 🙁 Actual behavior

`tsc --strict --target es2021 --outDir out c.ts && node out/c.js` prints `get,set 0`.

The emit writes unconditionally, with the short-circuited value:

```js
__classPrivateFieldSet(this, _C_instances, __classPrivateFieldGet(this, _C_instances, "a", _C_f_get) && 1, "a", _C_f_set);
```

`??=` (getter returning 0, so not nullish) and `||=` (getter returning 1) behave the same way: the setter runs with the current value.

### 🙂 Expected behavior

`get`, as with `--target es2022` or running the source directly. For `&&=` the spec returns `lval` without `PutValue` when it is falsy (https://tc39.es/ecma262/#sec-assignment-operators-runtime-semantics-evaluation); `||=` and `??=` are analogous. Public members are already lowered correctly (`o.p && (o.p = v)`).

### Additional information about the issue

Observable whenever the setter has side effects or there is no setter. With a private method the downlevel code throws `TypeError: Private method is not writable` even when no write should happen (`this.#m ||= 1`), though that case already gets TS2803.

The fix is probably in the logical-assignment branch for private identifiers in `transformers/classFields.ts`: emit `get && set(...)` (resp. `||`, and a nullish check for `??=`) instead of `set(get && v)`. Closest existing issues: #65287 (different defect, closed) and #39172 (public members, 2020).

This was found with an AI-assisted differential testing tool; the repro and outputs above were re-run on the listed versions."""
