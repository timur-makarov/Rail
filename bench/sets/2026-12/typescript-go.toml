id = "typescript-go-04"
request = """
Type printer recurses without limit into nested array/tuple types (stack overflow; can leave later types `any`)

### 🔎 Search Terms

stack overflow, noErrorTruncation, declaration emit, typeToString NoTruncation, recursive array type, TS2589, any, order-dependent

### 🕗 Version & Regression Information

Changed between `7.1.0-dev.20261001.1` and `7.1.0-dev.20261002.1` (edf7da4e93..09b1db0617). #64556 ("Detect cycles while serializing array and tuple types") is the only type printer change in that range, so it's my best guess. Still reproduces on `20261007.1`. 7.0.2 and 6.0.3 are fine.

### ⏯ Playground Link

_No response_

### 💻 Code

```ts
// tsc -p . with { "strict": true, "noEmit": true, "noErrorTruncation": true }
type G<T> = T extends unknown ? (T | G<[T]>)[] : never
declare const g: G<"x">
export const n: number = g
```

The same crash happens through declaration emit (`declaration: true`, no `noErrorTruncation`) with `export const h = g`.

### 🙁 Actual behavior

```
runtime: goroutine stack exceeds 1000000000-byte limit
fatal error: stack overflow
```

### 🙂 Expected behavior

Printing stops at a bounded depth, as in 7.0.2 / 6.0.3, which print about 10 levels and then `any` (or report TS7056 for declaration emit).

### Additional information about the issue

When the instantiation limit is hit before the stack overflows, the result is worse: printing a type changes later type checking. Using `arktype@2.2.8` with `noErrorTruncation`:

```ts
// a.ts
import { scope } from "arktype"
export const a = scope({
	"g0<p0>": "(p0 | g0<a0>)[]",
	a0: ["g0<string[]>", "...", "a1[]"],
	a1: { p1: "string" }
}).export()
export const n: number = a

// b.ts
import { type } from "arktype"
const User = type({ isAdmin: "false", name: "string" })
const Admin = type({ "...": User, isAdmin: "true" })
export const n: number = Admin.infer // expected TS2322
```

With `files: ["a.ts", "b.ts"]`, 7.1 reports TS2322, TS2589 and TS5115 on `a.ts` and nothing on `b.ts`. Generic type nodes in arktype's `.d.ts` that were first resolved during the print stay cached as errors, so every object spread inferred afterwards is `any`.

`b.ts` errors correctly in all of these cases:
- compiled alone, or checked before `a.ts`
- with `noErrorTruncation` off
- on 20261001.1, 7.0.2 or 6.0.3

The API shows the same thing: calling `typeToString(..., TypeFormatFlags.NoTruncation)` on `a` before querying `Admin.infer` makes it `any`. We hit this through `@ark/attest`, which prints types via `typescript/unstable/sync`."""
