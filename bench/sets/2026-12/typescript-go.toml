id = "typescript-go-33"
request = """
`getCompletionsAtPosition` in API deadlocks when used with `includeSymbol: true`

### 🔎 Search Terms

api, getCompletionsAtPosition, includeSymbol, deadlock

### 🕗 Version & Regression Information

This bug couldn't be reproduced in any published version because it can only be triggered if the error described in https://github.com/microsoft/TypeScript/issues/64132 were fixed

### ⏯ Playground Link

_No response_

### 💻 Code

(note: the reproduction must be run on a https://github.com/microsoft/TypeScript/pull/64133 branch, or on `main` after the PR is merged)

1. Create repro dir 
    ```bash
    mkdir /tmp/repro
    cd /tmp/repro
    npm init -y
    npm add typescript@7.0.2
    echo '{}' > tsconfig.json
    ```
1. Create files
    ```ts
    // export.ts
    export const someValue = 1
    
    // index.ts
    const foo = {
        
    }
    
    // repro.mjs
    import path from 'node:path'
    import { API } from 'typescript/unstable/sync'
    
    const api = new API()
    const root = process.cwd()
    const file = path.join(root, 'index.ts')
    const tsconfigPath = path.join(root, 'tsconfig.json')
    const snapshot = api.updateSnapshot({ openProject: tsconfigPath })
    const project = snapshot.getProject(tsconfigPath)
    
    console.log(project.checker.getCompletionsAtPosition(file, 15, { includeSymbol:true }))
    ```
1. Run repro
    ```bash
    node repro.mjs
    ```


### 🙁 Actual behavior

It hangs forever

### 🙂 Expected behavior

It returns completion items

### Additional information about the issue

This happens because `getCompletionsAtPosition` uses a context with a checker API lifetime: https://github.com/microsoft/TypeScript/blob/e73c923cb58e9ea8cd75ba41c51b8d8886af3076/tsc/internal/api/session.go#L4005-L4008

Because of this, there is only one persistent checker is the in checkerpool.

The same goroutine first acquires the checker here https://github.com/microsoft/TypeScript/blob/e73c923cb58e9ea8cd75ba41c51b8d8886af3076/tsc/internal/ls/completions.go#L431-L432

<img width="669" height="295" alt="Image" src="https://github.com/user-attachments/assets/1a3bbb01-0b4b-44a0-a845-36a4c76eecaf" />

Then it tries to acquire the same checker again here https://github.com/microsoft/TypeScript/blob/e73c923cb58e9ea8cd75ba41c51b8d8886af3076/tsc/internal/ls/autoimport/fix.go#L853-L854

<img width="663" height="463" alt="Image" src="https://github.com/user-attachments/assets/13f04323-64f5-4210-8f55-e4602d812381" />

As a result, it silently deadlocks and hangs indefinitely. There is no panic because other goroutines are still active."""
