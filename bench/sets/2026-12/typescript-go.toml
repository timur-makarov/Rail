TS2536 indexing an `as`-remapped mapped type by `Exclude<keyof T & string, ...>` (native 7.0.2 only)

### 🔎 Search Terms

TS2536, key remapping, as clause, Exclude keyof, mapped type index, native, tsgo

### 🕗 Version & Regression Information

- This is the behavior in every version I tried (native preview), and I reviewed the FAQ for entries about mapped types and key remapping
- I was unable to test this on prior native versions; the same code is accepted by TypeScript 5.9.3 and by the 6.0.3 (Strada) compiler — the error appears only with the native 7.0.2 compiler.

### ⏯ Playground Link

Reproduces on the command line (no tsconfig needed):

```bash
npm i typescript@7.0.2
node node_modules/typescript/bin/tsc --noEmit --strict repro.ts   # TS2536
node node_modules/@typescript/typescript6/bin/tsc6 --noEmit --strict repro.ts  # clean (6.0.3)
npx tsc@5.9.3 --noEmit --strict repro.ts                          # clean
```

### 💻 Code

```ts
type ChildPaths<T> = [PathTuples<T>] extends [never] ? [] : PathTuples<T>;
type PathTuples<T> = T extends object
  ? {
      [K in keyof T & string as K extends '_key' ? never : K]: [PathTuples<T[K]>] extends [never]
        ? never
        : readonly [K, ...ChildPaths<T[K]>];
    }[Exclude<keyof T & string, '_key'>]
  : [];

type T1 = PathTuples<{ a: string; _key: string; b: { c: number } }>;
const t1: T1 = ['b', 'c'];
```

### 🙁 Actual behavior

`typescript@7.0.2` (native) reports, at the indexed access:

```
repro.ts(3,5): error TS2536: Type 'Exclude<keyof T & string, "_key">' cannot be used to index type '{ [K in keyof T & string as K extends "_key" ? never : K]: [PathTuples<T[K]>] extends [never] ? never : readonly [K, ...ChildPaths<T[K]>]; }'.
```

TypeScript 5.9.3 and 6.0.3 (the Strada compiler from `@typescript/typescript6`) both accept the same file.

### 🙂 Expected behavior

No error, matching 5.9.3 and 6.0.3: the remapped key set of the mapped type is exactly `Exclude<keyof T & string, '_key'>`, so the indexed access is valid.

### Workaround

Indexing by `keyof` of the map itself is accepted by all three compilers and names the same key set:

```ts
type EntryPathMap<T> = {
  [K in keyof T & string as K extends '_key' ? never : K]: [PathTuples<T[K]>] extends [never]
    ? never
    : readonly [K, ...ChildPaths<T[K]>];
};
type PathTuples<T> = T extends object ? EntryPathMap<T>[keyof EntryPathMap<T>] : [];
```"""
