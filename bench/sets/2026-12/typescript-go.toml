$ npx tsc -v
Version 7.0.2
$ npx tsc -p .
$ echo $?
0
```

The types in `@cloudflare/workers-types` are valid and `7.0.2` accepts them.

### Additional information about the issue

Tested on Linux with Node 24. Package `@cloudflare/workers-types` is `5.20261110.1` (latest)."""
