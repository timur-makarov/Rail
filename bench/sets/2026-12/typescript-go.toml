# typescript-go: microsoft/TypeScript, go, proposed project of set 2026-12 (fulltest PLAN sections 3 and 4).
# Settings: written by reading the project's CI and docs at the oldest and newest start commit, nothing run;
# every command marked `unverified` is for the admission session to try and fix. Notes: notes/typescript-go.md.
# Situations: every candidate of bench-candidates/typescript-go.toml (REPORT-window-rule.md, 2026-11-26), in its order,
# all 38 of them.
# half is `work` for every candidate until the split after admission and the hardness runs (cloud/README.md).
# hidden_tests: the fix's changed files (start..fix, compare API) that match [project] tests or the travel
# globs ["tsc/testdata/fixtures/*", "tsc/internal/*/testdata/*", "tools/*/testdata/*", "tsc/internal/fourslash/tests/util/*", "tsc/internal/testutil/*"],
# and not ["tsc/testdata/baselines/local/*", "tsc/testdata/baselines/tmp/*"]; deleted files left out.
# self_filed: the issue's author opened the fix. bot_filed: the issue's author is an automation account
# (a login ending in bot or -ci, or turso-github-handyman, roboturso). security_trap: the reading pass's
# flag for a request whose natural fix invites a flaw. kind race is the race flag.

# typescript-go: the Go port of TypeScript (TypeScript 7), which now lives in microsoft/TypeScript itself. At every
# start commit (2026-08-20 .. 2026-11-20) the root holds go.work (use ./tools ./tsc), the Go module tsc/ (compiler,
# language server, baselines under tsc/testdata), the Go module tools/, npm workspaces packages/* and Herebyfile.mjs.
# There is NO git submodule any more (no .gitmodules at either start; the old _submodules/TypeScript is gone: the
# TypeScript test cases now live in tsc/testdata/tests/cases), so git archive loses nothing.
# Read at oldest start 6556d51579b56cebe862521ee6d631a3260b2ce0 and newest 779cf755f75a43e4ad4916fea56cb474e1f46db6.
# No [[situation]] tables: they are written elsewhere.

[project]
name = "typescript-go"
repo = "https://github.com/microsoft/TypeScript"
language = "go"
# TS 7 ships on npm as `typescript` (and nightlies as `@typescript/native-preview`); the word "typescript" catches both
# (`npm i typescript@7`, `npx @typescript/native-preview`). Go fetches are caught by the slug microsoft/TypeScript.
package = "typescript"
# Tests are Go test files AND the data-driven compiler tests: case files under tsc/testdata/tests and the reference
# baselines under tsc/testdata/baselines/reference. Baselines are listed here (not only as travel) on purpose: with
# clash = "dir" the grade then sets aside every arm-changed baseline in a hidden baseline's folder, so an arm cannot
# pass by accepting its own output for a hidden case's other baseline files (see typescript-go.md, "clash").
tests = ["tsc/*_test.go", "tools/*_test.go", "tsc/testdata/tests/*", "tsc/testdata/baselines/reference/*"]
clash = "dir"
# node_modules: Rail worktrees get a node_modules/ folder (a link into $BENCH_CACHE), never worth saving in a stage.
build_dirs = ["node_modules"]

[commands]
# from: .github/workflows/copilot-setup-steps.yml@779cf755 (go -C ./tsc mod download; go -C ./tools mod download),
#       .github/workflows/ci.yml@779cf755 job go-test (plain `go test ./...` in tsc works with no node and no npm ci),
#       tsc/internal/testutil/jstest/node.go@779cf755 (with node on PATH, astnav tests load
#       <root>/node_modules/typescript/lib/typescript.js), package-lock.json@779cf755 (typescript 6.0.3, integrity).
# unverified: never run; the toolchain switch to go1.26.0 / go1.27.0 (go.work `go 1.26` / `go 1.27`) and the offline
#   re-use of it are read from the Go 1.24.7 source, not tried; the npm tarball fetch is plain python, not npm.
# Setup fetches: the Go toolchain go.work asks for, every module of both workspace modules, and the one npm package the
# Go tests need (typescript, the version package-lock.json pins), all into $BENCH_CACHE. It writes nothing tracked; the
# copy gets only node_modules/typescript (a link into the cache; node_modules/ is gitignored) and a repacked .git
# (70k loose objects -> one pack: about 70k fewer inodes per copy).
setup = '''
set -euo pipefail
mkdir -p "$BENCH_CACHE/npm"
t=$(mktemp "$BENCH_CACHE/.go-env.XXXXXX")
printf '%s\n' 'export GOMODCACHE="$BENCH_CACHE/gomod"' 'export GOCACHE="$BENCH_CACHE/gocache"' > "$t"
mv -f "$t" "$BENCH_CACHE/go-env.sh"
. "$BENCH_CACHE/go-env.sh"
export GOPROXY=https://proxy.golang.org,direct
go -C tsc version
go -C tsc mod download
go -C tools mod download
go -C tsc list -deps -test ./... >/dev/null
go -C tools list -deps -test ./... >/dev/null
GOPROXY=off go -C tsc list -deps -test ./... >/dev/null
ts=$(python3 -I - "$BENCH_CACHE/npm" <<'PY'
import base64, hashlib, io, json, os, shutil, sys, tarfile, tempfile, urllib.request
lock = json.load(open("package-lock.json"))["packages"]["node_modules/typescript"]
dest = os.path.join(sys.argv[1], "typescript-" + lock["version"])
if not os.path.isfile(os.path.join(dest, "package", "lib", "typescript.js")):
    data = urllib.request.urlopen(lock["resolved"], timeout=600).read()
    algo, want = lock["integrity"].split("-", 1)
    if base64.b64encode(hashlib.new(algo, data).digest()).decode() != want:
        sys.exit("typescript tarball: integrity mismatch")
    tmp = tempfile.mkdtemp(dir=sys.argv[1])
    with tarfile.open(fileobj=io.BytesIO(data)) as tar:
        tar.extractall(tmp, filter="data")
    try:
        os.rename(tmp, dest)
    except OSError:
        shutil.rmtree(tmp)
print(os.path.join(dest, "package"))
PY
)
mkdir -p node_modules
ln -sfn "$ts" node_modules/typescript
git repack -a -d -q && git prune-packed
if [ -n "$(git status --porcelain)" ]; then git status --porcelain | head -20; echo "setup changed the tree"; exit 1; fi
'''
# from: CONTRIBUTING.md@779cf755 ("go -C ./tsc test -run='TestLocal/<test name>' ./internal/testrunner"),
#       tsc/internal/testrunner/compiler_runner{,_test}.go and transpile_runner.go@779cf755 (subtest names),
#       tsc/internal/fourslash/baselineutil.go@779cf755 (fourslash baseline name = test name without "Test", first
#       letter lowered).
# unverified: the mapping of a hidden file to the tests it belongs to (below) is read from the runner code, not run.
# Runs ONLY the tests the hidden files define or feed, one `go test` per package, -count=1:
#   *_test.go                -> the Test/Fuzz/Example funcs it defines (TestMain left out; none -> the whole package)
#   tests/cases/{compiler,conformance}/X.ts(x)          -> TestLocal/X.ts (every configuration of it)
#   baselines/reference/{compiler,conformance}/B        -> TestLocal/<the case B belongs to> (longest name prefix of B,
#                                                          cut at a '.' or '(', that is a case file)
#   tests/cases/transpile/X.*, baselines/reference/transpile/B -> TestTranspile/X
#   baselines/reference/fourslash/CMD/N.ext             -> TestN (first letter raised) in ./internal/fourslash/tests
#   baselines/reference/{tsc,tscWatch,tsbuild,tsbuildWatch,astnav,tsoptions,config,lsp,api,project}/... -> that
#                                                          package's whole run (best guess, unverified)
#   anything else (fixtures, other non-.go files)       -> travels only, not run
# A baseline whose case cannot be found is an error (exit 2), so admission says so instead of passing a null run.
test_files = '''
. "$BENCH_CACHE/go-env.sh" || exit 1
list=$(mktemp) || exit 1
trap 'rm -f "$list"' EXIT
err=0 fail=0
esc() { printf '%s' "$1" | sed -e 's/[][\\.^$*+?(){}|/]/\\&/g'; }
case_of() {
  local dir=$1 b=$2 i cand e found=""
  for ((i = 1; i < ${#b}; i++)); do
    case "${b:i:1}" in
      .|"(") cand=${b:0:i}
        for e in .ts .tsx .js .jsx .mts .cts; do
          [ -n "$(find "$dir" -type f -name "$cand$e" -print -quit 2>/dev/null)" ] && found=$cand$e
        done ;;
    esac
  done
  printf '%s' "$found"
}
for f in {files}; do
  b=${f##*/}
  case "$f" in
    tsc/*_test.go|tools/*_test.go)
      [ -f "$f" ] || continue
      mod=${f%%/*}; d=${f%/*}; pkg=./${d#*/}; [ "$d" = "$mod" ] && pkg=.
      names=$(grep -ohE '^func (Test|Fuzz|Example)[A-Za-z0-9_]*\(' "$f" | sed -E 's/^func //; s/\($//' | grep -vx TestMain)
      [ -n "$names" ] || names=ALL
      for n in $names; do echo "$mod $pkg $n" >> "$list"; done ;;
    tsc/testdata/tests/cases/compiler/*|tsc/testdata/tests/cases/conformance/*)
      case "$b" in *.ts|*.tsx) echo "L $(esc "$b")" >> "$list" ;; esac ;;
    tsc/testdata/tests/cases/transpile/*)
      echo "T $(esc "${b%.*}")" >> "$list" ;;
    tsc/testdata/baselines/reference/compiler/*|tsc/testdata/baselines/reference/conformance/*)
      suite=${f#tsc/testdata/baselines/reference/}; suite=${suite%%/*}
      c=$(case_of "tsc/testdata/tests/cases/$suite" "$b")
      if [ -n "$c" ]; then echo "L $(esc "$c")" >> "$list"; else echo "no test case for $f"; err=1; fi ;;
    tsc/testdata/baselines/reference/transpile/*)
      c=$(case_of tsc/testdata/tests/cases/transpile "$b")
      if [ -n "$c" ]; then echo "T $(esc "${c%.*}")" >> "$list"; else echo "no test case for $f"; err=1; fi ;;
    tsc/testdata/baselines/reference/fourslash/*)
      n=${b%%.*}; echo "tsc ./internal/fourslash/tests Test$(printf '%s' "${n:0:1}" | tr '[:lower:]' '[:upper:]')${n:1}" >> "$list" ;;
    tsc/testdata/baselines/reference/*)
      sub=${f#tsc/testdata/baselines/reference/}; sub=${sub%%/*}
      case "$sub" in
        tsc|tscWatch|tsbuild|tsbuildWatch) echo "tsc ./internal/execute/tsctests ALL" >> "$list" ;;
        astnav|tsoptions|lsp|api|project) echo "tsc ./internal/$sub ALL" >> "$list" ;;
        config) echo "tsc ./internal/tsoptions ALL" >> "$list" ;;
        *) echo "no test known for $f"; err=1 ;;
      esac ;;
  esac
done
[ "$err" = 0 ] || exit 2
local_re=$(sed -n 's/^L //p' "$list" | sort -u | paste -sd '|' -)
transpile_re=$(sed -n 's/^T //p' "$list" | sort -u | paste -sd '|' -)
if [ ! -s "$list" ]; then echo "no test found in the hidden files"; exit 2; fi
if [ -n "$local_re" ]; then
  go -C tsc test -count=1 ./internal/testrunner -run "^TestLocal\$/^($local_re)(_|\$)" || fail=1
fi
if [ -n "$transpile_re" ]; then
  go -C tsc test -count=1 ./internal/testrunner -run "^TestTranspile\$/^($transpile_re)(\\(|\$)" || fail=1
fi
while read -r mod pkg names; do
  if [ "$names" = ALL ]; then
    go -C "$mod" test -count=1 "$pkg" || fail=1
  else
    go -C "$mod" test -count=1 "$pkg" -run "^($names)\$" || fail=1
  fi
done < <(grep -vE '^[LT] ' "$list" | sort -u | awk '{k = $1 " " $2; if ($3 == "ALL") w[k] = 1; else a[k] = (k in a) ? a[k] "|" $3 : $3}
  END {for (k in w) print k, "ALL"; for (k in a) if (!(k in w)) print k, a[k]}')
exit $fail
'''
# from: .github/workflows/ci.yml@779cf755 (go test ./... in tsc), CI job log of run 45697103132 (go-test: testrunner
#       105 s, fourslash/tests 35 s on a 4-core runner; the whole `go test ./...` about 12 min cold).
# unverified: the choice of suites per package is mine, not the project's (the project runs the whole tsc suite).
# {package} is tsc/internal/X, tsc/cmd/X, tsc/testdata, tools or "." (see package_of). A tsc package runs its own
# tests and everything below it, plus the two baseline-driven suites that see most compiler and language-service
# changes: ./internal/testrunner (TestLocal: every compiler/conformance case; TestTranspile) and
# ./internal/fourslash/tests. tools runs the tools module. "." (root files, packages/, .github) runs the two suites.
# About 6-9 min per package in a new copy (compile 3-5 min, testrunner 2-3 min, fourslash 1 min).
test_package = '''
. "$BENCH_CACHE/go-env.sh" || exit 1
p={package}
case "$p" in
  tools) go -C tools test -count=1 -timeout=20m ./... ;;
  tsc/internal/*|tsc/cmd/*) go -C tsc test -count=1 -timeout=20m "./${p#tsc/}/..." ./internal/testrunner ./internal/fourslash/tests ;;
  *) go -C tsc test -count=1 -timeout=20m ./internal/testrunner ./internal/fourslash/tests ;;
esac
'''
# A path's package: its top folder under tsc/internal or tsc/cmd (so transformers/estransforms -> tsc/internal/
# transformers, ls/autoimport -> tsc/internal/ls), tsc/testdata, tools; anything else gives ".".
package_of = 'regex:^(tsc/(?:internal|cmd)/[^/]+|tsc/testdata|tools)(?:/|$)'
# Go's own failure lines; subtests are indented (`    --- FAIL: TestLocal/foo.ts_target=es5`), a panic prints
# `--- FAIL: TestX` before its trace.
failed = '^\s*--- FAIL: (\S+)'
timeout_minutes = 40

[commands.env]
BASH_DEFAULT_TIMEOUT_MS = "1800000"
BASH_MAX_TIMEOUT_MS = "7200000"
GOMODCACHE = "/srv/rail-bench/cache/typescript-go/gomod"
GOCACHE = "/srv/rail-bench/cache/typescript-go/gocache"
# Read with the toolchain facts in typescript-go.md. Values are literal (the bench does not expand them); the
# $BENCH_CACHE paths come from go-env.sh, which bash sources through BASH_ENV (and every command sources it again).
GOTOOLCHAIN = "auto"
GOPROXY = "off"
GOSUMDB = "sum.golang.org"
# NOT -mod=mod: go.work puts every go command in workspace mode, where -mod=mod is refused ("-mod may only be set to
# readonly or vendor when in workspace mode"). readonly is the default; set it so a machine GOFLAGS cannot leak in.
GOFLAGS = "-mod=readonly"
# As the CI go-test job and hereby's builds (CGO_ENABLED=0): no gcc needed, pure-Go net and os/user.
CGO_ENABLED = "0"
BASH_ENV = "$BENCH_CACHE/go-env.sh"

[rail.config.commands]
# from: as [commands] setup (offline part), CONTRIBUTING.md@779cf755 (go -C ./tsc ...).
# unverified: never run. Offline: links node_modules/typescript to the copy the bench setup fetched, then builds the
# tsc module so the toolchain switch and every module are proven offline and the worktree's compile is warm.
setup = '''
set -euo pipefail
. "$BENCH_CACHE/go-env.sh"
ver=$(python3 -I -c 'import json; print(json.load(open("package-lock.json"))["packages"]["node_modules/typescript"]["version"])')
ts="$BENCH_CACHE/npm/typescript-$ver/package"
[ -f "$ts/lib/typescript.js" ] || { echo "no $ts: run the bench setup with the network first"; exit 1; }
mkdir -p node_modules
ln -sfn "$ts" node_modules/typescript
go -C tsc build ./...
'''
# from: .github/workflows/ci.yml@779cf755 (go test in tsc; lint = golangci with govet; format = dprint+gofumpt, of
#       which gofmt is a subset), CONTRIBUTING.md@779cf755.
# unverified: never run; go vet on single packages is my stand-in for the project's custom golangci-lint.
# Always: gofmt -l on the changed .go files (the toolchain's own gofmt) and `go build ./...` of tsc. When the branch
# changes anything under tsc/: go vet of the changed packages, then their tests with the two baseline-driven suites
# (testrunner, fourslash/tests). tools/ changes: the tools module's tests. About 1-4 min with no change (cold build),
# 5-10 min with a tsc change.
verify = '''
set -uo pipefail
. "$BENCH_CACHE/go-env.sh" || exit 1
base=${RAIL_BASE:-refs/heads/main}
changed=$({ git diff --name-only "$base" --; git ls-files --others --exclude-standard; } | grep -vE '^\.(rail|claude)/' | sort -u)
go_files="" pkgs="" tsc_touched=0 tools_touched=0
for f in $changed; do
  case "$f" in tsc/*) tsc_touched=1 ;; tools/*) tools_touched=1 ;; esac
  case "$f" in *.go) [ -f "$f" ] && go_files="$go_files $f" ;; esac
  case "$f" in
    */testdata/*) ;;
    tsc/internal/*.go|tsc/cmd/*.go) [ -f "$f" ] && pkgs="$pkgs ./$(dirname "${f#tsc/}")" ;;
  esac
done
pkgs=$(printf '%s\n' $pkgs | sort -u)
if [ -n "$go_files" ]; then
  bad=$("$(go -C tsc env GOROOT)/bin/gofmt" -l $go_files) || exit 1
  [ -z "$bad" ] || { echo "not gofmt-formatted:"; echo "$bad"; exit 1; }
fi
go -C tsc build ./... || exit 1
if [ "$tsc_touched" = 1 ]; then
  if [ -n "$pkgs" ]; then go -C tsc vet $pkgs || exit 1; fi
  go -C tsc test -count=1 -timeout=20m $pkgs ./internal/testrunner ./internal/fourslash/tests || exit 1
fi
if [ "$tools_touched" = 1 ]; then
  go -C tools test -count=1 -timeout=20m ./... || exit 1
fi
'''
timeout_secs = 1800
setup_timeout_secs = 1200
verify_timeout_secs = 1800

# The bench's additions, the same for every project file of this set:
# - [commands] env BASH_DEFAULT_TIMEOUT_MS and BASH_MAX_TIMEOUT_MS: the Bash tool limits Rail's own
#   .claude/settings.json gives its worker, given to every child, so a plain arm's Bash tool is not cut at
#   two minutes while Rail's runs for thirty.
# - [commands] env GOMODCACHE and GOCACHE: the paths go-env.sh exports, written out for the store
#   /srv/rail-bench (BENCH_STORE), so a child's Go finds the cached modules and toolchain even if its shell
#   does not read BASH_ENV.
# - [rail.config.worker] ladder: the Rail arm of the first run (PLAN section 6, owner 2026-11-25): Sonnet 5.5
#   medium, then Opus 5.5 medium. It sits here because an arm file can give only one rung (bench/arms.py);
#   person_ladder and contract stay as Rail's seed has them.
# - [rail.config.claim] stale_minutes: above the longest Rail command's limit plus save_minutes (10), as
