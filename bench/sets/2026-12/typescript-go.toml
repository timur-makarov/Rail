import("cloudflare:workers").then((mod) => mod);
```

Run `npx tsc -p .`

`@cloudflare/workers-types` 5.20261104.1 fails the same way. `await import("cloudflare:workers")` without `.then` passes. A non-callback use of the module passes.

### 🙁 Actual behavior

```
$ npx tsc -v
