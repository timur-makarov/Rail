# typescript-go-01: Downlevel calls through #private members wrapped in parentheses, !, as or satisfies should keep
# their this receiver.
# issue opened 2026-11-20, fix opened 2026-11-20, squash (or single commit); source files:
# tsc/internal/transformers/estransforms/classfields.go (19 lines); request from body (never edited).
# reading notes: AI-drafted report (stated). Emit baselines pin paren retention and temp-var layout; natural fix
# likely matches.
[[situation]]
id = "typescript-go-01"
request = """
Calls through `#private` members lose `this` below ES2022 when the callee is parenthesized or has `!`, `as` or `satisfies`

> This issue was drafted with the help of LLMs (Claude and Codex); I reviewed it and verified the reproductions.

## TypeScript Version

The tested TypeScript version is `7.1.0-dev.20261119.1` (`typescript@next` on November 20, 2026). `7.0.2` and `6.0.3` print the same, and the first four lines print `false` in every version I tried, back to `4.3.5`.

## User Goal

We ran into `(obj?.fn!)?.()` losing `this` while testing optional method calls in core-js, and checking which other callee shapes lose `this` in downlevel emit turned up calls through private members. The optional chaining shapes are reported in #65597.

## Setup and Action

Save as `repro.mts`:

```ts
class Example {
  #method(..._args: unknown[]) { return this; }

  run() {
    console.log((this.#method)() === this);
    console.log(this.#method!() === this);
    console.log((this.#method as any)() === this);
    console.log((this.#method)?.() === this);
    console.log(this.#method() === this);
    console.log(this.#method?.() === this);
  }
}

new Example().run();
```

```sh
npx --yes --package=typescript@7.1.0-dev.20261119.1 tsc --ignoreConfig --target es2021 --outDir out repro.mts
node out/repro.mjs
```

[Playground with TypeScript 6.0.3 and the ES2021 target](https://www.typescriptlang.org/play/?ts=6.0.3&target=8&strict=true#code/MYGwhgzhAECiAeYC2AHEBTaBvAUNaAxEugC4AWA9gCYAUAdAwPpgBOA5hAFzQCuAdgGs+FAO58A2gF0AlNmgtSPFn2jkAlhADc0AL4488-jVm58+YBT4QKGOiApsaNdRDpFSlKtOPQAvP9UyDWlNA3NLa1t7Rxc3YnJqAEIff19A4NCzaAsrG3Q7BydY9wSqaEhyvgBPb1lU9IgQsOyIvILHZyDXEs9pAH46FICXJqycyPzozo04j2ohtJHMs3G2qeL4zwGFhtHdHD0cPnQROERUDGM6FiMmoA)

## Expected and Actual Behavior

**What actually happened**: The first four lines print `false`, so the method got `this === undefined`, and the last two print `true`. The first four calls are emitted without a receiver: `(__classPrivateFieldGet(this, _Example_instances, "m", _Example_method))()`, `__classPrivateFieldGet(this, _Example_instances, "m", _Example_method)()` for the `!` and `as` lines, and `(__classPrivateFieldGet(this, _Example_instances, "m", _Example_method))?.()`. The last two end in `.call(this)` and `?.call(this)`.

**What I expected**: All six lines print `true`, as they do with `node repro.mts` on Node.js 26.13.0 and with `--target es2022`. `!` and `as` are type-only, and a parenthesized private member access keeps its `this` when it is called.

The same happens with a tag, `` (this.#method)`x` ``, with `this.#method!?.()` and `(this.#method satisfies unknown)()`, and with other kinds of private members: a field holding a function, `(this.#field)()`, a getter returning one, `(this.#getter)()`, and a static method, `(Example.#staticMethod)()`.

## Agent Info

Claude Code in Claude desktop 6.6395.1 + Claude Opus 5.5; Skill Version 1.0"""
start = "779cf755f75a43e4ad4916fea56cb474e1f46db6"
fix = "d0f15bd67685e40f584a84311dabf649f664b864"
hidden_tests = ["tsc/testdata/baselines/reference/conformance/privateNameAccessorsCallExpression.js", "tsc/testdata/baselines/reference/conformance/privateNameAccessorsCallExpression.symbols", "tsc/testdata/baselines/reference/conformance/privateNameAccessorsCallExpression.types", "tsc/testdata/baselines/reference/conformance/privateNameFieldCallExpression.js", "tsc/testdata/baselines/reference/conformance/privateNameFieldCallExpression.symbols", "tsc/testdata/baselines/reference/conformance/privateNameFieldCallExpression.types", "tsc/testdata/baselines/reference/conformance/privateNameMethodCallExpression.js", "tsc/testdata/baselines/reference/conformance/privateNameMethodCallExpression.symbols", "tsc/testdata/baselines/reference/conformance/privateNameMethodCallExpression.types", "tsc/testdata/baselines/reference/conformance/privateNameStaticMethodCallExpression.js", "tsc/testdata/baselines/reference/conformance/privateNameStaticMethodCallExpression.symbols", "tsc/testdata/baselines/reference/conformance/privateNameStaticMethodCallExpression.types", "tsc/testdata/tests/cases/conformance/classes/members/privateNames/privateNameAccessorsCallExpression.ts", "tsc/testdata/tests/cases/conformance/classes/members/privateNames/privateNameFieldCallExpression.ts", "tsc/testdata/tests/cases/conformance/classes/members/privateNames/privateNameMethodCallExpression.ts", "tsc/testdata/tests/cases/conformance/classes/members/privateNames/privateNameStaticMethodCallExpression.ts"]
