# marimo-19: ui.dictionary's elements parameter should accept a covariant Mapping so dict[str, checkbox] type-checks.
# issue opened 2026-08-23, fix opened 2026-08-25, squash (or single commit); source files:
# marimo/_plugins/ui/_impl/batch.py, marimo/_plugins/ui/_impl/dictionary.py (24 lines); request from body (never
# edited).
# reading notes: type-level test (pyright); text names the fix (Mapping); validate_and_clone existed before the fix
[[situation]]
id = "marimo-19"
request = """
Typing: ui.dictionary.__init__ uses invariant dict[UIElement] and rejects dict[str, ui.checkbox]

### Describe the bug

`marimo.ui.dictionary.__init__` currently types `elements` as:

```python
dict[str, UIElement[Any, Any]]
```

This causes static type checkers (Pylance/Pyright) to reject valid subclass dictionaries like `dict[str, mo.ui.checkbox]` because `dict` is invariant.

Observed runtime signature:
```python
(self, elements: 'dict[str, UIElement[Any, Any]]', *, label: 'str' = '', on_change: 'Callable[[dict[str, object]], None] | None' = None) -> 'None'
```

## Error message

Pylance/Pyright:
> Argument of type `dict[str, checkbox]` cannot be assigned to parameter `elements` of type `dict[str, UIElement[Any, Any]]` ... Consider switching from `dict` to `Mapping`.

## Why this is problematic
- Runtime behavior is correct.
- Users must add casts like `cast(dict[str, Any], elements)`.
- `UIElement` appears internal/non-public, so precise public typing is hard to express externally.

## Proposed fix
Use a covariant input type for constructor parameter, e.g.:

```python
Mapping[str, UIElement[Any, Any]]
```

### Will you submit a PR?

- [x] Yes

### Environment

- marimo: `0.24.0`
- Python: 3.14 (uv-managed)
- Type checker: Pylance/Pyright

### Code to reproduce

```python
from __future__ import annotations

from collections.abc import Iterable, Mapping
import marimo as mo

class Checkboxes(mo.ui.dictionary):
    def __init__(
        self,
        options: Iterable[str] | Mapping[str, str],
        preselected_options: Iterable[str] | None = None,
    ):
        pre = set(preselected_options) if preselected_options else set()
        elements: dict[str, mo.ui.checkbox]
        if isinstance(options, Mapping):
            elements = {
                option: mo.ui.checkbox(label=label, value=(option in pre))
                for option, label in options.items()
            }
        else:
            elements = {
                option: mo.ui.checkbox(label=option, value=(option in pre))
                for option in options
            }
        super().__init__(elements)  # type error
```"""
