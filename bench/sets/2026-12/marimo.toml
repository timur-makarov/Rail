after = table._search(SearchTableArgs(
    page_size=10,
    page_number=0,
    sort=[SortArgs(by="a", descending=False)],
))
print(before.total_rows, json.loads(before.data))
print(after.total_rows, json.loads(after.data))
```

Current output:

```text
