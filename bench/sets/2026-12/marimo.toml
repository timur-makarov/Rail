# marimo-06: marimo check glob patterns should keep * within one directory and let **/ match zero or more directories.
# issue opened 2026-10-26, fix opened 2026-11-09, squash (or single commit); source files: marimo/_utils/files.py (53
# lines); request from body (never edited).
# reading notes: AI-assisted report (Codex) linking a prepared patch; text gives full repro and expected output;
# expand_file_patterns already sorts
[[situation]]
id = "marimo-06"
request = """
marimo check glob patterns skip root-level files and cross directory boundaries

### Describe the bug

Quoted file patterns passed to `marimo check` do not respect directory boundaries:

- `**/*.py` omits Python files directly inside the starting directory.
- `*.py` also includes files from nested subdirectories.

Both synchronous and asynchronous file-pattern expansion use `fnmatch` on the entire path. In that use, `*` can consume directory separators, and `**/` does not match zero directory levels. Regression tests through `run_check()` confirm this reaches the lint command.

### Code to reproduce

```python
import asyncio
from pathlib import Path
from tempfile import TemporaryDirectory

from marimo._utils.files import async_expand_file_patterns

async def collect(root: Path, pattern: str) -> list[str]:
    return sorted(
        path.relative_to(root).as_posix()
        async for path in async_expand_file_patterns((str(root / pattern),))
    )

with TemporaryDirectory() as directory:
    root = Path(directory)
    (root / "top.py").touch()
    (root / "sub").mkdir()
    (root / "sub" / "nested.py").touch()
    for pattern in ["*.py", "**/*.py"]:
        print(pattern, asyncio.run(collect(root, pattern)))
```

Actual:

```text
*.py ['sub/nested.py', 'top.py']
**/*.py ['sub/nested.py']
```

Expected:

```text
*.py ['top.py']
**/*.py ['sub/nested.py', 'top.py']
```

### Proposed scope

Match individual path components, with `**` matching zero or more components. Keep the existing traversal, exclusion of hidden directories, deduplication, and asynchronous streaming behavior. The proposed implementation works on Python 3.11 without adding a dependency.

Prepared patch: https://github.com/j341nono/marimo/commit/2e003cba7

### Validation

Before the fix, 12 of the new cases fail. With the fix, the file-pattern and lint entry-point test modules report **42 passed**. Coverage includes relative/absolute paths, zero and multiple directory levels, `?`, hidden-directory exclusion, deduplication, and `run_check()` behavior.

### Environment

- marimo 0.25.2, source checkout at `d389f26dc` (main)
- macOS, arm64
- Python 3.13.17


`make check` was attempted, but dependency resolution failed before the checks ran: the Windows/Python 3.11 dependency split could not resolve the `mcp` / `pywin32` wheel requirements. Targeted tests were run against the checkout with a separate Python 3.13 environment; changed files also pass Ruff lint/format checks and focused mypy checking (`--follow-imports=silent --ignore-missing-imports`).

