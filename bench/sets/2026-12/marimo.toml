# marimo-08: With duckdb 2.0, DuckDBEngine.get_default_database/get_default_schema should return memory/main instead
# of None.
# issue opened 2026-10-25, fix opened 2026-10-27, squash (or single commit); source files:
# marimo/_sql/engines/duckdb.py (6 lines); request from body (never edited).
# reading notes: text names the fix; AI-drafted report; test only discriminates when duckdb>=2.0 is installed in the
# grading environment
[[situation]]
id = "marimo-08"
request = """
DuckDB 2.0: get_default_database() and get_default_schema() return None, because relations no longer have fetchone()

### Describe the bug

With duckdb 2.0.0 (on PyPI since October 21), `DuckDBEngine.get_default_database()` and `get_default_schema()` in marimo 0.25.2 return `None` instead of `memory` and `main`. `get_schemas(database=None)` then returns an empty list, and the data source connection built by `engine_to_data_source_connection` has `default_database` and `default_schema` set to `None`. Nothing raises: both methods catch the exception, log at info level, and return `None`.

The cause is `connection.sql("SELECT CURRENT_DATABASE()").fetchone()` (and the same for `CURRENT_SCHEMA()`) in `marimo/_sql/engines/duckdb.py`, lines 144 and 160. DuckDB 2.0.0 removed `fetchone()` from relations:

```text
AttributeError: Relations no longer have fetchone(): a relation keeps no result between calls, so every call runs it again. Use rel.limit(1).fetchall() instead.
```

duckdb 1.5.6 gives no deprecation warning for this call.

A note on the fix: `connection.execute(...).fetchone()` also works on 2.0.0, but it leaves the result open, and in 2.0.0 the next `connection.sql(...)` on the same connection then raises `ResourceInUseException: ... connection has an unfinished result from execute()`. `connection.sql(...).limit(1).fetchall()` worked on 1.4.5, 1.5.6 and 2.0.0 for us, including when another `connection.sql(...)` followed.

We have not looked at what the `None` changes in the UI.

