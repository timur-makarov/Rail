import marimo as mo

# 1. TypeError: can't compare datetime.datetime to datetime.date
mo.ui.date(value=dt.datetime(2024, 1, 1, 12))

# 2. constructs fine, but .value raises
#    ValueError: unconverted data remains: T00:00:00
mo.ui.date(start=dt.datetime(2024, 1, 1), stop=dt.datetime(2024, 2, 1)).value

# 3. same for date_range
mo.ui.date_range(start=dt.datetime(2024, 1, 1, 12), stop=dt.datetime(2024, 2, 1)).value
mo.ui.date_range(value=(dt.datetime(2024, 1, 1, 12), dt.datetime(2024, 2, 1)))
```

Output on main:

```
date(value=datetime): TypeError: can't compare datetime.datetime to datetime.date
date(start=datetime, stop=datetime): ValueError: unconverted data remains: T00:00:00
date_range(start=datetime, stop=datetime): ValueError: unconverted data remains: T12:00:00
date_range(value=(datetime, datetime)): TypeError: can't compare datetime.datetime to datetime.date
```

