# marimo-25: Attribute completion should fall back to interpreter completion when jedi static analysis raises.
# issue opened 2026-07-02, fix opened 2026-07-08, squash (or single commit); source files: marimo/_runtime/complete.py
# (17 lines); request from body (never edited).
# reading notes: AI-drafted report; text names the fix
[[situation]]
id = "marimo-25"
request = """
Attribute completion silently fails for variables assigned from pl.concat(...) — jedi crashes with 'TreeInstance' object has no attribute 'with_generics', and the interpreter fallback is never reached

# Preface
## ⬇️ This is written by a human, me Bartomat/Bartek from Munich 👋

Hi, 
currently I am learning Marimo with Polars and I am enjoying this very much!
Yesterday I was annoyed by missing autocompletions, and as Claude Fable 5 is available for some days in my subscription, I decided to let him investigate the problem.
And I was really astonished, how deeply he investigated the problem. The solution for me was pretty easy, but only in my case, with the help of Claude.
So I asked him to write down the error he claims to have found for you, the creators of Marimo, see below.
I am aware that this is not a severe bug, so priorize it in a manner that suits you.

But anyway: Thanks for all the great work you did and will do with Marimo 🍀 

Cheers 
Bartek
<hr>  

## ⬇️ This is written by the AI Claude (except of the ```marimo env``` output)⬇️ 

### Attribute completion silently fails for variables assigned from `pl.concat(...)` — jedi crashes with `'TreeInstance' object has no attribute 'with_generics'`, and the interpreter fallback is never reached

#### Describe the bug

Dot-attribute completion (e.g. typing `my_df.wi` and expecting `with_columns`) silently returns **no suggestions at all** for any variable whose definition involves `polars.concat(...)`. Variable-*name* completion keeps working (it is served from the frontend variables store), which makes the failure look mysterious: names complete, attributes don't.

The behavior is identical with marimo's built-in Jedi completion **and** with pylsp enabled, because both run the same Jedi static analysis, and Jedi crashes on polars' generic `concat` signature with:

```
AttributeError: 'TreeInstance' object has no attribute 'with_generics'
```

This is a known, still-open upstream Jedi bug: https://github.com/davidhalter/jedi/issues/1990 (open since 2024-04-22; originally surfaced as https://github.com/ipython/ipython/issues/14412). We verified it reproduces with jedi 0.19.2 (marimo's pinned range is `jedi<0.20.0,>=0.18.0`) **and** with jedi 0.20.0, so a version bump would not help.

The marimo-specific part of this report: in `marimo/_runtime/complete.py`, `complete()` wraps everything in a `try/except` that logs the failure only at DEBUG level and sends "no completions". Because the static path *raises* instead of returning an empty list, the interpreter-based fallback in `_get_completions()` — which would have completed this variable just fine from the runtime globals — is never reached. So a Jedi inference crash on one generic function silently kills attribute completion for the affected variable, with nothing visible in the default (WARN) logs.

## How this was found

I am Claude (Claude Fable 5, an AI assistant by Anthropic), and I researched and wrote this report while helping Bartek debug why completion "sort of didn't work" in his notebooks (marimo 0.23.13, Windows 11/Chrome and Linux Mint/Firefox — identical symptoms on both, which ruled out the browser). The trail was:

1. Running `marimo edit -l debug` revealed `Completion with jedi failed: 'TreeInstance' object has no attribute 'with_generics'` on every completion request for the affected variable (this message is `LOGGER.debug(...)` in `complete.py`, so it is invisible at the default log level).
2. `~/.cache/marimo/logs/pylsp.log` contained the same `AttributeError` 210 times, specifically when resolving the affected variable, with a traceback ending in `jedi/inference/compiled/value.py`, line 261, `v.with_generics(arguments)` (inside `execute_annotation`).
3. Bisecting the variable's definition chain in a clean environment isolated the trigger to `pl.concat(...)` alone — `pl.read_csv`, `unique(subset=~cs.integer())`, `with_row_index(...)`, and `sort(...)` are all fine on their own.

`pl.concat` is generically typed (`def concat(items: Iterable[PolarsType], ...)`, where `PolarsType` is a `TypeVar`), and the crash happens exactly while Jedi executes that generic annotation, matching jedi#1990.

#### Minimal reproduction (no marimo needed — this is the exact code path `_get_completions_with_script` runs)

```python
import jedi  # 0.19.2 or 0.20.0

code = "\\n".join([
    "import polars as pl",
    'bk_a = pl.read_csv("a.csv")',
    'bk_b = pl.read_csv("b.csv")',
    "bk_x = pl.concat([bk_a, bk_b])",
    "bk_x.wi",
])
jedi.Script(code).complete()
# AttributeError: 'TreeInstance' object has no attribute 'with_generics'
```

Replace `pl.concat([bk_a, bk_b])` with plain `bk_a` and the same call returns `with_columns`, `with_row_index`, etc.

**In marimo:** put the first four lines in one cell, run it, then type `bk_x.` in a new cell. No completion popup appears (while `bk_a.` completes normally). Same result with the pylsp language server enabled.

#### Expected behavior

Either the completion should still work (the interpreter fallback would succeed — `jedi.Interpreter("bk_x.wi", [globals_with_real_df]).complete()` returns correct results for this case), or at minimum the failure should be visible above DEBUG level.

#### Suggested fixes (any subset would help)

1. In `_get_completions()` (`marimo/_runtime/complete.py`), catch exceptions from `_get_completions_with_script(...)` and treat them like "no static completions", so the existing interpreter fallback gets a chance to run.
2. Log Jedi completion failures at a more visible level (or once per session at WARNING), so users don't face a silent no-op.
3. Optionally track https://github.com/davidhalter/jedi/issues/1990 upstream.

#### Workaround for users

Annotate the assignment explicitly — Jedi then uses the annotation instead of evaluating `concat`'s generic return type:

```python
bk_x: pl.DataFrame = pl.concat([bk_a, bk_b])...
```

Verified: this restores attribute completion both with the built-in Jedi completion and with pylsp.

#### Environment

Affected user environment (symptoms confirmed on both):
- marimo 0.23.13, Windows 11 (Chrome) and Linux Mint (Firefox)
- jedi 0.19.2, polars 1.42.1, python-lsp-server 1.14.0

