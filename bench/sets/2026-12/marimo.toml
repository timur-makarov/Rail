# marimo-12: find_sql_defs should handle non-ASCII SQL by treating duckdb.tokenize offsets as UTF-8 byte offsets.
# issue opened 2026-10-12, fix opened 2026-10-12, squash (or single commit); source files: marimo/_ast/sql_visitor.py
# (19 lines); request from body (never edited).
# reading notes: text names the fix
[[situation]]
id = "marimo-12"
request = """
find_sql_defs fails with IndexError on SQL containing non-ASCII text (duckdb.tokenize returns byte offsets)

### Describe the bug

When a `mo.sql()` cell contains non-ASCII characters (for example a Cyrillic comment) before the last SQL token, marimo logs `Unexpected duckdb error string index out of range` (MF005) while parsing the cell. This happens on every parse in the kernel and in `marimo check`.                                                                    

Cause: `duckdb.tokenize()` returns token start positions as **byte** offsets into the UTF-8 encoded query. `_TokenExtractor` in `marimo/_ast/sql_visitor.py` uses them as  **character** indexes into the Python `str` (`sql_statement[start]`). Every multi-byte character shifts the offsets. That either raises `IndexError` or quietly reads the wrong token text, so `CREATE TABLE/VIEW/ATTACH` detection can go wrong too.                                                                                                                 
                                                                                                                                                                          
  ```python                                                                                                                                                                  
  import duckdb                                                                                                                                                              
  s = "-- ая\\nSELECT a FROM t"                                                                                                                                               
  len(s), len(s.encode())   # (21, 23)                                                                                                                                       
  duckdb.tokenize(s)        # SELECT is at 8 (byte offset), but s[8] is not 'S'                                                                                              
  ```                                                                                       

Possible fix: tokenize/index on `sql_statement.encode()` and decode the token slices, or map the byte offsets to character offsets before indexing. The same code is on `main`.           

### Will you submit a PR?

- [ ] Yes

### Environment

```json                                                                                                                                                                    
  {                                                                                                                                                                          
    "marimo": "0.23.8",                                                                                                                                                      
    "editable": false,                                                                                                                                                       
    "OS": "Darwin",                                                                                                                                                          
    "OS Version": "27.0.0",                                                                                                                                                  
    "Processor": "arm",                                                                                                                                                      
    "Python Version": "3.12.6",                                                                                                                                              
    "Optional Dependencies": {                                                                                                                                               
      "duckdb": "1.5.3",                                                                                                                                                     
      "pandas": "3.0.2",                                                                                                                                                     
      "polars": "1.41.1",                                                                                                                                                    
      "pyarrow": "24.0.0"                                                                                                                                                    
    }                                                                                                                                                                        
  }                                                                                                                                                                          
  ```                    

### Code to reproduce

 ```python                                                                                                                                                                  
  from marimo._ast.sql_visitor import find_sql_defs                                                                                                                          
                                                                                                                                                                             
  find_sql_defs("-- Purpose: test\\nSELECT a FROM t\\nWHERE x = 1\\n")   # OK                                                                                                   
  find_sql_defs("-- Purpose: тест\\nSELECT a FROM t\\nWHERE x = 1\\n")   # IndexError: string index out of range                                                                
  ``` 

Or in a notebook:                                                                                                                                                          
                                                                                                                                                                             
  ```python                                                                                                                                                                  
  df = mo.sql(""\"                                                                                                                                                            
      -- комментарий                                                                                                                                                         
      SELECT 1 AS x                                                                                                                                                          
  ""\")                                                                                                                                                                       
