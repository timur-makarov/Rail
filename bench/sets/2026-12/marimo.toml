id = "marimo-11"
request = """
mo.ui.date and mo.ui.date_range crash when given datetime.datetime values

### Describe the bug

mo.ui.date and mo.ui.date_range fail when start, stop or value is a datetime.datetime (or a pandas Timestamp, which subclasses it). datetime.datetime is a subclass of datetime.date, so these arguments match the annotated dt.date types, but both widgets only normalize string inputs:

- mo.ui.date(value=datetime(2024, 1, 1, 12)) raises TypeError: can't compare datetime.datetime to datetime.date during construction (the datetime value is compared against the default date bounds).
- mo.ui.date(start=datetime(...), stop=datetime(...)) constructs, but the initial value is serialized as "2024-01-01T00:00:00", so reading .value raises ValueError: unconverted data remains: T00:00:00.
- mo.ui.date_range has the same two failures for start/stop and for a value tuple of datetimes.

A common way to hit this is passing the min/max of a datetime column, e.g. mo.ui.date(start=df["ts"].min(), stop=df["ts"].max()) with pandas.

The private converters already contain a branch meant to handle this (if isinstance(value, dt.datetime): return value.date()), but it is unreachable because the isinstance(value, dt.date) check comes first, and the constructors only call the converter for str inputs.

Expected: datetimes are truncated to their date, the same way date strings are parsed, e.g. mo.ui.date(value=datetime(2024, 1, 1, 12)).value == date(2024, 1, 1).

Workaround: call .date() on the values before passing them.

Location: marimo/_plugins/ui/_impl/dates.py (date.__init__ / date._convert_value, date_range.__init__ / date_range._convert_single_value).

### Will you submit a PR?

- [x] Yes

### Environment

marimo 0.25.1 (main at bc0e35676), Python 3.12, macOS 15 (arm64). Not environment specific; plain Python, no browser needed.

### Code to reproduce

```python
