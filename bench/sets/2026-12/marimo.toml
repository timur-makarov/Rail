# marimo-24: Editing int8/uint8/float16 columns in data_editor should keep numeric values instead of coercing to
# strings.
# issue opened 2026-07-17, fix opened 2026-07-17, squash (or single commit); source files:
# marimo/_plugins/ui/_impl/data_editor.py (11 lines); request from body (never edited).
# reading notes: filed by fixer; text names the fix
[[situation]]
id = "marimo-24"
request = """
mo.ui.data_editor silently corrupts int8/uint8/float16 columns on edit

### Bug

Editing a cell in a numeric column whose dtype is `Int8`, `UInt8`, `Int128`, `UInt128`, or `Float16` silently corrupts the column instead of preserving the number.

`_convert_value` in `marimo/_plugins/ui/_impl/data_editor.py` hand-enumerates only `Int16/Int32/Int64/UInt16/UInt32/UInt64` and `Float32/Float64`. Any other numeric width falls through to `return str(value)`, so:

- **pandas** — the edited value becomes a string and the whole column is coerced to `object`.
- **polars** — the edit fails with a misleading `ValueError: Data editor does not support this type of data`.

### Reproduction

```python
import pandas as pd
from marimo._plugins.ui._impl.data_editor import apply_edits

df = pd.DataFrame({"a": pd.array([1, 2, 3], dtype="int8")})
res = apply_edits(df, {"edits": [{"rowIdx": 0, "columnId": "a", "value": "5"}]})
print(res["a"].dtype, list(res["a"]))
```

Output:
```
object ['5', 2, 3]     # int8  -> column corrupted to strings (BUG)
```
vs. the `int16` control, which works correctly:
```
int64 [5, 2, 3]
```

`int8` / `uint8` / `float16` are standard memory-optimized dtypes, so this hits real dataframes.

### Fix

Use narwhals' dtype-category predicates (`dtype.is_integer()` / `dtype.is_float()`) instead of hand-enumerating widths — that covers every integer/float width and can't miss one again. (Category methods are needed rather than adding `nw.Int8`/`nw.Float16` explicitly, because `nw.Float16` doesn't exist as an attribute on the minimum supported narwhals.)

PR incoming."""
