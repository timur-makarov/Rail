Sorting plain-Python tables with unequal column lengths drops rows or raises IndexError

### Describe the bug

`mo.ui.table` supports plain-Python column data with unequal lengths: its initial response pads absent values with null and counts the longest column. Sorting the same data can omit rows or raise `IndexError`.

On main `baddf23e92360b245f3c195f65ab6eeefe088383`, `{"a": [2], "b": [10, 20]}` initially returns two rows. Sorting by `a` returns only `[{"a": 2, "b": 10}]` with `total_rows=1`. With `{"a": [], "b": [10, 20]}`, sorting by `b` returns zero rows. With `{"a": [2, 1], "b": [10]}`, sorting by `a` raises `IndexError`.

Expected: sorting preserves the rows, treats absent values like explicit `None`, and retains the column-oriented return format. The original input is unchanged; this concerns the sorted result.

The normalization and row-count coverage from #9258 already accepts this input. The sorting path still derives the index count from the first column and indexes shorter columns directly. Padding columns explicitly with `None` works around it.

### Will you submit a PR?

- [x] Yes, if a narrowly scoped sorting fix and regressions would be welcome. A local candidate preserves existing None-last, stable multi-column sorting, mixed-type fallback, and non-mutating behavior. No public API, dependency, or frontend changes are proposed. Please confirm the scope before I open a draft PR.

