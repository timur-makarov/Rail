# marimo-21: radio and multiselect should raise dropdown's helpful ValueError for invalid option names instead of a
# bare KeyError.
# issue opened 2026-08-09, fix opened 2026-08-09, squash (or single commit); source files:
# marimo/_plugins/ui/_impl/input.py (26 lines); request from body (never edited).
# reading notes: filed by fixer; text names the fix; message text given in issue
[[situation]]
id = "marimo-21"
request = """
mo.ui.radio and mo.ui.multiselect raise a bare KeyError for invalid option names

### Describe the bug

`mo.ui.dropdown` validates option names and raises a `ValueError` naming the valid options. `mo.ui.radio` and `mo.ui.multiselect` index `self.options` directly, so an invalid option surfaces as an uninformative `KeyError`.

```python
import marimo as mo

mo.ui.dropdown(options=["a", "b"], value="zzz")
# ValueError: The option name 'zzz' is not a valid option.
#             Please use one of the following options: ['a', 'b']

mo.ui.radio(options=["a", "b"], value="zzz")
# KeyError: 'zzz'

mo.ui.multiselect(options=["a", "b"], value=["zzz"])
# KeyError: 'zzz'
```

Reproduced on marimo 0.23.16 (macOS, Python 3.12).

`_convert_value` runs both at construction and on every update from the frontend (`ui_element.py`), so this affects both paths.

Source: `dropdown._convert_value` performs the check in `marimo/_plugins/ui/_impl/input.py`, while `radio._convert_value` and `multiselect._convert_value` do a bare dict lookup.

### Suggested fix

Extract dropdown's existing check into a small helper and use it in all three components, so the message stays consistent by construction.

Note this would change the exception type on the error path from `KeyError` to `ValueError` for `radio` and `multiselect`. Happy to keep `KeyError` and only improve the message if you'd prefer to avoid that.

