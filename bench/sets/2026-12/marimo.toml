# marimo: marimo-team/marimo, python, reserve project of set 2026-12 (fulltest PLAN sections 3 and 4).
# Settings: written by reading the project's CI and docs at the oldest and newest start commit, nothing run;
# every command marked `unverified` is for the admission session to try and fix. Notes: notes/marimo.md.
# Situations: every candidate of bench-candidates/marimo.toml (REPORT-window-rule.md, 2026-11-26), in its order,
# all 27 of them.
# half is `work` for every candidate until the split after admission and the hardness runs (cloud/README.md).
# hidden_tests: the fix's changed files (start..fix, compare API) that match [project] tests or the travel
# globs [],
# and not ["marimo/_smoke_tests/**"]; deleted files left out.
# self_filed: the issue's author opened the fix. bot_filed: the issue's author is an automation account
# (a login ending in bot or -ci, or turso-github-handyman, roboturso). security_trap: the reading pass's
# flag for a request whose natural fix invites a flaw. kind race is the race flag.

# marimo-team/marimo for Rail's bench (a reserve). Read-only work of 2026-11-26: nothing here was run; see marimo.md.
# Oldest start read: 3599fe4e71f4d02dd3c1a1b4e255399b17029bd8 (2026-07-01); newest: 35660bbe0a6ad5fd429a9c6cf07b77bff99e88a8
# (2026-11-25). Shorthand below: OLD = 3599fe4e, NEW = 35660bbe.
#
# A Python package with a TypeScript frontend; only the Python tests matter here. CI's Python test job does not build
# the frontend: it copies frontend/index.html and the favicon into marimo/_static (gitignored) and runs pytest. As for
# the other Python projects: the venv lives in $BENCH_CACHE/venvs/KEY, the copy holds a symlink `.venv`, the editable
# install's .pth is rewritten to a relative path, and commands also set PYTHONPATH to the copy.

[project]
name = "marimo"
repo = "https://github.com/marimo-team/marimo"
language = "python"
package = "marimo"
tests = ["tests/**"]

[commands]
# unverified: CI uses "uv run --python X --group test-optional pytest ..." (a project venv, editable marimo, resolution
#   window UV_EXCLUDE_NEWER = 7 days); here uv pip with --exclude-newer at the start commit's own time, plus ruff
#   (dev group; two candidates' tests skip without it).
# from: .github/workflows/test_be.yaml@NEW and @OLD, .github/actions/test-python/action.yaml@NEW and @OLD ("Create
#   assets directory, copy over index.html"), pyproject.toml@both ([dependency-groups] test, test-optional;
#   uv_build backend), .python-version@both (3.13).
setup = '''
set -euo pipefail
# Network is on only here. Every later command runs offline.
unset UV_OFFLINE UV_PYTHON_DOWNLOADS
export UV_CACHE_DIR="$BENCH_CACHE/uv" UV_PYTHON_INSTALL_DIR="$BENCH_CACHE/python" UV_PYTHON_PREFERENCE=only-managed \
       UV_LINK_MODE=hardlink UV_COMPILE_BYTECODE=1 UV_NO_PROGRESS=1
root=$PWD
pyver=$(tr -d '[:space:]' < .python-version 2>/dev/null || echo 3.13)
uv python install "$pyver"
py=$(uv python find "$pyver")
# Packages as they were on the start commit's day: git archive stamped every file with the commit's time.
newer=$(date -u -d "@$(stat -c %Y pyproject.toml)" +%Y-%m-%dT%H:%M:%SZ)
key=$( { echo "marimo-venv-1 $py $newer"; cat pyproject.toml; } | sha256sum | cut -c1-16)
venv="$BENCH_CACHE/venvs/$key"
mkdir -p "$BENCH_CACHE/venvs"
exec 9>"$venv.lock"
flock 9
if [ ! -f "$venv/.bench-ok" ]; then
  rm -rf "$venv"
  uv venv -q --python "$py" "$venv"
  uv pip install -q --no-config --python "$venv/bin/python" --exclude-newer "$newer" --group test-optional -e . ruff
  # The editable install wrote this copy's absolute path into a .pth file; make it relative to site-packages.
  "$venv/bin/python" - "$root" <<'PY'
import os, sys, sysconfig
roots = {sys.argv[1], os.path.realpath(sys.argv[1])}
sp = sysconfig.get_paths()["purelib"]
for name in sorted(os.listdir(sp)):
    if not name.endswith(".pth"):
        continue
    path = os.path.join(sp, name)
    with open(path) as f:
        lines = f.read().splitlines()
    out, hit = [], False
    for line in lines:
        s = line.strip()
        for r in roots:
            if s == r or s.startswith(r + os.sep):
                out.append(os.path.normpath(os.path.join("..", "..", "..", "..", os.path.relpath(s, r))))
                hit = True
                break
        else:
            out.append(line)
    if hit:
        os.unlink(path)
        with open(path, "w") as f:
            f.write("\n".join(out) + "\n")
        print("bench: made", name, "relative:", out)
    elif any(r in l for l in lines for r in roots):
        sys.exit(f"bench: {name} still names the setup path")
PY
  touch "$venv/.bench-ok"
fi
flock -u 9
ln -sfn "$venv" .venv
grep -qxF '/.venv' .git/info/exclude || echo '/.venv' >> .git/info/exclude
# Some tests read marimo/_static/index.html (gitignored); CI copies it from the frontend source, unbuilt.
mkdir -p marimo/_static/assets
cp frontend/index.html marimo/_static/index.html
cp frontend/public/favicon.ico marimo/_static/favicon.ico
# Smoke: this copy's marimo is the one imported.
PYTHONPATH="$root" .venv/bin/python -c 'import marimo, sys; assert marimo.__file__.startswith(sys.argv[1]), marimo.__file__; print("bench: marimo", marimo.__version__)' "$root"
df -h "$BENCH_CACHE" . || true
'''
# unverified: CI's flags are "-v -n auto -k 'not test_cli' --durations=10 --picked=first --inline-snapshot=disable";
#   here -n 0 for steadiness, -p no:sugar for plain summary lines, -m "not network" (marked as needing package
#   indexes), and no -k (a hidden test may live in tests/_cli/test_cli_*.py). Non-Python files in the list (fixtures,
#   the .mjs Pyodide test of marimo-04) are left out: they need node and a Pyodide download.
# from: .github/actions/test-python/action.yaml@NEW, pyproject.toml@NEW [tool.pytest.ini_options] (timeout = 120).
test_files = '''
set -o pipefail
export PYTHONPATH="$PWD"
args=()
for f in {files}; do
  case "$f" in tests/*) ;; *) continue ;; esac
  case "${f##*/}" in test_*.py|*_test.py) args+=("$f") ;; esac
done
if [ ${#args[@]} -eq 0 ]; then echo "bench: no test modules among the given files"; exit 1; fi
exec .venv/bin/python -m pytest -p no:sugar -p no:cacheprovider -rfE -n 0 -m "not network" --inline-snapshot=disable "${args[@]}"
'''
# unverified: the folder walk-up is mine. tests/_server, tests/_runtime or tests/_plugins as a whole take about 3-6
#   minutes on 4 cores; most deeper folders under 2.
# from: as test_files; CI runs all of tests/ with -n auto.
test_package = '''
set -o pipefail
export PYTHONPATH="$PWD"
p={package}
d=tests; [ "$p" = . ] || d="tests/$p"
while [ "$d" != tests ] && [ ! -d "$d" ]; do d=${d%/*}; done
if [ "$d" = tests ]; then set -- tests/_ast/test_app.py; else set -- "$d"; fi
exec .venv/bin/python -m pytest -p no:sugar -p no:cacheprovider -rfE -n 4 -m "not network" --inline-snapshot=disable "$@"
'''
# marimo/_plugins/ui/_impl/table.py -> _plugins/ui/_impl (tests/_plugins/ui/_impl); marimo/_server/host/bridge.py ->
# _server/host; marimo/__init__.py, frontend/** -> "." (tests/_ast/test_app.py).
package_of = 'regex:^marimo/(.+)/[^/]+$'
failed = '^(?:FAILED|ERROR) (\S.*?)(?: - .*)?$'
timeout_minutes = 45
env = { UV_OFFLINE = "1", UV_PYTHON_DOWNLOADS = "never", MARIMO_SERVER_SKIP_UPDATE_CHECK = "1", BASH_DEFAULT_TIMEOUT_MS = "1800000", BASH_MAX_TIMEOUT_MS = "7200000" }
[rail.config.commands]
# unverified: no project source; links the venv and copies the two static files CI copies.
# from: .github/actions/test-python/action.yaml@NEW (the static files).
setup = '''
set -euo pipefail
main="$(git rev-parse --path-format=absolute --git-common-dir)/.."
[ -e .venv ] || ln -s "$(readlink "$main/.venv")" .venv
mkdir -p marimo/_static/assets
cp frontend/index.html marimo/_static/index.html
cp frontend/public/favicon.ico marimo/_static/favicon.ico
'''
# unverified: "ruff check" is CI's lint step (test_be.yaml test_check job, on all files); here on changed files only.
#   Tests: tests/_ast/test_app.py always, plus the test folders of the changed marimo/ files and changed test modules.
# from: .github/workflows/test_be.yaml@NEW ("uv run ruff check --fix --output-format=github").
verify = '''
set -o pipefail
export PYTHONPATH="$PWD"
base="${RAIL_BASE:-refs/heads/main}"
mapfile -t changed < <( { git diff --name-only "$base" --; git ls-files --others --exclude-standard; } | grep . | sort -u)
py=(); targets=(tests/_ast/test_app.py)
for f in "${changed[@]}"; do
  case "$f" in *.py) [ -f "$f" ] && py+=("$f") ;; esac
  case "$f" in
    marimo/*/*)
      d="tests/${f#marimo/}"; d=${d%/*}
      while [ "$d" != tests ] && [ ! -d "$d" ]; do d=${d%/*}; done
      [ "$d" = tests ] || targets+=("$d") ;;
    tests/*)
      case "${f##*/}" in test_*.py) [ -f "$f" ] && targets+=("$f") ;; esac ;;
  esac
done
if [ ${#py[@]} -gt 0 ]; then .venv/bin/python -m ruff check --force-exclude --quiet "${py[@]}" || exit 1; fi
mapfile -t targets < <(printf '%s\n' "${targets[@]}" | sort -u)
exec .venv/bin/python -m pytest -p no:sugar -p no:cacheprovider -rfE -n 4 -m "not network" --inline-snapshot=disable "${targets[@]}"
'''
timeout_secs = 900
setup_timeout_secs = 300
