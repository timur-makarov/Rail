# marimo-04: In WASM notebooks, constructing an unhashable threading.local subclass (e.g. a dataclass) should work
# instead of raising TypeError from the shim's WeakSet registry.
# issue opened 2026-11-12, fix opened 2026-11-19, squash (or single commit); source files:
# marimo/_runtime/_wasm/_concurrency/_threading.py (141 lines); request from oldest of 2 edit records.
# reading notes: AI-drafted report (Claude Code); text names cause and fix options; one changed test is a Pyodide .mjs
# matrix row, but the Python shim tests stand alone with mocks
[[situation]]
id = "marimo-04"
request = """
WASM: threading.local shim requires hashable instances (breaks rich.Console, gdsfactory)

### Describe the bug

In WebAssembly notebooks (marimo 0.25.2, Pyodide 314), constructing a subclass of `threading.local` that isn't hashable raises `TypeError: unhashable type`. A common case is a `@dataclass`, which sets `__hash__ = None` when `eq=True`.

The cause is in the WASM concurrency shim. `AsyncLocal.__new__` registers every instance in a module-level `weakref.WeakSet` (`_ASYNC_LOCALS.add(self)` in `marimo/_runtime/_wasm/_concurrency/_threading.py`), and a `WeakSet` hashes its members. CPython's own `threading.local` never needs instances to be hashable.

We hit this through rich. `rich.console.ConsoleThreadLocals` is declared `@dataclass class ConsoleThreadLocals(threading.local)`, so creating a `rich.console.Console()` fails. kfactory creates one at import time, so `import gdsfactory`/`import kfactory` fails in marimo.app. The same code works in plain Pyodide, where the shim isn't active.

### Reproduction

Observed in a marimo 0.25.2 WASM notebook (Pyodide 314) by importing `gdsfactory`, or anything else that constructs a `rich.console.Console()`. A minimal cell that exercises the same path:

```python
import dataclasses, threading

@dataclasses.dataclass
class L(threading.local):
    x: int = 0

L()  # TypeError: unhashable type: 'L' (via _ASYNC_LOCALS.add in AsyncLocal.__new__)
```

### Workaround

Before importing the library, give the class identity hashing, which is what `threading.local` has anyway:

```python
import rich.console
if rich.console.ConsoleThreadLocals.__hash__ is None:
    rich.console.ConsoleThreadLocals.__hash__ = object.__hash__
```

### Possible fix (needs a maintainer's view on the design)

The registry needs weak references, but it shouldn't depend on the instances' `__hash__`/`__eq__`, which belong to user classes. Options:
- a dict keyed by `id(self)` whose values are `weakref.ref(self, callback)`, with the callback removing the entry when the instance dies;
- registering storage per synthetic thread instead of per local, so thread cleanup doesn't need to enumerate locals.

I'm happy to send a PR with a test once the approach is agreed.

### Environment

- marimo 0.25.2 (WASM / marimo.app runtime)
- Pyodide 314 (Python 3.14)
- rich `ConsoleThreadLocals` (current releases)

🤖 Generated with [Claude Code](https://claude.com/claude-code)"""
