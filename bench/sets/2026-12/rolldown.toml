# rolldown-18: Honor transform sourcemaps of `{ mappings: '' }` and keep only traced sources in collapsed maps, so
# replaced module source does not leak into sourcemaps.
# issue opened 2026-10-09, fix opened 2026-10-22, squash (or single commit); source files:
# crates/rolldown/src/utils/render_ecma_module.rs,
# crates/rolldown_plugin/src/plugin_context/transform_plugin_context.rs, crates/rolldown_sourcemap/src/lib.rs (471
# lines); request from body (never edited).
# reading notes: text names the fix (two code sites); Rust test also pins that getCombinedSourcemap keeps an
# untransformed load map as is
# security trap: An incomplete pruning of sources/sourcesContent keeps disclosing server-only module source in
# published sourcemaps.
[[situation]]
id = "rolldown-18"
request = """
[Feature Request]: Honor empty transform sourcemaps (`{ mappings: '' }`) like Rollup

### What problem does this feature solve?

A transform that replaces a module with unrelated code needs a way to say that the output has no source mapping, so the module's original source stays out of the emitted map. Rollup supports this: its [plugin docs](https://rollupjs.org/plugin-development/#source-code-transformations) say to "return an empty sourcemap" with `map: { mappings: '' }`. Rolldown keeps the original module in `sources` and `sourcesContent` anyway.

For `@vitejs/plugin-rsc` this is a source disclosure. In the browser build it replaces each `"use server"` module with `createServerReference()` proxies, so the server implementation never ships as JavaScript. With client sourcemaps enabled, though, the browser `.js.map` still publishes the whole server module. vitejs/vite-plugin-react#1497 returns `{ mappings: '' }` for those proxies, which matches what Next.js does. Its e2e test passes on Vite 7 (Rollup) and fails on Vite 8 (Rolldown) because of this.

Two places in Rolldown cause it, permalinked to current `main`:

1. [`normalize_transform_sourcemap`](https://github.com/rolldown/rolldown/blob/24bc2d0b5c9a8c87ac8d1ce8cb9a2df61b8624b9/crates/rolldown_plugin/src/plugin_driver/build_hooks.rs#L389-L408) fills a returned map that has no `sources` or `sourcesContent` with the module id and its pre-transform code. So `{ mappings: '' }` becomes "the original module, with its content, and no mappings".
2. [`collapse_sourcemaps`](https://github.com/rolldown/rolldown/blob/24bc2d0b5c9a8c87ac8d1ce8cb9a2df61b8624b9/crates/rolldown_sourcemap/src/lib.rs#L102-L110) copies `sources` and `sourcesContent` wholesale from the first map in the chain, whether or not any traced token reaches them. So if an earlier transform produced a map (for example TypeScript stripping), the original survives even when a later transform returns `{ mappings: '' }` or [omits its map](https://github.com/rolldown/rolldown/blob/24bc2d0b5c9a8c87ac8d1ce8cb9a2df61b8624b9/crates/rolldown/src/utils/render_ecma_module.rs#L86-L92).

Rollup's [`collapseSourcemaps.ts`](https://github.com/rollup/rollup/blob/master/src/utils/collapseSourcemaps.ts), which Rolldown's comment says it follows, builds `sources` and `sourcesContent` in `traceMappings()` only from files that a traced segment actually reaches. A file no mapping reaches never appears.

### What does the proposed API look like?

There's no new API: honor the existing Rollup contract.

- A transform returning `map: { mappings: '' }` means its output has no mapping back to the module's previous code. It should not be filled with the pre-transform `sources` and `sourcesContent`.
- The collapsed map should include only the `sources` and `sourcesContent` that traced tokens reach, as Rollup's `traceMappings()` does, so earlier maps in the chain can't bring the original back.

### Reproduction

`npm i rolldown@1.2.13 rollup@4.64.3 magic-string`, then `node repro.mjs`:

```js
import fs from 'node:fs'
import path from 'node:path'
import MagicString from 'magic-string'
import { rolldown } from 'rolldown'
import { rollup } from 'rollup'

const dir = fs.mkdtempSync(path.join(import.meta.dirname, 'app-'))
fs.writeFileSync(path.join(dir, 'entry.js'), `import { save } from './action.js'\\nwindow.save = save\\n`)
fs.writeFileSync(path.join(dir, 'action.js'), `export async function save() { return 'SERVER_ONLY_SECRET' }\\n`)
const isAction = (id) => id.endsWith('action.js')

// Stands in for any earlier transform with a real map (e.g. TypeScript stripping).
const earlier = {
  name: 'earlier',
  transform(code, id) {
    if (!isAction(id)) return
    const s = new MagicString(code).prepend('/* earlier */\\n')
    return { code: s.toString(), map: s.generateMap({ hires: true }) }
  },
}
// Replaces the module with code that has no relation to the original.
const replace = {
  name: 'replace',
  transform(_code, id) {
    if (!isAction(id)) return
    return { code: `export const save = () => 'proxy'\\n`, map: { mappings: '' } }
  },
}

for (const [bundler, build] of [['rolldown', rolldown], ['rollup', rollup]]) {
  for (const plugins of [[replace], [earlier, replace]]) {
    const bundle = await build({ input: path.join(dir, 'entry.js'), plugins, treeshake: false, onwarn() {} })
    const { output } = await bundle.generate({ sourcemap: true })
    const { sources, sourcesContent } = output[0].map
    const leaked = sourcesContent.some((content) => content?.includes('SERVER_ONLY_SECRET'))
    console.log(`${bundler} [${plugins.map((p) => p.name)}]`, { sources, leaked })
  }
}
```

Output:

```
rolldown [replace] { sources: [ '../app-…/action.js', '../app-…/entry.js' ], leaked: true }
rolldown [earlier,replace] { sources: [ '../app-…/action.js', '../app-…/entry.js' ], leaked: true }
rollup [replace] { sources: [ 'app-…/entry.js' ], leaked: false }
rollup [earlier,replace] { sources: [ 'app-…/entry.js' ], leaked: false }
```"""
start = "8d4cfa46881922832c1dfdca2018dad90cfe67fe"
fix = "3f1dda11023c426b88b7d6ee39af23af653fba7d"
hidden_tests = ["crates/rolldown/tests/rolldown/issues/11176/main.js", "crates/rolldown/tests/rolldown/issues/11176/mod.rs", "crates/rolldown/tests/rolldown/issues/mod.rs", "packages/rolldown/tests/fixtures/issues/11176/_config.ts", "packages/rolldown/tests/fixtures/issues/11176/earlier-then-omitted.js", "packages/rolldown/tests/fixtures/issues/11176/earlier-then-replaced.js", "packages/rolldown/tests/fixtures/issues/11176/main.js", "packages/rolldown/tests/fixtures/issues/11176/replaced.js"]
