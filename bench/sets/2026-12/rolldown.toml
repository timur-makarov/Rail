# from: justfile lint-rust (cargo fmt --all --check) and test-rust @ both starts; rust-common.md section 6
# unverified: run time of the rolldown package on 4 cores
verify = '''
set -euo pipefail
export PATH="$COREPACK_HOME/bin:$PATH" CI=true INSTA_UPDATE=no INSTA_FORCE_PASS=0
base="${RAIL_BASE:-refs/heads/main}"
cargo fmt --all --check
names=$( { git diff --name-only "$base"; git ls-files --others --exclude-standard; } | sort -u | python3 -c '
import json, os, subprocess, sys
m = json.loads(subprocess.run(["cargo", "metadata", "--no-deps", "--offline", "--format-version", "1"],
                              check=True, capture_output=True, text=True).stdout)
root = m["workspace_root"]
by_dir = {os.path.relpath(os.path.dirname(p["manifest_path"]), root): p["name"]
          for p in m["packages"] if p["id"] in m["workspace_members"]}
out = set()
for line in sys.stdin:
    d = os.path.dirname(line.strip())
    while d and d not in by_dir:
        d = os.path.dirname(d)
    if d in by_dir:
        out.add(by_dir[d])
print(" ".join(sorted(out)))
')
echo "verify: packages changed against $base: ${names:-none}"
for n in $names; do
  case "$n" in
    rolldown_binding) cargo check -p rolldown_binding --tests ;;
    rolldown) cargo test -p rolldown --tests --no-fail-fast -- --skip test262_module_code ;;
    *) cargo test -p "$n" --tests --no-fail-fast ;;
  esac
done
'''
timeout_secs = 900
setup_timeout_secs = 900
verify_timeout_secs = 2400

# The bench's additions, the same for every project file of this set:
# - [commands] env BASH_DEFAULT_TIMEOUT_MS and BASH_MAX_TIMEOUT_MS: the Bash tool limits Rail's own
#   .claude/settings.json gives its worker, given to every child, so a plain arm's Bash tool is not cut at
#   two minutes while Rail's runs for thirty.
# - [rail.config.worker] ladder: the Rail arm of the first run (PLAN section 6, owner 2026-11-25): Sonnet 5.5
#   medium, then Opus 5.5 medium. It sits here because an arm file can give only one rung (bench/arms.py);
#   person_ladder and contract stay as Rail's seed has them.
# - [rail.config.claim] stale_minutes: above the longest Rail command's limit plus save_minutes (10), as
#   `rail docs config` asks.
[rail.config.worker]
ladder = ["claude-sonnet-5-5:medium", "claude-opus-5-5:medium"]

[rail.config.claim]
stale_minutes = 55

# rolldown-01: A dynamically imported module that does `export * from` a CommonJS module should expose the CJS named
# exports in its namespace, as Node does.
