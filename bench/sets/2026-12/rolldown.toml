# rolldown-26: In dev mode HMR patches and lazy chunks, calling an imported function must not bind `this` to the
# exports object.
# issue opened 2026-10-06, fix opened 2026-10-06, squash (or single commit); source files:
# crates/rolldown/src/hmr/impl_traverse_for_hmr_ast_finalizer.rs (47 lines); request from oldest of 2 edit records.
