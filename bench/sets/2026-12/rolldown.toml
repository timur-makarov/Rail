# rolldown-36: In dev module wrappers, re-exports from external modules should go through a real import instead of
# loadExports of an unregistered id, without declaring the same binding twice.
# issue opened 2026-07-27, fix opened 2026-07-27, squash (or single commit); source files:
# crates/rolldown/src/hmr/hmr_ast_finalizer.rs (64 lines); request from oldest of 3 edit records.
# reading notes: text names the fix; filed by a maintainer from code reading. Snapshot follows the existing import-arm
# codegen the issue points to.
[[situation]]
id = "rolldown-36"
request = """
Re-exports from external modules do not work in dev module wrappers (HMR patches, lazy chunks)

### What happens

In dev mode, module wrappers (HMR patches and lazy chunks) are produced by `HmrAstFinalizer`. When a wrapped module **re-exports** from an **external** module, the finalizer emits a `loadExports("<external id>")` call. External modules are never registered in the dev runtime registry, so this lookup cannot find anything, and the re-exported names end up empty.

Plain imports of external modules work. Only re-exports are affected. All three re-export forms hit the same path:

```js
export * from 'ext';
export * as ns from 'ext';
export { x } from 'ext';
```

### Minimal example (illustrative, from code reading)

```js
// a module inside an HMR patch or lazy chunk
export { debounce } from 'lodash-es'; // external

// wrapper output today
var __rolldown_exports__ = __rolldown_runtime__.__exportAll({ debounce: () => import_lodash_es.debounce });
var import_lodash_es = __rolldown_runtime__.loadExports("lodash-es"); // "lodash-es" is never registered
```

Compare with a plain import, which the same finalizer already handles correctly by emitting a real import statement the host resolves:

```js
// input
import * as A from 'node:assert';
// wrapper output (visible in the snapshot added by #10476)
import * as import_node_assert_10 from "node:assert";
```

### Why

The import arm branches on the module kind. The two re-export arms do not:

```mermaid
flowchart TD
  A["plain import of an external module"] --> B["ImportDeclaration arm — has a Module::External branch"]
  B --> C["emits a real import statement"]
  C --> OK["works — the host resolves the package"]
  D["any re-export from an external module"] --> E["ExportAllDeclaration and ExportNamedDeclaration arms — no external branch"]
  E --> F["emits var import_ext = loadExports of the external id"]
  F --> BAD["fails — externals are never registered in the dev runtime"]
```

Code locations (at `c50fac0`):

- Import arm with the external branch: [hmr_ast_finalizer.rs#L120-L135](https://github.com/rolldown/rolldown/blob/c50fac0639724199193b016a15845560e11e8428/crates/rolldown/src/hmr/hmr_ast_finalizer.rs#L120-L135)
- `export * from` / `export * as ns from` arm, no external branch: [hmr_ast_finalizer.rs#L288-L305](https://github.com/rolldown/rolldown/blob/c50fac0639724199193b016a15845560e11e8428/crates/rolldown/src/hmr/hmr_ast_finalizer.rs#L288-L305)
- `export { x } from 'ext'` path, no external branch: [hmr_ast_finalizer.rs#L178](https://github.com/rolldown/rolldown/blob/c50fac0639724199193b016a15845560e11e8428/crates/rolldown/src/hmr/hmr_ast_finalizer.rs#L178)
- `create_load_exports_call_stmt` emits `loadExports` for any module kind: [hmr_ast_finalizer.rs#L398](https://github.com/rolldown/rolldown/blob/c50fac0639724199193b016a15845560e11e8428/crates/rolldown/src/hmr/hmr_ast_finalizer.rs#L398)
- The gap is already marked in the code: [`// TODO reexport external module`](https://github.com/rolldown/rolldown/blob/c50fac0639724199193b016a15845560e11e8428/crates/rolldown/src/hmr/hmr_ast_finalizer.rs#L504)

### Second symptom: the same binding name declared twice

Both arms name the local binding through `ensure_static_import_info`, keyed by the importee. But they check different sets before emitting (`self.imports` vs `generated_static_import_stmts_from_external`), so neither one suppresses the other. A module that both imports and star-re-exports the same external gets two declarations with one name:

```js
// input
import { x } from 'ext';
export * from 'ext';

// wrapper output — the same name declared twice, which is a syntax error
import * as import_ext from 'ext';
var import_ext = __rolldown_runtime__.loadExports('ext');
```

### Scope

- Only the wrapper path is affected. The initial dev bundle and production builds go through scope hoisting, which resolves externals correctly for all forms.
- Found by code reading during the review of #10476. That PR does not change external handling — its new branch reads the same binding that `export * from` already used.
- No runnable reproduction attached. The exact runtime failure (empty namespace vs a thrown error) depends on how `loadExports` handles a missing id.

### Suggested direction

- Give the two re-export arms the same `Module::External` branch the import arm has: emit a real import statement and build the re-export from that binding.
- Unify the two duplicate-check sets so one binding name is never declared twice."""
