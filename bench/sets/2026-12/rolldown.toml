# rolldown-08: An exported var read early through an import cycle must not be inlined with its initializer value.
# issue opened 2026-11-07, fix opened 2026-11-17, squash (or single commit); source files:
# crates/rolldown/src/stages/link_stage/cross_module_optimization.rs, crates/rolldown/src/stages/link_stage/mod.rs,
# crates/rolldown/src/stages/link_stage/refine_stmt_side_effects.rs (40 lines); request from oldest of 3 edit records.
# reading notes: Snapshots carry runtime asserts; extra cases (default, __proto__, re-export, namespace) follow from
# the same rule.
[[situation]]
id = "rolldown-08"
request = """
`export var` read across a circular import before its declaration executes is inlined with its initializer

In Rolldown 1.3.0 with default options, a never-reassigned `export var` is inlined into a circularly imported module that evaluates before the declaring module, replacing `undefined` with the initializer value.

```js
// main.js
import { early } from './b.js';
export var v = 3;
console.log(early, v);

// b.js
import { v } from './main.js';
export const early = v;
```

```sh
npx rolldown main.js -f es -o bundle.js && node bundle.js
```

Running `node main.js` (as well as bundling with Rollup, esbuild, or webpack) prints `undefined 3`, because `b.js` evaluates before `main.js` when `v` is still `undefined`. Rolldown inlines `3` into `b.js` (`const early = 3;`) and prints `3 3`.

#11379 stopped inlining a `var` when module-level code in the same module reads it before its declaration, but cross-module reads in a cycle can still execute before the declaring module's body.

Credit: https://ucsbplse.github.io/"""
