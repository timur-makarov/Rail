# rolldown-28: In dev, deleting a still-imported file must fail the HMR round with an unresolved-import error and
# recreating it must recover.
# issue opened 2026-07-27, fix opened 2026-09-24, squash (or single commit); source files:
# crates/rolldown_dev/src/bundling_task.rs, crates/rolldown_dev/src/dev_context.rs (28 lines); request from oldest of
# 2 edit records.
# reading notes: text names the fix (clear resolver cache on create/delete); JS test is a file-watcher poll with 20s
# timeout
[[situation]]
id = "rolldown-28"
request = """
[Bug]: deleting a still-imported file yields a silent Noop (resolver cache never invalidated on watch events)

### Reproduction link or steps

Reproduction branch: **`test/dev-resolver-cache-deleted-file`** — <https://github.com/rolldown/rolldown/tree/test/dev-resolver-cache-deleted-file/packages/rolldown/tests/dev/dev-watch.test.ts>

```bash
git fetch origin && git switch test/dev-resolver-cache-deleted-file
pnpm install --frozen-lockfile
just build-rolldown
pnpm --filter @rolldown/test-dev-server build   # dev-watch tests import its compiled dist
cd packages/rolldown/tests
pnpm exec vitest run dev/dev-watch.test.ts -t "deleting an imported file"
```

The branch adds one test to `dev-watch.test.ts`. It asserts the **desired** behavior and fails red today. The core of it:

```ts
// main.js  -> import './parent.js'
// parent.js -> import { value } from './child.js'  (+ import.meta.hot.accept())
// child.js -> export const value = 'child'

fs.rmSync(path.join(cwd, 'child.js'));
// EXPECTED: the round fails with an unresolved-import error for './child.js'
await expect.poll(() => errorCalls().length, { timeout: 20_000 }).toBeGreaterThan(0);
```

What it shows: after deleting `child.js`, no error ever reaches `onHmrUpdates`. The poll times out with `expected 0 to be greater than 0`. The engine emits a silent `Noop` update instead, and the module graph keeps serving the deleted file's old content.

### What is expected?

Deleting a file that is still imported should fail the HMR round with an unresolved-import error — the same result as a cold build of that file state, and the same result Vite's bundled dev mode already shows (its `vite:resolve` re-checks the filesystem on every resolution, so the error overlay appears immediately). Recreating the file should then recover.

### What is actually happening?

The round ends in a silent `Noop`. The dev session keeps working against the deleted file until the server restarts; the restart then fails on the exact same file state with `UNRESOLVED_IMPORT`. So the running session and a fresh build disagree about whether the project builds.

Root cause: the resolver cache is never invalidated by watch events.

- oxc_resolver caches every filesystem lookup — hits **and** misses — in the cached path's metadata slot (`oxc_resolver` 11.24.2, `src/cache/cache_impl.rs:108`), and its only invalidation API is the whole-cache `clear_cache()`.
- Rolldown wraps it in `crates/rolldown_resolver/src/resolver.rs:100` (`clear_cache` also clears the `package_json_cache`).
- Dev calls `clear_resolver_cache()` in exactly one place: a full rebuild or a tsconfig change (`crates/rolldown_dev/src/bundling_task.rs:144-147`). The steady-state HMR loop never reaches it — even error recovery only re-runs an Hmr task (`crates/rolldown_dev/src/bundle_coordinator.rs:234`).

Both staleness directions are reachable:

| Direction | Trigger | Result today |
| --- | --- | --- |
| stale "exists" | delete a still-imported file | silent `Noop`; graph serves the deleted module; restart contradicts the session |
| stale "missing" | import a not-yet-existing file, then create it | resolution keeps failing until something forces a full rebuild, which the dev loop never does |

### System Info

```
rolldown: origin/main fc33374a6 (built from source, just build-rolldown)
OS: macOS 26.5.1 (arm64)
Node.js: v24.12.0
pnpm: 11.9.0
```

### Any additional comments?

- This is not caused by the `hotUpdate` work in #10305 — the repro has no plugins and the behavior is identical on `main` (verified on `fc33374a6`).
- The engine-level fixture `crates/rolldown/tests/rolldown/topics/hmr/delete_file_used` (added in #10333) currently pins the `noop` as intended behavior; fixing this issue flips that fixture's step-0 snapshot to an error, which should happen deliberately in the same change.
- Vite impact: rolldown-vite users are shielded, because `vite:resolve` answers relative resolution with a fresh `stat` per call and rolldown's own resolver is only the fallback. The bug hits raw dev-engine consumers (the `dev()` JS API, the node-fixture dev server, any future standalone `rolldown dev`).
- Fix shape: the only tool oxc_resolver offers today is whole-cache `clear_cache()`; calling it when a watch batch contains create/delete events (and on `package.json` edits) would cover both directions. Per-path invalidation would need an upstream oxc_resolver API.
- The same test exists as a skipped acceptance test on the #10305 branch; the fix un-skips it."""
