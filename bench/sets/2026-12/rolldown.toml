# rolldown-25: Runtime helpers should go into a separate runtime chunk when an entry is added via emitFile, as for
# input entries.
# issue opened 2026-10-28, fix opened 2026-10-28, squash (or single commit); source files:
# crates/rolldown/src/stages/generate_stage/chunk_optimizer.rs (33 lines); request from body (never edited).
[[situation]]
id = "rolldown-25"
request = """
[Bug]: runtime helpers are placed into an entry chunk added via `emitFile`

### Reproduction link or steps

[REPL](https://repl.rolldown.rs/#)

```js
// index.js (input)
export const load = () => import('./dep.js')

// secondary.js (input)
import { extra } from './dep.js'
export { extra }

// dep.js
export const extra = 3

// other.js (emitted chunk)
import * as ns from './ns.js'
export { ns }

// ns.js
export const a = 1
```

```js
// rolldown.config.js
import { defineConfig } from 'rolldown'

export default defineConfig({
  input: ['index.js', 'secondary.js'],
  plugins: [
    {
      name: 'emit-entry',
      buildStart() {
        this.emitFile({ type: 'chunk', id: './other.js' })
      },
    },
  ],
})
```

### What is expected?

The runtime helpers go into a separate `rolldown-runtime-*.js` chunk, the same as when `other.js` is passed via `input`:

```js
// dep-[hash].js
import { t as __exportAll } from "./rolldown-runtime-[hash].js";
```

### What is actually happening?

When an entry is added via `this.emitFile({ type: 'chunk' })`, Rolldown places the runtime helpers (`__exportAll` here) into that emitted entry's chunk. Unrelated chunks then import helpers from it, and the emitted entry is split into a facade plus a common chunk:

```js
// dep-[hash].js
import { n as __exportAll } from "./other-[hash].js";

// other-[hash].js
export { __exportAll as n, ns_exports as t };

// other-[hash].js (entry facade)
export { t as ns } from "./other-[hash].js";
```

Moving `./other.js` from `emitFile` into `input`, with nothing else changed, gives the expected output. Emitting from `buildStart` or `transform` behaves the same.

### System Info

```
rolldown 1.2.15
Node.js v22.23.4, Linux arm64
```

### Any additional comments?

This breaks `rolldown-plugin-dts`, which adds declaration entries via `emitFile`. Declarations also use `__exportAll` for `typeof import()` namespaces, so the runtime lands in a `.d.mts` chunk. The plugin then strips the helper code from that chunk and the JS output ends up importing `__exportAll` from a `.d.mts` file (rolldown/tsdown#1051, sxzz/rolldown-plugin-dts#166).

Possibly related: #8809 (runtime placed in an entry chunk, fixed for `input` entries).

Note: the REPL currently fails for every version with `Cannot set properties of undefined (setting 'initWorker')`, so the link above may not render output until that is fixed. The inline code reproduces locally with `rolldown@1.2.15`."""
