id = "rolldown-16"
request = """
import.meta.glob: negated `**/` patterns are ignored in build when the glob reaches outside the root

### Reproduction link or steps

```
repro/
  docs/
    a.md
    _note.md
    en-US/a.md
    tools/t.md
  app/
    index.html        <script type="module" src="/src/main.js"></script>
    src/main.js
```

`app/src/main.js`:

```js
const rel = import.meta.glob(
  ['../../docs/**/*.md', '!**/_*.md', '!**/tools/**', '!**/en-US/**'],
  { query: '?raw', import: 'default' }
)
console.log(Object.keys(rel))
```

```sh
cd repro/app
npm i -D vite@8.3.5
npx vite build
grep -o '"\\.\\./\\.\\./docs/[^"]*"' dist/assets/index-*.js
```

### What is expected?

The same result as `vite dev`: only `../../docs/a.md`.

### What is actually happening?

The build output has all four files:

```
../../docs/_note.md
../../docs/a.md
../../docs/en-US/a.md
../../docs/tools/t.md
```

The negated patterns have no effect. `vite dev` returns only `a.md`.

Two variants work correctly in build:

| Glob | dev | build |
|---|---|---|
| `['../../docs/**/*.md', '!**/en-US/**', …]` | `a.md` | all files |
| `['../../docs/**/*.md', '!../../docs/en-US/**', …]` | `a.md` | `a.md` |
| `['./docs/**/*.md', '!**/en-US/**', …]` (files inside root) | `a.md` | `a.md` |

So it only fails when the positive glob starts with `../` and the negation starts with `**/`. My guess is that the negation is matched against the relative key (`../../docs/en-US/a.md`), and `**` does not match the `..` segments. In dev, Vite's JS `transformGlobImport` handles the same pattern as expected.

The build uses `viteImportGlobPlugin` from `rolldown/experimental`. The switch happens in Vite's `importGlobPlugin` via `applyToEnvironment` → `isBundled`.

