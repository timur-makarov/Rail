```

### What is actually happening?

When the dynamic import's argument is a `const` that rolldown inlines, the message shows the identifier's **source text with its first and last characters removed**. It looks as if the diagnostic slices the import's span to drop the quotes of a string literal, but the span here covers an identifier:

