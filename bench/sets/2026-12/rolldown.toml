# rolldown-02: Add an inlineCommonChunks limit, maxDuplicatedSize, so a candidate stays a file when its size times its
# extra copy count reaches the limit.
# issue opened 2026-11-19, fix opened 2026-11-20, squash (or single commit); source files:
# crates/rolldown/src/stages/generate_stage/inline_common_chunks/select.rs,
# crates/rolldown/src/utils/prepare_build_context.rs,
# crates/rolldown_binding/src/options/binding_output_options/binding_manual_code_splitting_options.rs,
# crates/rolldown_binding/src/utils/normalize_binding_options.rs,
# crates/rolldown_common/src/inner_bundler_options/types/inline_common_chunks_options.rs,
# crates/rolldown_error/src/build_diagnostic/events/invalid_option.rs (253 lines); request from body (never edited).
# reading notes: filed by fixer; text names the fix (option name, rule, waiting-round and cycle details all stated).
# Test also sets a Rust struct field max_duplicated_size; snapshot of placement follows the stated rule.
[[situation]]
id = "rolldown-02"
request = """
inlineCommonChunks: bound the duplicated output, not only the candidate's size

## What happens

Since #11656, `experimentalInlineCommonChunks` also inlines a common chunk that an `import()` loads: every chunk that imports it statically prints a copy, and the `import()` loads a file that only registers it. `maxSize` bounds each candidate's source size, but nothing bounds how many copies a candidate gets. A module that many lazy chunks import is printed into each of them, and a page that loads several of those chunks downloads it once per chunk.

The design doc lists this under unresolved questions: "Cost model: `maxSize` bounds the duplicated source, not the duplicated output; a record printed into many files multiplies its bytes. A count limit or a shared-carrier heuristic is future work."

## Reproduction

`main.js` loads three panels and a dropdown with `import()`; each panel imports the dropdown statically. The dropdown is about 7 kB, under `maxSize`.

```js
// main.js
globalThis.load = {
  a: () => import('./panel-a.js'),
  b: () => import('./panel-b.js'),
  c: () => import('./panel-c.js'),
  dropdown: () => import('./dropdown.js'),
};

// panel-a.js (panel-b.js and panel-c.js are the same)
import { renderDropdown } from './dropdown.js';
export const panelA = () => 'panel-a ' + renderDropdown();

// dropdown.js: exports renderDropdown over a 120-entry string table
```

```js
const bundle = await rolldown({ input: 'src/main.js', preserveEntrySignatures: false });
await bundle.write({ dir: 'dist', codeSplitting: { experimentalInlineCommonChunks: { maxSize: 32768 } } });
```

| file | v1.2.15 | v1.3.3 |
| --- | --- | --- |
| `dropdown-*.js` | 7,412 B | 7,665 B |
| `panel-a-*.js` | 357 B | 7,967 B (prints the dropdown) |
| `panel-b-*.js` | 357 B | 7,967 B (prints the dropdown) |
| `panel-c-*.js` | 357 B | 7,967 B (prints the dropdown) |

A page that opens all three panels fetches 8.5 kB on v1.2.15 and 23.9 kB on v1.3.3; the dropdown's code runs once either way, through the registry.

## On a large application

On a code-split application with about 3,300 output chunks and a 32 KiB `maxSize`, moving from a v1.2.15-based build to a v1.3.3-based one (both carry a few code-splitting patches of ours on top of the release) turned about 300 more chunks into records and added about 4,000 copies. Individual pages fetch fewer files but more bytes: one page went from 354 files and 55.0 MB to 279 files and 56.1 MB (unminified), with the extra bytes in modules it now downloads 2 to 11 times. 394 of the 399 modules that page fetched more often were in a chunk that an `import()` also loads.

## Proposal: `maxDuplicatedSize`

A candidate stays a file when its pre-render size times the number of files beyond the first that would print it reaches `maxDuplicatedSize`. It is checked in the placement loop, next to the existing eval rule, so the copy count is the real one after registration propagation, and a loader's copy counts like a carrier's. Two details:

- A record that another over-limit record reads waits for a later round: once its reader is a file, that file prints the one copy the reader's importers used to repeat, so the count usually drops.
- Members of a record-only static cycle are left alone, since making one of them a file would leave a cycle that mixes records and files.

A count limit (`maxCopies`) was the first thing tried and it does not work: it also rejects the small, widely shared records that inlining is most useful for, and on the application above it added several hundred files. Weighting by size keeps those and stops the large, widely copied ones.

Measured on the same application, unminified, three representative pages:

| | page 1 files / MB | page 2 files / MB | page 3 files / MB | total JS |
| --- | --- | --- | --- | --- |
| v1.3.3, no limit | 279 / 56.07 | 348 / 57.92 | 314 / 52.87 | 328 MB |
| v1.2.15 rule for `import()` targets | 354 / 55.01 | 430 / 56.95 | 389 / 52.15 | 312 MB |
| `maxDuplicatedSize: 262144` | 304 / 54.99 | 374 / 56.80 | 341 / 52.01 | 314 MB |
| `maxDuplicatedSize: 131072` | 347 / 54.04 | 419 / 55.78 | 384 / 51.13 | 303 MB |

At 256 KiB the pages keep about two thirds of v1.3.3's request savings and lose all of its byte growth. Cold page loads over ten routes, measured as paired runs, were within noise of or faster than both the v1.2.15-based build and uncapped v1.3.3 on every route. The clearest gain is a page where uncapped v1.3.3 was about 0.4 s slower than the v1.2.15-based build; with the limit it was level.

I have an implementation with a fixture (`function/inline_common_chunks/max_duplicated_size`, a reader that waits for its over-limit reader, and an `unlimited` config variant) and can open a PR if this direction is acceptable. Happy to change the option's name or shape, for example a per-candidate callback instead of a number.

Related: #11040, #11656, rolldown/backlog#20."""
