[[situation]]
id = "rolldown-01"
request = """
[Bug]: `export * from` a CommonJS module in a dynamically imported chunk loses the named exports

### Reproduction link or steps

```js
// cjs.cjs
exports.foo = function foo() {}
```

```js
// re.js
export * from "./cjs.cjs"
```

```js
// entry.js
const m = await import("./re.js")
console.log("keys:", Object.keys(m), "foo:", typeof m.foo)
```

```sh
node entry.js                                  # keys: [ 'default', 'foo', 'module.exports' ] foo: function
npx rolldown entry.js -d out -f esm -p node
node out/entry.js                              # keys: [] foo: undefined
```

### What is expected?

The namespace returned by `import("./re.js")` contains the CommonJS module's named exports (`foo`), as in Node.

### What is actually happening?

The dynamic chunk for `re.js` is emitted as:

```js
//#endregion
export {};
```

The CommonJS module is dropped entirely, and `m.foo` is `undefined`.

With a default re-export added to `re.js`:

```js
import D from "./cjs.cjs"
export * from "./cjs.cjs"
export default D
```

the CJS module is bundled, but the chunk ends with `export { re_default as default };` and the namespace has only `default`. `m.foo` is still `undefined`.

### System Info

```Shell
rolldown v1.2.13 (latest)
Node v24.21.0
macOS 27.0.1, arm64
```

### Any additional comments?

Found in the wild: `@effect/platform-node`'s `NodeHttpClient.layerUndici` does `import("./Undici.js")` then `new _.Agent()`. `Undici.js` is `export * from "undici"` + `export default Undici` (undici is CJS). After bundling, it fails with `TypeError: _.Agent is not a constructor`.

Workaround: put the CJS package and the re-exporting module into one `output.codeSplitting.groups` entry. The chunk then exports a `__reExport`-built namespace, and the importer reads it via `.then((n) => n.t)`.

Possibly related: #10492 fixed the same symptom for `export * from "<external>"`. #10595 notes that a CommonJS star is still refused for namespace extraction."""
