# rolldown-07: Emitted entry chunks should keep their requested name ahead of common chunks, as input entries do.
# issue opened 2026-11-02, fix opened 2026-11-18, squash (or single commit); source files:
# crates/rolldown/src/chunk_graph.rs (13 lines); request from body (never edited).
# reading notes: Repros are REPL links but prose describes the setup. Reporter account looks bot-named. Facade part of
# the issue is optional and not fixed. Extra fixtures pin name precedence for user entry vs emitted chunk and a
# removed emitted facade vs group.
[[situation]]
id = "rolldown-07"
request = """
[Bug]: Emitted entry chunks lose their file name to common chunks

### Reproduction link or steps

Both reproductions use Rolldown 1.2.16. `rolldown.config.js` has a small plugin that calls `this.emitFile({ type: 'chunk', name, id })` in `buildStart`, with `entryFileNames` and `chunkFileNames` set to `[name].js`.

1. [Name conflict](https://repl.rolldown.rs/#): `one.js` and `two.js` are emitted entries. They share `lib/common.js`, and one of them is named `common`. ([same modules as input entries](https://repl.rolldown.rs/#))
2. [Facade](https://repl.rolldown.rs/#): `dep.js` is an emitted entry that another emitted entry imports through `mid.js`. ([same modules as input entries](https://repl.rolldown.rs/#))

### What is expected?

1. An entry chunk keeps its `name`, as input entries do. The common chunk gets the deduplicated name.
2. The entry module stays in its own entry chunk, as it does for input entries.

### What is actually happening?

1. The common chunk takes the name, and the entry is renamed:

| Chunk | Input entries | Emitted entries |
| --- | --- | --- |
| entry `common` (`one.js`) | `common.js` | `common2.js` |
| common chunk (`lib/common.js`) | `common2.js` | `common.js` |

2. `dep.js` becomes an empty facade, and the module moves to a separate common chunk:

| Chunk | Input entries | Emitted entries |
| --- | --- | --- |
| entry `dep` | `dep.js`, contains `dep.js` | `dep.js`, no modules |
| common chunk | none | `dep2.js`, contains `dep.js` |

`preserveSignature` set to `'strict'`, `'allow-extension'` or `'exports-only'` doesn't remove the facade. `false` does, but it strips the entry's exports, at least in rolldown-plugin-dts.

### System Info

```Shell
System:
  OS: Linux 7.2 Debian GNU/Linux 12 (bookworm) 12 (bookworm)
  CPU: (8) arm64 unknown
Binaries:
  Node: 22.23.4
  npm: 10.9.9
  pnpm: 12.16.1
npmPackages:
  rolldown: ^1.2.16 => 1.2.16
```

### Any additional comments?

This came from rolldown-plugin-dts, which emits a `.d.ts` chunk for each entry: https://github.com/sxzz/rolldown-plugin-dts/issues/268. There the name conflict is more than cosmetic. Without `[hash]`, `index.d.mts` can contain a common chunk, and the real entry lands in `index2.d.mts`, so `index.mjs` resolves to the wrong types. A chunk for `lib/index.d.ts` is named `index.d`, so it can conflict with an entry named `index`.

Both differences appear to come from code that only treats `UserDefinedEntry` chunks as entries:

- Names: [`rebuild_sorted_chunk_idx_vec`](https://github.com/rolldown/rolldown/blob/v1.2.16/crates/rolldown/src/chunk_graph.rs#L101) puts only `UserDefinedEntry` chunks first. Emitted entries are sorted with common chunks by execution order, so a common chunk that runs first gets the name.
- Facade: the [chunk optimizer](https://github.com/rolldown/rolldown/blob/v1.2.16/crates/rolldown/src/stages/generate_stage/chunk_optimizer.rs#L815-L820) skips emitted entries unless they use `allow-extension`, with a comment that the facade needs to be preserved.

The name conflict is the actual bug for us. The facade output is correct, just one file larger, so if keeping it is intentional, we'd only ask for the name fix."""
