id = "rolldown-21"
request = """
[Bug]: `preserveModules` strips non-JS extensions from `[name]`, so `card.json` takes `card.js`

### Reproduction link or steps

No plugins needed, JSON is enough:

```js
// card.json
{ "title": "card" }

// card.js
import data from './card.json'
export const card = data.title

// index.js
export { card } from './card.js'
```

```js
// build.mjs
import { rolldown } from 'rolldown'
import { rollup } from 'rollup'
import json from '@rollup/plugin-json'

const output = { format: 'esm', preserveModules: true, entryFileNames: '[name].js' }

const rd = await (await rolldown({ input: 'index.js' })).generate(output)
console.log('rolldown:', rd.output.map((c) => `${c.fileName} (name: ${c.name})`).join(', '))

const ru = await (await rollup({ input: 'index.js', plugins: [json()] })).generate(output)
console.log('rollup:  ', ru.output.map((c) => `${c.fileName} (name: ${c.name})`).join(', '))
```

Output:

```
rolldown: index.js (name: index), card.js (name: card.json), card2.js (name: card)
rollup:   index.js (name: index), card.js (name: card), card.json.js (name: card.json)
```

### What is expected?

Same as Rollup: with `preserveModules`, `[name]` keeps non-JS extensions, so `card.json` is emitted as `card.json.js` and `card.js` keeps `card.js`.

### What is actually happening?

`[name]` drops every extension, so `card.json` renders as `card.js`. It runs before `card.js` and takes the name first, which renames the real JS module to `card2.js`. Since deduplication is case-insensitive, `Card.ts` + `card.css` clash the same way.

`chunk.name` is already `card.json` (following rollup/rollup#4565), but the value used for `[name]` in `crates/rolldown/src/stages/generate_stage/mod.rs` (`chunk_filename`) strips all extensions. In Rollup, `getPreserveModulesChunkNameFromModule` only strips `NON_ASSET_EXTENSIONS` and uses the same value for both.

### System Info

```Shell
System:
  OS: Linux 7.2 Debian GNU/Linux 12 (bookworm)
  CPU: (8) arm64
Binaries:
  Node: 22.23.4
npmPackages:
  rolldown: 1.2.16
  rollup: 4.67.2 (for comparison)
```

### Any additional comments?

Found in tsdown, where a CSS file named like a JS module turns `Card.tsx` into `Card2.cjs` with `unbundle: true` (rolldown/tsdown#912). tsdown works around it in rolldown/tsdown#1114 by adding the CSS extension back in `entryFileNames`."""
