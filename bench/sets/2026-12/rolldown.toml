# rolldown-14: Top-level `this` in a .js file reached only through require() should be its exports object, not
# undefined, when the file has no CommonJS markers.
# issue opened 2026-10-22, fix opened 2026-10-22, squash (or single commit); source files:
# crates/rolldown/src/stages/link_stage/determine_module_exports_kind.rs,
# crates/rolldown_common/src/ecmascript/ecma_view.rs (31 lines); request from body (never edited).
# reading notes: snapshot uses existing CJS wrapper codegen (this$N param); extra test covers dynamic import without
# code splitting
[[situation]]
id = "rolldown-14"
request = """
Top-level `this` becomes `undefined` in a `.js` file that is loaded with `require()` but has no CommonJS markers of its own

### Reproduction link or steps

Four files:

```js
// node_modules/umd-this/package.json
{ "name": "umd-this", "version": "1.0.0", "main": "lib/index.js" }
```

```js
// node_modules/umd-this/lib/index.js
module.exports = { Thing: require('./thing.js').Thing };
```

```js
// node_modules/umd-this/lib/thing.js
(function (global) {
  global.Thing = function Thing() {};
}(this));
```

```js
// src/entry.mjs
import { Thing } from 'umd-this';
console.log('Thing is', typeof Thing);
```

Bundle and run it:

```js
import { rolldown } from 'rolldown';
const bundle = await rolldown({ input: 'src/entry.mjs' });
await bundle.write({ file: 'out.mjs', format: 'esm' });
```

```
$ node out.mjs
TypeError: Cannot set properties of undefined (setting 'Thing')
```

### What is expected?

`Thing is function`, which is what Node prints for `require('umd-this').Thing` and what esbuild 0.28.2 produces. `thing.js` is a CommonJS module (it is `.js` in a package without `"type": "module"`, and it is only reached through `require()`), so its top-level `this` is `module.exports`. esbuild compiles the call to `})(exports);`.

### What is actually happening?

Rolldown wraps `thing.js` as CommonJS, but replaces its top-level `this` with `void 0`, and the wrapper does not take `exports`:

```js
var require_thing = /* @__PURE__ */ __commonJSMin((() => {
	(function(global) {
		global.Thing = function Thing() {};
	})(void 0);
}));
```

The same file works when either of these is true, so the rewrite seems to follow a format guess made from the file's own contents rather than from how it is loaded:

- it is named `thing.cjs` (and required as `./thing.cjs`): the output passes `exports`;
- it contains any CommonJS marker, for example `exports.__marker = true;` at the end: the output passes `exports`.

### System Info

```
  System:
    OS: Linux 7.0 Ubuntu 24.04.3 LTS 24.04.3 LTS (Noble Numbat)
    CPU: (4) x64 AMD EPYC 7R13 Processor
    Memory: 10.71 GB / 30.67 GB
    Container: Yes
    Shell: 5.2.21 - /bin/bash
  Binaries:
    Node: 26.10.0
    npm: 10.8.2
    pnpm: 12.11.2
  npmPackages:
    rolldown: ^1.2.15 => 1.2.15
```

Also reproduced with rolldown 1.2.8.

### Any additional comments?

We hit this through Vite 8's dependency prebundling (via `@angular/build` 22.2.3): `vtt.js@0.13.0` ships `lib/vtt.js`, `lib/vttcue.js` and `lib/vttregion.js` in exactly this shape (`}(this));`, required from `lib/index.js`), so any app importing `vtt.js` crashes at startup under the dev server. Production builds through esbuild are unaffected. Our workaround is excluding the package from prebundling.

#5316 (`options.context`) is related but different: that asks for a configurable `this` for ES modules, while this file is already being treated as CommonJS everywhere except its `this`."""
