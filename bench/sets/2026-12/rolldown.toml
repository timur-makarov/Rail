# rolldown: rolldown/rolldown, rust, reserve project of set 2026-12 (fulltest PLAN sections 3 and 4).
# Settings: written by reading the project's CI and docs at the oldest and newest start commit, nothing run;
# every command marked `unverified` is for the admission session to try and fix. Notes: notes/rolldown.md.
# Situations: every candidate of bench-candidates/rolldown.toml (REPORT-window-rule.md, 2026-11-26), in its order,
# all 41 of them.
# half is `work` for every candidate until the split after admission and the hardness runs (cloud/README.md).
# hidden_tests: the fix's changed files (start..fix, compare API) that match [project] tests or the travel
# globs ["crates/*/snapshots/*.snap"],
# and not []; deleted files left out.
# self_filed: the issue's author opened the fix. bot_filed: the issue's author is an automation account
# (a login ending in bot or -ci, or turso-github-handyman, roboturso). security_trap: the reading pass's
# flag for a request whose natural fix invites a flaw. kind race is the race flag.

# rolldown/rolldown for Rail's bench: [project], [commands] and [rail.config.commands]; situations are added apart.
# Read with gh api at the oldest start (rolldown-40, bb19a483dd9885401e5ef8514ba4d56e9e27f8ad) and the newest
# (rolldown-04, 3a2d3b4ef3acc1306ccbfa795afa8b2e46bde2dc). See rolldown.md and rust-common.md.

[project]
name = "rolldown"
repo = "https://github.com/rolldown/rolldown"
# rust: the hidden tests are mostly cargo fixture tests (crates/rolldown/tests/**); the Node side is a client of the
# Rust core, built from it by napi, and its vitest tests are run as an extra step.
language = "rust"
package = "rolldown"
tests = ["crates/*/tests/**", "packages/*/tests/**", "crates/*/src/tests.rs", "crates/*/src/*/tests.rs"]
# node_modules: made at test time from the pnpm store (pnpm install --offline). Note: fixtures also hold committed
# node_modules folders; a saved stage leaves them out and runs.restore puts them back from the sealed copy.
build_dirs = ["node_modules"]

[commands]
# from: rust-toolchain.toml, Cargo.lock, package.json packageManager @ both starts; rust-common.md section 2 and 3
# unverified: rustup and corepack on the machine; pnpm 11/12 accepting --ignore-scripts and --store-dir as written
setup = '''
set -euo pipefail
command -v rustup >/dev/null || { echo "bench: rustup is not on PATH"; exit 1; }
mkdir -p "$CARGO_HOME" "$RUSTUP_HOME" "$COREPACK_HOME/bin" "$PNPM_STORE_DIR"
read -r tc comps tgts < <(python3 - <<'TC'
import os, tomllib
f = next((n for n in ("rust-toolchain.toml", "rust-toolchain") if os.path.exists(n)), None)
d = {}
if f:
    t = open(f).read()
    try: d = tomllib.loads(t).get("toolchain", {})
    except tomllib.TOMLDecodeError: d = {"channel": t.strip()}
print(d.get("channel", "stable"), ",".join(d.get("components", [])) or "-", ",".join(d.get("targets", [])) or "-")
TC
)
args=(--profile minimal --component rustfmt,clippy)
[ "$comps" != - ] && args+=(--component "$comps")
[ "$tgts" != - ] && args+=(--target "$tgts")
rustup toolchain install "$tc" "${args[@]}"
rustup default >/dev/null 2>&1 || rustup default "$tc"
cargo --version
CARGO_NET_OFFLINE=false cargo fetch --locked
cargo metadata --offline --format-version 1 >/dev/null
# Node side: pnpm at the packageManager pin (11.9.0 .. 12.4.2 over the window) through corepack, and the pnpm store.
# The install fills the store; git clean then removes every node_modules it made, so the sealed copy stays small and
# each copy installs from the store (hard links) when a command needs it.
node --version
COREPACK_ENABLE_NETWORK=1 corepack install
corepack enable --install-directory "$COREPACK_HOME/bin" pnpm
export PATH="$COREPACK_HOME/bin:$PATH" CI=true
pnpm --version
COREPACK_ENABLE_NETWORK=1 pnpm install --frozen-lockfile --ignore-scripts --store-dir "$PNPM_STORE_DIR"
git clean -ffdxq
pnpm install --offline --frozen-lockfile --ignore-scripts --store-dir "$PNPM_STORE_DIR" >/dev/null
git clean -ffdxq
git status --porcelain | head -5
'''
# from: crates/rolldown/tests/integration/*.rs, testing_macros fixture.rs (swc), packages/rolldown/tests/package.json
#   @ both starts; runner tested on a synthetic workspace (rolldown.md)
# unverified: the vitest step (napi build-binding, build-node, vitest -t) has not been run
test_files = '''
set -euo pipefail
export CARGO_INCREMENTAL=0 INSTA_UPDATE=no INSTA_FORCE_PASS=0 CI=true PATH="$COREPACK_HOME/bin:$PATH"
[ -d node_modules/.pnpm ] || pnpm install --offline --frozen-lockfile --ignore-scripts --store-dir "$PNPM_STORE_DIR"
python3 - {files} <<'PY'
# bench: run only the given Rust test files. Each .rs file goes to the cargo target that compiles it (read from
# `cargo metadata`): an integration test target (--test NAME), the library (--lib) or a binary (--bin NAME), with a
# libtest filter for the file's module path (or its test function names), so only that file's tests run. Data files
# and helper modules with no test in them travel but are not run. Exits non-zero when a file can't be placed, when
# nothing in the list can run, or when a run executes no test (an empty run would pass vacuously).
import json, os, re, subprocess, sys

files = [f for f in sys.argv[1:] if f]
meta = json.loads(subprocess.run(["cargo", "metadata", "--no-deps", "--offline", "--format-version", "1"],
                                 check=True, capture_output=True, text=True).stdout)
root = meta["workspace_root"]
members = set(meta["workspace_members"])
TARGETS = []  # dicts: pid, pkg, sel (cargo args), src, dir (the crate root's folder); paths relative to root
for p in meta["packages"]:
    if p["id"] not in members:
        continue
    for t in p["targets"]:
        kinds = set(t["kind"])
        if "test" in kinds:
            sel = ["--test", t["name"]]
        elif kinds & {"lib", "rlib", "proc-macro", "cdylib", "staticlib", "dylib"}:
            sel = ["--lib"]
        elif "bin" in kinds:
            sel = ["--bin", t["name"]]
        else:
            continue  # build scripts, examples, benches
        if t.get("required-features"):
            sel += ["--features", ",".join(t["required-features"])]
        src = os.path.relpath(t["src_path"], root)
        TARGETS.append({"pid": p["id"], "pkg": p["name"], "sel": sel, "src": src, "dir": os.path.dirname(src)})


def read(path):
    try:
        with open(os.path.join(root, path), errors="replace") as f:
            return f.read()
    except OSError:
        return ""


def place(path):
    """The targets compiling `path`: the target whose crate root it is, else those whose crate root folder is the
    deepest one holding it; among several, those whose root declares the file's top module, a library before a
    binary."""
    exact = [t for t in TARGETS if t["src"] == path]
    if exact:
        return exact
    holding = [t for t in TARGETS if t["dir"] == "" or path.startswith(t["dir"] + "/")]
    if not holding:
        return []
    deepest = max(len(t["dir"]) for t in holding)
    cands = [t for t in holding if len(t["dir"]) == deepest]
    if len(cands) > 1:
        top = os.path.relpath(path, cands[0]["dir"]).split("/")[0]
        top = top[:-3] if top.endswith(".rs") else top
        declaring = [t for t in cands if re.search(rf"\bmod\s+{re.escape(top)}\b|#\[path\s*=\s*\"[^\"]*{re.escape(top)}",
                                                    read(t["src"]))]
        cands = declaring or cands
        libs = [t for t in cands if t["sel"][0] == "--lib"]
        cands = libs or cands
    return cands


TEST_ATTR = re.compile(r"#\[\s*(?:[\w:]+::)?(?:test|tokio::test|test_case|rstest|case|quickcheck|proptest)\b")


def test_fns(path):
    """Test function names in a file: a `fn` soon after an attribute naming a test."""
    names, armed = [], 0
    for line in read(path).splitlines():
        s = line.strip()
        if TEST_ATTR.search(s):
            armed = 8
        m = re.match(r"(?:pub(?:\([^)]*\))?\s+)?(?:async\s+)?fn\s+(\w+)", s)
        if m and armed:
            names.append(m.group(1))
            armed = 0
        elif armed and s and not s.startswith(("#", "//")):
            armed -= 1
    return names


def module_path(path, t):
    rel = os.path.relpath(path, t["dir"])[:-3].split("/")
    if rel[-1] == "mod":
        rel = rel[:-1]
    return "::".join(rel)


# Per-project hook (rolldown). crates/rolldown/tests/integration/main.rs is ONE test target, `integration`; its
# modules use testing_macros' #[fixture("./tests/SUB/**/_config.json")], which makes one test per fixture folder at
# compile time, named FN_ + the _config.json path (from crates/rolldown, '/' -> '__', other non-word chars -> '_',
# then '___' -> '__'), and it pulls tests/rolldown/**.rs in with #[path] (module rolldown_tests). A file in a fixture
# folder runs that fixture's test; a .rs module there runs its module path. --include-ignored: testing_macros 1.0.1
# (start commits up to late July 2026) marks every fixture #[ignore] when any folder of the absolute path starts with
# '.', such as /srv/rail-bench or .claude/worktrees. packages/rolldown/tests/** (vitest, against the napi binding) is
# collected and run after the cargo runs by one bash step.
RD = "crates/rolldown"
RD_MAIN = RD + "/tests/integration/main.rs"
JS_TESTS = "packages/rolldown/tests/"
JS_CMD = []
JS_SCRIPT = r"""
set -euo pipefail
files=(); fixtures=(); dev=0
for a in "$@"; do
  case "$a" in file:*) files+=("${a#file:}") ;; fixture:*) fixtures+=("${a#fixture:}") ;; dev) dev=1 ;; esac
done
echo "bench: building the napi binding (debug) and the JS glue of packages/rolldown"
pnpm --filter rolldown run build-binding
pnpm --filter rolldown run build-node
if [ "$dev" = 1 ]; then pnpm --filter @rolldown/test-dev-server run build; fi
cd packages/rolldown/tests
st=0
vt() {  # vitest, failing when no test passed (a filter that matches nothing must not pass)
  local out; out=$(mktemp)
  RUST_BACKTRACE=1 ROLLDOWN_TEST=1 pnpm exec vitest run --reporter verbose "$@" 2>&1 | tee "$out" || st=1
  grep -Eq 'Tests +[1-9][0-9]* passed' "$out" || { echo "bench: no vitest test passed for: $*"; st=1; }
  rm -f "$out"
}
if [ ${#files[@]} -gt 0 ]; then vt "${files[@]}"; fi
if [ ${#fixtures[@]} -gt 0 ]; then
  pat=$(python3 -c 'import re,sys; print("^(" + "|".join(re.escape(a) for a in sys.argv[1:]) + ")$")' "${fixtures[@]}")
  vt fixture.test.ts fixtures-concurrent.test.ts -t "$pat"
fi
exit $st
"""


def rd_fixture_fns():
    """{SUB: (module, fn)} from the #[fixture] attributes of the integration target's modules."""
    out = {}
    d = os.path.dirname(RD_MAIN)
    for name in sorted(os.listdir(os.path.join(root, d))):
        if name.endswith(".rs"):
            for m in re.finditer(r'#\[fixture\("\./tests/(\w+)/\*\*/_config\.json"\)\]\s*fn\s+(\w+)', read(d + "/" + name)):
                out[m.group(1)] = (name[:-3], m.group(2))
    return out


def rd_mod_tree():
    """{file: module path} for the modules of the integration target, following #[path]."""
    out, pathed, stack = {RD_MAIN: ""}, {RD_MAIN}, [RD_MAIN]
    while stack:
        f = stack.pop()
        base = os.path.dirname(f)
        owns = f in pathed or os.path.basename(f) in ("mod.rs", "main.rs", "lib.rs")
        sub = base if owns else f[:-3]
        for m in re.finditer(r'(?:#\[path\s*=\s*"([^"]+)"\]\s*)?(?:pub(?:\([^)]*\))?\s+)?mod\s+(\w+)\s*;', read(f)):
            p, name = m.group(1), m.group(2)
            if p:
                child = os.path.normpath(os.path.join(base, p))
                pathed.add(child)
            else:
                child = sub + "/" + name + ".rs"
                if not os.path.exists(os.path.join(root, child)):
                    child = sub + "/" + name + "/mod.rs"
            out[child] = (out[f] + "::" if out[f] else "") + name
            stack.append(child)
    return out


RD_STATE = {}


def project_hook(path, runs, other):
    if path.startswith(RD + "/tests/") and path.split("/")[3] in ("rolldown", "esbuild", "rollup"):
        if "fns" not in RD_STATE:
            RD_STATE["fns"], RD_STATE["mods"] = rd_fixture_fns(), rd_mod_tree()
            RD_STATE["key"] = next((t["pid"], t["pkg"], tuple(t["sel"])) for t in TARGETS
                                   if t["pkg"] == "rolldown" and t["sel"][:2] == ["--test", "integration"])
        sub = path.split("/")[3]
        top = RD + "/tests/" + sub
        filt = None
        if path.endswith(".rs") and path in RD_STATE["mods"]:
            if test_fns(path):
                filt = RD_STATE["mods"][path] + "::"
        else:
            d = os.path.dirname(path)
            while d.startswith(top) and filt is None:
                if os.path.exists(os.path.join(root, d, "_config.json")) and sub in RD_STATE["fns"]:
                    mod, fn = RD_STATE["fns"][sub]
                    rel = os.path.relpath(d + "/_config.json", RD)
                    name = (fn + "_" + re.sub(r"[^A-Za-z0-9_]", "_", rel.replace("/", "__"))).replace("___", "__")
                    filt = mod + "::" + name
                elif os.path.exists(os.path.join(root, d, "mod.rs")) and test_fns(d + "/mod.rs") \
                        and d + "/mod.rs" in RD_STATE["mods"]:
                    filt = RD_STATE["mods"][d + "/mod.rs"] + "::"
                d = os.path.dirname(d)
        if filt is None:
            print(f"bench: {path} is no fixture and holds no test: it travels, it is not run", flush=True)
            return True
        key = RD_STATE["key"]
        runs[key] = set(runs.get(key) or ()) | {filt, "--include-ignored"}
        return True
    if path.startswith(JS_TESTS):
        rel = path[len(JS_TESTS):]
        arg = None
        if re.search(r"\.test\.[cm]?[jt]sx?$", rel) and not re.search(r"\.test-d\.", rel):
            arg = "file:" + rel
            if "@rolldown/test-dev-server" in read(path) and "dev" not in JS_CMD:
                JS_CMD.append("dev")
        elif rel.startswith("fixtures/"):
            d = os.path.dirname(path)
            while d.startswith(JS_TESTS + "fixtures/"):
                if os.path.exists(os.path.join(root, d, "_config.ts")):
                    arg = "fixture:" + d[len(JS_TESTS + "fixtures/"):]
                    break
                d = os.path.dirname(d)
        if arg is None:
            print(f"bench: {path} is a data file of packages/rolldown/tests: it travels, it is not run", flush=True)
            return True
        if not JS_CMD or JS_CMD[0] != "bash":
            JS_CMD[:0] = ["bash", "-c", JS_SCRIPT, "bench-js"]
            other.append(JS_CMD)
        if arg not in JS_CMD:
            JS_CMD.append(arg)
        return True
    return False


runs = {}    # (pid, pkg, sel) -> set of filters, or None for the whole target
other = []   # commands a project hook adds: lists of argv
placed, errors = [], []
for f in files:
    if project_hook(f, runs, other):
        continue
    if not f.endswith(".rs"):
        print(f"bench: {f} is a data file: it travels, it is not run", flush=True)
        continue
    ts = place(f)
    if not ts:
        errors.append(f"{f}: no cargo target of this workspace compiles it")
        continue
    placed.append((f, ts))
listed = {}
for f, ts in placed:
    for t in ts:
        listed.setdefault((t["pid"], t["pkg"], tuple(t["sel"])), set()).add(f)
for f, ts in placed:
    fns = test_fns(f)
    for t in ts:
        key = (t["pid"], t["pkg"], tuple(t["sel"]))
        if f == t["src"]:
            if t["sel"][0] == "--test" and len(listed[key]) == 1 and (fns or re.search(r"^\s*(pub\s+)?mod\s+\w+\s*;",
                                                                                      read(f), re.M)):
                runs[key] = None          # the test target is this file (and the modules it declares): all of it
                continue
            filt = fns                    # a crate root: its own test functions only
        elif fns:
            filt = [module_path(f, t) + "::"]
        else:
            filt = []
        if not filt:
            print(f"bench: {f} holds no test of {t['pkg']} {' '.join(t['sel'])}: it travels, it is not run", flush=True)
            continue
        if runs.get(key, ()) is not None:
            runs[key] = set(runs.get(key, ())) | set(filt)
for e in errors:
    print(f"bench: {e}", flush=True)
if errors:
    sys.exit(2)
if not runs and not other:
    print("bench: nothing in the list can run", flush=True)
    sys.exit(2)


def stream(cmd, cwd):
    """Run cmd, echo its output, return (exit code, tests run)."""
    proc = subprocess.Popen(cmd, cwd=cwd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, errors="replace")
    ran = 0
    for line in proc.stdout:
        sys.stdout.write(line)
        # passed + failed from libtest's (and libtest-mimic's, kitest's) summary: `running N` counts ignored tests too
        m = re.search(r"test result: (?:\x1b\[[\d;]*m)*\w+(?:\x1b\[[\d;]*m)*\. (\d+) passed; (\d+) failed", line)
        if m:
            ran += int(m.group(1)) + int(m.group(2))
    sys.stdout.flush()
    return proc.wait(), ran


status = 0
for (pid, pkg, sel), filt in sorted(runs.items(), key=lambda kv: (kv[0][1], kv[0][2])):
    cmd = ["cargo", "test", "-p", pid, *sel, "--no-fail-fast", "--", *sorted(filt or [])]
    print("bench: " + " ".join(["cargo", "test", "-p", pkg, *cmd[4:]]), flush=True)
    code, ran = stream(cmd, root)
    if code != 0:
        status = 1
    elif ran == 0:
        print(f"bench: no test ran for {pkg} {' '.join(sel)} {sorted(filt or [])}", flush=True)
        status = 1
for cmd in other:
    print("bench: " + " ".join(cmd), flush=True)
    code, _ = stream(cmd, root)
    if code != 0:
        status = 1
sys.exit(status)
PY
'''
# from: justfile test-rust (cargo test --workspace --exclude rolldown_binding) @ both starts
# unverified: run times; the '.' fallback is this file's choice
test_package = '''
set -euo pipefail
export CARGO_INCREMENTAL=0 INSTA_UPDATE=no INSTA_FORCE_PASS=0 CI=true PATH="$COREPACK_HOME/bin:$PATH"
pkg={package}
name=""
if [ "$pkg" != . ]; then
  name=$(python3 - "$pkg" <<'PY'
import json, os, subprocess, sys
m = json.loads(subprocess.run(["cargo", "metadata", "--no-deps", "--offline", "--format-version", "1"],
                              check=True, capture_output=True, text=True).stdout)
want = os.path.realpath(os.path.join(sys.argv[1], "Cargo.toml"))
print(next((p["name"] for p in m["packages"]
            if p["id"] in m["workspace_members"] and os.path.realpath(p["manifest_path"]) == want), ""))
PY
)
fi
case "$name" in
  "")
    echo "bench: $pkg is no workspace member; running rolldown's unit tests"
    exec cargo test -p rolldown --lib --no-fail-fast ;;
  rolldown_binding)  # a napi cdylib: CI never runs its tests (--exclude rolldown_binding); check that it compiles
    exec cargo check -p rolldown_binding --tests ;;
  rolldown)  # test262 needs the test262 git submodule, which a sealed copy has not got
    [ -d node_modules/.pnpm ] || pnpm install --offline --frozen-lockfile --ignore-scripts --store-dir "$PNPM_STORE_DIR"
    exec cargo test -p rolldown --tests --no-fail-fast -- --skip test262_module_code ;;
  *)
    exec cargo test -p "$name" --tests --no-fail-fast ;;
esac
'''
package_of = "nearest:Cargo.toml"
# from: rust-common.md section 4; libtest's own line
failed = '^test (.+?) \.\.\. FAILED'
timeout_minutes = 45

[commands.env]
BASH_DEFAULT_TIMEOUT_MS = "1800000"
