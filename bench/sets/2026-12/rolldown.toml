# crates/rolldown/src/stages/link_stage/tree_shaking/include_statements.rs (160 lines); request from body (never
# edited).
# reading notes: Many new fixtures with runtime checks plus snapshots; snapshots of live-import variants could differ
# for a fix taking another route.
[[situation]]
id = "rolldown-06"
request = """
[Bug]: `codeSplitting: false` still emits a lazy-init chunk for a pure re-export module shared with a tree-shaken dynamic import (breaks UMD/IIFE)

### Reproduction link or steps

Minimal, no dependencies other than `rolldown@1.2.11`:

```js
// src/core.js
export function merge(x) { return x + 1; }
export function count(x) { return x * 2; }
```
```js
// src/surface.js — a pure re-export module
export { merge, count } from "./core.js";
```
```js
// src/lazy.js — reachable only through import()
import { merge } from "./surface.js";
export function readIt(x) { return merge(x); }
```
```js
// src/io.js
export async function read(x) { const { readIt } = await import("./lazy.js"); return readIt(x); }
export function create() { return 1; }
```
```js
// src/index.js
export * as Surface from "./surface.js";
export * as Io from "./io.js";
```
```js
// src/main.js — `Io.read` (and therefore the import()) is never used
import { Surface, Io } from "./index.js";
export function run() { return Surface.count(Io.create()); }
```
```js
// build.mjs
import { build } from "rolldown";
for (const format of ["esm", "umd"]) {
  await build({
    input: "src/main.js",
    output: { dir: `out/${format}`, format, name: "myLib", codeSplitting: false },
  });
}
```

Run `node build.mjs`.

### What is expected?

With `codeSplitting: false`, a single output file for both formats.

### What is actually happening?

The ESM build emits a second chunk, `surface-[hash].js`, containing only a lazy-init wrapper:

```js
import { n as __esmMin, t as init_core } from "./main.js";
__esmMin((() => {
	init_core();
}));
```

and the UMD build then fails:

```
[INVALID_OPTION] Invalid value "umd" for option "output.format" - UMD and IIFE are not supported for code-splitting builds. For single entry builds, you can set `output.codeSplitting` to `false` to disable code-splitting.
```

— even though `codeSplitting: false` is already set. The deprecated `inlineDynamicImports: true` behaves the same.

Observations:

- It needs all of: a pure re-export module (`surface.js`), imported both statically from the entry graph (`export * as`) and from a module reachable only via `import()` (`lazy.js`), with the function containing the `import()` tree-shaken away.
- If `main.js` also calls `Io.read`, the output is a single file.
- `treeshake: false` produces a single file.

### System Info

```Shell
rolldown 1.2.11 (also 1.2.9; originally reported on Vite 8.1.3 / rolldown 1.1.3 and Vite 8.3.1 / rolldown 1.2.11)
Node.js v26.8.1
macOS
```

### Any additional comments?

Found through a real library build: https://github.com/documonster/documonster/issues/233. We are removing the triggering import on our side, but the stray chunk is still a bundler bug — a user who requests a single file should never get two.

Possibly related: #10843, #10844 (other `inlineDynamicImports` interactions with namespace re-exports)."""
