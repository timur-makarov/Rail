id = "rolldown-11"
request = """
[Bug]: deduplicated asset gets a `2` suffix when a shorter name is emitted later

### Reproduction link or steps

https://github.com/IWANABETHATGUY-reproduction/rolldown-asset-dedupe-name-suffix

Run `pnpm i && pnpm start`. A plugin emits the same asset source two times, first with the name `long-name.svg` and then with `a.svg`. `assetFileNames` is `assets/[hash][extname]`.

### What is expected?

One asset named `assets/BZJ5HxlP.svg`. Rollup gives this name, and rolldown gives it too when `a.svg` is emitted first.

### What is actually happening?

The asset is named `assets/BZJ5HxlP2.svg`.

When each asset is emitted from a `load` hook, as Vite's asset plugin does, the name depends on which hook finishes first. So the output changes between builds. In the repro, 20 builds give `BZJ5HxlP2.svg` 15 times and `BZJ5HxlP.svg` 5 times. Rollup gives `BZJ5HxlP.svg` each time.

### System Info

```Shell
  System:
    OS: macOS 26.6.2
    CPU: (12) arm64 Apple M3 Pro
    Memory: 3.79 GB / 36.00 GB
    Shell: 5.9 - /bin/zsh
  Binaries:
    Node: 24.19.0
    npm: 11.17.0
    pnpm: 12.11.1
  Browsers:
    Safari: 26.6.2
  npmPackages:
    rolldown: 1.2.14 => 1.2.14
```

`main` at 3258f136127595569d91dee42d27e59b5f6838eb has the same result.

### Any additional comments?

The re-pick from #9948 calls `generate_file_name` again for the shorter name:
https://github.com/rolldown/rolldown/blob/3258f136127595569d91dee42d27e59b5f6838eb/crates/rolldown_common/src/file_emitter.rs#L196-L210

That calls `make_unique_name` with `self.names`, which still has the old name:
https://github.com/rolldown/rolldown/blob/3258f136127595569d91dee42d27e59b5f6838eb/crates/rolldown_common/src/file_emitter.rs#L319-L321

When the template has no `[name]`, the new name is the same as the old name, so the asset conflicts with itself and gets `2`. When the template has `[name]`, the old name stays reserved, so a different asset with that name gets `2` (part 3 of the repro).

I think we should keep the current name when the new name is the same, and release the old name from `names` otherwise.

I found this in a Vite 8 + React Router app with `assetFileNames: 'assets/[hash:12][extname]'`. 8 to 108 assets got the suffix in each build, so `dist` was not reproducible.

related: #9940, #10197"""
