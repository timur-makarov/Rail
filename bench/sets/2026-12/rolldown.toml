# rolldown-10: avoidRedundantChunkLoads should retry moves rejected only because an importer's atom had not moved yet,
# so already loaded modules join the shared chunk.
# issue opened 2026-11-11, fix opened 2026-11-11, squash (or single commit); source files:
# crates/rolldown/src/stages/generate_stage/dynamic_already_loaded.rs,
# crates/rolldown/src/stages/generate_stage/reduced_chunk_graph.rs (167 lines); request from oldest of 2 edit records.
# reading notes: filed by fixer; text names the fix (retry rejected moves). Three existing snapshots change too; a
# retry-based fix should match them.
[[situation]]
id = "rolldown-10"
request = """
`avoidRedundantChunkLoads` leaves an already loaded module in a chunk of its own when its move is checked before its importer's

### Reproduction

```js
// main1.js and main2.js (two entries, same code)
import { shared } from './shared.js';
export const value = shared();
export const loadMiddle = () => import('./dynamic-middle.js');
export const loadLeaf = () => import('./dynamic-leaf.js');

// shared.js
import { middle } from './middle.js';
export const shared = () => `shared ${middle()}`;

// middle.js
import { leaf } from './leaf.js';
export const middle = () => `middle ${leaf()}`;

// leaf.js
export const leaf = () => 'leaf';

// dynamic-middle.js
import { middle } from './middle.js';
export const value = middle();

// dynamic-leaf.js
import { leaf } from './leaf.js';
export const value = leaf();
```

```js
await rolldown({ input: { main1: 'main1.js', main2: 'main2.js' } })
```

Both entries load `shared.js`, `middle.js` and `leaf.js` statically before either dynamic entry can run, so all three are already loaded for both dynamic entries.

### Actual (rolldown 1.3.1, also `main` at 80f11ea)

```
main1.js             main1.js
main2.js             main2.js
dynamic-leaf.js      dynamic-leaf.js
dynamic-middle.js    dynamic-middle.js
leaf.js              leaf.js
shared.js            middle.js, shared.js
```

### Expected (rollup 4.68.2)

```
main1.js             main1.js
main2.js             main2.js
shared.js            leaf.js, middle.js, shared.js
dynamic-middle.js    dynamic-middle.js
dynamic-leaf.js      dynamic-leaf.js
```

### Cause

`optimize_dynamic_entry_bits` reduces both `middle.js` (`{main1, main2, dynamic-middle}`) and `leaf.js` (`{main1, main2, dynamic-middle, dynamic-leaf}`) to `{main1, main2}`. The loop visits the atom of `leaf.js` first. With only that atom moved, the chunk of `shared.js` imports the chunk of `middle.js` and that chunk imports `leaf.js` in the chunk of `shared.js`, so `ReducedChunkGraph::try_move` rejects the move. The next iteration moves `middle.js`, after which the rejected move would be acyclic, but the pass never tries it again.

Atoms that import each other have the same problem in any order: neither can leave the cycle alone, but both can leave it together.

### Impact

In an app with about 160 dynamic entries (Module Federation remotes and lazy routes), 72 of the 122 reductions that the pass accepted were rejected this way. The initial page loads 104 JS files with Vite 8, against 39 with Vite 7, and is about 17% slower to become interactive on a throttled connection. Retrying the rejected moves moves all 72, the final graph has no cycle, and the page loads 35 files. A fix is in the linked PR."""
