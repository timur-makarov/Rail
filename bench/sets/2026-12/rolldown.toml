[[situation]]
id = "rolldown-26"
request = """
[Bug]: dev mode: calling an imported function binds `this` to the exports object (`TypeError: Illegal invocation`)

### Reproduction link or steps

Vite 8.3.3 (rolldown 1.2.12), `vite --experimentalBundle`.

```js
// lib.js — a library that re-exports a native function as it is
export const clone = globalThis.structuredClone
```

```js
// eager.js
import { clone } from './lib.js'

export function render() {
  document.getElementById('eager').textContent = 'eager: ' + JSON.stringify(clone({ a: 1 }))
}

if (import.meta.hot) import.meta.hot.accept((m) => m.render())
```

```js
// lazy.js
import { clone } from './lib.js'

document.getElementById('lazy').textContent = 'lazy: ' + JSON.stringify(clone({ a: 1 }))
```

```js
// main.js
import { render } from './eager.js'

render()
import('./lazy.js').catch((e) => {
  document.getElementById('lazy').textContent = 'lazy: ' + e
})
```

```html
<!-- index.html -->
<pre id="eager"></pre>
<pre id="lazy"></pre>
<script type="module" src="/main.js"></script>
```

1. Run `vite --experimentalBundle` and open the page.
2. Edit the text `'eager: '` in `eager.js` and save.

### What is expected?

Same result as `vite` (unbundled dev) and `vite build`:

- The page shows `eager: {"a":1}` and `lazy: {"a":1}`.
- After the edit, the page shows the new text.

### What is actually happening?

- The initial bundle works: `eager: {"a":1}`.
- The lazy chunk throws: `lazy: TypeError: Illegal invocation`.
- The HMR patch throws, and the update is not applied:

  ```
  [vite] TypeError: Illegal invocation
  [vite] Failed to reload eager.js. This could be due to syntax errors or importing non-existent modules. (see errors above)
  ```

Code served for the lazy chunk:

```js
document.getElementById("lazy").textContent = "lazy: " + JSON.stringify(import_lib_00.clone({ a: 1 }));
```

`clone(x)` becomes `import_lib_00.clone(x)`. This is a method call, so `this` is the exports object. A native function like `structuredClone` checks `this` and throws.

```mermaid
flowchart LR
  A["source<br/>clone(x)"] --> B["HMR finalizer renames the identifier<br/>to the text 'import_lib_00.clone'"]
  B --> C["import_lib_00.clone(x)<br/>this = exports object"]
  C --> D["TypeError: Illegal invocation"]
  B -. "expected" .-> E["(0, import_lib_00.clone)(x)<br/>this = undefined"]
```

### System Info

```Shell
  System:
    OS: macOS 26.6.2
    CPU: (14) arm64 Apple M4 Pro
  Binaries:
    Node: 24.21.0
    pnpm: 12.9.1
  Browsers:
    Chrome: 154.0.8037.98
  npmPackages:
    vite: 8.3.3 => 8.3.3
    rolldown: 1.2.12 (dependency of vite)
```

### Any additional comments?

**Where:** `rewrite_identifier_reference` in `crates/rolldown/src/hmr/impl_traverse_for_hmr_ast_finalizer.rs` renames an imported identifier to `binding.prop`, and it does not check whether the identifier is a callee. The same finalizer writes lazy chunks and HMR patches, so both are affected. The initial bundle uses the normal finalizer, which already wraps a callee as `(0, ns.member)` (`generate_finalized_expr_for_reference` in `crates/rolldown/src/module_finalizers/rename.rs`).

**Fix direction:** when the renamed identifier is the callee of a call or the tag of a tagged template, emit `(0, import_x.prop)` instead of `import_x.prop`.

**Also affected:** any imported function used as a callee or as a template tag gets the exports object as `this`. With `export function who() { return this }` in `lib.js`, `who()` and ``who`x` `` in the lazy chunk both return the exports object in bundled dev, and `undefined` in unbundled dev. A normal function usually does not throw, but this differs from ESM.

**Found in:** tldraw's examples app. Three pages (`multiple-themes`, `overlay-theme-colors`, `selection-color-condition`) call `structuredClone` imported from `tldraw`, which exports `globalThis.structuredClone` as it is. These pages crash in bundled dev and work in unbundled dev."""
