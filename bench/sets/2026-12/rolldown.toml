# rolldown-24: transform/transformSync with a TsconfigCache should report the applied tsconfig in tsconfigFilePaths.
# issue opened 2026-10-27, fix opened 2026-10-27, squash (or single commit); source files:
# crates/rolldown_common/src/utils/enhanced_transform.rs (11 lines); request from body (never edited).
