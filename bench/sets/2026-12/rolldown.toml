pnpm add -D rolldown@1.3.2 rollup @rollup/plugin-babel @babel/core @rollup/plugin-node-resolve dompurify@3.4.17
echo 'import DOMPurify from "dompurify"; console.log(DOMPurify);' > main.js
```

`repro.mjs`:

```js
import { babel } from '@rollup/plugin-babel';
import { nodeResolve } from '@rollup/plugin-node-resolve';
import { rollup } from 'rollup';
import { rolldown } from 'rolldown';

for (const [name, bundle] of [['rollup', rollup], ['rolldown', rolldown]]) {
  const b = await bundle({
    input: 'main.js',
    plugins: [nodeResolve(), babel({ babelHelpers: 'bundled', extensions: ['.js', '.mjs'] })],
    logLevel: 'silent',
  });
  const { output } = await b.generate({ dir: 'out/deep/deps', sourcemap: true, format: 'es' });
  console.log(name, output[0].map.sources);
}
```

`node repro.mjs` (project at `/work/repro`, installed with pnpm):

```
rollup   [ '../../../node_modules/.pnpm/dompurify@3.4.17/node_modules/dompurify/dist/purify.es.mjs', '../../../main.js' ]
rolldown [ '../../../../src/utils.ts', '../../../../src/tags.ts', '../../../../src/attrs.ts', ... ]
```

### What is expected?

The `sources` resolve to files that exist. `dompurify/dist/purify.es.mjs` has a `//# sourceMappingURL` whose map lists `"../src/tags.ts"` etc. (relative to `dompurify/dist/`; `dompurify/src/` is shipped). Babel picks that map up as its input map, and its transform result keeps `sources: ['../src/utils.ts', ...]`, which is correctly relative to the transformed module.

So rolldown should either resolve them against the module's directory (giving `node_modules/dompurify/src/tags.ts`), or, like Rollup, map back to the module itself.

### What is actually happening?

Rolldown resolves the transform map's relative `sources` against the **cwd** rather than the module's directory: `../src/tags.ts` becomes `/work/src/tags.ts`, which does not exist, and the output map gets `../../../../src/tags.ts`.

### Impact

This shows up in Vite 8 when a Babel plugin runs in `optimizeDeps.rolldownOptions.plugins` (e.g. `@embroider/vite` does this by default). Every pre-bundled dependency that ships its own sourcemap gets broken `sources`, and Vite logs one warning per source file:

```
Sourcemap for "<root>/node_modules/.vite/deps/dompurify.js" points to a source file outside its package: "<parent of root>/src/tags.ts"
```

In a real Ember app this is 100+ warnings on each dev server start.

Workaround: `babel({ ..., overrides: [{ test: /[\\\\/]node_modules[\\\\/]/, inputSourceMap: false }] })`.

### System Info

- rolldown 1.3.2 (also 1.2.12 and 1.2.18 via Vite 8.3.4 / 8.3.8)
- @babel/core 8.1.2, @rollup/plugin-babel 7.1.0, rollup 4.68.2 (for comparison)
- Linux, Node 24.20.0, pnpm"""
