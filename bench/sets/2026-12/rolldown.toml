id = "rolldown-05"
request = """
[Bug]: getModuleInfo() and this.resolve() report moduleSideEffects: null instead of the value Rolldown applies

### Reproduction link or steps

[REPL on `main`](https://repl.rolldown.rs/#)

- `node_modules/pkg/package.json` declares `"sideEffects": false`. `pkg/a.js` has a top-level side effect.
- `treeshake.moduleSideEffects` returns `false` for `local.js` and `undefined` for everything else.
- `index.js` imports `b` from `pkg` and `./local.js`.
- A plugin logs `this.getModuleInfo(id).moduleSideEffects` and `(await this.resolve(id)).moduleSideEffects` for every module in `buildEnd`. It shows them in `report.txt` and as warnings.


### What is expected?

The value Rolldown applies to each module, in the precedence its own docs give for `moduleSideEffects`: hooks, then `treeshake.moduleSideEffects`, then the `package.json` `sideEffects` field, then `true` (default).

| module | expected |
|---|---|
| `pkg/a.js`, `pkg/b.js`, `pkg/index.js` | `false` (package.json) |
| `local.js` | `false` (`treeshake.moduleSideEffects`) |
| `index.js` | `true` (default) |

Rollup's `ModuleInfo.moduleSideEffects` is typed `boolean | 'no-treeshake'` and reports the effective value, including `treeshake.moduleSideEffects` and the default `true`.


### What is actually happening?

Both APIs report `null` for every module:

```
index.js      getModuleInfo: null   this.resolve: null
local.js      getModuleInfo: null   this.resolve: null
pkg/a.js      getModuleInfo: null   this.resolve: null
pkg/b.js      getModuleInfo: null   this.resolve: null
pkg/index.js  getModuleInfo: null   this.resolve: null
output keeps a.js's side effect: false, local.js's: false
```

Rolldown does apply both declarations: neither side effect is in the output. Only a value that a plugin returns from `resolveId`, `load` or `transform` is reported. Returning `moduleSideEffects: false` from `resolveId` for `local.js` makes both APIs report `false` for it.


