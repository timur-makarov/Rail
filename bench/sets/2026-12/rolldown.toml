# rolldown-03: With output.topLevelVar, top-level `using` / `await using` declarations must be kept so their disposers
# run.
# issue opened 2026-11-18, fix opened 2026-11-19, squash (or single commit); source files:
# crates/rolldown/src/module_finalizers/mod.rs (7 lines); request from body (never edited).
# reading notes: AI-drafted report; text names the fix (leave using declarations untouched). _test.mjs only asserts on
# Node >= 24, otherwise vacuous.
[[situation]]
id = "rolldown-03"
request = """
output.topLevelVar turns top-level using / await using into var, so the disposers never run

> Written with the help of an AI coding agent (Claude); reproduced locally.

### Reproduction link or steps

```js
// a.js
using sync = { [Symbol.dispose]() { console.log('sync disposed') } }
await using res = { async [Symbol.asyncDispose]() { console.log('async disposed') } }
console.log('body', typeof res, typeof sync)
```

```js
// build.mjs — node build.mjs
import { rolldown } from 'rolldown'
const bundle = await rolldown({ input: 'a.js' })
const { output } = await bundle.generate({ format: 'esm', topLevelVar: true })
console.log(output[0].code)
```

### What is expected?

The `using` declarations are kept, as with `topLevelVar: false`; running the output prints:

```
body object object
async disposed
sync disposed
```

### What is actually happening?

```js
console.log("body", "object", "object");
```

Both declarations are gone and neither disposer runs. A binding that is still referenced becomes a plain `var`, and
its disposer is not called either:

```js
// input:  await using res = { async [Symbol.asyncDispose]() { console.log('async disposed') } }
//         export const get = () => res
var res = { async [Symbol.asyncDispose]() {
	console.log("async disposed");
} };
var get = () => res;
export { get };
```

Vite 8 sets `topLevelVar: true` for builds, so `vite build` with `build.target: 'esnext'` (any target that keeps
`using`) loses top-level disposal.

### System Info

rolldown 1.3.3 (also 1.2.19), Node 26.12.1, Linux x64. Through Vite: 8.3.8, 8.4.0-beta.1.

### Any additional comments?

Leaving `using` / `await using` declarations untouched under `topLevelVar` would fix it."""
