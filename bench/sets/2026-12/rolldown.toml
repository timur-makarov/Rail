# rolldown-37: A callable builtin plugin's resolveId should forward options.kind so a require-call resolves with the
# require condition.
# issue opened 2026-07-23, fix opened 2026-07-25, squash (or single commit); source files:
# crates/rolldown_binding/src/options/plugin/binding_callable_builtin_plugin.rs (19 lines); request from body (never
# edited).
# reading notes: filed by fixer. text names the fix. Test patch adds a workspace fixture package and edits
# tests/package.json, so the harness needs a reinstall.
[[situation]]
id = "rolldown-37"
request = """
[Bug]: Callable builtin plugin resolveId hardcodes ImportKind::Import — programmatic resolveId can never select the "require" condition

### Reproduction link or steps

Three files, `npm i`, `node repro.mjs` (rolldown 1.1.4, Node 24.18.0, macOS):

`package.json`

```json
{"name":"repro","private":true,"type":"module","dependencies":{"rolldown":"1.1.4","dual-pkg":"file:./dual-pkg"}}
```

`dual-pkg/package.json` (+ trivial `index.mjs`/`index.cjs`)

```json
{"name":"dual-pkg","version":"1.0.0","exports":{".":{"import":"./index.mjs","require":"./index.cjs"}}}
```

`repro.mjs` — constructs `viteResolvePlugin` from `rolldown/experimental` the way Vite 8 does for an unbundled server environment, then calls its `resolveId` twice:

```js
import path from "node:path";
import { fileURLToPath } from "node:url";
import { viteResolvePlugin } from "rolldown/experimental";

const root = path.dirname(fileURLToPath(import.meta.url));
const importer = path.join(root, "src/importer.js");

function makePlugin(staticIsRequire) {
  const plugin = viteResolvePlugin({
    resolveOptions: {
      isBuild: false, isProduction: false, asSrc: false, preferRelative: false,
      ...(staticIsRequire === undefined ? {} : { isRequire: staticIsRequire }),
      root, scan: false,
      mainFields: ["module", "jsnext:main", "jsnext", "main"],
      conditions: ["node"], externalConditions: ["node"],
      extensions: [".mjs", ".js", ".mts", ".ts", ".jsx", ".tsx", ".json"],
      tryIndex: true, preserveSymlinks: false, tsconfigPaths: false,
    },
    environmentConsumer: "server", environmentName: "ssr",
    builtins: [], external: true, noExternal: true, dedupe: [],
    resolveSubpathImports: () => undefined,
  });
  const hook = plugin.resolveId;
  return (id, imp, opts) =>
    typeof hook === "function" ? hook(id, imp, opts) : hook.handler(id, imp, opts);
}

const viaKind = await makePlugin(undefined)("dual-pkg", importer, { kind: "require-call" });
console.log('per-call kind "require-call" ->', viaKind?.id);

const viaStatic = await makePlugin(true)("dual-pkg", importer, {});
console.log("static isRequire: true       ->", viaStatic?.id);
```

Output:

```
per-call kind "require-call" -> …/dual-pkg/index.mjs
static isRequire: true       -> …/dual-pkg/index.cjs
```

### What is expected?

A resolveId call that declares itself a require-call (`kind: "require-call"`, the same options shape Vite's plugin container forwards to plugin hooks) should reach the native plugin as `ImportKind::Require`, so exports/imports condition resolution includes `require` and returns `index.cjs`. The second arm shows the resolver itself fully supports this — only the per-call signal never arrives.

### What is actually happening?

`options.kind` is silently discarded at the JS→native boundary: `BindingHookJsResolveIdOptions` carries only `isEntry`/`scan`/`custom` (`crates/rolldown_binding/src/options/plugin/binding_callable_builtin_plugin.rs:198`), and `BindingCallableBuiltinPlugin::resolve_id` hardcodes `kind: ImportKind::Import` (`:101`; both unchanged at current main, `4930a00b0`). So `vite_resolve_plugin.rs:338`'s `is_require: self.resolve_options.is_require.unwrap_or(args.kind == ImportKind::Require)` is always false on this path, and `resolver.rs` pushes the `import` condition.

Downstream, this means Vite 8's `environment.pluginContainer.resolveId` has no working way to resolve a `require()` call: Vite 7's `custom["node-resolve"].isRequire` handling no longer exists in Vite 8, and the `kind` Vite forwards dies here. A concrete casualty is `@cloudflare/vitest-pool-workers`' module-fallback service for workerd (cloudflare/workers-sdk#12984): `require()` of dual-format packages (e.g. `pg` → `pg-protocol`) resolves to the ESM entry inside workerd, throwing `Cannot use import statement outside a module`; it's currently worked around downstream with a post-hoc exports-map rescan (cloudflare/workers-sdk#13062).

### System Info

```shell
System:
  OS: macOS 26.5.2
  CPU: (14) arm64 Apple M4 Pro
  Memory: 5.67 GB / 48.00 GB
