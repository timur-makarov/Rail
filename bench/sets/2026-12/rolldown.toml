[[situation]]
id = "rolldown-24"
request = """
[Bug]: `transform`/`transformSync` with a `TsconfigCache` returns empty `tsconfigFilePaths`

### Reproduction link or steps

Any file that a `tsconfig.json` applies to, rolldown 1.2.15 (same on `main`):

```js
import path from 'node:path';
import { TsconfigCache, transformSync } from 'rolldown/utils';

const file = path.resolve('src/index.ts'); // ./tsconfig.json applies to it
const code = 'export const a: number = 1;';

transformSync(file, code).tsconfigFilePaths; // ['/.../tsconfig.json']

const cache = new TsconfigCache();
transformSync(file, code, undefined, cache).tsconfigFilePaths; // [] (first call, the cache loads the file)
transformSync(file, code, undefined, cache).tsconfigFilePaths; // []
```

The same with an explicit path: `transformSync(file, code, { tsconfig: p })` returns `[p]`, and with `new TsconfigCache(p)` passed as well it returns `[]`.

### What is expected?

`tsconfigFilePaths` holds the tsconfig that was applied, with or without a cache, as `resolveTsconfig(file, cache)` already reports for the same cache.

### What is actually happening?

`resolve_tsconfig_from_cache` (`crates/rolldown_binding/src/transform.rs`) hands the cached config to `enhanced_transform` as `TsconfigOption::Config`, and that branch reports no paths, which is right for a raw config object but drops the file the cache loaded.

This matters for Vite. `transformWithOxc` always passes its `TsconfigCache` when `options.tsconfig` is unset or equals `config.tsconfig`, and calls `ensureWatchedFile` for each entry of `result.tsconfigFilePaths`, so that loop never runs. `ensureWatchedFile` only adds files outside `config.root`, which is where it matters: with `root: 'src'` and `tsconfig.json` one level up, the tsconfig is not watched in dev, and editing it does not trigger `reloadOnTsconfigChange`. Checked with Vite 8.3.5 and 8.3.0: `createServer({ root: 'src' })`, `transformRequest('/main.ts')`, recording `server.watcher.add` calls. No call today; with the fix below Vite adds `../tsconfig.json`.

### System Info

```
rolldown 1.2.15 (also 1.2.9), main at 8eaa7f3c7
vite 8.3.5 (also 8.3.0)
Node 22.23.2, macOS 26 (darwin arm64)
```

### Any additional comments?

Fix and regression tests in a PR that follows: the `Config` branch of `enhanced_transform` reports the config's path when it has one. Independent of #11265, which fixes the `Ok(None)` side of the same cache lookup."""
