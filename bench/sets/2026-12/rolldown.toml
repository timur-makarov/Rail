# rolldown-13: Allow experimentalInlineCommonChunks to inline a common chunk whose only import.meta use is a
# plugin-resolved ROLLDOWN_FILE_URL reference, resolving the URL per receiving file.
# issue opened 2026-10-05, fix opened 2026-11-06, squash (or single commit); source files:
# crates/rolldown/src/ast_scanner/impl_visit.rs, crates/rolldown/src/module_finalizers/finalizer_context.rs,
# crates/rolldown/src/module_finalizers/mod.rs, crates/rolldown/src/stages/generate_stage/resolve_file_urls.rs (137
# lines); request from body (never edited).
# reading notes: Issue filed by a maintainer; text names why the selection check rejects it.
[[situation]]
id = "rolldown-13"
request = """
experimentalInlineCommonChunks: support plugin-resolved asset URL references

### Minimal case

Two entries import the same asset URL module. A plugin generates `import.meta.ROLLDOWN_FILE_URL_<ref>` and resolves it to the fixed string `"/icon.svg"`.

Tested with Rolldown 1.2.12 at [ffb6509](https://github.com/rolldown/rolldown/commit/ffb6509cfd37eb14be3e952626ad8ce310e9a279).

```js
// a.js
import icon from 'virtual:icon';
console.log('A', icon);

// b.js
import icon from 'virtual:icon';
console.log('B', icon);
```

```js
// rolldown.config.mjs
export default {
  input: { a: './a.js', b: './b.js' },
  preserveEntrySignatures: false,
  plugins: [{
    name: 'asset-url',
    resolveId(id) {
      if (id === 'virtual:icon') return id;
    },
    load(id) {
      if (id !== 'virtual:icon') return;
      const ref = this.emitFile({
        type: 'asset',
        fileName: 'icon.svg',
        source: '<svg />',
      });
      return `export default import.meta.ROLLDOWN_FILE_URL_${ref};`;
    },
    resolveFileUrl() {
      return JSON.stringify('/icon.svg');
    },
  }],
  output: {
    dir: 'dist',
    format: 'es',
    strictExecutionOrder: true,
    codeSplitting: {
      experimentalInlineCommonChunks: { maxSize: Infinity },
    },
  },
};
```

The build emits four JS files: two entries, an asset URL common chunk, and the runtime. The asset URL chunk's final code contains `"/icon.svg"`, not `import.meta`. Changing the plugin's `load` result to `export default '/icon.svg';` allows that common chunk to be inlined and leaves three JS files. The SVG asset itself is not part of the JS count.

### Why it is not inlined

The [selection check](https://github.com/rolldown/rolldown/blob/ffb6509cfd37eb14be3e952626ad8ce310e9a279/crates/rolldown/src/stages/generate_stage/inline_common_chunks/select.rs#L342) sees the placeholder as included `import.meta` and rejects it before [`resolveFileUrl`](https://github.com/rolldown/rolldown/blob/ffb6509cfd37eb14be3e952626ad8ce310e9a279/crates/rolldown/src/stages/generate_stage/resolve_file_urls.rs#L40) replaces it. The current URL-resolution pass also skips inlined chunks, so removing the selection check alone would not support this case.

### Expected behavior

Allow this fixed-URL common chunk to be inlined. Distinguish plugin-resolved asset references from native `import.meta`, whose value can depend on the output file. URL resolution and plugin metadata must remain correct for each receiving file; arbitrary file-dependent plugin replacements should not be assumed safe."""
