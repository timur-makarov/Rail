# rolldown-20: With externalLiveBindings: false in CJS output, `export *` from an external should copy values instead
# of defining getters.
# issue opened 2026-10-26, fix opened 2026-10-26, squash (or single commit); source files:
# crates/rolldown/src/utils/chunk/render_chunk_exports.rs (28 lines); request from oldest of 2 edit records.
# reading notes: filed by fixer; snapshot matches the issue's expected code
[[situation]]
id = "rolldown-20"
request = """
[Bug]: `externalLiveBindings: false` is ignored for `export *` from an external module in CJS output

In CJS output, `externalLiveBindings: false` applies to named re-exports from an external module but not to `export *`, which still emits non-configurable getters.

Rollup copies the values in that case, so moving from rollup to rolldown makes those exports impossible to redefine, which breaks `jest.spyOn`/`sinon.stub` on them.

### Reproduction

```js
// index.js
export * from 'ext';
export { foo as namedFoo } from 'ext';
```

```js
// node_modules/ext/index.js
exports.foo = function foo() {};
```

```js
const bundle = await rolldown({ input: 'index.js', external: ['ext'] });
await bundle.write({ format: 'cjs', externalLiveBindings: false, file: 'out.cjs' });
```

### What is expected?

With `externalLiveBindings: false`, the star re-export copies values, like the named re-export next to it and like rollup does:

```js
exports.namedFoo = ext.foo;
Object.keys(ext).forEach(function (k) {
	if (k !== 'default' && !Object.prototype.hasOwnProperty.call(exports, k)) exports[k] = ext[k];
});
```

### What is actually happening?

The named re-export respects the option, but the star re-export still defines getters:

```js
exports.namedFoo = ext.foo;
Object.keys(ext).forEach(function(k) {
	if (k !== "default" && !Object.prototype.hasOwnProperty.call(exports, k)) Object.defineProperty(exports, k, {
		enumerable: true,
		get: function() {
			return ext[k];
		}
	});
});
```

Those properties are non-configurable, so anything that redefines an export on the CJS module fails:

```js
const m = require('./out.cjs');
Object.defineProperty(m, 'foo', { value: 1 }); // TypeError: Cannot redefine property: foo
```

A few things rely on this, like `jest.spyOn` and `sinon.stub` work, so users who spy on a re-exported function in their tests break.

Looks like the `export *` loop is hardcoded, and the `externalLiveBindings` option is only checked for named exports. I understand that the getters make them behave like ESM exports, but the inconsistency makes me think that `export *` should respect the option the same way.

### System Info

```
rolldown 1.2.15, rollup 4.62.3 for comparison, Node 24.22.1, macOS
```"""
