# renaming follows the issue's Rollup example.
[[situation]]
id = "rolldown-34"
request = """
[Bug]: CJS output shadows the injected `require` when a module declares its own `var require`

### Reproduction link or steps

https://github.com/marcoroth/rolldown-cjs-require-shadow-repro

```sh
git clone https://github.com/marcoroth/rolldown-cjs-require-shadow-repro
cd rolldown-cjs-require-shadow-repro
npm install
npm start     # exits 1 — prints the emitted line, then the TypeError
```

`src/entry.js`:

```js
export async function init() {
  const { createRequire } = await import("node:module")
  var require = createRequire(import.meta.url)

  const path = require("node:path")
  const os = require("node:os")

  return path.sep + os.EOL
}
```

`rolldown.config.mjs`:

```js
import { defineConfig } from "rolldown"

export default defineConfig({
  input: "./src/entry.js",
  output: { file: "./dist/entry.cjs", format: "cjs" },
  platform: "node",
})
```

### What is expected?

`import.meta.url` is rewritten for CJS output using a `require("url")` call. When the module already declares its own `require` binding in that scope, the injected call should reference the real CommonJS `require`, either by emitting it before the shadowing declaration or by renaming the local binding.

Rollup handles this by deconflicting the local to `require$1`:

```js
var require$1 = createRequire(require('u' + 'rl').pathToFileURL(__filename).href);
```

### What is actually happening?

The injected `require("url")` is emitted *inside the initializer of the shadowing declaration*:

```js
async function init() {
	const { createRequire } = await import("node:module");
	var require = createRequire(require("url").pathToFileURL(__filename).href);
	const path = require("node:path");
	const os = require("node:os");
	return path.sep + os.EOL;
}
```

`var require` is hoisted to the top of the function, so the `require("url")` in its own initializer resolves to the local binding, which is still `undefined` at that point. The module throws `TypeError: require is not a function` on the first call.

The ESM output is unaffected, since `import.meta.url` needs no rewriting there.

### System Info

```Shell
System:
    OS: macOS 15.7.7
    CPU: (16) arm64 Apple M4 Max
    Memory: 3.98 GB / 64.00 GB
    Shell: 4.0.2 - /opt/homebrew/bin/fish
  Binaries:
    Node: 24.16.0 - /Users/marcoroth/.local/share/mise/installs/node/24.16.0/bin/node
    Yarn: 1.22.22 - /Users/marcoroth/.local/share/mise/installs/node/24.16.0/bin/yarn
    npm: 11.13.0 - /Users/marcoroth/.local/share/mise/installs/node/24.16.0/bin/npm
    pnpm: 11.21.0 - /Users/marcoroth/.local/share/mise/installs/node/24.16.0/bin/pnpm
    Deno: 2.9.0 - /opt/homebrew/bin/deno
    Watchman: 2026.01.12.00 - /opt/homebrew/bin/watchman
  Browsers:
    Chrome: 150.0.7871.187
    Safari: 26.5
```

### Any additional comments?

This is not a hand-written pattern. Emscripten emits exactly this shape in its generated glue when built with `-s EXPORT_ES6=1 -s ENVIRONMENT='node'`:

```js
if (ENVIRONMENT_IS_NODE) {
  const { createRequire } = await import("node:module");
  var require = createRequire(import.meta.url)
}
```

and later reads that binding for `require("node:fs")`, `require("node:path")` and `require("node:url")`, so it stays a variable. Emscripten used to allow opting out with `-s USE_ES6_IMPORT_META=0`, but current versions reject it with `Disabling is no longer supported`, so the shape cannot be avoided on the producing side.

We hit this migrating a monorepo from rollup to rolldown. Every CommonJS bundle carrying the emscripten module, four CLIs and a language server, threw on load. We are working around it with a `transform` plugin that renames the binding where the generated file enters the graph, which we would like to drop once this is fixed."""
