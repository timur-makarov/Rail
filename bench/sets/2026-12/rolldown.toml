# rolldown-31: Rolldown panics with jsx: preserve when an exported primitive const used as a JSX tag is
# constant-inlined; it should build without panicking.
# issue opened 2026-09-17, fix opened 2026-11-12, squash (or single commit); source files:
# crates/rolldown/src/stages/link_stage/cross_module_optimization.rs, crates/rolldown/src/stages/link_stage/mod.rs (36
# lines); request from oldest of 2 edit records.
# reading notes: text names the fix (keep literals out of the inliner for JSX names). Snapshot keeps <Tag /> which is
# the only valid output.
[[situation]]
id = "rolldown-31"
request = """
[Panic]: JsxElementName::IdentifierReference unreachable when an exported primitive const used as a JSX tag is inlined (`jsx: preserve`)

### Panic message

```
Rolldown panicked. This is a bug in Rolldown, not your code.

thread '<unnamed>' (201929) panicked at crates/rolldown/src/module_finalizers/impl_visit_mut.rs:705:15:
internal error: entered unreachable code: Should always rewrite to Identifier, StaticMemberExpression, or ThisExpression for JsxElementName::IdentifierReference
note: run with `RUST_BACKTRACE=1` environment variable to display a backtrace
```

### Reproduction

Two files, no plugins, no `resolve`, no `platform`. Rolldown `1.2.9` (latest published):

`entry.tsx`

```tsx
export const Tag = 'div';
export const App = () => <Tag />;
```

`build.mjs`

```js
import { rolldown } from 'rolldown';

const bundle = await rolldown({
  input: new URL('./entry.tsx', import.meta.url).pathname,
  transform: { jsx: 'preserve' },
});
await bundle.generate({ format: 'esm' });
```

```bash
npm i rolldown@1.2.9
node build.mjs
```

The panic aborts the process (the JS side then also throws
`Error: internal error: entered unreachable code: Should always rewrite to ...`).

**Fail / pass matrix** (same two files, only the tag declaration and the JSX context change):

| JSX element name resolves to | panics? |
| --- | --- |
| exported `const` = short string (`'div'`), int in `0..999`, `true`/`false`/`null` | **yes** |
| exported `const` = long string, used directly | no |
| exported `const` = long string, used as `cond && <Tag />` or `cond ?? <Tag />` | **yes** |
| exported `const`, JSX inside a ternary *alternate* or an `if` body | no |
| non-exported local `const` | no |
| imported / re-exported from another module (incl. `export default 'div'`) | **yes** |

Ways to make it not panic, all verified on `1.2.9`:

* `optimization: { inlineConst: false }` → ok (also ok when the const comes from another module).
* `transform: { jsx: 'react-jsx' }` or `'react'` → ok (JSX never reaches the module finalizer).
* Any stable version is **not** a workaround: see the version matrix below.

### Root cause (from the `v1.2.7`/`v1.2.9` sources)

`visit_jsx_element_name` at `crates/rolldown/src/module_finalizers/impl_visit_mut.rs:705` only
accepts `Identifier`, `StaticMemberExpression` and `ThisExpression` from the rewrite and
`unreachable!()`s otherwise. But `finalized_expr_for_symbol_ref`
(`crates/rolldown/src/module_finalizers/mf_mod.rs`) can return a **literal**:

* `mf_mod.rs:566` — constant inlining: `constant_value_map.get(&canonical_ref)` →
  `meta.value.to_expression(..)`, producing `StringLiteral` / `NumericLiteral` /
  `BooleanLiteral` / `NullLiteral`.
* `mf_mod.rs:752` — the same through `try_inline_constant_from_namespace_alias`.

The inlining gate is `!inline_const_smart_mode || state.contains(SmartInlineConst) || meta.safe_to_inline`,
where `safe_to_inline` is integers in `[-99, 999]`, strings of length `<= 3`, booleans, `null`,
and `SmartInlineConst` is set across the *entire* `&&` / `||` / `??` expression (and around
`if`/ternary tests) — which is why any string length panics inside a logical expression, and
why a conditional tag is enough to trigger it. Only exported, non-reassigned `const`
declarations reach `constant_value_map`, which matches the fail/pass matrix above.

Suggested fix: in the `JsxElementName::IdentifierReference` arm, either keep literals out of
the inliner for JSX element names, or handle the literal case (emit the inlined expression /
bail out of the rewrite) instead of `unreachable!()`.

### Version matrix

Minimal repro above, run twice per version (`transform: { jsx: 'preserve' }`, and tsconfig
`"jsx": "preserve"` only):

| version | panics? |
| --- | --- |
| 1.2.9 | **PANIC** (latest published) |
| 1.2.8 | **PANIC** |
| 1.2.7 / 1.2.6 / 1.2.5 / 1.2.4 | **PANIC** |
| 1.2.3 / 1.2.2 | **PANIC** (line 706) |
| 1.2.1 / 1.2.0 | **PANIC** |
| 1.1.5 / 1.1.0 | **PANIC** |
| 1.0.0 – 1.0.3 | **PANIC** |
| 1.0.0-rc.8 … rc.18 | **PANIC** |
| 1.0.0-rc.6 | ok |
| 0.14 / 0.15 | ok, but only because 0.x has no JSX `preserve` mode (JSX is always downlevelled) |

Regression window: `1.0.0-rc.6` → `1.0.0-rc.8`. Every stable `1.x` release panics. The
message is still present on `main` today, so upgrading does not fix it.

### Additional context

* Encountered while bundling authored modules with `jsx: 'preserve'` in a Nitro/eve pipeline;
  the same build emits
  `[CONFIGURATION_FIELD_CONFLICT] compilerOptions.jsx from tsconfig.json is overridden by jsx from transform`,
  which is how we confirmed the effective mode is `preserve`.
* Related but distinct reports: #8318 and #6036 are closed; both describe the same
  `unreachable!()` message, but this repro still panics on `1.2.9`, so either the fix covered
  a different rewrite path or this constant-inlining trigger regressed. Happy to re-test a
  build if a fix has landed.
* For anyone else hitting it: **no version pin works**; the only non-panicking builds are the
  `1.0.0-rc.2 … rc.6` prereleases, which are not a sane pin. Use
  `optimization: { inlineConst: false }` or stop emitting `jsx: 'preserve'`.

### System Info

```
