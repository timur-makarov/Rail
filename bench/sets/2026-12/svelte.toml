[project]
name = "svelte"
repo = "https://github.com/sveltejs/svelte"
language = "typescript"
package = "svelte"
# Sample folders are the test cases of svelte's suites; the runner files and plain *.test.ts files run them.
tests = [
  "packages/svelte/tests/*/test.ts",
  "packages/svelte/tests/*/test-*.ts",
  "packages/svelte/tests/**/*.test.ts",
  "packages/svelte/src/**/*.test.ts",
  "packages/svelte/tests/*/samples/**",
  "packages/svelte/tests/*/samples-dom/**",
  "packages/svelte/tests/*/custom-elements-samples/**",
  "packages/svelte/tests/types/**",
]
clash = "path"
# _output: compiled samples the suites write next to each sample (gitignored by packages/svelte/tests/.gitignore).
build_dirs = ["_output"]

[commands]
# from: .github/workflows/ci.yml@b1a066c2fd09 (.github/actions/setup: `pnpm install --frozen-lockfile`), package.json packageManager
# unverified: installing the pinned pnpm with npm into $BENCH_CACHE and the explicit --store-dir are ours, not CI's
setup = '''
set -euo pipefail
V=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")
P="$BENCH_CACHE/pnpm/$V"
if [ ! -x "$P/bin/pnpm" ]; then
  mkdir -p "$BENCH_CACHE/pnpm"
  rm -rf "$P.tmp.$$"
  npm_config_cache="$BENCH_CACHE/npm-cache" npm install -g --prefix "$P.tmp.$$" --no-audit --no-fund "pnpm@$V"
  mv -T "$P.tmp.$$" "$P" 2>/dev/null || rm -rf "$P.tmp.$$"
fi
"$P/bin/pnpm" --version
"$P/bin/pnpm" install --frozen-lockfile --store-dir "$BENCH_CACHE/pnpm-store"
node node_modules/vitest/vitest.mjs --version
'''
# from: packages/svelte/tests/suite.ts@b1a066c2fd09 and @2bace308e37a (FILTER=name runs only the sample folder
#   named exactly so), vitest.config.js@both (include/projects), ci.yml@both (`pnpm test` = `vitest run`, CI: true)
# unverified: the per-sample FILTER loop and the "no test ran" guard are ours; not run against a real copy
test_files = '''
set -uo pipefail
export CI=true NO_COMPILE_CACHE=true
VT=node_modules/vitest/vitest.mjs
T=packages/svelte/tests
pairs=()
plain=()
types=0
for f in {files}; do
  case "$f" in
    "$T"/*)
      IFS=/ read -r -a p <<< "${f#"$T"/}"
      suite=${p[0]}
      if [ "${#p[@]}" -ge 4 ] && [[ "${p[1]}" == samples || "${p[1]}" == samples-dom || "${p[1]}" == custom-elements-samples ]]; then
        name=${p[2]}
        case "${p[1]}" in
          samples) if [ "$suite" = runtime-browser ]; then r="$T/$suite/test-ssr.ts"; else r="$T/$suite/test.ts"; fi ;;
          samples-dom) r="$T/$suite/test-dom.test.ts" ;;
          *) r="$T/$suite/test.ts" ;;
        esac
        if [ -f "$r" ]; then
          pairs+=("$name $r")
        else
          echo "bench: no runner $r for $f"
        fi
      elif [ "$suite" = types ]; then
        types=1
      elif [[ "$f" == *.test.ts || "$f" == "$T/$suite/test.ts" || "$f" == "$T/runtime-browser/test-ssr.ts" ]]; then
        if [ -f "$f" ]; then plain+=("$f"); fi
      else
        echo "bench: support file, not run by itself: $f"
      fi
      ;;
    *.test.ts) if [ -f "$f" ]; then plain+=("$f"); fi ;;
    *) echo "bench: not a test file, not run: $f" ;;
  esac
done
rc=0
ran=0
out=$(mktemp)
run_vitest() {
  local filter=$1 code
  shift
  ran=1
  echo "bench: FILTER='$filter' vitest run $*"
  FILTER="$filter" node "$VT" run "$@" 2>&1 | tee "$out"
  code=${PIPESTATUS[0]}
  if [ "$code" -eq 0 ] && ! grep -Eq '^ *Tests +.*[1-9][0-9]* passed' "$out"; then
    echo "bench: no test ran"
    code=1
  fi
  if [ "$code" -ne 0 ]; then rc=1; fi
}
if [ "${#plain[@]}" -gt 0 ]; then run_vitest "" "${plain[@]}"; fi
if [ "${#pairs[@]}" -gt 0 ]; then
  for name in $(printf '%s\n' "${pairs[@]}" | cut -d' ' -f1 | sort -u); do
    rs=($(printf '%s\n' "${pairs[@]}" | awk -v n="$name" '$1 == n { print $2 }' | sort -u))
    run_vitest "$name" "${rs[@]}"
  done
fi
if [ "$types" = 1 ]; then
  ran=1
  echo "bench: tsc in $T/types"
  (cd "$T/types" && node ../../node_modules/typescript/bin/tsc) || rc=1
fi
rm -f "$out"
if [ "$ran" = 0 ]; then echo "bench: nothing runnable in the list"; exit 1; fi
exit "$rc"
'''
# from: vitest.config.js@b1a066c2fd09 (include list), ci.yml@b1a066c2fd09 (`pnpm test`, CI: true)
# unverified: leaving out runtime-browser/test.ts (it needs a playwright chromium, CI installs one) is ours
test_package = '''
set -uo pipefail
pkg={package}
case "$pkg" in
  .changeset|documentation|benchmarking|playgrounds/*)
    echo "bench: $pkg holds no tests of its own"
    exit 0
    ;;
esac
unset FILTER
export CI=true
T=packages/svelte/tests
args=(packages/svelte/src/ "$T/runtime-browser/test-ssr.ts")
for d in "$T"/*/; do
  if [ "$d" != "$T/runtime-browser/" ]; then args+=("$d"); fi
done
for f in "$T"/*.test.ts; do
  if [ -e "$f" ]; then args+=("$f"); fi
done
node node_modules/vitest/vitest.mjs run "${args[@]}"
'''
