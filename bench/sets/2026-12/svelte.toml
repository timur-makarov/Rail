# svelte-13: A recoverable hydration mismatch inside a svelte:boundary should bypass the boundary and reach top-level
# hydrate recovery instead of rendering the fallback.
# issue opened 2026-09-18, fix opened 2026-09-19, squash (or single commit); source files:
# packages/svelte/src/internal/client/dom/blocks/boundary.js, packages/svelte/src/internal/client/error-handling.js
# (16 lines); request from oldest of 4 edit records.
# reading notes: filed by fixer; text names the fix (rethrow HYDRATION_ERROR before boundary dispatch)
[[situation]]
id = "svelte-13"
request = """
Hydration mismatch recovery is intercepted by svelte:boundary

## Description

A recoverable hydration mismatch is intercepted by `<svelte:boundary>` when hydrating a SvelteKit 3 app. The boundary treats Svelte's internal hydration failure signal as an application render error, so SvelteKit renders its `+error.svelte` page instead of allowing top-level `hydrate()` recovery.

Originally reported in sveltejs/kit#17151.

## Reproduction

```svelte
<script>
	const html = '<p>Valid HTML fragment</p>';
</script>

<p>{@html html}</p>
```

Place the component beneath a `<svelte:boundary>` with a fallback, SSR it, then directly load or reload the page in a browser. The browser repairs the invalid nested `<p>` structure before hydration.

The same occurs with an unterminated fragment such as `'<p>Missing closing tag'`.

## Actual behavior

1. SSR returns 200 with the generated markup.
2. The browser normalizes the invalid structure.
3. Svelte logs `hydration_mismatch`.
4. The boundary intercepts the internal hydration failure and renders its fallback. In SvelteKit 3 this becomes the 500 error page.

Client-side navigation works because no SSR DOM is hydrated. SvelteKit 2 logs the mismatch but leaves recovery to Svelte and does not render an error page.

## Expected behavior

Hydration mismatch recovery signals should bypass error boundaries and reach top-level `hydrate()`, which can discard the mismatched DOM and mount again. Genuine component exceptions during hydration should still be handled by the nearest boundary.

## Proposed direction

In the client error-boundary dispatch, rethrow the private `HYDRATION_ERROR` sentinel before traversing boundaries or applying `transformError`, preserving its identity for the catch in `hydrate()`.

Add regression coverage asserting that malformed `{@html}` beneath a boundary warns and recovers without rendering the fallback, while genuine hydration-time component exceptions remain catchable."""
