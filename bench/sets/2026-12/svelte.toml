```svelte
<script>
	import { page } from '$app/state';
	let { children } = $props();
</script>

<nav><a href="/">home</a> <a href="/fail">fail</a> <a href="/ok">ok</a></nav>

{#if page.error}
	{@render children()}
{:else}
