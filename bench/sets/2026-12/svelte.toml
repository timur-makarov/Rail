    OS: Linux 6.6 Ubuntu 24.04.3 LTS
    CPU: (32) x64 AMD RYZEN AI MAX+ PRO 395 w/ Radeon 8060S
    Memory: 45.84 GB / 94.07 GB
    Container: Yes
    Shell: 5.2.21 - /bin/bash
