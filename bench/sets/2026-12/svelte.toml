# svelte-24: Server compile of a getter returning a later-declared $derived with leading line comments emits the
# comments after return, so it returns undefined.
# issue opened 2026-08-02, fix opened 2026-08-14, squash (or single commit); source files:
# packages/svelte/src/compiler/phases/3-transform/server/visitors/shared/element.js,
# packages/svelte/src/compiler/phases/3-transform/server/visitors/shared/utils.js (93 lines); request from body (never
# edited).
# reading notes: screenshots carry only confirmation; text has a full repro
[[situation]]
id = "svelte-24"
request = """
Comments break server-side compiler

### Describe the bug

A getter that returns a `$derived` declared later in the same scope compiles incorrectly for the server when that declaration has leading line comments: the comments are emitted between `return` and the value, so it gets turned it into `return undefined`. Minimal repro:

```svelte
<script>
	const ctx = {
		get later() {
			return later;
		}
	};

	// a leading comment on the declaration
	// that spans more than one line
	const later = $derived.by(() => 'LATER');
</script>
```

