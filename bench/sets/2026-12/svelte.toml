# svelte-09: An unexpected element where a nested boundary's opening comment should be must be handled as a hydration
# mismatch and recovered from, not throw a TypeError.
# issue opened 2026-10-04, fix opened 2026-10-04, squash (or single commit); source files:
# packages/svelte/src/internal/client/dom/blocks/boundary.js (11 lines); request from oldest of 2 edit records.
# reading notes: text names the fix (check the node is a comment)
[[situation]]
id = "svelte-09"
request = """
Extra node before a nested <svelte:boundary> throws a TypeError during hydration instead of recovering

### Describe the bug

Follow-up to #18840 / #18841.

#18841 lets the hydration mismatch signal pass through boundaries so `hydrate()` can recover. There is one case it doesn't cover: when the unexpected node sits exactly where a nested boundary's opening comment should be.

The boundary reads `comment.data.startsWith(...)` on whatever node is at that position. If it's an element, `data` is undefined, so it throws

```
TypeError: Cannot read properties of undefined (reading 'startsWith')
```

That is a normal error, not the hydration signal, so a parent boundary with `failed` / `onerror` catches it. No warning, no recovery, the parent's fallback renders.

How I ran into it: SvelteKit 3 wraps every route node in a boundary, and a browser extension was adding an element to the page before hydration. The whole app got replaced by the error page with a 500. #18841 fixes that for most positions, but if the element lands as the first child of an element whose first child is a boundary (the start of `<main>` in a layout, for example), it still ends up on the error page.

Expected: handled like any other hydration mismatch (warn and recover).

The read is in `packages/svelte/src/internal/client/dom/blocks/boundary.js`:

```js
const comment = /** @type {Comment} */ (this.#hydrate_open);
// ...
const server_rendered_failed = comment.data.startsWith(HYDRATION_START_FAILED);
```

A check that the node is a comment before reading it (and going down the mismatch path if not) would probably be enough. Happy to send a PR if that sounds right.

### Reproduction

<!-- playground link goes here -->

`Nested.svelte`

```svelte
<script>
	let { onerror } = $props();
</script>

<svelte:boundary {onerror}>
	<div>
		<svelte:boundary>
			<p>inner</p>
			{#snippet failed()}<p>inner failed</p>{/snippet}
		</svelte:boundary>
	</div>
	{#snippet failed()}<p>outer failed</p>{/snippet}
</svelte:boundary>
```

`App.svelte`

```svelte
<script>
	import { hydrate } from 'svelte';
	import Nested from './Nested.svelte';

	// What the server renders for Nested, plus one extra <span> as the
	// first child of the div, where the inner boundary's comment should be.
	const html =
		'<!--[--><!--[--><div><span></span><!--[--><p>inner</p><!--]--></div><!--]--><!--]-->';

	let caught = $state('nothing');

	function run(target) {
		target.innerHTML = html;
		hydrate(Nested, { target, props: { onerror: (e) => (caught = String(e)) } });
	}
</script>

<div {@attach run}></div>
<p>outer boundary caught: {caught}</p>
```

Result: `outer boundary caught: TypeError: Cannot read properties of undefined (reading 'startsWith')` and "outer failed" is rendered.

Remove the `<span></span>` from the string and it hydrates fine.

### Logs

```shell
TypeError: Cannot read properties of undefined (reading 'startsWith')
```

### System Info

