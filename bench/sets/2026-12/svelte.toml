# svelte-26: A svelte:boundary hydrated in the failed state should call onerror and give the failed snippet a working
# reset.
# issue opened 2026-07-17, fix opened 2026-07-17, squash (or single commit); source files:
# packages/svelte/src/internal/client/dom/blocks/boundary.js (89 lines); request from body (never edited).
# reading notes: filed by fixer; repro is in an external repo but prose states the wanted behaviour
[[situation]]
id = "svelte-26"
request = """
A `<svelte:boundary>` hydrated in the failed state can never be reset

### Describe the bug

A boundary that fails during SSR renders its `failed` snippet and hydrates back into the failed state from the serialized marker. During that hydration `onerror` is never called, and the `reset` handed to the `failed` snippet is a no-op ([boundary.js#L200-L210](https://github.com/sveltejs/svelte/blob/4a6a85b5f149cc96514ed3bf5e59083b9246d394/packages/svelte/src/internal/client/dom/blocks/boundary.js#L200-L210)). Once a boundary hydrates as failed there is no way to leave that state short of destroying the component, even when its children would render fine on the client.

This is also what keeps SvelteKit's `+error.svelte` mounted after navigating away from a server-rendered error page (sveltejs/kit#16345). Kit resets its route boundaries on navigation with the reset functions collected in `onerror` (sveltejs/kit#16296), and for hydrated failures those never exist.

### Reproduction

https://github.com/Nic-Polumeyv/svelte-hydrate-failed-reset

The child throws only during SSR, so a client render would succeed. `pnpm install && node server.js`, open the page, click reset. Nothing happens and the console never logs `onerror called`.

### Logs

```
None, the reset silently does nothing.
```

### System Info

```
svelte 5.56.4 and 5.56.6, vite 8.1.4. The code is unchanged on main.
```

### Severity

annoyance"""
