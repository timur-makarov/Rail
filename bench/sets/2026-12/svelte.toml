# svelte-05: <!-- and --> inside <style> should be treated as CSS CDO/CDC tokens so the rules between them are parsed
# and scoped.
# issue opened 2026-11-21, fix opened 2026-11-21, squash (or single commit); source files:
# packages/svelte/src/compiler/phases/1-parse/read/style.js (17 lines); request from body (never edited).
# reading notes: filed by fixer; expected output keeps the markers, as the issue says Svelte already does
[[situation]]
id = "svelte-05"
request = """
HTML comment markers in `<style>` hide rules from scoping, so they leak globally

### Describe the bug

Svelte 5 reads `<!-- ... -->` in `<style>` like a `/* */` comment and skips everything between the markers. In CSS, `<!--` and `-->` are not comments. They are single tokens (CDO and CDC) that are ignored at the top level of a stylesheet, so the content between them is normal CSS ([spec](https://drafts.csswg.org/css-syntax-3/#consume-stylesheet-contents)).

Svelte keeps the markers in the output, so the browser still applies the rules between them. Because Svelte skipped those rules, they are not scoped and leak to the whole page.

Svelte 4 followed the spec here and scoped the rules. The skipping comes from [`allow_comment_or_whitespace`](https://github.com/sveltejs/svelte/blob/90ad4e870c72aa76db35ecc7e46f0b027ffe175a/packages/svelte/src/compiler/phases/1-parse/read/style.js#L653-L668), which has been there since Svelte 5 started (fe8a9ce).

| `<style>` content | Svelte 4 output | Svelte 5 output |
|---|---|---|
| `<!-- h1 { color: red } -->` | `h1.svelte-xyz{color:red}` | `<!-- h1 { color: red } -->` (not scoped) |

### Reproduction

[Playground](https://svelte.dev/playground#H4sIAAAAAAAAE3WQwW7DIAyGX8XzpZekuacoUrVTn6HsQBNHQQODwN1WRXn3ibRT22m7YPGb3_4_ZmTjCVvMcnEEk3gHffCeWMCReccKxVj3aXnAdjQuU4WjdZSxPc4ol1i8RcDqZ9I-xm3-ICdFO5lMf-l9YCGWjC2q3CcbpdOsxfoYksDrZN0AYwoeNttmvd2sm51m1dwdrGJ3AOPBMuxjrOAAeQpnNwAHgRNBokE1sdOsrkObTnOBoi_BVtKZluofjse1zyS_Oo8s9zTro-tqzWr93hVRvdR1qRHmUrT0wYXUlqC7IizlqOtu5by5ngO_Ld8pAI75tgEAAA): the `<p>` in `App.svelte` turns red because of a style in `Child.svelte`.

### Logs

_No response_

### System Info

```shell
svelte 5.59.1 (also on main at 90ad4e8)
```

### Severity

annoyance"""
