# svelte-03: Dev-mode __svelte_meta on elements should not be enumerable so deep-equality helpers do not walk into the
# component graph and hang.
# issue opened 2026-11-18, fix opened 2026-11-18, squash (or single commit); source files:
# packages/svelte/src/internal/client/dev/elements.js, packages/svelte/src/internal/client/dom/blocks/html.js,
# packages/svelte/src/internal/client/dom/blocks/slot.js, packages/svelte/src/internal/client/dom/blocks/snippet.js,
# packages/svelte/src/internal/client/dom/blocks/svelte-element.js,
# packages/svelte/src/internal/client/dom/operations.js (99 lines); request from body (never edited).
# reading notes: text names the fix (Object.defineProperty non-enumerable); tests also check Element.prototype
# fallback and {@html}/slot/snippet metadata sites, which a fix should find by grepping __svelte_meta;
# svelte-meta-html-update likely already passed
[[situation]]
id = "svelte-03"
request = """
5.58.0: dev `__svelte_meta.component` makes element deep-equality hang

### Describe the bug

### Bug

Since 5.58.0, in dev mode, `assign_location` in `src/internal/client/dev/elements.js` adds the current component context to the metadata attached to every element:

```js
element.__svelte_meta = {
  parent: dev_stack,
  loc: { file: filename, line: location[0], column: location[1] },
  component: component_context // new in 5.58.0
};
```

`__svelte_meta` is a plain enumerable property, so every rendered element now links into the component's reactive graph (effects, props, parent contexts, other DOM nodes). Deep-equality helpers that walk an element's own properties follow that link.

In our test suite, a Vitest assertion that passes a rendered element to `toMatchObject` now never returns:

```js
expect(observerOptions.at(-1)).toMatchObject({
  root: target.querySelector("[data-scroll-area-viewport]"),
  rootMargin: "0px 0px 400px 0px"
});
```

The traversal is synchronous, so Vitest's `testTimeout` never fires and the whole `vitest run` freezes. The same test passes on 5.57.3. In our app the element is deep inside a component tree (bits-ui scroll area, tabs, nested route components). With one small component the graph is small enough that the comparison still finishes, so the reproduction below shows the cause directly rather than the hang.

### Expected behavior

Dev-only metadata should not change how elements behave under deep equality. Comparing a rendered element with `toMatchObject` / `toEqual` should work the same as on 5.57.3.

A possible fix is to define `__svelte_meta` (or at least its `component` field) as non-enumerable, e.g. with `Object.defineProperty(element, "__svelte_meta", { value, enumerable: false, configurable: true, writable: true })`.

### Workaround

Compare elements by identity instead of structurally:

```js
expect(observerOptions.at(-1)?.root).toBe(target.querySelector("[data-scroll-area-viewport]"));
expect(observerOptions.at(-1)?.rootMargin).toBe("0px 0px 400px 0px");
```

### System info

- svelte: 5.58.0 (regression; 5.57.3 works)
- vitest: 5.1.1
- jsdom: 30.1.3
- @sveltejs/vite-plugin-svelte: 7.3.1
- Node: 26.13.0 and 26.13.1

### Severity

Annoyance

### Reproduction

### Reproduction

```svelte
<!-- App.svelte -->
<script>
  let count = $state(0);
</script>

<div>
  <button onclick={() => count++}>{count}</button>
</div>
```

```js
// repro.test.js (Vitest, environment: "jsdom", resolve.conditions: ["browser"])
import { flushSync, mount } from "svelte";
import { expect, test } from "vitest";
import App from "./App.svelte";

test("__svelte_meta exposes the component context as an enumerable property", () => {
  const target = document.body.appendChild(document.createElement("div"));
  mount(App, { target });
  flushSync();

  const el = target.querySelector("div");

  // 5.58.0: dev metadata now links every element into the component's reactive graph,
  // and deep-equality helpers (e.g. Vitest's toMatchObject) walk into it.
  expect(Object.keys(el)).toContain("__svelte_meta");
  expect(el.__svelte_meta.component).toBeDefined(); // undefined on 5.57.3

  // With a deeper component tree, this never returns:
  // expect({ root: el }).toMatchObject({ root: el });
});
```


