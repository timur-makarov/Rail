# svelte-17: Each mount of a component with svelte:head leaves an empty text-node anchor in document.head that unmount
# never removes.
# issue opened 2026-08-24, fix opened 2026-08-24, squash (or single commit); source files:
# packages/svelte/src/internal/client/dom/blocks/svelte-head.js (8 lines); request from body (never edited).
# reading notes: text names the fix (include the anchor in the branch node range)
[[situation]]
id = "svelte-17"
request = """
`<svelte:head>` leaks one text node in `document.head` per mount — anchor is created outside the effect tree and never removed

### Describe the bug

Every client-side mount of a component containing `<svelte:head>` appends an empty text-node *anchor* to `document.head` that is never removed on unmount.

In `packages/svelte/src/internal/client/dom/blocks/svelte-head.js`, `head()` does:

```js
if (!hydrating) {
	anchor = document.head.appendChild(create_text());
}

try {
	block(() => {
		var e = branch(() => render_fn(anchor));
		e.f |= HEAD_EFFECT;
	});
}
```

The rendered head content becomes part of the branch effect's node range (`e.nodes.start … e.nodes.end`) and is correctly removed by `destroy_effect` → `remove_effect_dom` (the `HEAD_EFFECT` flag even forces DOM removal). But the **anchor** text node is created *before* the effect, outside its node range, so no teardown path ever removes it.

In an SPA this is unbounded: every route navigation that mounts a page with `<svelte:head>` (e.g. any SvelteKit app with a per-page SEO component) permanently adds one empty text node to `document.head`. We found this while soak-testing a large production SvelteKit app: DOM node count grows by exactly 1 per `<svelte:head>` mount, linear through 800 mounts with no plateau (~2 nodes + ~4 KiB per route round-trip). Chrome heap snapshots confirm the accumulated nodes are the empty head anchors. This looks like the root cause of the symptom reported in sveltejs/kit#12405 (closed without a root cause).

### Reproduction

```js
import { mount, unmount } from 'svelte';
import Head from './Head.svelte'; // <svelte:head><meta name="test" content="value" /></svelte:head>

const before = document.head.childNodes.length;

for (let i = 0; i < 100; i++) {
	const instance = mount(Head, { target: document.body });
	unmount(instance);
}

console.log(document.head.childNodes.length - before); // 100 — expected 0
```

Also reproduced as a failing test in this repo's own runtime suite (PR incoming): a `{#if}`-toggled child with `<svelte:head>`, toggled on/off 3 times, leaves `document.head.childNodes.length` 3 higher than it started — in both `dom` and `hydrate` variants.

### Expected behaviour

`document.head` returns to its previous state after unmount; no per-mount growth.

### Proposed fix

Since the head content renders immediately *before* the anchor, the ranges are contiguous — including the anchor in the branch's node range lets the existing `HEAD_EFFECT` teardown sweep remove it (`remove_effect_dom` is inclusive of `end`). PR with a regression test to follow shortly.

### System Info

```
svelte 5.56.8 (also present in current main)
verified in Chromium 143 (Playwright) and jsdom (vitest runtime suite)
```

### Severity

annoyance (unbounded, but slow — matters for long-lived SPA sessions)"""
