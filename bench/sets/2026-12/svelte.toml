# svelte-15: Components whose only elements are inside svelte:head wrongly get css_unused_selector warnings for
# :is(:global(...)) and :export rules since 5.57.0.
# issue opened 2026-09-07, fix opened 2026-09-07, squash (or single commit); source files:
# packages/svelte/src/compiler/phases/2-analyze/css/css-prune.js (20 lines); request from body (never edited).
# reading notes: text names the cause line; expected.css also pins existing :global stripping output
[[situation]]
id = "svelte-15"
request = """
Regression: css_unused_selector false positive for global/:export rules in components whose only elements are inside <svelte:head> (#18160)

## Describe the bug

Since **5.57.0**, `svelte-check` / the compiler reports `css_unused_selector` warnings for selectors that are not actually unused, in components that have **no scopable DOM elements of their own** — i.e. their only markup is inside `<svelte:head>` (plus optionally components and `{@render ...}`).

Two kinds of rule are wrongly flagged:

- `:is(:global(...))` — a global selector wrapped in `:is()` (this is exactly what a CSS minifier such as LightningCSS produces from a `:global(a), :global(b)` list).
- `:export { ... }` — the ICSS export block that `*.module.scss` files use to expose SCSS variables to JS.

Both selectors are correct and functional at runtime; they are simply never marked "used".

I bisected this to **#18160** ("fix: never apply class hash to elements inside `<svelte:head>`"), the only CSS-analysis change between 5.56.10 and 5.57.0. In `css-prune.js` it adds:

```js
!is_inside_svelte_head(element) && apply_selector(...)
```

`apply_selector` is what marks global/complex rules as used, and that marking is only reached by iterating the component's elements. When a component's *only* elements are inside `<svelte:head>`, the iterable is now empty, `apply_selector` never runs, and those rules are reported as unused. Adding any non-head DOM element (e.g. a single `<div>`) makes the warnings disappear.

Note: a plain `:global(a), :global(b)` list is **not** affected (it's recognised as global structurally); only the `:is(:global(...))` form is, which is why this surfaces in real projects only after a CSS minifier rewrites the selector list.

## Reproduction

REPL (shows both warnings on 5.57.0+): https://svelte.dev/playground/f3d42eefdb154668bb1d2a49d348593b

Minimal, no preprocessing required — compiling either component below emits a false `css_unused_selector` warning on 5.57.0 but not on 5.56.10:

```svelte
<!-- A.svelte -->
<svelte:head><meta name="x" content="y" /></svelte:head>
<style>
  :is(:global(td), :global(th)) { color: red; }
</style>
```

```svelte
<!-- B.svelte -->
<svelte:head><meta name="x" content="y" /></svelte:head>
<style>
  :export { foo: red; }
</style>
```

Adding `<div></div>` to the template of either makes the warning go away.

| case | 5.56.10 | 5.57.0 |
|---|---|---|
| `A.svelte` (`:is(:global(td), :global(th))`) | no warning | `Unused CSS selector ":is(:global(td), :global(th))"` |
| `B.svelte` (`:export`) | no warning | `Unused CSS selector ":export"` |
| either + a `<div>` in the template | no warning | no warning |

Real-world trigger: a SvelteKit `+layout.svelte` that only renders `<svelte:head>`, a child component, and `{@render children()}`, with global `<style>` (table styles + a `@use`d `*.module.scss` that has an `:export` block). Vite's LightningCSS minifier rewrites `:global(td), :global(th)` to `:is(:global(td), :global(th))`, which then trips the bug.

## Logs

```shell
Warn: Unused CSS selector ":export"
https://svelte.dev/e/css_unused_selector

Warn: Unused CSS selector ":is(:global(td), :global(th))"
https://svelte.dev/e/css_unused_selector
```

## System Info

```shell
System:
  OS: Linux (Ubuntu 26.04)
Binaries:
  Node: 26.8.1
  npm: 11.19.0
npmPackages:
  @sveltejs/vite-plugin-svelte: 7.3.0
  svelte: 5.57.0
  vite: 8.2.2
```

## Severity

annoyance"""
