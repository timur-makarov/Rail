# svelte-01: Keyed each items whose outros mix zero and non-zero durations should still be removed from the DOM once
# the group finishes.
# issue opened 2026-10-18, fix opened 2026-10-18, squash (or single commit); source files:
# packages/svelte/src/internal/client/dom/blocks/each.js (23 lines); request from body (never edited).
# reading notes: filed by fixer; prose names the cause in pause_effects; second fixture also pins
# restore-while-outroing edge cases that follow from group semantics
[[situation]]
id = "svelte-01"
request = """
Keyed each items are never removed when outros of zero and non-zero duration run together

### Describe the bug

In a keyed `{#each}`, when one update removes several items and some of their outros take no time (`duration: 0`, or a transition function that returns no duration) while others do, none of the removed items is ever taken out of the DOM. They stay `inert`, at their final transition state, until the component is destroyed. If every removed item has a timed outro, or every one has none, they are removed as expected.

The cause is in `pause_effects` (`packages/svelte/src/internal/client/dom/blocks/each.js`). An outro of zero duration finishes synchronously, inside the loop that starts the outros, before `group` exists. Its callback takes the `else` branch and only decrements `remaining`. After the loop, `remaining` is not zero, so `group` is created with `pending: new Set(to_destroy)`, which still holds the effect that already finished. Nothing removes it from `pending` again, so `pending.size` never reaches 0 and `destroy_effects` never runs for the group.

We hit this with an `animate:` + `out:` grid whose outro duration depends on the item. I intend to submit a PR for this.

### Reproduction

[Playground](https://svelte.dev/playground/untitled#H4sIAAAAAAAAE22QzW6rMBCFX-XUrdREIiFNuqJA1Re42y5CFg4MwiqMqT2kt0J-9yvD_dlcr2aOZz6f41m1pievsvOs5HsklS2CShTrIXZv47j3N-olalft6X96bVmIxatM5b52ZpSy4krMMFonmNHqhhDQOjvgcd1KxWn2Rozlx5eK43hPAiM0eBR48KKFNuenBMcEp8v2peI8_cfm_DqJWIblujf1RzFvtihKbP4Azk-XbSgdDfZGOEJzg1Oerksr4G63w3Gx5mEnQWsdDoNPcFrK58PSxMWrlQ496RvBMKQjeD0QprHRQvuKEc8PMtKRg_GgGzmsTzd7vBvpQJ-T7tFMTsfEPlmZ2tEeu11Z8XxPuu5-x9d-KdYw2xD_Jh-jxyy6Leb5LyhbB4uiwBGvOCCLvhFCOceLkKdjhKcRHipWiRL6KSoTN1G4JEq06b8MNyprde8p_AL8t156DwIAAA)

```svelte
<script>
	import { fade } from 'svelte/transition';

	let items = $state([1, 2, 3]);
</script>

<button onclick={() => (items = [1])}>remove 2 and 3</button>

{#each items as item (item)}
	<p out:fade={{ duration: item === 2 ? 0 : 400 }}>{item}</p>
{/each}
```

Click the button: `2` and `3` are never removed. With `duration: 400` for both, they are.

### Logs

```shell
None: no error is thrown.
```

### System Info

```shell
System:
  OS: macOS 26.5.2
  CPU: (10) arm64 Apple M5
Binaries:
  Node: 25.9.0
  pnpm: 11.12.0
Browsers:
  Chrome: 155.0.8059.82
npmPackages:
  svelte: 5.57.0, and reproduced on main (40bb084)
```

### Severity

annoyance"""
start = "b1a066c2fd09c789890bef6f205aca15d3d7943e"
fix = "b3c9567d952bb08d73afd0f13e1defa8dbed571e"
hidden_tests = ["packages/svelte/tests/runtime-runes/samples/transition-each-mixed-completion/_config.js", "packages/svelte/tests/runtime-runes/samples/transition-each-mixed-completion/main.svelte", "packages/svelte/tests/runtime-runes/samples/transition-each-mixed-duration/_config.js", "packages/svelte/tests/runtime-runes/samples/transition-each-mixed-duration/main.svelte"]
