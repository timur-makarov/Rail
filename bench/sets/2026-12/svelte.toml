id = "svelte-25"
request = """
CSS custom properties with falsy values are ignored

### Describe the bug

When a CSS custom property is defined on a component with a falsy value, the rendered result does not include the custom property.

For example, `<Component --foo={1} />` creates:
```html
<svelte-css-wrapper style="display: contents; --foo: 1;">...</svelte-css-wrapper>
```

But `<Component --foo={0} />` creates:
```html
<svelte-css-wrapper style="display: contents;">...</svelte-css-wrapper>
```

Also note that `<Component --foo="0" />` creates:
```html
<svelte-css-wrapper style="display: contents; --foo: 0;">...</svelte-css-wrapper>
```


