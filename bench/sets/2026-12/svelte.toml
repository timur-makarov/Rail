# svelte-04: Directive names containing ?. (use:obj?.act etc.) should compile as optional chaining on the resolved
# binding for state, props and stores.
# issue opened 2026-11-23, fix opened 2026-11-23, squash (or single commit); source files:
# packages/svelte/src/compiler/phases/3-transform/client/visitors/shared/utils.js,
# packages/svelte/src/compiler/phases/patterns.js, packages/svelte/src/compiler/phases/scope.js (22 lines); request
# from body (never edited).
# reading notes: filed by fixer; prose names the cause in parse_directive_name
[[situation]]
id = "svelte-04"
request = """
Directive names with `?.` like `use:obj?.act` are not compiled as optional chaining

### Describe the bug

A directive name with `?.`, like `use:obj?.act` or `transition:t?.fade`, compiles, but the compiler does not read it as optional chaining. `parse_directive_name` splits the name on `.`, so `obj?.act` becomes an identifier named `obj?` with a member `act`. The scope reference also uses `obj?`, so it never resolves to `obj`:

https://github.com/sveltejs/svelte/blob/985627872532ec8085f8298e0a69a0e3657fa701/packages/svelte/src/compiler/phases/3-transform/client/visitors/shared/utils.js#L223-L237

https://github.com/sveltejs/svelte/blob/985627872532ec8085f8298e0a69a0e3657fa701/packages/svelte/src/compiler/phases/scope.js#L1021-L1022

The output only looks right because the identifier `obj?` is printed as is, which gives `obj?.act`. This works for a plain `const`, but:

- with a reassigned `$state`, the output is `obj?.act` instead of `$.get(obj)?.act`, so the action silently does not run
- with a prop, the output is `obj?.act` instead of `$$props.obj?.act`, so it throws `ReferenceError: obj is not defined`
- with a store, `use:$store?.act` fails to compile with "`$store?` is an illegal variable name"
- `use:obj.a?.b` compiles to `obj['a?'].b`

The same happens for `transition:`, `in:`, `out:` and `animate:`.

### Reproduction

[Playground](https://svelte.dev/playground#H4sIAAAAAAAAE41S0W6DMAz8FSuaBEgI3hkwTf2MsYcUzJqKOlFiWCfEv08B2rUTlfqWOJfz3dmjIHlCkQltWGmSHdQHqUjRFyiCRlmsWQ0IHuVELFiq7ltRI7JWdg5j0aoOncg-RsE_xhP5gogvtO_GJG7Ajn1tLx1u1WtNjMROZCJ3tVWGy4oqViejLcPuoLoGWqtPECTpfFu_Bq8VeWCtyTGYTiqCAkaQNWcQkm4wgqJcTgnjmXdLIyggmP9kYCUFEUyeiDtkcCwZoYCX-RA-xzVjr1zRTNb2VPtEwaJDDiMYfbXiS4ML88w6TquEqaI8_YuA8kYN0DvMZnNviay5XJU3qgHSDLanPG3UUN6g5yYLetW2hV6C1ftjMT7n01htrjYnSMuK_ErgmUXGtscpfrAFt0O734N_Lw82wU9m9Eph8rPxOlzoc94OS--Pi_lF8Ib3e9mf0y8gdBDWBwMAAA)

```svelte
<!-- App.svelte -->
<script>
	import Child from './Child.svelte';

	const plain = { act: (node) => (node.textContent = 'const: ran') };
	let state = $state({ act: (node) => (node.textContent = 'state: ran') });
	function reset() {
		state = { act: () => {} };
	}
</script>

<div use:plain?.act>const: did not run</div>
<div use:state?.act>state: did not run</div>
<Child obj={{ act: (node) => (node.textContent = 'prop: ran') }} />
```

```svelte
<!-- Child.svelte -->
<script>
	let { obj } = $props();
</script>

<div use:obj?.act>prop: did not run</div>
```

Expected: all three show "ran". Actual: only the `const` one does, and the console shows `ReferenceError: obj is not defined`.

### Logs

```shell
ReferenceError: obj is not defined
```

