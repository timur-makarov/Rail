# svelte-16: A svelte-ignore ownership_invalid_mutation comment should silence the ownership warning for the
# assignment generated by a bind: directive.
# issue opened 2026-08-25, fix opened 2026-08-25, squash (or single commit); source files:
# packages/svelte/src/compiler/phases/3-transform/client/visitors/BindDirective.js (23 lines); request from body
