# svelte-20: Namespaced universal type selectors (ns|*, *|*) should compile, and print() should keep the namespace on
# ns|E selectors.
# issue opened 2026-08-20, fix opened 2026-08-20, squash (or single commit); source files:
# packages/svelte/src/compiler/phases/1-parse/read/style.js,
# packages/svelte/src/compiler/phases/3-transform/css/index.js, packages/svelte/src/compiler/print/index.js,
# packages/svelte/src/compiler/types/css.d.ts, packages/svelte/types/index.d.ts (26 lines); request from body (never
# edited).
# reading notes: two related asks both covered by tests; text names the parse-side fix and notes a new AST field is
# needed (field name not tested); small doubt: scoped output for ns|* pinned as svg|*.svelte-xyz rather than dropping
# the *
[[situation]]
id = "svelte-20"
request = """
Namespaced type selectors: `ns|*` fails to compile, and `print()` drops the namespace from `ns|E`

### Describe the bug

Namespaced type selectors are handled inconsistently. Two of the four forms fail to compile at all, and the two that do compile lose the namespace when printed.

Measured on 5.56.9, with the namespace properly declared:

| selector | `compile()` | `print()` |
| --- | --- | --- |
| `svg\\|circle` | preserved | **`circle`** |
| `*\\|circle` | preserved | **`circle`** |
| `svg\\|*` | **throws `css_expected_identifier`** | throws |
| `*\\|*` | **throws `css_expected_identifier`** | throws |
| `circle` | preserved | preserved |

So there are two separate problems here, and I've kept them apart below because I don't think they have the same fix.

**1. `ns|*` and `*|*` don't compile**

```svelte
<svg><circle /></svg>
<style>
	@namespace svg url(http://www.w3.org/2000/svg);
	svg|* { fill: red; }
</style>
```

`compile()` throws `css_expected_identifier`. This isn't `print()`-only — it fails an ordinary build. `ns|*` is a valid type selector in [CSS Namespaces 3](https://www.w3.org/TR/css3-namespace/#css-qnames); I cross-checked all four forms against `css-tree`, which accepts every one of them.

The cause looks like both namespace branches in `phases/1-parse/read/style.js` read the part after `|` with `read_identifier()`:

```js
// :208
} else if (parser.eat('*')) {
	let name = '*';
	if (parser.eat('|')) {
		// * is the namespace (which we ignore)
		name = read_identifier(parser);
	}

// :318
	let name = read_identifier(parser);
	if (parser.eat('|')) {
		// we ignore the namespace when trying to find matching element classes
		name = read_identifier(parser);
	}
```

`read_identifier()` can't return `*`, so `svg|*` and `*|*` are rejected while `svg|circle` and `*|circle` are fine.

**2. `print()` drops the namespace on the forms that do compile**

```js
import { parse, print } from 'svelte/compiler';

const src = '<style>@namespace svg url(http://www.w3.org/2000/svg); svg|circle { fill: red; }</style>';
print(parse(src, { modern: true })).code;
// <style>@namespace svg url(http://www.w3.org/2000/svg); circle { fill: red; }</style>
```

The `@namespace` rule survives, but the selector that used it doesn't, so the output declares a prefix nothing references and `circle` now matches circles in any namespace rather than SVG ones. `compile()` is unaffected and emits `svg|circle.svelte-119ptmz`, so this is the printer specifically — same shape as #18664, where `compile()` was fine and `print()` reconstructed the selector from the AST and lost something.

The reason it can't be fixed in `print/` alone is that both snippets above overwrite `name` with the post-`|` identifier, so `svg|circle` and `circle` produce identical AST nodes. The namespace isn't recoverable at print time; it would have to be kept at parse time.

I mentioned this at the end of #18664 and deliberately left it out of scope there. Since that one is now closed by #18667, I'm filing it separately rather than letting it drop.

### Reproduction

```js
import { compile, parse, print } from 'svelte/compiler';

const decl = '@namespace svg url(http://www.w3.org/2000/svg);';

// 1 — throws css_expected_identifier
compile(`<svg><circle /></svg><style>${decl} svg|* { fill: red; }</style>`);

// 2 — prints `circle`, losing the namespace
const src = `<style>${decl} svg|circle { fill: red; }</style>`;
print(parse(src, { modern: true })).code;
```

### Logs

```
CompileError: Expected a valid CSS identifier
https://svelte.dev/e/css_expected_identifier
```

### System Info

```
svelte 5.56.9, node 22.17.1
```

### Severity

annoyance

### Note on fixing it

Happy to send a PR, but the two halves pull in different directions and I'd rather ask first.

The compile failure is self-contained — accept `*` after `|` at both sites. On its own that's small.

The printer half needs the namespace stored on `TypeSelector`, which means a new field on a public AST node, and that's your call rather than mine. It also interacts with the first fix: once `svg|*` parses, whatever it stores decides whether `print()` can round-trip it, so doing the compile fix without deciding the AST shape would just move the data loss rather than remove it. If you'd rather have the parse fix alone first, that's easy to split out.

One more thing I noticed while checking: the `// * is the namespace (which we ignore)` comment at :208 describes the `*|E` case, but it sits in the branch reached after eating `*`, where `*` is the namespace only when a `|` follows. Not a bug, just slightly misleading if someone reads it while touching this."""
