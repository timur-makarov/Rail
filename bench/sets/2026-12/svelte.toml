`reset` from a destroyed `<svelte:boundary>` crashes with "Cannot read properties of null (reading 'r')"

### Describe the bug

If a `<svelte:boundary>` is destroyed while its error is still being handled, `onerror` still receives a `reset` function. Calling that `reset` later re-renders the boundary's children with a null component context. The first `bind:this` inside then throws `Cannot read properties of null (reading 'r')`.

SvelteKit hits this on every client navigation after a render error, if the layout renders `children` under `{#if page.error}`. Since kit#16296, SvelteKit's root boundary passes `(_, reset) => resetters.add(reset)` as `onerror` and calls every stored `reset` on the next navigation. When `page.error` flips the layout's `{#if}`, the branch holding the page boundary is destroyed, but its `reset` has already been stored. Each crash is then caught by a boundary that is still alive, which stores a new `reset`, so it happens again on every navigation.

`reset` runs `#run`, which sets the component context from `this.#effect.ctx` ([boundary.js#L376](https://github.com/sveltejs/svelte/blob/f90853565966bc0bab57c99fe7d669a91bef0f4c/packages/svelte/src/internal/client/dom/blocks/boundary.js#L376)). `destroy_effect` has already set that to null ([effects.js#L563](https://github.com/sveltejs/svelte/blob/f90853565966bc0bab57c99fe7d669a91bef0f4c/packages/svelte/src/internal/client/reactivity/effects.js#L563)). Neither `reset` nor the `onerror` call checks whether the boundary was destroyed ([boundary.js#L222-L257](https://github.com/sveltejs/svelte/blob/f90853565966bc0bab57c99fe7d669a91bef0f4c/packages/svelte/src/internal/client/dom/blocks/boundary.js#L222-L257)).

Adding `if ((this.#effect.f & DESTROYED) !== 0) return;` at the top of `reset` and before `onerror` is called fixes it in the repro. I'm happy to open a PR with that and a test.

