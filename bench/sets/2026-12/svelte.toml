# svelte-23: An effect teardown should see the value the effect ran with, not the value before the last of several
# writes in one flush.
# issue opened 2026-08-07, fix opened 2026-08-07, squash (or single commit); source files:
# packages/svelte/src/internal/client/reactivity/batch.js, packages/svelte/src/internal/client/reactivity/sources.js
# (9 lines); request from body (never edited).
# reading notes: filed by fixer; report says it was written with AI assistance; text names the cause (old_values
# overwritten per write)
[[situation]]
id = "svelte-23"
request = """
Wrong $state value in effect teardown when the state was written multiple times in one flush

### Describe the bug

When an `$effect` teardown reads a `$state` that was written **more than once** during the flush that destroys the effect, it receives a value that is neither the value the effect ran with, nor the current value — it is "the value from just before the *last* write", which is essentially arbitrary.

`old_values` (in `packages/svelte/src/internal/client/reactivity/sources.js`) is overwritten on **every** write in a flush:

```js
old_values.set(source, is_destroying_effect ? value : source.v);
```

and `get()` (in `runtime.js`) serves it to any read that happens while `is_destroying_effect` is true:

```js
if (is_destroying_effect && old_values.has(signal)) {
	return old_values.get(signal);
}
```

Since the map holds only one slot per source, the value handed to a teardown depends on how many writes happened before it in the same flush — not on what the effect actually saw.

I understand the "teardowns see old values" behaviour is intentional (#15469, and #18391/#18402 treat it as the contract). This report is not asking to change that contract — it is asking that the value served actually *be* the old value the effect ran with. Today it is not.

This silently breaks any teardown that has to pair up with its effect body — register/unregister, add/remove listener keyed by a value, acquire/release:

```svelte
<script>
	let value = $state('one');

	const registry = new Set();

	$effect(() => {
		registry.add(value);
		console.log(`register: ${value}`);

		return () => {
			registry.delete(value);
			console.log(`unregister: ${value}`);
		};
	});
</script>

<button onclick={() => {
	value = 'two';
	value = 'three';
}}>go</button>
```

Click the button once.

- The effect registered `'one'`.
- The teardown is handed **`'two'`** — a value the effect never observed, and not the current value (`'three'`) either.
- `registry.delete('two')` is a no-op, so `'one'` leaks in the registry forever.

Adding a fourth write (`value = 'four'`) to the handler changes the value handed to the teardown to `'three'` — it is purely a function of write count.

With a single write in the handler everything pairs up correctly, which is why this goes unnoticed until a handler happens to touch the same source twice.

I intend to submit a PR for this.

### Real-world impact

This was found via a reference-counting scroll lock: a module-scope `$state` counter incremented in effect bodies and decremented in the teardowns. When one effect's teardown runs in the same flush as other effects' increments, the teardown applies its decrement to a stale count and the counter permanently drifts, so the lock is never released (`document.body` stays `overflow: hidden` on iOS Safari). That scenario also involves the "teardowns see old values" contract itself, so I will follow it up as a comment in #16019 instead of here.

### Workaround

Snapshot the state into a local `const` in the effect body, and have the teardown use the snapshot instead of re-reading the state (REPL: https://svelte.dev/playground/e966296fb0b4435d9c8f78d77f3f9299?version=5.56.8):

```svelte
$effect(() => {
	const v = value; // snapshot — the teardown must not re-read `value`
	registry.add(v);
	return () => {
		registry.delete(v);
	};
});
```

The teardown then always deletes exactly what the effect added.

### Related

- #15469 introduced `old_values` (teardowns read pre-write values). This report accepts that contract; it only points out that the stored value is not well-defined when a source is written more than once per flush.
- #16019 / #16140 debate whether the contract itself should change — orthogonal to this. (I read the whole #16019 thread: multiple writes per flush are not discussed there.)
- #17375 is a closely related open report (stale `$state` in `onDestroy`); the mechanism is the same `old_values` map.
- #18391 / #18402 concern `old_values.clear()` being called too early; also the same map, different failure mode.

*Note: English is not my first language, so I used AI assistance to write this report. The reproductions and logs are from real runs that I verified myself.*

### Reproduction

https://svelte.dev/playground/bb8ba4d8027d4f6f8682df63c12c2ddd?version=5.56.8

Same code as in the description; click "go" once and check the console (logs in the Logs field below). The page also shows the leaked key: `still registered after unregister: one`.

Note: the reproduction deliberately renders the state with plain text interpolation. Putting it behind an `{#if}` makes the bug disappear, because a block effect lands in `eager_block_effects` and `flush_queued_effects` then calls `old_values.clear()` mid-flush (that early clear is #18391's territory).

Also reproduces as a `runtime-runes` test in the repo (included in the PR), so it is not browser-specific.

### Logs

```shell
Actual, on 5.56.8 and `main` (one click):


register: one
unregister: two   <-- expected `one`; `one` is never unregistered
register: three


Expected:


register: one
unregister: one
register: three
```

### System Info

```shell
System:
    OS: macOS 15.7.8
    CPU: (16) arm64 Apple M3 Max
    Memory: 316.00 MB / 64.00 GB
    Shell: 5.9 - /bin/zsh
  Binaries:
    Node: 24.5.0 - /Users/yuki/.nvm/versions/node/v24.5.0/bin/node
    npm: 11.5.1 - /Users/yuki/.nvm/versions/node/v24.5.0/bin/npm
    pnpm: 10.33.4 - /Users/yuki/.nvm/versions/node/v24.5.0/bin/pnpm
  Browsers:
    Chrome: 151.0.7922.76
    Firefox: 133.0.3
    Safari: 26.6
  npmPackages:
    svelte: workspace:^ => 5.56.8

(reproduced on 5.53.7, 5.56.8 and `main` @ 44a7813)
```

### Severity

annoyance"""
