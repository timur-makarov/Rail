# svelte-06: A comment before a parenthesized template expression should appear in the inner expression's
# leadingComments in the modern AST.
# issue opened 2026-11-23, fix opened 2026-11-23, squash (or single commit); source files:
# packages/svelte/src/compiler/phases/1-parse/acorn.js,
