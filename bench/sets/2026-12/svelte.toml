# svelte-08: Replacing Svelte Flow nodes from an effect right after first measurement should not leave them hidden
# (regression from #18508 effect ordering).
# issue opened 2026-10-30, fix opened 2026-10-30, squash (or single commit); source files:
# packages/svelte/src/internal/client/reactivity/batch.js (10 lines); request from body (never edited).
# reading notes: PR by triage bot; repro needs @xyflow/svelte; test is an internal signals unit test of effect tree
# order using APIs that existed before
[[situation]]
id = "svelte-08"
request = """
Regression in 5.57.1 (#18508): Svelte Flow nodes stay hidden after the nodes array is replaced from an effect

### Describe the bug

Since 5.57.1, replacing the `nodes` of a `@xyflow/svelte` flow from an `$effect` right after the first measurement leaves every node at `visibility: hidden` for good. The page shows an empty canvas, and edges don't render.

New node objects without `measured` make Svelte Flow forget the node's size. It then relies on an `$effect` in its `NodeWrapper` to observe the node again:

```js
$effect(() => {
  if (resizeObserver && (!isInitialized || nodeRef !== prevNodeRef)) {
    prevNodeRef && resizeObserver.unobserve(prevNodeRef);
    nodeRef && resizeObserver.observe(nodeRef);
    prevNodeRef = nodeRef;
  }
});
```

On 5.57.0 the ResizeObserver fires a second time after the replacement, and the node becomes visible. On 5.57.1 it fires only once, before the replacement, so the node is never measured again. My reading is that this effect no longer re-runs when `isInitialized` goes back to `false`, but I haven't confirmed that inside Svelte.

I bisected it to ce89035ecb, "fix: prevent effect tree of batches from interfering with each other" (#18508). Its parent, d16099ef0, works. I bisected by swapping `packages/svelte/src` from each commit into an installed 5.57.1. `main` at fe21fce01 (2026-10-29) still fails.

### Reproduction

`@xyflow/svelte` 1.7.0, Vite 8, no SvelteKit, `experimental.async` off.

`App.svelte`:

```svelte
<script>
  import { SvelteFlow } from '@xyflow/svelte';
  import '@xyflow/svelte/dist/style.css';
  import Relayout from './Relayout.svelte';

  const layout = () => [{ id: 'a', position: { x: 100, y: 100 }, data: { label: 'A' } }];

  let nodes = $state.raw(layout());
</script>

<div style="width: 100vw; height: 100vh">
  <SvelteFlow bind:nodes>
    <Relayout onmeasured={() => (nodes = layout())} />
  </SvelteFlow>
</div>
```

`Relayout.svelte`, which must be a child of `<SvelteFlow>` to read its context:

```svelte
<script>
  import { useNodesInitialized } from '@xyflow/svelte';

  let { onmeasured } = $props();
  const nodesInitialized = useNodesInitialized();
  let done = false;

  $effect(() => {
    if (!nodesInitialized.current || done) return;
    done = true;
    onmeasured();
  });
</script>
```

`vite.config.js` needs `optimizeDeps: { exclude: ['@xyflow/svelte'] }`, because the package ships uncompiled `.svelte` files.

Run the dev server and inspect `.svelte-flow__node`:

| svelte | node |
|---|---|
| 5.57.0 | `visibility: visible` |
| 5.57.1 | `visibility: hidden` |
| 5.57.3 | `visibility: hidden` |

Replacing `nodes` from a `setTimeout` (500 ms) instead of the effect works on 5.57.1. The replacement has to happen in the flush where the first measurement lands.

### Logs

None. No errors or warnings in the console.

### System Info

