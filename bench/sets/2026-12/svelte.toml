[[situation]]
id = "svelte-16"
request = """
`svelte-ignore ownership_invalid_mutation` has no effect on a `bind:` directive

### Describe the bug

`svelte-ignore ownership_invalid_mutation` works for a write I can put the comment above. It does nothing for the assignment a `bind:` generates.

```svelte
<script>
  let { item } = $props();

  function rename() {
    // svelte-ignore ownership_invalid_mutation
    item.heading = 'renamed'; // silent
  }
</script>

<button onclick={rename}>rename</button>

<!-- svelte-ignore ownership_invalid_mutation -->
<input bind:value={item.heading} /> <!-- still warns -->
```

I tried four placements for the input. Directly above it, above a wrapping element, inside the wrapping element, and above `<script>`. All four still warn. Compiling and counting `ownership_validator.mutation` call sites says the same thing, one site for the binding and none for the handler.

This looks structural rather than a placement I got wrong. `is_ignored` looks the node up in `ignore_map`, which the parser fills, and the assignment behind a `bind:` is built during transform, so the parser never saw it.

