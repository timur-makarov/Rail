# svelte-02: Flushing many effects that write state should take linear, not quadratic, time (regression since 5.58.1
# from rescanning batch writes).
# issue opened 2026-11-23, fix opened 2026-11-23, squash (or single commit); source files:
# packages/svelte/src/internal/client/reactivity/batch.js (46 lines); request from body (never edited).
# reading notes: PR by triage bot; text suggests the approach (record writes as they happen); perf test counts
# iterations over Batch.ensure().current, which existed before, so a fix that keeps that Map is assumed
[[situation]]
id = "svelte-02"
request = """
Mounting many components that write state after mount is quadratic since 5.58.1 (flush_queued_effects rescans batch writes)

### Describe the bug

Since 5.58.1, mounting many legacy-mode components that each write state after mount (for example `bind:this` on an exported prop, as carbon-components-svelte's `Tag` and `Checkbox` do) takes quadratic time.

The cause appears to be the loop added to `flush_queued_effects` in #19030 (`packages/svelte/src/internal/client/reactivity/batch.js`; it is still on `main`):

    if (write_version !== version && current_batch !== null) {
    	for (const [value, write] of current_batch.current) {
    		if (write.wv > version) (earlier_writes ??= new Map()).set(value, write);
    	}
    }

After every effect that writes, this scans every write in the batch so far, so N writing effects in one flush cost O(N²). In a CPU profile at N = 16000, 78% of samples on 5.58.1 are self time in `flush_queued_effects`. On 5.58.0 it isn't among the top five functions.

In our app, a page that renders 2,101 table rows (each a Carbon `Checkbox` and up to 12 `Tag`s) went from about 7.5 s to 22 s on 5.58.1, and to 24 s on 5.59.1.

A possible fix is to record writes as they happen instead of rescanning `current_batch.current`.



### Reproduction

`Child.svelte`

    <script>
      export let ref = null;
    </script>

    <span bind:this={ref}></span>

`App.svelte`

    <script>
      import { flushSync } from 'svelte';
      import Child from './Child.svelte';

      let n = 0;
      let count = 16000;
      let result = '';

      function render() {
        n = 0;
        flushSync();
        const start = performance.now();
        n = count;
        flushSync();
        result = `${count} children: ${Math.round(performance.now() - start)} ms`;
      }
    </script>

    <input type="number" bind:value={count} />
    <button on:click={render}>render</button>
    <p id="result">{result}</p>

    {#each Array(n) as _}
      <Child />
    {/each}

Median mount time in ms (`mount` + `flushSync`, production build, headless Chromium, 3 runs):

| N | 5.58.0 | 5.58.1 | 5.59.1 |
|---|---:|---:|---:|
| 1000 | 19 | 32 | 41 |
| 4000 | 30 | 85 | 97 |
| 16000 | 78 | 798 | 972 |
| 32000 | 159 | 4514 | 4865 |

From 16000 to 32000, time doubles on 5.58.0 and grows about 5.7× on 5.58.1. A plain `$:` local assignment without `bind:this` shows no regression on its own, but it adds to the cost when combined with `bind:this`.



### Logs

```shell

```

### System Info

```shell
### System Info

svelte 5.58.0 (good), 5.58.1 and 5.59.1 (bad); Chromium (Playwright), Linux
```

### Severity

blocking an upgrade"""
start = "c987f7247d43cf8b111e85eab88ae2eef637dd50"
fix = "d9f33ed2c57adefd1ea051261366bd0bb0c2f12d"
hidden_tests = ["packages/svelte/tests/signals/batch.test.ts", "packages/svelte/tests/signals/test.ts"]
closed = 2026-11-24
kind = "wrong-result"
half = "work"
