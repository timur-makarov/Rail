# reading notes: filed by fixer; parser fixture also pins trailingComments placement for comments after parentheses
# and a bind_invalid_parens/svelte-ignore follow-on, small doubt
[[situation]]
id = "svelte-06"
request = """
A comment before a parenthesized template expression is not in its leadingComments

### Describe the bug

In `{/* a */ (value)}`, the comment is not in the `leadingComments` of the expression. It is only in the root `comments`. Without the parentheses, `{/* a */ value}`, the comment is in `leadingComments`.

The comment is attached to the `ParenthesizedExpression`, and `remove_parens` returns the inner node without it:

https://github.com/sveltejs/svelte/blob/90ad4e870c72aa76db35ecc7e46f0b027ffe175a/packages/svelte/src/compiler/phases/1-parse/acorn.js#L172-L178

Tools that read comments from the AST lose it. prettier-plugin-svelte 4.2.0 formats `{/* a */ (value)}` to `{value}`, and svelte-eslint-parser gets a broken AST (sveltejs/svelte-eslint-parser#1083).

I tried moving the comments of the `ParenthesizedExpression` to the inner node in `remove_parens`. svelte-eslint-parser then works, but prettier-plugin-svelte formats `{/* a */ (value)}` to `{/* a */ (value}`, so that change alone is not enough.

### Reproduction

```js
import { parse } from 'svelte/compiler';

for (const source of ['{/* a */ value}', '{/* a */ (value)}']) {
	const ast = parse(source, { modern: true });
	console.log(
		source,
		ast.fragment.nodes[0].expression.leadingComments,
		ast.comments.map((c) => c.value)
	);
}
```

```
{/* a */ value} [ { type: 'Block', value: ' a ', start: 1, end: 8 } ] [ ' a ' ]
{/* a */ (value)} undefined [ ' a ' ]
```

### Logs

```shell
-
```

