# typescript-eslint-11: no-unnecessary-type-parameters should count uses in a mapped type's constraint even when
# TypeScript has cached the template type.
# issue opened 2026-09-28, fix opened 2026-09-28, squash (or single commit); source files:
# packages/eslint-plugin/src/rules/no-unnecessary-type-parameters.ts (28 lines); request from oldest of 2 edit
