### Additional Info

`parseRegExpText` is passed `flags.includes('u')`, so a pattern with only the `v` flag is parsed in non-Unicode mode, where `\\p` is a plain `p`.
Passing `unicodeSets: flags.includes('v')` to `regexpp.parsePattern` fixes it. I [have a proposed fix with tests ready](https://github.com/typescript-eslint/typescript-eslint/compare/main...JacobLey:fix/prefer-string-starts-ends-with-v-flag?expand=1) if this is accepting PRs.

