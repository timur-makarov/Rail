    "allowJs": true,
    "strictNullChecks": true
  }
}
```

### Expected Result

The rule should still report the WeakMap spread (`{ ...weakMap }`, message: `noMapSpreadInObject`), since spreading a WeakMap into an object also produces an empty object, same as with Map.

However, it should not offer the `Object.fromEntries(...)` suggestion for WeakMap, since WeakMap is not iterable. Applying that suggestion produces `Object.fromEntries(weakMap)`, which throws `TypeError: object is not iterable` at runtime.

So for this case, I'd expect the report to remain, but the `Object.fromEntries(weakMap)` suggestion to be omitted.

### Actual Result

The rule reports the WeakMap spread with `noMapSpreadInObject`, but also offers the `replaceMapSpreadInObject` suggestion ("Replace map spread in object with `Object.fromEntries()`").

The suggested replacement is `const result = Object.fromEntries(weakMap);`. This does not type-check because WeakMap is not iterable. TypeScript reports `TS2769: No overload matches this call.`

The suggested code would also throw `TypeError: object is not iterable` at runtime.

### Additional Info

This appears to come from `no-misused-spread` treating `WeakMap` together with `Map` and `ReadonlyMap` when generating the `Object.fromEntries(...)` suggestion.

The report itself seems correct, since spreading a WeakMap into an object also produces an empty object. The suggestion should likely use a narrower check that excludes WeakMap, because WeakMap is not iterable."""
