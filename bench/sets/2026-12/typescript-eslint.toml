### Playground Link

https://typescript-eslint.io/play/#ts=6.0.3&fileType=.ts&code=E4UwLgrsB2AEDGB7aBnRAbEA6diDmAFAOQBmiiRAlANwBQQA&eslintrc=N4KABGBEBOCuA2BTAzpAXGUEKQAIBcBPABxQGNoBLY-AWhXkoDt8B6Jge1oFtLlZkiACa1i0Dr0GoMkRNHHRI4MAF8QKoA&tsconfig=N4KABGBEDGD2C2AHAlgGwKYCcDyiAuysAdgM6QBcYoEEkJemy0eAcgK6qoDCAFutAGsylBm3TgwAXxCSgA&tokens=false

### Repro Code

```TypeScript
return console.log('foo');
```

### ESLint Config

```javascript
module.exports = {
  parser: "@typescript-eslint/parser",
  rules: {
    "@typescript-eslint/no-misused-promises": "error",
  },
};
```

### tsconfig

```jsonc
{
  "compilerOptions": {
    "strictNullChecks": true
  }
}
```

### Expected Result

No report from the rule. A `return` that is not inside a function has no enclosing
signature, so there is nothing for the returned value to be misused against.

### Actual Result

The rule throws and ESLint reports an internal error:

```
Non-null Assertion Failed: Expected node to have a parent.
Occurred while linting /input.ts:1
Rule: "@typescript-eslint/no-misused-promises"
```

### Additional Info

`checkReturnStatement` walks up from the `return` looking for the function it belongs to,
then asserts that it found one:

https://github.com/typescript-eslint/typescript-eslint/blob/aa51fc617bfb71fe9002768f39ea7de5db9b8a82/packages/eslint-plugin/src/rules/no-misused-promises.ts#L623-L630

At `Program` level the walk ends at `undefined`, and `nullThrows` turns that into a crash.
The assertion is checking an invariant that does not hold: a `return` can appear with no
function above it. `node.parent` itself is always present here, so the message is also
misleading about what went wrong.

This is reachable from code that is not a mistake. Top-level `return` is legal in a
CommonJS module, and it crashes under `sourceType: "commonjs"` too:

```js
// guard.js, linted with sourceType: "commonjs"
if (!process.env.ENABLED) {
}
return (module.exports = {});
```

That file runs fine under Node. I checked `module`, `script` and `commonjs` source types
and all three crash. `return;` with no argument is fine, since the rule returns early when
there is no argument.

I found this by running every rule in the plugin over the code snippets in this repo's own
rule tests; three of them contain a bare top-level `return` and each one triggers it.
`no-misused-promises` is the only rule with this shape — it is the single place that walks
upward for an enclosing function and then asserts the result is non-null.

Happy to send a PR: returning early when no enclosing function is found leaves the rest of
the check untouched."""
