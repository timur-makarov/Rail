### Repro Code

```TypeScript
const key = {};
const weakMap = new WeakMap([[key, "value"]]);

const result = { ...weakMap };
```

### ESLint Config

```javascript
module.exports = {
  parser: "@typescript-eslint/parser",
  parserOptions: {
    project: true,
  },
  rules: {
    "@typescript-eslint/no-misused-spread": "error",
  },
};
```

### tsconfig

