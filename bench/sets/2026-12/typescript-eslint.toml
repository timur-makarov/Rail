# typescript-eslint: typescript-eslint/typescript-eslint, typescript, proposed project of set 2026-12 (fulltest PLAN sections 3 and 4).
# Settings: written by reading the project's CI and docs at the oldest and newest start commit, nothing run;
# every command marked `unverified` is for the admission session to try and fix. Notes: notes/typescript-eslint.md.
# Situations: every candidate of bench-candidates/typescript-eslint.toml (REPORT-window-rule.md, 2026-11-26), in its order,
# all 32 of them.
# half is `work` for every candidate until the split after admission and the hardness runs (cloud/README.md).
# hidden_tests: the fix's changed files (start..fix, compare API) that match [project] tests or the travel
# globs ["packages/ast-spec/src/**/fixtures/**", "packages/*/tests/**/__snapshots__/*.snap", "packages/*/tests/**/*.shot", "packages/*/tests/fixtures/**", "packages/eslint-plugin/tests/schema-snapshots/*.shot", "packages/eslint-plugin/tests/docs-eslint-output-snapshots/*.shot"],
# and not ["packages/*/src/rules/*.ts", "packages/*/src/util/*.ts", "packages/*/docs/**"]; deleted files left out.
# self_filed: the issue's author opened the fix. bot_filed: the issue's author is an automation account
# (a login ending in bot or -ci, or turso-github-handyman, roboturso). security_trap: the reading pass's
# flag for a request whose natural fix invites a flaw. kind race is the race flag.

# typescript-eslint/typescript-eslint: per-project settings for Rail's bench (no [[situation]] tables here).
# Start commits read: newest aac759c23dc3c66e607ee498884e161c24440f3a (typescript-eslint-01, pnpm 12.20.0, nx 23.3.0,
# vitest 5.0.3) and oldest dd020578ed417b844b1d03a70be42a126d51cbb5 (typescript-eslint-32, pnpm 10.33.0, nx 22.3.3,
# vitest 4.0.18). See typescript-eslint.md for what was read and the traps.

[project]
name = "typescript-eslint"
repo = "https://github.com/typescript-eslint/typescript-eslint"
language = "typescript"
package = "@typescript-eslint/eslint-plugin"
# Every file under a package's tests/ folder: vitest test files, plus fixtures, .shot/.snap snapshots and the tracked
# packages/type-utils/tests/fixtures/node_modules fixture. ast-spec's fixture folders live under src/ and are in
# typescript-eslint.travel.json "travel" instead.
tests = ["packages/*/tests/**", "tools/scripts/*.test.mts"]
clash = "path"
# .nx holds nx's local task cache and workspace data (gitignored at both start commits).
build_dirs = [".nx"]

[commands]
# from: .github/actions/prepare-install/action.yml@aac759c2 (pnpm install --frozen-lockfile [--trust-lockfile], HUSKY=0,
#       SKIP_POSTINSTALL=true), tools/scripts/postinstall.mts@aac759c2 (what the skipped postinstall does: husky, clean,
#       build, nx typecheck ast-spec), .github/workflows/ci.yml@aac759c2 (build job: nx run-many --target=build
#       --parallel --exclude=website --exclude=website-eslint)
# unverified: installing the pinned pnpm with npm into $BENCH_CACHE and --store-dir are this bench's own choices; the
#       final "nothing left untracked" check is ours too.
setup = '''
set -euo pipefail
pm=$(node -p 'require("./package.json").packageManager.split("@")[1].split("+")[0]')
P="$BENCH_CACHE/pnpm/$pm"
if [ ! -f "$P/.ok" ]; then
  rm -rf "$P"
  mkdir -p "$P"
  npm_config_cache="$BENCH_CACHE/npm-cache" npm install -g --prefix "$P" --no-audit --no-fund "pnpm@$pm"
  touch "$P/.ok"
fi
export PATH="$P/bin:$PATH"
echo "pnpm $(pnpm --version | tail -n 1) (pinned $pm)"
trust=""
if grep -q -- '--trust-lockfile' .github/actions/prepare-install/action.yml 2>/dev/null; then trust="--trust-lockfile"; fi
pnpm install --frozen-lockfile $trust --store-dir "$BENCH_CACHE/pnpm-store"
node node_modules/nx/bin/nx.js run-many -t build --exclude=website,website-eslint --parallel=4
node node_modules/nx/bin/nx.js run ast-spec:typecheck
left=$(git status --porcelain)
if [ -n "$left" ]; then
  echo "setup left changes that git does not ignore:" >&2
  echo "$left" >&2
  exit 1
fi
'''

# from: .github/workflows/ci.yml@aac759c2 (plugin_unit_tests / unit_tests: `pnpm exec nx test PKG -- ARGS` with CI=true;
#       nx.json@aac759c2 targetDefaults.test dependsOn ^build; ast-spec, utils and typescript-eslint package.json nx
#       test dependsOn typecheck), packages/*/vitest.config.mts@aac759c2 and @dd020578,
#       packages/ast-spec/tests/fixtures.test.ts@aac759c2 (one test file runs every src/**/fixtures/*/fixture.ts),
#       docs/contributing/Local_Development.mdx@aac759c2 ("packages generally depend on each other's built outputs")
# unverified: CI runs vitest through nx; here nx only builds (build all but the website, as CI's build job, then the
#       typecheck target where the test target depends on it) and vitest runs directly in the package folder with the
#       package's config, which is what the @nx/vitest test target does. The mapping of fixtures and snapshots to the
#       test file that reads them is ours.
test_files = '''
set -euo pipefail
pm=$(node -p 'require("./package.json").packageManager.split("@")[1].split("+")[0]')
export PATH="$BENCH_CACHE/pnpm/$pm/bin:$PATH"
root="$PWD"
declare -A run=()
for f in {files}; do
  case "$f" in
    packages/ast-spec/src/*/fixtures/*|packages/ast-spec/tests/*.shot)
      t=packages/ast-spec/tests/fixtures.test.ts ;;
    packages/scope-manager/tests/fixtures/*)
      t=packages/scope-manager/tests/fixtures.test.ts ;;
    packages/eslint-plugin/tests/schema-snapshots/*)
      t=packages/eslint-plugin/tests/schemas.test.ts ;;
    packages/eslint-plugin/tests/docs-eslint-output-snapshots/*)
      t=packages/eslint-plugin/tests/docs.test.mts ;;
    packages/*/__snapshots__/*.snap)
      t="${f%/__snapshots__/*}/$(basename "$f" .snap)" ;;
    packages/*/tests/fixtures/*)
      continue ;;
    packages/*/tests/*.test.ts|packages/*/tests/*.test.tsx|packages/*/tests/*.test.mts|packages/*/tests/*.test.cts|packages/*/tests/*.test-d.ts|tools/scripts/*.test.mts)
      t="$f" ;;
    *)
      continue ;;
  esac
  if [ ! -f "$t" ]; then echo "no test file $t (for $f)" >&2; exit 2; fi
  case "$t" in
    tools/*) d=tools ;;
    *) d="${t#packages/}"; d="packages/${d%%/*}" ;;
  esac
  run[$d]+="${t#$d/}"$'\n'
done
if [ "${#run[@]}" -eq 0 ]; then echo "no runnable test file in the list" >&2; exit 2; fi
node node_modules/nx/bin/nx.js run-many -t build --exclude=website,website-eslint --parallel=4
tc=""
for d in "${!run[@]}"; do
  case "$d" in packages/ast-spec|packages/utils|packages/typescript-eslint) tc="$tc${tc:+,}${d#packages/}" ;; esac
done
if [ -n "$tc" ]; then node node_modules/nx/bin/nx.js run-many -t typecheck --projects="$tc" --parallel=4; fi
status=0
for d in $(printf '%s\n' "${!run[@]}" | sort); do
  mapfile -t rel < <(printf '%s' "${run[$d]}" | sort -u)
  ( cd "$d" && CI=true node "$root/node_modules/vitest/vitest.mjs" run --config vitest.config.mts "${rel[@]}" ) || status=1
done
exit "$status"
'''

# from: same as test_files; package "." runs the repo's own tools tests (package.json@aac759c2 nx target repo:test,
#       tools/vitest.config.mts; absent at dd020578, then nothing runs). website, website-eslint and integration-tests
#       are left out: root package.json "test" excludes them (integration-tests packs and installs packages).
# unverified: same as test_files.
test_package = '''
set -euo pipefail
pm=$(node -p 'require("./package.json").packageManager.split("@")[1].split("+")[0]')
export PATH="$BENCH_CACHE/pnpm/$pm/bin:$PATH"
p={package}
if [ "$p" = . ]; then
  if [ -f tools/vitest.config.mts ]; then
    CI=true node node_modules/vitest/vitest.mjs run --config tools/vitest.config.mts
  else
    echo "no repo-level tests at this commit"
  fi
  exit 0
fi
case "$p" in
  website|website-eslint|integration-tests|tseslint.com) echo "package $p: no offline unit tests"; exit 0 ;;
esac
if [ ! -f "packages/$p/vitest.config.mts" ] || [ ! -d "packages/$p/tests" ]; then echo "package $p has no tests"; exit 0; fi
node node_modules/nx/bin/nx.js run-many -t build --exclude=website,website-eslint --parallel=4
case "$p" in ast-spec|utils|typescript-eslint) node node_modules/nx/bin/nx.js run "$p:typecheck" ;; esac
cd "packages/$p"
CI=true node ../../node_modules/vitest/vitest.mjs run --config vitest.config.mts
'''

package_of = 'regex:^packages/([^/]+)/'

# from: CI job log 139326381044 (run 45648489702, 2026-11-25, vitest 5, coloured):
#       " FAIL   eslint-plugin  tests/schemas.test.ts > Rule schemas ... > consistent-type-assertions"; with NO_COLOR
#       vitest prints the project label as "|eslint-plugin|" (packages/vitest/src/node/reporters/renderers/utils.ts
#       formatProjectName, base.ts line ` FAIL  ${projectName}${name}`). A suite-level failure is
#       " FAIL  |p| tests/x.test.ts [ tests/x.test.ts ]".
failed = '^ FAIL +(\S.*?)\s*$'
timeout_minutes = 25

[commands.env]
BASH_DEFAULT_TIMEOUT_MS = "1800000"
BASH_MAX_TIMEOUT_MS = "7200000"
NO_COLOR = "1"
npm_config_manage_package_manager_versions = "false"
pnpm_config_pm_on_fail = "ignore"
COREPACK_ENABLE_STRICT = "0"
COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"
PUPPETEER_SKIP_DOWNLOAD = "1"
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
SKIP_SIMPLE_GIT_HOOKS = "1"
HUSKY = "0"
SKIP_POSTINSTALL = "true"
NX_DAEMON = "false"
NX_NO_CLOUD = "true"
NX_TUI = "false"

[rail.config.commands]
# unverified: the bench's own way to make a new worktree testable offline (COMMON.md decision 5): hard-link copies of
#       the main checkout's node_modules (root and packages/*), real copies of the build outputs (dist folders and
#       packages/types/src/generated, the ast-spec types the types build copies in); the next build is incremental.
#       Fallback when the main checkout has no node_modules: an offline pnpm install from $BENCH_CACHE plus a build.
setup = '''
set -euo pipefail
main="$(cd "$(git rev-parse --path-format=absolute --git-common-dir)/.." && pwd -P)"
here="$(pwd -P)"
pm=$(node -p 'require("./package.json").packageManager.split("@")[1].split("+")[0]')
export PATH="$BENCH_CACHE/pnpm/$pm/bin:$PATH"
if [ "$main" = "$here" ]; then
  if [ ! -d node_modules ]; then echo "the main checkout has no node_modules" >&2; exit 1; fi
  exit 0
fi
if [ -d "$main/node_modules" ]; then
  for d in $(cd "$main" && printf '%s\n' node_modules packages/*/node_modules); do
    if [ -d "$main/$d" ] && [ ! -e "$d" ] && [ -d "$(dirname "$d")" ]; then cp -al "$main/$d" "$d"; fi
  done
  for d in $(cd "$main" && printf '%s\n' dist packages/*/dist packages/types/src/generated); do
    if [ -d "$main/$d" ] && [ ! -e "$d" ] && [ -d "$(dirname "$d")" ]; then cp -a "$main/$d" "$d"; fi
  done
else
  trust=""
  if grep -q -- '--trust-lockfile' .github/actions/prepare-install/action.yml 2>/dev/null; then trust="--trust-lockfile"; fi
  pnpm install --offline --frozen-lockfile $trust --store-dir "$BENCH_CACHE/pnpm-store"
  node node_modules/nx/bin/nx.js run-many -t build --exclude=website,website-eslint --parallel=4
fi
'''
# from: .github/workflows/ci.yml@aac759c2 (check-format = prettier --check; build job; `nx show projects --affected
#       --withTarget=test` picks the test jobs), root package.json@aac759c2 "test" (excludes integration-tests, website,
#       website-eslint)
# unverified: format check limited to changed files, `nx show projects --affected --files=...` instead of --base/--head
#       (so uncommitted and untracked files count), and the per-package vitest runs are ours.
verify = '''
set -euo pipefail
pm=$(node -p 'require("./package.json").packageManager.split("@")[1].split("+")[0]')
export PATH="$BENCH_CACHE/pnpm/$pm/bin:$PATH"
base="${RAIL_BASE:-refs/heads/main}"
mapfile -t changed < <( { git diff --name-only "$base" --; git ls-files --others --exclude-standard; } | grep -v -e '^\.rail/' -e '^\.claude/' | sort -u || true )
existing=()
for f in "${changed[@]}"; do if [ -f "$f" ]; then existing+=("$f"); fi; done
if [ "${#existing[@]}" -gt 0 ]; then node node_modules/prettier/bin/prettier.cjs --check --ignore-unknown "${existing[@]}"; fi
node node_modules/nx/bin/nx.js run-many -t build --exclude=website,website-eslint --parallel=4
if [ "${#changed[@]}" -eq 0 ]; then echo "no change against $base: format and build only"; exit 0; fi
csv=$(IFS=,; echo "${changed[*]}")
aff=$(node node_modules/nx/bin/nx.js show projects --affected --files="$csv" --withTarget=test)
echo "affected projects with tests: $(echo $aff)"
status=0
for p in $aff; do
  case "$p" in website|website-eslint|integration-tests) continue ;; esac
  if [ "$p" = repo ]; then
    if [ -f tools/vitest.config.mts ]; then CI=true node node_modules/vitest/vitest.mjs run --config tools/vitest.config.mts || status=1; fi
    continue
  fi
  if [ ! -f "packages/$p/vitest.config.mts" ] || [ ! -d "packages/$p/tests" ]; then continue; fi
  case "$p" in ast-spec|utils|typescript-eslint) node node_modules/nx/bin/nx.js run "$p:typecheck" || { status=1; continue; } ;; esac
  ( cd "packages/$p" && CI=true node ../../node_modules/vitest/vitest.mjs run --config vitest.config.mts ) || status=1
done
exit "$status"
'''
timeout_secs = 1800
setup_timeout_secs = 900
verify_timeout_secs = 1800

# The bench's additions, the same for every project file of this set:
# - [commands] env BASH_DEFAULT_TIMEOUT_MS and BASH_MAX_TIMEOUT_MS: the Bash tool limits Rail's own
#   .claude/settings.json gives its worker, given to every child, so a plain arm's Bash tool is not cut at
#   two minutes while Rail's runs for thirty.
# - [rail.config.worker] ladder: the Rail arm of the first run (PLAN section 6, owner 2026-11-25): Sonnet 5.5
#   medium, then Opus 5.5 medium. It sits here because an arm file can give only one rung (bench/arms.py);
#   person_ladder and contract stay as Rail's seed has them.
# - [rail.config.claim] stale_minutes: above the longest Rail command's limit plus save_minutes (10), as
#   `rail docs config` asks.
[rail.config.worker]
ladder = ["claude-sonnet-5-5:medium", "claude-opus-5-5:medium"]

[rail.config.claim]
stale_minutes = 45

# typescript-eslint-01: The array-type autofix should parenthesize readonly X[] when ReadonlyArray<X> is the object of
# an indexed access type, instead of producing invalid or changed types.
# issue opened 2026-10-19, fix opened 2026-10-26, squash (or single commit); source files:
# packages/eslint-plugin/src/rules/array-type.ts (6 lines); request from body (never edited).
# reading notes: Tests also cover Readonly<X[]>[number], a natural extension.
[[situation]]
id = "typescript-eslint-01"
request = """
Bug: [array-type] autofix can produce invalid TS code

### Before You File a Bug Report Please Confirm You Have Done The Following...

- [x] I have tried restarting my IDE and the issue persists.
- [x] I have updated to the latest version of the packages.
- [x] I have [searched for related issues](https://github.com/typescript-eslint/typescript-eslint/issues?q=is%3Aissue+label%3A%22package%3A+eslint-plugin%22) and found none that matched my issue.
- [x] I have [read the FAQ](https://typescript-eslint.io/linting/troubleshooting) and my problem is not listed.
- [x] If I used AI assistance to prepare this issue, I have reviewed and followed the [AI Contribution Policy](https://typescript-eslint.io/contributing/ai-policy/).

### Playground Link

https://typescript-eslint.io/play/#ts=5.9.2&showAST=es&fileType=.tsx&code=C4TwDgpgBAGlC8UDeAoKUCWATAXFAzsAE4YB2A5igL4q0D0dUARgK7kA0mpAbgIYA22KABUAylADGAeywQUoSFABiUqQEYEUAEoReWKaX4gAgkSK8QAHhgA%2BANqkWAWyYQiAXQDc9Rqw6SAC14KCHwoBTkI5VUAJk0dPQMjU3MrWwdnVw87Lx8oKQBreXBoFSkAZnjdfUMTMwtre3cgA&eslintrc=N4KABGBEBOCuA2BTAzpAXGUEKQAIBcBPABxQGNoBLY-AWhXkoDt8B6AQ2mncNqNPRREXAPbRI4MAF8QUoA&tsconfig=N4KABGBEDGD2C2AHAlgGwKYCcDyiAuysAdgM6QBcYoEEkJemy0eAcgK6qoDCAFutAGsylBm3TgwAXxCSgA&tokens=false

### Repro Code

```TypeScript
type X = {
  id: string
}


// bug, invalid TS code
type Foo1 = ReadonlyArray<X>[number]

// bug, changes type
type Foo2 = ReadonlyArray<X>[number][]

// ok
type Foo3 = ReadonlyArray<X>[]
```

### ESLint Config

```javascript
module.exports = {
  parser: "@typescript-eslint/parser",
  rules:  {
    "@typescript-eslint/array-type": "error"
  }
};
```

### tsconfig

```jsonc
{
  "compilerOptions": {
    "strictNullChecks": true
  }
}
```

### Expected Result

Autofix should wrap `readonly X[]` in parentheses, as it already does for `Foo3` (indexed access cases seems to be missed)

```ts
type Foo1 = (readonly X[])[number]
type Foo2 = (readonly X[])[number][]

type Foo3 = (readonly X[])[]
```

### Actual Result

Autofix changes the code to:

```ts
type Foo1 = readonly X[][number]
type Foo2 = readonly X[][number][]
```

In `Foo1`, this produces `TS1354: 'readonly' type modifier is only permitted on array and tuple literal types.` In `Foo2`, it silently changes type from `X[]` to readonly `X[]`

### Additional Info

_No response_"""
start = "aac759c23dc3c66e607ee498884e161c24440f3a"
fix = "dccfeb952ef6b16bf0f8438073eb6bceca581df3"
