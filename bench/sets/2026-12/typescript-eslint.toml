### Expected Result

Tokens returned by parser for `ReturnType<<T` part of example should be:

| type         | value        | range      |
| ------------ | ------------ | ---------- |
| `Identifier` | `ReturnType` | `[11, 21]` |
| `Punctuator` | `<`          | `[21, 22]` |
