# typescript-eslint-02: The consistent-generic-constructors autofix should place the type annotation after the ? on
# optional class properties and not let a line comment swallow the type arguments in constructor mode.
# issue opened 2026-11-07, fix opened 2026-11-08, squash (or single commit); source files:
# packages/eslint-plugin/src/rules/consistent-generic-constructors.ts (25 lines); request from body (never edited).
# reading notes: Line-comment output (newline added after the comment) is one of a few valid fixes, but the issue's
# description points to it.
[[situation]]
id = "typescript-eslint-02"
request = """
Bug: [consistent-generic-constructors] invalid autofix for optional class properties and line comments

### Before You File a Bug Report Please Confirm You Have Done The Following...

- [x] I have tried restarting my IDE and the issue persists.
- [x] I have updated to the latest version of the packages.
- [x] I have [searched for related issues](https://github.com/typescript-eslint/typescript-eslint/issues?q=is%3Aissue+label%3A%22package%3A+eslint-plugin%22) and found none that matched my issue.
- [x] I have [read the FAQ](https://typescript-eslint.io/linting/troubleshooting) and my problem is not listed.
- [x] If I used AI assistance to prepare this issue, I have reviewed and followed the [AI Contribution Policy](https://typescript-eslint.io/contributing/ai-policy/).

### Playground Link

https://typescript-eslint.io/play/#ts=6.0.3&fileType=.ts&code=CYUwxgNghgTiAEYD2A7AzgF0QLngVxQEsBHPBNATwFsAjJCAbgCgnIo014AxJJeAbybx4UAPzwAvPBQgA7vADKIDAB5MMQigDmAPgAUASmbCA2mAC64qTPlLV6zbsPMAvkyA&eslintrc=N4KABGBEBOCuA2BTAzpAXGUEKQAIBcBPABxQGNoBLY-AWhXkoDt8B6MgeyeUuX0Ra0A5gMRUytTt3xwy%2BDtFQYA2uGw4x0BZAA0a9ZCKlaAQyZMO%2BE-kpdI%2BsAF01AXxAugA&tsconfig=N4KABGBEDGD2C2AHAlgGwKYCcDyiAuysAdgM6QBcYoEEkJemy0eAcgK6qoDCAFutAGsylBm3TgwAXxCSgA&tokens=false

### Repro Code

```TypeScript
declare const c: unique symbol;

class Foo {
  a? = new Set<string>();
  [c]? = new Set<string>();
}
```

### ESLint Config

```javascript
module.exports = {
  parser: "@typescript-eslint/parser",
  rules: {
    "@typescript-eslint/consistent-generic-constructors": [
      "error",
      "type-annotation",
    ],
  },
};
```

### tsconfig

```jsonc
{
  "compilerOptions": {
    "strictNullChecks": true
  }
}
```

### Expected Result

The autofix should insert the type annotation after the `?` token on optional class properties:

```ts
declare const c: unique symbol;

class Foo {
  a?: Set<string> = new Set();
  [c]?: Set<string> = new Set();
}
```

### Actual Result

The autofix attaches `: Set<string>` directly after `node.key` (or `]` for computed properties) before the `?` token, producing invalid syntax:

```ts
declare const c: unique symbol;

class Foo {
  a: Set<string>? = new Set();
  [c]: Set<string>? = new Set();
}
```

(Similarly, in default `"constructor"` mode, when the type annotation contains a line comment like `const a: // comment\\n  Set<string> = new Set();`, the autofix inserts `// comment` without a trailing newline right before `<string>()`, producing `const a = new Set// comment<string>();` where `<string>();` gets commented out.)

### Additional Info

_No response_"""
start = "9dfa943cba5bfc1485bd9bd07a087d05c4b599e4"
fix = "628f0c6882ed638385cd2a5e6a4000b66c7b1990"
