request = """
63- and 64-table joins fail with 'Greedy join ordering: no valid next table'; join limit is 63 instead of 64

SQLite allows up to 64 tables in a join. Turso fails at 63 and 64 tables with a planner error, and its hard limit rejects with "up to 63" instead of 64.

## Repro

63-way self-join (verified, debug build at fae58dc3e):

```sql
CREATE TABLE t14(x);
INSERT INTO t14 VALUES('abcdefghij');
SELECT 1 FROM t14, t14, … , t14;   -- 63 copies of t14
