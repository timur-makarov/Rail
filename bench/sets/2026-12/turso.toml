id = "turso-07"
request = """
`wal_get_frame` returns uncommitted frames after the committed `max_frame`

`read_frame_raw` does not compare `frame_id` with `max_frame`, and it holds no read lock (`core/storage/wal.rs:3912`). Thus `wal_get_frame` returns frames that are not committed. In the reproducer, a reader gets a frame that an open transaction on another connection spilled to the WAL. A replicator that copies such frames sends data that was never committed.

