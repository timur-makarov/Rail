# turso-01: A passive checkpoint that runs while a commit rewrites its row versions from TxID to timestamp gets its
# materialized stamp reset, so GC never drops those versions; the rewrite should keep the stamp.
# issue opened 2026-11-18, fix opened 2026-11-20, merge commit; source files: core/mvcc/database/mod.rs (13 lines);
# request from oldest of 2 edit records.
# reading notes: Reproducer lives in an external repo but prose states cause and expected result; tests step the
# COMMIT deterministically using existing test hooks.
[[situation]]
id = "turso-01"
request = """
MVCC: a passive checkpoint inside the TxID rewrite window after CommitEnd leaks row versions that GC never drops

## Summary

With MVCC and passive checkpoints, a commit that is between `CommitEnd` and `FinalizeCommit` rewrites its row versions from `TxID` to the commit timestamp. If a passive checkpoint pass runs inside that window and stamps those versions, the rewrite resets the stamp (`materialized_at`). The pass already pruned the keys from the dirty set, so no later pass stamps them again, and GC never drops those versions. They stay in memory until the key is written again.

It happens when a commit with a higher timestamp finishes first: commits that finish out of timestamp order (no group commit needed), or a group commit follower whose record the leader wrote. Reads and recovery stay correct. It is a memory leak, not a correctness bug.

## Reproducer

The tests are in [harness/repro/commitend-rewrite-leak.patch](https://github.com/pereman2/turso-mvcc-quint/blob/main/harness/repro/commitend-rewrite-leak.patch) in [pereman2/turso-mvcc-quint](https://github.com/pereman2/turso-mvcc-quint). The patch adds three tests to `core/mvcc/database/tests.rs` and changes no engine code. The data is written with SQL. To place the commit in the window, the tests step each `COMMIT` and, for the group commit case, hold `pager_commit_lock` until the leader and follower are both queued (as `commit_parks_once_while_another_transaction_holds_the_commit_lock` does). They count versions in `MvStore::rows`.

On turso main at `624ed32dbb` (also at `9cf2de2d8`), with a clean tree:

```bash
git apply /path/to/turso-mvcc-quint/harness/repro/commitend-rewrite-leak.patch
cargo test -p turso_core --lib rewrite_window_keeps_checkpoint_stamps -- --nocapture --test-threads=1
```

| Test | Result |
|---|---|
| `out_of_order_commit_rewrite_window_keeps_checkpoint_stamps` (no group commit: A waits in `BuildLogRecord`, B commits to the end, then the pass runs in A's window) | fails 3 of 3 runs, 76 of 1100 versions stay |
| `group_commit_rewrite_window_keeps_checkpoint_stamps` | fails 3 of 3 runs, 76 of 1100 versions stay |
| `serialized_commit_rewrite_window_keeps_checkpoint_stamps` (control, commits in order) | passes, 0 stay |

## Expected

After the reader ends and three more checkpoint passes, no row version of `t` stays in `mv_store.rows`.

## Actual

76 of 1100 row versions stay in memory, with `materialized_at` reset by the rewrite, and no later pass or GC removes them.

## Model

Variants `rewriteGroupCommit` and `rewriteSerialized` of the commit rewrite model fail `NoStrandedVersions`. The fixed variants, where the rewrite keeps the stamp, find no error. Design: [docs/DESIGN-commit-rewrite.md](https://github.com/pereman2/turso-mvcc-quint/blob/main/docs/DESIGN-commit-rewrite.md). Writeup: [docs/FINDINGS.md](https://github.com/pereman2/turso-mvcc-quint/blob/main/docs/FINDINGS.md) row 28, confirmed on `624ed32dbb` in [44937c07](https://github.com/pereman2/turso-mvcc-quint/commit/44937c07).

## Related, but different

- #11749: a rolled-back UPDATE keeps a checkpointed row in memory. Same symptom (a version GC never drops), different cause (rollback, not the commit rewrite window)."""
