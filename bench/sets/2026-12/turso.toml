# turso-52: In MVCC mode, a statement that fails inside an explicit transaction should undo its writes to temp tables,
# as SQLite does.
# issue opened 2026-10-05, fix opened 2026-10-06, merge commit; source files: core/vdbe/mod.rs (10 lines); request
# from body (never edited).
# reading notes: text names the fix
[[situation]]
id = "turso-52"
request = """
MVCC: a statement that fails in an explicit transaction keeps its writes to temp tables

With `PRAGMA journal_mode = 'mvcc'`, when a statement fails on a constraint inside an explicit transaction, Turso does not undo the rows that the statement already wrote to temp tables. SQLite undoes the whole statement. The rows stay after `COMMIT`.

Tables in the main database, attached databases, WAL mode and autocommit mode give the SQLite result.

### Reproducer 1: multi-row INSERT that fails on a UNIQUE constraint

```sql
PRAGMA journal_mode = 'mvcc';
CREATE TEMP TABLE t(x UNIQUE);
INSERT INTO t VALUES(1);
BEGIN;
INSERT INTO t VALUES(2),(1);
-- Turso:  Runtime error: UNIQUE constraint failed: t.x (19)
-- SQLite: Error: UNIQUE constraint failed: t.x
COMMIT;
SELECT group_concat(x) FROM t;
-- Turso:  1,2
-- SQLite: 1
```

### Reproducer 2: temp trigger whose write to a main table fails

```sql
PRAGMA journal_mode = 'mvcc';
CREATE TABLE m(x UNIQUE);
INSERT INTO m VALUES(1);
CREATE TEMP TABLE t(x);
CREATE TEMP TRIGGER tr AFTER INSERT ON t BEGIN INSERT INTO m VALUES(new.x); END;
BEGIN;
INSERT INTO t VALUES(2),(1);
-- Turso:  Runtime error: UNIQUE constraint failed: m.x (19)
-- SQLite: Error: UNIQUE constraint failed: m.x
COMMIT;
SELECT (SELECT group_concat(x) FROM t), (SELECT group_concat(x) FROM m);
-- Turso:  2,1|1
-- SQLite: |1
```

Turso undoes the statement's write to `m`, but keeps its writes to `t`.

The result is the same when an earlier statement in the transaction already wrote to the temp table, so it does not depend on when the temp transaction starts.

Run each script with one statement per line: `tursodb -q -m list repro.db < repro.sql`. The CLI skips the rest of a line after an error. The SQLite results are from sqlite3 3.53.4, with the `PRAGMA` line removed. Tested on main at `41a3f5337`.

### Cause

Temp has no `MvStore`, so for a statement that writes temp inside an explicit transaction, `op_transaction` opens a pager savepoint on the temp pager and adds the pager to `attached_savepoint_pagers`:

https://github.com/tursodatabase/turso/blob/41a3f5337b999b80c1e3ccc245f34469f580ce7c/core/vdbe/execute.rs#L5135-L5153

When the main database uses MVCC, `ProgramState::end_statement` rolls back only `MvStore` savepoints. It never rolls back the pagers in `attached_savepoint_pagers`:

https://github.com/tursodatabase/turso/blob/41a3f5337b999b80c1e3ccc245f34469f580ce7c/core/vdbe/mod.rs#L1615-L1633

The `ReleaseSavepoint` branch skips them in the same way:

https://github.com/tursodatabase/turso/blob/41a3f5337b999b80c1e3ccc245f34469f580ce7c/core/vdbe/mod.rs#L1592-L1602

When the MVCC branch of `RollbackSavepoint` also calls `rollback_to_newest_savepoint()` on each pager in `attached_savepoint_pagers`, both reproducers give the SQLite result.

Related: #9289. There, a runtime error in a statement that writes only temp tables rolls back the whole transaction, in both WAL and MVCC mode."""
start = "331b1f9d31ef87333abf1898708da354412c1398"
fix = "c2e639f66d8360fbcc5ba507dbf5a6d2fb9b894b"
