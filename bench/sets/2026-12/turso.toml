# turso: IntegrityError: UNIQUE constraint failed: ids.ext
# 2**63 - 1 and 2**63 - 2 are stored as two integers
```

The same fallback takes any object with `__float__`, so `decimal.Decimal("12345678901234567.89")` is stored as `1.2345678901234568e+16` where `sqlite3` refuses the type.

