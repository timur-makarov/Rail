# turso-41: A bound LIMIT ? inside a scalar subquery is dropped from the parameter count, so the statement rejects the
# correct number of arguments.
# issue opened 2026-10-14, fix opened 2026-10-15, merge commit; source files: core/translate/emitter/mod.rs,
# core/translate/subquery.rs (60 lines); request from body (never edited).
# added to the candidate's hidden tests: sqlite/conformance/sqlite-sqltests/subquery/expressions.sqltest
[[situation]]
id = "turso-41"
request = """
Bound LIMIT in a scalar subquery is dropped, then the argument count is rejected

## Summary

Turso Cloud rejects an `UPDATE ... RETURNING` that current SQLite accepts, because a bound `LIMIT` inside a scalar subquery is not counted as a bind parameter.

## Statement

```sql
UPDATE "pf_job_queue"
SET "job_attempts" = "job_attempts" + 1,
    "locked_until" = ?,
    "claim_receipt" = ?
WHERE "id" = (
  SELECT "id"
  FROM "pf_job_queue"
  WHERE "queue" = ?
    AND "available_at" <= ?
    AND ("locked_until" IS NULL OR "locked_until" <= ?)
    AND "job_attempts" < "job_retry_limit"
    AND "_deleted" = 0
  ORDER BY "job_attempts", "available_at", "id"
  LIMIT ?
)
RETURNING "id"
```

The client sends 6 arguments. The server responds:

```text
Input error: Number of arguments mismatch: expected 5, got 6
```

The same `LIMIT ?` is accepted on a top-level `SELECT` with 4 arguments. Replacing the subquery `LIMIT ?` with literal `LIMIT 1` makes the `UPDATE` succeed with 5 arguments.

## Why this matters

This is the shape Drizzle emits for `.where(eq(column, subquery.limit(1)))`. Any ORM that binds `LIMIT` inside `WHERE col = (SELECT ... LIMIT ?)` will fail on Turso and pass on SQLite.

It matches SQLite's historical optimization that drops `LIMIT` in a scalar subquery. SQLite 3.53.4 no longer does that: both `bun:sqlite` and Python's `sqlite3` prepare this `UPDATE` with 6 parameters and execute it. Turso's SQL-over-HTTP protocol requires the argument count to match the prepared parameter count exactly, so the dropped parameter is a hard error rather than an ignored `LIMIT`.

## Environment

- Client: `@tursodatabase/serverless@1.4.1`
- Server: Turso Cloud, reached over the SQL-over-HTTP protocol
- Local control: SQLite 3.53.4 accepts the 6-argument update

## Expected

The prepared statement should count the `LIMIT` parameter, so 6 arguments succeed, matching current SQLite.

## Workaround

Inline `LIMIT 1` in the scalar subquery so the client sends 5 arguments."""
start = "7a0a7b8b856609b15db99d3aa193718be97e48ad"
fix = "3125f38b10e099eaff3ce8564e57f9eec2747242"
