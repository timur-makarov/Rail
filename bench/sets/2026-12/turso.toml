# turso-16: A failed first CREATE TYPE must not leave __turso_internal_types in the connection schema, so later CREATE
# TYPE works.
# issue opened 2026-10-07, fix opened 2026-10-08, merge commit; source files: core/translate/schema.rs (32 lines);
# request from body (never edited).
# reading notes: Text names the cause.
[[situation]]
id = "turso-16"
request = """
Failed CREATE TYPE keeps __turso_internal_types in the connection schema after rollback

```sh
U="CREATE TYPE u AS UNION($(seq -s, -f 'v%g INT' 0 256));"
printf '%s\\n' "$U" "SELECT name FROM sqlite_schema;" "PRAGMA table_list;" "CREATE TYPE t2 BASE text;" | tursodb -q -m list --experimental-custom-types t.db
```

Use a new, empty database. The SQL is:

```sql
CREATE TYPE u AS UNION(v0 INT, v1 INT, ..., v256 INT);  -- 257 variants
SELECT name FROM sqlite_schema;
PRAGMA table_list;
CREATE TYPE t2 BASE text;
```

Actual:

```
Runtime error: Parse error: UNION type cannot have more than 256 variants (got 257)
main|__turso_internal_types|table|2|0|0
main|sqlite_schema|table|5|0|0
temp|sqlite_temp_schema|table|5|0|0
Runtime error: I/O error: short read on page 2: expected 4096 bytes, got 0
```

`sqlite_schema` has no rows, and the file has only page 1. But `PRAGMA table_list` shows `__turso_internal_types` with root page 2. Each later CREATE TYPE, CREATE DOMAIN or `SELECT * FROM __turso_internal_types` in this connection fails with the same error. A new connection does not have the problem.

tursopg has the same problem:

```sh
printf '%s\\n' "CREATE TYPE t AS ENUM ('it''s');" "CREATE TYPE t2 AS ENUM ('a');" | tursopg -q t.db
```

```
Error: Parse error: invalid type sql: CREATE TYPE t(value text) BASE text ENCODE CASE WHEN value IN ('it's') THEN value ELSE RAISE (ABORT, 'invalid input value for enum t') END DECODE value OPERATOR '<'
Error: I/O error: short read on page 2: expected 4096 bytes, got 0
```

The problem occurs only when the failed statement is the first CREATE TYPE or CREATE DOMAIN in the database, that is, the statement that creates `__turso_internal_types`. If a type exists before the failed statement, the next CREATE TYPE works. An error before the statement runs (for example a syntax error or a duplicate type name) does not cause the problem.

Expected:

The failed CREATE TYPE has no effect. `PRAGMA table_list` does not show `__turso_internal_types`, and the second CREATE TYPE succeeds.

sqlite3 has no CREATE TYPE. For a CREATE TABLE ... AS SELECT that allocates a B-tree and then fails, sqlite3 and tursodb both remove the table:

```sql
CREATE TABLE t AS SELECT abs(-9223372036854775808);
PRAGMA table_list;
CREATE TABLE t(a);
SELECT name, rootpage FROM sqlite_schema;
```

sqlite3 output (tursodb gives the same rows):

```
Runtime error near line 1: integer overflow
main|sqlite_schema|table|5|0|0
temp|sqlite_temp_schema|table|5|0|0
t|2
```

When `__turso_internal_types` does not exist, `persist_type_definition` emits `CreateBtree`, an insert into `sqlite_schema`, `ParseSchema`, an insert into the new table, `AddType`, and then `SetCookie`. `ParseSchema` puts the new table into the connection schema. `AddType` parses the type SQL again and can fail. Then `SetCookie` does not run. Only `SetCookie` sets `schema_did_change`, and `Pager::rollback` restores the connection schema only when `schema_did_change` is true. Thus the rollback removes page 2, but the connection schema keeps the table with root page 2. CREATE TABLE, CREATE INDEX and CREATE TRIGGER emit `SetCookie` before `ParseSchema`, so the rollback after a failure in these statements restores the schema.

Code: `core/translate/schema.rs` `persist_type_definition`, `core/storage/pager.rs` `Pager::rollback`"""
