# turso-59: An MVCC passive checkpoint racing a concurrent DROP TABLE must not resurrect the dropped table.
# issue opened 2026-07-22, fix opened 2026-07-23, merge commit; source files:
# core/mvcc/database/checkpoint_state_machine.rs (49 lines); request from body (never edited).
# reading notes: deterministic yield-injection test, close to the one in the issue
[[situation]]
id = "turso-59"
request = """
MVCC passive checkpoint can durably resurrect a concurrently dropped table

## Non-deterministic test

```rust
#[test]
fn test_mvcc_passive_checkpoint_drop_race_preserves_schema_and_integrity() {
    use std::sync::{Arc, Barrier};
    use std::time::Duration;

    let expected_integrity = vec![vec![Value::from_text("ok".to_string())]];
    let mut saw_both_operations_succeed = false;

    for (attempt, delay_micros) in [0_u64, 10, 50, 100, 250, 500, 1_000, 2_000, 5_000]
        .into_iter()
        .enumerate()
    {
        let db = MvccTestDbNoConn::new_with_random_db_passive();
        let setup = db.connect();
        setup
            .execute("PRAGMA mvcc_checkpoint_threshold = -1")
            .unwrap();
        setup
            .execute("CREATE TABLE t(id INTEGER PRIMARY KEY, v BLOB)")
            .unwrap();
        setup
            .execute("CREATE TABLE driver(x INTEGER PRIMARY KEY)")
            .unwrap();
        setup
            .execute(
                "INSERT INTO t \\
                 SELECT value, zeroblob(300) FROM generate_series(1, 20000)",
            )
            .unwrap();
        let root_before = get_rows(
            &setup,
            "SELECT rootpage FROM sqlite_schema WHERE type = 'table' AND name = 't'",
        )[0][0]
            .as_int()
            .unwrap();
        assert!(root_before < 0, "t must still be MVCC-only");
        setup
            .execute("PRAGMA mvcc_checkpoint_threshold = 0")
            .unwrap();

        let checkpoint_conn = db.connect();
        let drop_conn = db.connect();
        drop_conn.set_busy_timeout(Duration::from_millis(250));
        let barrier = Arc::new(Barrier::new(2));
        let checkpoint_barrier = barrier.clone();
        let checkpoint = std::thread::spawn(move || {
            checkpoint_barrier.wait();
            checkpoint_conn.execute("INSERT INTO driver VALUES (1)")
        });

        barrier.wait();
        std::thread::sleep(Duration::from_micros(delay_micros));
        let drop_result = drop_conn.execute("DROP TABLE t");
        let checkpoint_result = checkpoint.join().unwrap();

        if drop_result.is_ok() && checkpoint_result.is_ok() {
            saw_both_operations_succeed = true;
            let observer = db.connect();
            let schema_rows = get_rows(
                &observer,
                "SELECT name, rootpage FROM sqlite_schema \\
                 WHERE type = 'table' AND name = 't'",
            );
            let integrity = get_rows(&observer, "PRAGMA integrity_check");
            assert!(
                schema_rows.is_empty() && integrity == expected_integrity,
                "successful checkpoint/DROP race corrupted the database: \\
                 attempt={attempt} delay_us={delay_micros} \\
                 schema={schema_rows:?} integrity={integrity:?}"
            );
        }
    }

    assert!(
        saw_both_operations_succeed,
        "no attempt completed both public operations successfully"
    );
}
```

### Output

```text
$ cargo test -p turso_core test_mvcc_passive_checkpoint_drop_race_preserves_schema_and_integrity -- --nocapture

thread 'mvcc::database::tests::test_mvcc_passive_checkpoint_drop_race_preserves_schema_and_integrity' panicked:
successful checkpoint/DROP race corrupted the database:
attempt=3 delay_us=100
schema=[[Text("t"), Integer(3)]]
integrity=[["*** in database main ***
Page 3: never used
Page 5: never used
...
Page 103: never used"]]

test mvcc::database::tests::test_mvcc_passive_checkpoint_drop_race_preserves_schema_and_integrity ... FAILED
```

## Deterministic test (`MemoryYieldIO` + yield injection)

```rust
#[cfg(feature = "io_memory_yield")]
#[test]
#[ignore = "known bug: passive checkpoint stale schema publication resurrects DROP"]
fn test_passive_checkpoint_preserves_drop_committed_after_collection() {
    use crate::StepResult;

    let io = Arc::new(crate::MemoryYieldIO::new());
    let path = format!("passive_checkpoint_stale_schema_{}", rand::random::<u64>());
    let db = Database::open_file_with_flags(
        io.clone(),
        &path,
        OpenFlags::default(),
        DatabaseOpts::new().with_experimental_mvcc_passive_checkpoint(true),
        None,
        Arc::new(SqliteDialect),
    )
    .unwrap();
    let setup = db.connect().unwrap();
    setup.execute("PRAGMA journal_mode = 'mvcc'").unwrap();
    setup
        .execute("PRAGMA mvcc_checkpoint_threshold = -1")
        .unwrap();
    setup
        .execute("CREATE TABLE t(id INTEGER PRIMARY KEY, v TEXT)")
        .unwrap();
    setup
        .execute("CREATE TABLE driver(id INTEGER PRIMARY KEY)")
        .unwrap();
    setup.execute("INSERT INTO t VALUES (1, 'live')").unwrap();
    let root_rows = setup
        .prepare("SELECT rootpage FROM sqlite_schema WHERE type = 'table' AND name = 't'")
        .unwrap()
        .run_collect_rows()
        .unwrap();
    let root_before = root_rows[0][0].as_int().unwrap();
    assert!(
        root_before < 0,
        "t must still have an unpublished MVCC root, got {root_before}"
    );

    let checkpoint_conn = db.connect().unwrap();
    checkpoint_conn
        .execute("PRAGMA mvcc_checkpoint_threshold = 0")
        .unwrap();
    let injector = FixedYieldInjector::new([CheckpointYieldPoint::AfterCollectTableRows.point()]);
    checkpoint_conn.set_yield_injector(Some(injector.clone()));
    let mut checkpoint = checkpoint_conn
        .prepare("INSERT INTO driver VALUES (1)")
        .unwrap();

    let mut parked_after_collection = false;
    for _ in 0..200_000 {
        match checkpoint.step().unwrap() {
            StepResult::Yield if injector.is_empty() => {
                parked_after_collection = true;
                break;
            }
            StepResult::IO => io.step().unwrap(),
            StepResult::Yield => {}
            StepResult::Done => {
                panic!("checkpoint completed before the post-collection yield fired")
            }
            other => panic!("unexpected checkpoint step: {other:?}"),
        }
    }
    assert!(
        parked_after_collection,
        "passive checkpoint must park after collecting its table-row snapshot"
    );

    let dropper = db.connect().unwrap();
    dropper.execute("DROP TABLE t").unwrap();
    let dropped_schema_rows = dropper
        .prepare("SELECT name FROM sqlite_schema WHERE type = 'table' AND name = 't'")
        .unwrap()
        .run_collect_rows()
        .unwrap();
    assert!(
        dropped_schema_rows.is_empty(),
        "DROP must be visible before the parked checkpoint resumes"
    );

    let mut checkpoint_done = false;
    for _ in 0..200_000 {
        match checkpoint.step().unwrap() {
            StepResult::Done => {
                checkpoint_done = true;
                break;
            }
            StepResult::IO => io.step().unwrap(),
            StepResult::Yield => {}
            other => panic!("unexpected checkpoint step after DROP: {other:?}"),
        }
    }
    assert!(checkpoint_done, "passive checkpoint did not finish");
    checkpoint_conn.set_yield_injector(None);
    drop(checkpoint);

    let observer = db.connect().unwrap();
    let schema_rows_after_racing_checkpoint = observer
        .prepare("SELECT name, rootpage FROM sqlite_schema WHERE type = 'table' AND name = 't'")
        .unwrap()
        .run_collect_rows()
        .unwrap();
    let integrity_after_racing_checkpoint = observer
        .prepare("PRAGMA integrity_check")
        .unwrap()
        .run_collect_rows()
        .unwrap();

    observer.execute("PRAGMA wal_checkpoint(PASSIVE)").unwrap();
    let schema_rows_after_followup_checkpoint = observer
        .prepare("SELECT name, rootpage FROM sqlite_schema WHERE type = 'table' AND name = 't'")
        .unwrap()
        .run_collect_rows()
        .unwrap();
    let integrity_after_followup_checkpoint = observer
        .prepare("PRAGMA integrity_check")
        .unwrap()
        .run_collect_rows()
        .unwrap();

    drop(observer);
    drop(dropper);
    drop(checkpoint_conn);
    drop(setup);
    drop(db);

    let reopened_db = Database::open_file_with_flags(
        io,
        &path,
        OpenFlags::default(),
        DatabaseOpts::new().with_experimental_mvcc_passive_checkpoint(true),
        None,
        Arc::new(SqliteDialect),
    )
    .unwrap();
    let reopened = reopened_db.connect().unwrap();
    let schema_rows_after_reopen = reopened
        .prepare("SELECT name, rootpage FROM sqlite_schema WHERE type = 'table' AND name = 't'")
        .unwrap()
        .run_collect_rows()
        .unwrap();
    let integrity_after_reopen = reopened
        .prepare("PRAGMA integrity_check")
        .unwrap()
        .run_collect_rows()
        .unwrap();

    assert!(
        schema_rows_after_racing_checkpoint.is_empty()
            && schema_rows_after_followup_checkpoint.is_empty()
            && schema_rows_after_reopen.is_empty(),
        "committed DROP was lost: after racing checkpoint={schema_rows_after_racing_checkpoint:?}, \\
         after follow-up checkpoint={schema_rows_after_followup_checkpoint:?}, \\
         after reopen={schema_rows_after_reopen:?}; integrity results: \\
         racing={integrity_after_racing_checkpoint:?}, \\
         follow-up={integrity_after_followup_checkpoint:?}, reopen={integrity_after_reopen:?}"
    );
    let ok = vec![vec![Value::build_text("ok")]];
    assert_eq!(integrity_after_racing_checkpoint, ok);
    assert_eq!(integrity_after_followup_checkpoint, ok);
    assert_eq!(integrity_after_reopen, ok);
}
```

