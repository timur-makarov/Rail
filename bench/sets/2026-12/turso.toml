# turso-13: Make wal_get_frame read into its own buffer so a queued read cannot write into the caller's buffer after
# an error.
# issue opened 2026-09-24, fix opened 2026-10-21, merge commit; source files: core/connection.rs,
# core/storage/pager.rs, core/storage/wal.rs (62 lines); request from oldest of 2 edit records.
# reading notes: Issue contains the test; text names the fix.
[[situation]]
id = "turso-13"
request = """
`wal_get_frame` can write into the caller buffer after it returns an error

`read_frame_raw` gives the IO completion a raw pointer to the caller buffer (`core/storage/wal.rs:3928`). If `step()` fails while the read is queued, `wait_for_completion` returns the error, but the read stays queued. The io_uring backend does this when `submit_and_wait` fails (`core/io/io_uring.rs:560`). A later `step()` then writes into the buffer. If the caller frees the buffer after the error, this is a write to freed memory.

Expected: `read_frame_raw` reads into its own buffer.

Reproducer, fails on `main` (bec3bbff). Add it to `tests/integration/functions/test_wal_api.rs` and run `cargo test -p core_tester --test integration_tests wal_get_frame_writes_into_buffer_after_it_returns`:

```rust
struct StepFailsOnce {
    io: crate::queued_io::QueuedIo,
    fail_next_step: std::sync::atomic::AtomicBool,
}

impl turso_core::Clock for StepFailsOnce {
    fn current_time_monotonic(&self) -> turso_core::MonotonicInstant {
        turso_core::Clock::current_time_monotonic(&self.io)
    }
    fn current_time_wall_clock(&self) -> turso_core::WallClockInstant {
        turso_core::Clock::current_time_wall_clock(&self.io)
    }
}

impl turso_core::IO for StepFailsOnce {
    fn open_file(
        &self,
        path: &str,
        flags: turso_core::OpenFlags,
        direct: bool,
    ) -> turso_core::Result<Arc<dyn turso_core::File>> {
        turso_core::IO::open_file(&self.io, path, flags, direct)
    }
    fn remove_file(&self, path: &str) -> turso_core::Result<()> {
        turso_core::IO::remove_file(&self.io, path)
    }
    fn file_id(&self, path: &str) -> turso_core::Result<turso_core::io::FileId> {
        turso_core::IO::file_id(&self.io, path)
    }
    fn step(&self) -> turso_core::Result<()> {
        if self
            .fail_next_step
            .swap(false, std::sync::atomic::Ordering::SeqCst)
        {
            return Err(LimboError::InternalError("io_uring_enter failed".into()));
        }
        turso_core::IO::step(&self.io)
    }
}

#[test]
fn wal_get_frame_writes_into_buffer_after_it_returns() {
    let io = Arc::new(StepFailsOnce {
        io: crate::queued_io::QueuedIo::new(),
        fail_next_step: false.into(),
    });
    let db =
        turso_core::Database::open_file(io.clone(), "repro.db", Arc::new(SqliteDialect)).unwrap();
    let conn = db.connect().unwrap();
    conn.execute("CREATE TABLE t(x)").unwrap();
    let mut frame = vec[0u8; 24 + 4096];
    io.fail_next_step
        .store(true, std::sync::atomic::Ordering::SeqCst);
    assert!(conn.wal_get_frame(1, &mut frame).is_err());
    io.io.step_one().unwrap();
    assert!(
        frame.iter().all(|&byte| byte == 0),
        "the read wrote into the buffer after wal_get_frame returned"
    );
}
```

Output:

```
the read wrote into the buffer after wal_get_frame returned
```"""
