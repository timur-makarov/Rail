# turso-04: With persistent database-file write failures, checkpoint hangs, panics, or counts unwritten frames as
# backfilled; it should fail cleanly and not advance backfill.
# issue opened 2026-08-03, fix opened 2026-11-20, merge commit; source files: core/io/mod.rs, core/storage/wal.rs (31
# lines); request from oldest of 3 edit records.
# reading notes: text names the fix (three proposed changes); tests use an in-process capacity-limited IO and a 60 s
# hang timeout; short-write case is an extra variant.
[[situation]]
id = "turso-04"
request = """
Persistent checkpoint write failures can hang, panic, or mark unwritten frames as backfilled


While prototyping a fixed-capacity storage backend for `sqlite3_deserialize`, I found that checkpoint does not correctly handle a persistent write failure.

The existing in-tree storage backends do not provide a deterministic way to exercise this condition: `MemoryIO` has no capacity limit, while ordinary filesystem testing generally does not inject persistent `pwrite` failures. A fixed-capacity or quota-limited backend exposes three compounding bugs:

1. checkpoint hangs because the default `File::pwritev` implementation drops a child-write error;
2. after that is fixed, abort handling panics while releasing the WAL write lock a second time;
3. after both are fixed, a failed write batch can be removed from checkpoint bookkeeping before its error is inspected, allowing checkpoint to report success and advance `wal_total_backfilled` past frames that were never written.

I have a candidate patch for all three issues, with two regression tests and clean core and integration test runs. I am filing this separately from the deserialize proposal because this is a general commit/checkpoint correctness problem affecting any `DatabaseStorage` implementation that can return a persistent write error.

### Expected behavior

When a checkpoint write fails persistently:

* checkpoint should return `LimboError::CheckpointFailed`;
* the connection and pager should leave checkpoint state cleanly;
* the transaction should not attempt to release an already-released WAL lock;
* backfill bookkeeping should advance only for successfully written batches;
* subsequent operations on the connection should remain usable.

### Actual behavior

The same persistent failure exposes three bugs in sequence.

#### 1. Default `File::pwritev` hangs

The default `File::pwritev` implementation decomposes a vectored write into one `pwrite` call per buffer, with a child completion for each write.

The completion callback handles `Ok(n)`, but does nothing on `Err(e)`. As a result:

* the `outstanding` counter is never decremented;
* the parent completion is never resolved;
* checkpoint's driving loop continues calling `io.step()` indefinitely.

**Proposed fix:** on `Err(e)`, decrement `outstanding` and resolve the parent completion with `c_main.error(e)`. `Completion` already uses first-result-wins semantics, so concurrent child completions cannot replace an earlier result.

#### 2. Checkpoint failure triggers a double lock release

Once the `pwritev` error is propagated, checkpoint returns `LimboError::CheckpointFailed`.

`Program::abort()` does not have a no-rollback arm for that error, so it falls through to generic rollback handling and attempts to release the WAL write lock again. `commit_tx` has already released that lock before starting checkpoint, because the transaction's frames have already been committed to the WAL and checkpoint is post-commit work.

This causes a double-lock-release panic.

There is an additional cleanup requirement: because checkpoint I/O yielded back to the caller, `commit_tx`'s synchronous error branch does not run. The pager's checkpoint and commit state must therefore be reset by abort handling.

**Proposed fix:** add a `LimboError::CheckpointFailed` arm to `Program::abort()` that:

* does not perform transaction rollback;
* calls `pager.cleanup_after_checkpoint_failure()` to reset the checkpoint and commit state;
* sets the connection transaction state to `TransactionState::None`.

#### 3. A failed batch can be reported as successfully backfilled

After the first two issues are fixed, a retry can partially write a checkpoint batch: some pages fit within the backend's remaining capacity and later pages fail.

In `WalFile::checkpoint_inner`, the `CheckpointState::Processing` arm currently calls:

```text
process_inflight_writes()
```

before:

```text
first_write_error()
```

`process_inflight_writes()` removes completed batches from `inflight_writes`, regardless of whether they completed successfully. If a batch becomes complete-with-error on that iteration, it is removed before `first_write_error()` can inspect it.

Checkpoint can consequently report success and set `wal_total_backfilled` to include frames that were never written to the main database.

A later read of one of those pages trusts the backfill counter, skips the WAL, and reads from an incomplete main database file. In the reproducer, this eventually surfaces as:

```text
short read on page N
```

**Proposed fix:** inspect `first_write_error()` before removing completed batches with `process_inflight_writes()`.

### Why these appear as a sequence

Each bug masks the next:

1. the dropped completion error leaves checkpoint hanging;
2. propagating the error exposes the double lock release;
3. correcting abort cleanup allows a checkpoint retry, which exposes the incorrect backfill bookkeeping.

Testing only the first visible symptom would therefore leave two correctness bugs behind it.

### Reproduction and regression tests

I added two tests under `tests/integration/`.

#### `pwritev_default_error_propagation.rs`

Uses a `File` implementation that overrides only `pwrite`, ensuring the default `pwritev` implementation is exercised. Writes at or beyond a configured offset fail persistently.

Without the first fix, the test hangs and is terminated by a ten-second timeout.

After error propagation is fixed, it returns `LimboError::CheckpointFailed`. The test then verifies that the connection remains usable, covering the abort cleanup and double-release fix.

#### `checkpoint_torn_batch_backfill.rs`

Uses a `File` with a persistent fixed write capacity: every write beyond the capacity fails.

The test performs enough autocommit inserts to cross the automatic-checkpoint threshold, then requests an explicit checkpoint retry.

Without the bookkeeping fix:

* the retry reports success;
* `wal_total_backfilled` covers frames whose writes failed;
* a subsequent operation encounters `short read on page N`.

With the fix, the checkpoint retry correctly returns an error and does not claim that the failed frames were backfilled.

Both tests fail against the corresponding unfixed behavior and pass with all three changes applied.

### Verification

* `cargo test -p turso_core --lib`: 2,231 passed, 0 failed.
* `cargo test -p core_tester --test integration_tests`: 1,015 passed, 0 failed, including both new regression tests.
* Each fix was independently removed and restored to verify that its corresponding test fails before the fix and passes afterward.
* `cargo mutants --in-diff` generated ten mutants across the changed functions: five were caught by the tests, five were unviable because the substituted types do not implement `Default`, and none were missed. Removing the new `CheckpointFailed` match arm was among the caught mutants.

### Patch

Branch: [`jamestexas/turso:bug/checkpoint-pwritev-error-hang`](https://github.com/jamestexas/turso/tree/bug/checkpoint-pwritev-error-hang), at commit `bf9d8dfb37`.

The branch was based directly on `upstream/main` before filing and contains no unrelated fork changes.

### Related work

* Companion proposal: *`sqlite3_deserialize`: zero-copy `READONLY` attach* — this bug was discovered while testing the mutable, fixed-capacity variant. Link to be added once filed.
* This is a different failure mode from [#7952](https://github.com/tursodatabase/turso/issues/7952), which concerns checkpoint crash atomicity under `synchronous=NORMAL`. Validation of its proposed `CheckpointState::SyncWal` fix showed that the original torn-backfill behavior no longer reproduced, but also found a separate regression in which a `synchronous=FULL` commit following a WAL-resetting checkpoint was observed to return without issuing its WAL fsync. The exact mechanism of that regression remains under investigation. This report instead concerns explicit write-error propagation and bookkeeping in `CheckpointState::Processing`; no crash is involved.

### Description of AI usage

I used Claude Code to assist with tracing the failure through `core/io/mod.rs`, `core/vdbe/mod.rs`, and `core/storage/wal.rs`, and with drafting the regression tests. A separate adversarial review pass identified that the initial double-release fix also needed to reset the pager's checkpoint state. I reviewed the changes, reproduced each failure independently, and ran the verification described above."""
start = "8dd36eb42cf4e1382fd618aebfbda9538ef9c032"
fix = "bed55acc3e845ecb4c9aa023d818c4e8990e588a"
hidden_tests = ["tests/integration/checkpoint_write_failure.rs", "tests/integration/mod.rs"]
