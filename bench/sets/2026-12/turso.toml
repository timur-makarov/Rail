[[situation]]
id = "turso-34"
request = """
INSERT OR FAIL in a trigger body rolls back the whole outer statement

`INSERT OR FAIL` inside a trigger body rolls back the whole outer statement. SQLite keeps everything written before the failing row.

```sql
CREATE TABLE src(id INTEGER PRIMARY KEY, x);
CREATE TABLE t(id INTEGER PRIMARY KEY, x, k UNIQUE);
CREATE TABLE a(id INTEGER PRIMARY KEY AUTOINCREMENT, x);
CREATE TRIGGER io AFTER INSERT ON src BEGIN
  INSERT OR FAIL INTO t(x, k) VALUES (new.x, new.x % 3);
  INSERT INTO a(x) VALUES (new.x);
END;
INSERT INTO src(x) VALUES (2),(3),(4),(5);   -- UNIQUE constraint failed: t.k (on x=5)
SELECT (SELECT count(*) FROM src), (SELECT count(*) FROM t), (SELECT count(*) FROM a);
-- sqlite: 4|3|3
-- turso:  0|0|0
```

The outer INSERT has no explicit ON CONFLICT, so the trigger step's own `OR FAIL` applies (`trigger.c`, `codeTriggerProgram`), and FAIL keeps prior changes. Turso treats it as ABORT.

Found by the differential fuzzer; reproduces on main."""
