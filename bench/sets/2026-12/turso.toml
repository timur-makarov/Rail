# turso-30: CDC must record an AFTER INSERT trigger's write after the INSERT that fired it, in the order the writes
# happened.
# issue opened 2026-10-19, fix opened 2026-10-19, merge commit; source files: core/translate/emitter/update.rs,
# core/translate/insert.rs, core/translate/upsert.rs (276 lines); request from oldest of 2 edit records.
# reading notes: filed by fixer. Tests also cover AFTER UPDATE and other trigger/upsert paths under the same ordering
# rule.
[[situation]]
id = "turso-30"
request = """
CDC: an AFTER INSERT trigger's write is recorded before the INSERT that fired it

## Summary

CDC records an AFTER INSERT trigger's write before the INSERT that fired it. A consumer that replays `turso_cdc` in `change_id` order applies the changes in an order that never happened.

## Repro

On main (`e5452eece9`):

```sql
PRAGMA capture_data_changes_conn('full');
CREATE TABLE t(id INTEGER PRIMARY KEY, x);
CREATE TABLE audit(id INTEGER PRIMARY KEY, msg);
CREATE TRIGGER t_ai AFTER INSERT ON t BEGIN INSERT INTO audit(msg) VALUES ('inserted ' || new.id); END;
DELETE FROM turso_cdc;
INSERT INTO t VALUES (1, 'a');
SELECT change_id, change_type, table_name, id FROM turso_cdc WHERE change_type != 2 ORDER BY change_id;
```

```
1 | 1 | audit | 1
2 | 1 | t     | 1
```

Expected: `t` first (the row is inserted, then the AFTER trigger runs), then `audit`.

## Likely cause (not confirmed)

The INSERT's CDC row appears to be written by bytecode placed after the AFTER-trigger call, while the trigger subprogram writes its own CDC row when it runs, so the trigger's row gets the smaller `change_id`.

## Impact

Replaying in this order can fail where the original statement succeeded. For example, if `audit` had a foreign key to `t`, replaying the `audit` insert before the `t` insert violates the constraint. (DELETE with `ON DELETE CASCADE` records the parent before the child, so the order is not reversed in every case.)

Related: the extra COMMIT record written by trigger and FK-action subprograms, and the sync push applying trigger effects twice."""
