# turso-58: Under synchronous=NORMAL, a crash during checkpoint backfill should not leave a torn database that
# integrity_check calls ok.
# issue opened 2026-07-22, fix opened 2026-07-29, merge commit; source files:
# core/mvcc/database/checkpoint_state_machine.rs, core/mvcc/database/mod.rs, core/storage/pager.rs,
# core/storage/wal.rs, core/vdbe/vacuum.rs (98 lines); request from body (never edited).
# reading notes: AI-drafted report; test uses an in-process crash-simulating IO
[[situation]]
id = "turso-58"
request = """
Checkpoint backfill not crash-atomic under default durability

If a crash lands during a checkpoint in the default durability mode, the database file can be left with a torn mix of pages on disk. The guarantee that should hold is that a reader never trusts data beyond what is durably on disk: reads resolve through the write-ahead log and recovery never treats a partially applied checkpoint as committed.

### Prerequisites

In WAL mode, committed transactions append frames to the write-ahead log; a **checkpoint** copies
(backfills) those committed frames into the main database file, then resets the WAL. Durability of
those DB-file writes depends on `PRAGMA synchronous`:

```text
synchronous=FULL    : the checkpoint fsyncs the backfilled DB pages before resetting the WAL
synchronous=NORMAL  : (the WAL-mode default) the backfill DB-page writes are NOT fsynced
                      before the WAL is reset / truncated
```

The recovery contract for a crash during checkpoint is a **committed prefix**: on reopen the
database must equal either the pre-transaction state `S0` or a fully-committed transaction `T` — a
clean loss of at most the last commit. A "torn" file (some backfilled pages persisted, the matching
WAL tail dropped) is neither, and is silent corruption if `integrity_check` does not catch it.

### The bug

Under `synchronous=NORMAL`, the checkpoint copies committed WAL frames into the DB file **without
first forcing them to stable storage**. A power-loss crash partway through the copy persists some
backfilled pages while the matching WAL tail is dropped on the next open:

```text
checkpoint backfill (synchronous=NORMAL), crash at page j (< k committed frames):
  DB file after crash: pages 1..j persisted, pages j+1..k NOT
  WAL after crash:     reset / dropped on reopen
  reopen recovery ->   torn(1..j)   ≠ S0   and   ≠ T
```

Recovery lands on the torn intermediate, and `integrity_check` reports it as **ok** — a silent split.

### Reference behavior

With the durability barrier in place — the checkpoint fsyncs the backfilled pages before the WAL is
reset, as under `synchronous=FULL` — a crash at the same point recovers a committed prefix: the WAL
replay heals the split. The differential's `FULL` control demonstrates exactly this (zero torn images
below), so the fix is to restore that barrier on the default (`NORMAL`) path.

### Reproduction

Run a checkpoint under `synchronous=NORMAL`; inject a power-loss crash mid-backfill via an in-process
crash-simulating IO layer; reopen; compare the recovered image against a `synchronous=FULL` control
at the same crash point, using stock `PRAGMA integrity_check`. The runtime leg needs **no
instrumentation** — the observation is stock `integrity_check`; the crash injection is a test-side IO
substrate. (An out-of-process crash harness such as `dm-log-writes` reproduces the same split.)

### Concrete evidence — captured differential run (crash-sim substrate, NORMAL vs FULL, same crash points)

```text
NORMAL: torn recovered images         = 23
        of those, integrity_check flagged = 0   ->  SILENT torn
FULL:   torn recovered images         = 0    ->  the fsync'd WAL replay heals every split
        recovered to a committed T         = 25   ->  heal present (control is non-vacuous)
```

Under `NORMAL`, 23 recovered images were torn and `integrity_check` flagged **zero** of them; under
`FULL` at the same crash points, zero were torn.

### Violation card

- **Guarantee violated — Checkpoint Crash-Atomicity under synchronous=NORMAL:** Under `PRAGMA
  synchronous=NORMAL`, a crash at any point during a checkpoint's DB-file backfill must recover to a
  committed prefix — the recovered database must equal either the pre-transaction state (S0) or a
  fully-committed transaction (T), never a torn mix of persisted backfill pages and a dropped WAL tail.
- **Scenario:** checkpoint under `synchronous=NORMAL`; crash injected mid-backfill (crash-sim IO);
  reopen; stock `integrity_check`; `FULL` control at the same crash point.
- **Observed:** 23 recovered images torn, `integrity_check` caught 0 (silent); `FULL` control 0 torn.
- **Expected:** recovered DB `== S0` or `T`; `integrity_check` clean.
- **Actual:** recovered DB `== torn(1..j)`; `integrity_check` reports "ok" (silent corruption).

Reported upstream: this behavior is tracked in `tursodatabase/turso` #7781 (assert checkpoint backfill
crash-atomicity), which has merged — the assertion landed and a fix is pending.

---

---"""
