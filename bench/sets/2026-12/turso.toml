# turso-56: ALTER TABLE ADD COLUMN should keep column COLLATE clauses in the stored CREATE TABLE text.
# issue opened 2026-08-06, fix opened 2026-08-25, merge commit; source files: core/schema.rs (17 lines); request from
# oldest of 2 edit records.
# reading notes: issue drafted with Claude Code; exact stored SQL follows from the formats shown in the issue
# added to the candidate's hidden tests: sqlite/conformance/sqlite-sqltests/alter_table.sqltest
[[situation]]
id = "turso-56"
request = """
ALTER TABLE ADD COLUMN drops COLLATE from the stored schema, changing query results and letting a UNIQUE index accept duplicates

## Description

`ALTER TABLE ... ADD COLUMN` rewrites the stored `CREATE TABLE` text from the parsed schema instead of editing the original, and the rewrite loses `COLLATE`. Every connection that opens the database afterwards reads a schema where the column is `BINARY`, so comparisons silently change meaning and a `UNIQUE` index built under `NOCASE` starts accepting duplicates. The change is persisted, and `PRAGMA integrity_check` does not notice.

## Rows stop matching

```sql
CREATE TABLE tbl(col1 TEXT COLLATE NOCASE);
INSERT INTO tbl VALUES ('ABC');

SELECT count(*) FROM tbl WHERE col1 = 'abc';   -- 1 in both engines

ALTER TABLE tbl ADD COLUMN extra TEXT;

SELECT count(*) FROM tbl WHERE col1 = 'abc';
-- Turso:  0
-- SQLite: 1
```

The stored schema after the ALTER:

```
-- SQLite: CREATE TABLE tbl(col1 TEXT COLLATE NOCASE, extra TEXT)
-- Turso:  CREATE TABLE tbl (col1 TEXT, extra TEXT)
```

## A UNIQUE index then accepts a duplicate

```sql
CREATE TABLE tbl(col1 TEXT COLLATE NOCASE);
CREATE UNIQUE INDEX u ON tbl(col1);
INSERT INTO tbl VALUES ('ABC');

INSERT INTO tbl(col1) VALUES ('abc');   -- both engines: UNIQUE constraint failed

ALTER TABLE tbl ADD COLUMN extra TEXT;

INSERT INTO tbl(col1) VALUES ('abc');
-- Turso:  accepted
-- SQLite: UNIQUE constraint failed: tbl.col1

SELECT col1 FROM tbl ORDER BY rowid;
-- Turso:  ABC , abc
-- SQLite: ABC

PRAGMA integrity_check;   -- "ok" in both
```

The table now holds a pair of rows that the index was created to forbid, and nothing reports it.

## Only COLLATE is lost

Turso already normalises whitespace and drops comments when it stores a schema, but the pre-ALTER text keeps the collation:

```
-- before ALTER, Turso:
CREATE TABLE tbl (col1 TEXT COLLATE NOCASE DEFAULT 'hi', n INTEGER NOT NULL DEFAULT (1 + 2), ...)
-- after ALTER, Turso:
CREATE TABLE tbl (col1 TEXT DEFAULT 'hi', n INTEGER NOT NULL DEFAULT (1 + 2), ...)
```

`CHECK`, `NOT NULL`, `DEFAULT`, `UNIQUE` and `PRIMARY KEY` all survive, and a column-level `REFERENCES` is rewritten to an equivalent table-level `FOREIGN KEY`. `COLLATE` is the one clause that disappears, so the defect is in the ALTER-specific schema rewrite rather than the general schema printer.

Found with a differential fuzzer against SQLite 3.54.0. `main` @ `bc62e487`, debug build.

---
*This issue brought to you by Mikaël and Claude Code.*"""
