# turso-05: Remove the logical-log fsync after the MVCC checkpoint truncates the log, and add a recovery test that old
# frames are skipped.
# issue opened 2026-11-17, fix opened 2026-11-17, merge commit; source files: core/mvcc/database/checkpoint.rs,
# core/mvcc/database/mod.rs, core/mvcc/persistent_storage/logical_log.rs, core/vdbe/execute.rs,
# sync/engine/src/database_sync_engine.rs (82 lines); request from oldest of 2 edit records.
# reading notes: filed by fixer; text names the fix; a test also requires the MVCC-to-WAL switch to make the
# truncation durable, an edge the issue does not mention.
[[situation]]
id = "turso-05"
request = """
MVCC: remove the logical log fsync from the checkpoint

After the checkpoint truncates the logical log, it fsyncs the log (`CheckpointState::FsyncLogicalLog`). This fsync is not necessary.

## Why the fsync is not necessary

Before the truncation, the checkpoint fsyncs the database file. At that point, the database file has the new `persistent_tx_ts_max`.

If a crash loses the truncation, the old frames come back in the logical log. Recovery replays only the frames with `commit_ts > persistent_tx_ts_max`. All the old frames are at or below this value, so recovery skips them. Thus recovery gives the same result with or without the truncation.

## What to do

1. Remove `CheckpointState::FsyncLogicalLog`.
2. Add a recovery test. After a checkpoint, put the old frames back in the logical log, then open the database again. Recovery must skip the old frames.

## Code pointers

- `CheckpointState::FsyncLogicalLog` in `core/mvcc/database/checkpoint.rs`
- The recovery rules at the top of `core/mvcc/persistent_storage/logical_log.rs`"""
