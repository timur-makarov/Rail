# turso-18: After a 'database or disk is full' error inside a transaction, a later INSERT must not panic and the
# statement rollback must work.
# issue opened 2026-09-23, fix opened 2026-10-24, merge commit; source files: core/storage/btree.rs,
# core/storage/pager.rs (8 lines); request from body (never edited).
# reading notes: Text names the cause.
[[situation]]
id = "turso-18"
request = """
Panic after "database or disk is full" inside a transaction

Inside a transaction, an INSERT that fails with "database or disk is full" leaves a page in the page cache that the statement rollback cannot remove. The next INSERT that allocates the same page number panics.

```sql
CREATE TABLE t(id INTEGER PRIMARY KEY, a);
PRAGMA max_page_count=3;
BEGIN;
INSERT INTO t VALUES (2, zeroblob(3000)), (1, zeroblob(3000));
-- Turso:  Runtime error: database or disk is full (13)
-- SQLite: Runtime error: database or disk is full (13)
PRAGMA max_page_count=10;
INSERT INTO t VALUES (3, zeroblob(3000)), (4, zeroblob(3000));
-- Turso:  panic (see below)
-- SQLite: ok
COMMIT;
SELECT count(*) FROM t;
-- SQLite: 2
```

After the first INSERT, Turso logs:

```
ERROR turso_core::vdbe: Failed to rollback statement savepoint during abort: page 3 is pinned
ERROR turso_core::vdbe: Abort failed during error handling: page 3 is pinned
```

The second INSERT then stops the process:

```
thread 'main' panicked at core/storage/page_cache.rs:287:21:
Attempted to insert different page with same key: {key:?}
```

The same panic occurs with `SAVEPOINT s1` and `RELEASE s1` in place of `BEGIN` and `COMMIT`. The database file stays valid: sqlite3 `PRAGMA integrity_check` gives `ok`.

Tested on main at `dfca1dcf` with sqlite3 3.45.1.

### Cause

1. The first INSERT overflows the root page. `balance_root` allocates page 3. Then `do_allocate_page` for the next sibling returns `DatabaseFull` inside `balance_non_root` (`core/storage/btree.rs:4337`).
2. The cursor of the failed statement is still open, and its balance state still holds a `PinGuard` on page 3 (`BalanceInfo::pages_to_balance`, `btree.rs:493`).
3. The abort calls `rollback_to_snapshot`. There, `cache.truncate(db_size)?` fails with `page 3 is pinned` (`core/storage/pager.rs:2588`).
4. The function returns early. It does not rewind the WAL, and it does not call `invalidate_all_cursors` (`pager.rs:2591-2610`).
5. The old page 3 stays in the page cache, but the restored header gives 2 pages. The next allocation of page 3 calls `force_insert_page` (`pager.rs:5999`), and the assert in `page_cache.rs:287` fails.

### Related

- #7702 reports a panic after the disk became full, with no reproducer. I do not know if it has the same cause.
- #3130 (closed) reported the same assert from a different path."""
