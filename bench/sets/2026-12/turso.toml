# turso-43: ALTER TABLE reprints table-level UNIQUE/PRIMARY KEY constraints without per-column DESC and COLLATE, so
# after reopen the constraint is weakened.
# issue opened 2026-09-05, fix opened 2026-10-08, merge commit; source files: core/schema.rs (58 lines); request from
# body (never edited).
[[situation]]
id = "turso-43"
request = """
ALTER TABLE drops DESC and COLLATE from a table-level constraint

Currently, `ADD COLUMN` reprints a table-level UNIQUE or PRIMARY KEY without its per-column `DESC` or `COLLATE`, while the index keeps its original definition. Reopen the file and that UNIQUE column accepts a duplicate.

```sql
CREATE TABLE t(a TEXT, UNIQUE(a DESC));
CREATE TABLE u(a TEXT, UNIQUE(a COLLATE NOCASE));
CREATE TABLE v(a TEXT COLLATE NOCASE, UNIQUE(a));
CREATE UNIQUE INDEX ix ON v(a DESC);

ALTER TABLE t ADD COLUMN q TEXT;
SELECT sql FROM sqlite_master WHERE name='t';
-- Turso:  CREATE TABLE t (a TEXT, q TEXT, UNIQUE (a))
-- SQLite: CREATE TABLE t(a TEXT, q TEXT, UNIQUE(a DESC))
-- reopen a file written this way and INSERT INTO t VALUES('a') twice is accepted

ALTER TABLE u ADD COLUMN q TEXT;
SELECT sql FROM sqlite_master WHERE name='u';
-- Turso:  CREATE TABLE u (a TEXT, q TEXT, UNIQUE (a))
-- SQLite: CREATE TABLE u(a TEXT, q TEXT, UNIQUE(a COLLATE NOCASE))
-- COLLATE goes the same way as DESC, so it is every per-column modifier

ALTER TABLE v ADD COLUMN q TEXT;
SELECT sql LIKE '%COLLATE NOCASE%' FROM sqlite_master WHERE name='v';
-- both 1, so the same modifier written at column level survives
SELECT sql LIKE '%a DESC%' FROM sqlite_master WHERE name='ix';
-- both 1, and an explicitly created index keeps its DESC

INSERT INTO t(a) VALUES('a');
INSERT INTO t(a) VALUES('a');
SELECT count(*) FROM t;
-- both UNIQUE constraint failed: t.a, then 1, so the open connection still enforces it
```

`DROP COLUMN` does the same, and a table-level `PRIMARY KEY(a DESC)` is reprinted as a column-level `a TEXT PRIMARY KEY`.

tested on main & SQLite 3.50.4"""
