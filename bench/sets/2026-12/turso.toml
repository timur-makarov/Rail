# turso-35: Inside BEGIN CONCURRENT, a busy AUTOINCREMENT id allocation must retry the inner transaction instead of
# committing the outer one.
# issue opened 2026-10-05, fix opened 2026-10-18, merge commit; source files: core/vdbe/execute.rs (17 lines); request
# from body (never edited).
# reading notes: Test pins the 'retry and succeed' outcome, one of the two the issue allows; deterministic Busy
# stepping, no sleeps. Text names the cause and fix options.
[[situation]]
id = "turso-35"
request = """
MVCC: a busy AUTOINCREMENT id allocation inside BEGIN CONCURRENT commits the outer transaction

## Summary

Inside `BEGIN CONCURRENT`, an `INSERT` into an `AUTOINCREMENT` table allocates the id in an inner transaction (`SequenceBeginInnerTx` / `SequenceCommitInnerTx`). If that inner commit is busy because another connection holds the write lock, the retry ends up committing the **outer** transaction. The insert then fails with `No such transaction ID`. `ROLLBACK` reports that no transaction is active, and the transaction's earlier writes stay committed although the application rolled it back. Found while building an Elixir binding on turso_core.

## Reproduction (Rust, turso_core only)

`Cargo.toml`: `turso_core = "0.8.1"`

```rust
use std::sync::Arc;
use std::time::Duration;
use turso_core::{Database, PlatformIO, SqliteDialect, StepResult, IO};

fn main() -> Result<(), Box<dyn std::error::Error>> {
    let io: Arc<dyn IO> = Arc::new(PlatformIO::new()?);
    let db = Database::open_file(io, "inner_tx.db", Arc::new(SqliteDialect))?;
    let a = db.connect()?;
    a.execute("PRAGMA journal_mode = 'mvcc'")?;
    let b = db.connect()?;
    a.execute("CREATE TABLE s (id INTEGER PRIMARY KEY AUTOINCREMENT, v INTEGER)")?;
    a.execute("CREATE TABLE p (v TEXT)")?;
    a.set_busy_timeout(Duration::from_secs(5));

    // b holds the write lock.
    b.execute("BEGIN IMMEDIATE")?;
    b.execute("INSERT INTO p VALUES ('b')")?;

    // a writes in a concurrent transaction, then inserts into the AUTOINCREMENT table.
    a.execute("BEGIN CONCURRENT")?;
    a.execute("INSERT INTO p VALUES ('a')")?;
    let mut insert = a.prepare("INSERT INTO s (v) VALUES (1)")?;
    let mut b_committed = false;
    let result = loop {
        match insert.step() {
            Ok(StepResult::IO) | Ok(StepResult::Yield) => insert._io().step()?,
            // The id allocation's inner commit is busy: release the lock and step again.
            Ok(StepResult::Sleep { .. }) | Ok(StepResult::Busy) if !b_committed => {
                b.execute("COMMIT")?;
                b_committed = true;
            }
            Ok(StepResult::Sleep { duration }) => std::thread::sleep(duration),
            other => break other,
        }
    };
    drop(insert);
    println!("insert: {result:?}");
    println!("rollback: {:?}", a.execute("ROLLBACK"));

    let c = db.connect()?;
    println!("p: {:?}", c.prepare("SELECT v FROM p ORDER BY v")?.run_collect_rows()?);
    Ok(())
}
```

**Expected:** the insert either waits and succeeds, or fails with a busy error that leaves the transaction intact. After `ROLLBACK`, `p` contains only `'b'`.

**Actual (0.8.1 and main):**
```
insert: Err(NoSuchTransactionID("4"))
rollback: Err(TxError("cannot rollback - no transaction is active"))
p: [[Text(Text { value: "a", subtype: Text })], [Text(Text { value: "b", subtype: Text })]]
```

`'a'` was committed by a transaction that the application rolled back.

## Analysis

On `Busy`, `op_sequence_commit_inner_tx` rolls back the inner transaction, points the connection back at the outer transaction and returns `Busy`. `Program::fail_step` then retries the same PC. `SequenceCommitInnerTx` finds no inner commit in progress, takes the connection's current transaction (now the outer one) as the inner one, and commits it.

- If the outer transaction hasn't written yet, it is committed read-only and removed. The statement's cursor still refers to it, hence `No such transaction ID`.
- If the outer transaction has written, those writes become durable (as above).
- If the insert runs inside a trigger, turso_core panics instead. To see this, add `CREATE TABLE q (v TEXT)` and `CREATE TRIGGER q_ins AFTER INSERT ON q BEGIN INSERT INTO s (v) VALUES (2); END`, and step `INSERT INTO q VALUES (1)` instead of the insert into `s`. The result is `panicked at core/mvcc/database/mod.rs:7248: Transaction 6 not found while rolling back savepoint` (main: `mod.rs:7263`).

A possible fix is to keep the inner transaction's id in the program state (`sequence_inner_tx_pending`) instead of reading it back from the connection. On `Busy`, either keep the inner transaction and its commit state machine for the retry, or jump back to the retry label as the conflict path does. The busy-budget-exhausted path appears to have the same problem. (PR #7915 fixed the conflict path only.)

## Versions

- turso_core 0.8.1: reproduced.
- main at 36da5b2e4: reproduced with the same program and output.

## Impact

Atomicity violation: part of a rolled-back transaction is committed. It happens whenever a `BEGIN CONCURRENT` transaction inserts into an `AUTOINCREMENT` table while another connection holds the write lock (an exclusive transaction, or a checkpoint). Our binding works around it by resetting such a statement and reporting busy, which forces a rollback."""
start = "c876402b8650e4a599e9fe0664422410d0913949"
fix = "611a2b445b491cd6b5ccdf2fae16d1a35af1b7de"
hidden_tests = ["core/mvcc/database/tests.rs"]
closed = 2026-10-19
