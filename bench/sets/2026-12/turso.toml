# turso-06: When tursopg gets several statements and one has a syntax error, it skips keyword-less bad statements
# silently and runs the ones before; it should report the error and run none.
# issue opened 2026-11-11, fix opened 2026-11-11, merge commit; source files: postgres/frontend/session.rs,
# postgres/parser/lib.rs (10 lines); request from body (never edited).
# reading notes: filed by fixer; text names the cause (split_with_scanner); a test also expects BEGIN ATOMIC bodies
# not to split, which follows from parser-based splitting.
[[situation]]
id = "turso-06"
request = """
tursopg: a statement with a syntax error is skipped without an error when sent with other statements

## Summary

When the tursopg CLI gets several statements in one text and one of them has a syntax error, it does not behave like PostgreSQL:

1. **A statement that contains no SQL keyword is skipped without an error.** For example, a misspelled `COMMIT` is ignored, tursopg prints nothing and exits with 0, and the transaction is never committed.
2. **The statements before the bad one run, and their changes are kept.** PostgreSQL runs none of them.

This happens with the SQL argument (`tursopg db "..."`) and with several statements on one line of the REPL or of stdin. A script with one statement per line shows the error.

The tursopg wire server is not affected. It rejects the whole query, like PostgreSQL.

## 1. A misspelled statement is skipped without an error

```console
$ tursopg test.db "CREATE TABLE t (x int); BEGIN; INSERT INTO t VALUES (1); comit;"
$ echo $?
0
$ tursopg test.db "SELECT count(*) FROM t"
┌───────┐
│ count │
├───────┤
│     0 │
└───────┘
```

No error is printed, the exit code is 0, and the inserted row is lost because `COMMIT` never ran.

PostgreSQL 18.6 with the same text:

```console
$ psql -c "CREATE TABLE t (x int); BEGIN; INSERT INTO t VALUES (1); comit;"
ERROR:  syntax error at or near "comit"
LINE 1: ...ATE TABLE t (x int); BEGIN; INSERT INTO t VALUES (1); comit;
                                                                 ^
$ echo $?
1
```

A shorter example:

```console
$ tursopg :memory: "SELECT 1; selecgt 2; SELECT 3;"
┌──────────┐
│ ?column? │
├──────────┤
│        1 │
└──────────┘
┌──────────┐
│ ?column? │
├──────────┤
│        3 │
└──────────┘
$ echo $?
0
```

`psql -c "SELECT 1; selecgt 2; SELECT 3;"` prints only `ERROR:  syntax error at or near "selecgt"` and exits with 1.

The same thing happens when the statements are on one line of stdin:

```console
$ printf 'SELECT 1; selecgt 2;\\n' | tursopg :memory:
┌──────────┐
│ ?column? │
├──────────┤
│        1 │
└──────────┘
$ echo $?
0
```

psql prints the result of `SELECT 1` and then `ERROR:  syntax error at or near "selecgt"`.

Only statements that contain no SQL keyword are skipped: `selecgt 2`, `foo`, `comit`. A statement like `delet FROM t WHERE x = 1` contains `FROM`, so tursopg reports its syntax error.

## 2. The statements before a syntax error run

```console
$ tursopg test.db "CREATE TABLE t (x int); INSERT INTO t VALUES (1); SELECT FROM WHERE;"
ERROR:  Invalid statement: syntax error at or near "WHERE"
$ tursopg test.db "SELECT x FROM t"
┌───┐
│ x │
├───┤
│ 1 │
└───┘
```

PostgreSQL parses the whole text of a query before it runs any of it. `psql -c` with the same text prints `ERROR:  syntax error at or near "WHERE"`, and table `t` is not created.

## Expected behaviour

- `tursopg db "SQL"`, and `PgConnection::query_runner` which it uses, should behave like the server: if any statement has a syntax error, report the error and run nothing.
- For the REPL and stdin, psql sends each statement on its own, so `SELECT 1; selecgt 2; SELECT 3;` on one line prints `1`, the error, then `3`. Whether tursopg should match that is a separate question, but it must always print the error.

## Notes for the fix

The text is split with `pg_query::split_with_scanner`, which drops any part of the text between two semicolons that contains no SQL keyword. Tests that send `SELECT 1; selecgt 2;` currently only check that `SELECT 1` succeeds, so they pass even though the error is lost.

## Versions

- tursopg built from `main` at 3cc96a1888
- PostgreSQL 18.6, psql 18"""
