# turso-63: A parked partial checkpoint must not publish a stale nbackfills into a restarted WAL generation, which
# hides committed rows and corrupts recovery.
# issue opened 2026-07-03, fix opened 2026-07-07, merge commit; source files: core/storage/pager.rs,
# core/storage/wal.rs (58 lines); request from oldest of 3 edit records.
# reading notes: text names the cause; full reproducer is on a linked branch but the timeline is described
[[situation]]
id = "turso-63"
request = """
Parked checkpoint publishes stale nbackfills into a restarted WAL generation: committed rows vanish, recovery corrupts the b-tree (Antithesis TableLeaf assert)

## Summary

A **partially backfilled** checkpoint drops all WAL locks at the WAL-level `Finalize` step (`core/storage/wal.rs:4851`, the `!should_truncate()` branch) but publishes `nbackfills` only later, from the pager phases `SyncDbFile → ReadDbIdentity → PublishBackfill` (`core/storage/pager.rs:4646`, `:4668`, `:4709-4713`), which yield on IO in between. `publish_backfill` is a blind store with no monotonicity or generation check (`core/storage/wal.rs:872-878`).

If, while the checkpoint is parked in that lock-free window, another connection completes the backfill and **restarts the WAL** (legal: fully backfilled, no locks held — `try_restart_log_before_write`, `core/storage/wal.rs:4915`), the parked checkpoint later stores the *old* generation's backfill count into the *new* generation, leaving `nbackfills > max_frame`. Every reader then computes `min_frame = nbackfills + 1` and finds no WAL frame in range, so **every committed frame of the new generation is invisible**: committed rows vanish, re-inserting a committed PRIMARY KEY succeeds, later writers build on the stale view, and WAL recovery merges the divergent histories into b-tree corruption.

This is the failure chain behind the Antithesis hit of `matches!(self.page_type(), Ok(PageType::TableLeaf))` in `cell_table_leaf_read_rowid` (`core/storage/pager.rs:434`) under `stress/singleton_driver_stress.sh`: the stress workload constantly produces exactly this shape — one thread's commit crosses the auto-checkpoint threshold (`commit_tx` releases the read+write locks *before* running the checkpoint, `core/storage/pager.rs:3010-3011`), the other thread's in-flight read caps `mxSafeFrame` so the backfill is partial, and WAL restarts are routine.

## Timeline (deterministic, single-threaded, public API only)

1. Conn A commits 500 rows; conn B parks a `SELECT` mid-scan (holds a read mark).
2. A commits 600 more rows in one transaction; the COMMIT crosses the 1000-frame auto-checkpoint threshold. Because of B's read mark the backfill is partial, so the guard drops at WAL `Finalize` while `publish_backfill(M1)` is still pending. A's COMMIT statement is parked at the next IO yield (no locks held).
3. B finishes its scan, runs `PRAGMA wal_checkpoint` (full backfill, `nbackfills == max_frame`), then INSERTs — the write path restarts the WAL — and commits 3 rows into the new generation.
4. A's COMMIT is resumed: `publish_backfill(M1)` poisons the new generation (`nbackfills ≈ 1110`, `max_frame ≈ 10`).

## Reproducer

`wal_stale_publish_backfill_hides_committed_rows` on branch [`claude/table-leaf-assertion-reproducer-u6oa9d`](https://github.com/tursodatabase/turso/compare/main...claude/table-leaf-assertion-reproducer-u6oa9d) (uses the existing `QueuedIo` test harness to park the COMMIT at each trailing IO yield; no engine internals touched):

```
cargo test -p core_tester --test integration_tests wal_stale_publish_backfill_hides_committed_rows
```

Fails on main (`8f157dc1`) in ~2s:

```
WAL generation poisoned by stale publish_backfill (COMMIT parked after 7/8 IO pumps):
- rows committed by connection B vanished: got [], expected [1000001, 1000002, 1000003]
- re-INSERT of invisible committed PRIMARY KEY 1000001: Ok(()) (should be constraint error)
- integrity_check after reopen+recovery: "*** in database main *** Page 1105 (Normal) cell 1
  has rowid=1000001 in wrong order. Parent cell has parent_rowid=1099 and next_rowid=1099"
```

Under the stress workload the same divergent-history merge lands on pages that changed type (table leaf freed and reused as index/interior page), which is where `cell_table_leaf_read_rowid` trips its page-type assert instead.

## Fix direction

Either hold the checkpoint guard through DB-fsync + publish for partial checkpoints too (TRUNCATE already carries the guard via `maybe_guard`, `core/storage/wal.rs:4849` → `core/storage/pager.rs:4770`), or make `publish_backfill` reject stale publishes (generation/`checkpoint_seq` tag or `nbackfills <= max_frame` clamp)."""
