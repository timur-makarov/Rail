# turso-60: When ALTER TABLE RENAME COLUMN is rejected for a trigger, the error should name the column reference as
# written (e.g. t.b).
# issue opened 2026-07-03, fix opened 2026-07-03, merge commit; source files: core/translate/alter.rs (31 lines);
# request from body (never edited).
# reading notes: test regex also covers doubly-qualified and quoted references (dequoted T.B)
[[situation]]
id = "turso-60"
request = """
ALTER TABLE Error Message Omits Table Qualifier for Column References

## Description

When `ALTER TABLE` validation rejects an operation because a trigger references a renamed column via a **table-qualified** name, Turso reports only the bare column name. SQLite reports the reference as written in the expression.

Both engines correctly reject the rename. This is error-message compatibility only — no data corruption or silent wrong behaviour.

Found while working on PR [#7681](https://github.com/tursodatabase/turso/pull/7681) [#7646]: the same column-name mismatch also affects `DROP COLUMN` when a `CHECK` constraint uses a table-qualified reference (e.g. `t_check_qual.a`). That path depends on #7681 landing first; the reproducer below does not.

## Reproducer

```sql
CREATE TABLE t (a, b);
CREATE TRIGGER tr BEFORE UPDATE ON t WHEN t.b > 0 BEGIN SELECT 1; END;
ALTER TABLE t RENAME COLUMN b TO c;
-- Turso:  error in trigger tr after rename: no such column: b
-- SQLite: error in trigger tr: no such column: t.b
```

Unqualified references in the same situation already match:

```sql
CREATE TABLE t (a, b);
CREATE TRIGGER tr BEFORE UPDATE ON t WHEN b > 0 BEGIN SELECT 1; END;
ALTER TABLE t RENAME COLUMN b TO c;
-- Both: error in trigger tr: no such column: b
```

Related case (requires #7681; same bare-name bug in the column reference):

```sql
CREATE TABLE t_check_qual (a INTEGER, b INTEGER CHECK (t_check_qual.a < b));
ALTER TABLE t_check_qual DROP COLUMN a;
-- Turso:  error in table t_check_qual after drop column: no such column: a
-- SQLite: error in table t_check_qual after drop column: no such column: t_check_qual.a
```

Regression test to reproduce:

```
@database :memory:

@cross-check-integrity
test rename_column_trigger_when_qualified_ref_error_message {
    CREATE TABLE t (a, b);
    CREATE TRIGGER tr BEFORE UPDATE ON t WHEN t.b > 0 BEGIN SELECT 1; END;
    ALTER TABLE t RENAME COLUMN b TO c;
}
expect error {
    error in trigger tr: no such column: t.b
}
```"""
