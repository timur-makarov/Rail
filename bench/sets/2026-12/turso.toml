# turso-19: Under MVCC after a checkpoint, an index scan must return a row its own transaction inserts ahead of the
# scan position.
# issue opened 2026-10-26, fix opened 2026-10-26, merge commit; source files: core/mvcc/cursor.rs,
# core/mvcc/database/mod.rs (78 lines); request from body (never edited).
# reading notes: AI-drafted (autofixer review). Tests also cover own deletes and ROLLBACK TO ahead of the scan; same
# mechanism, small doubt.
[[situation]]
id = "turso-19"
request = """
MVCC: after a checkpoint, an index scan does not return a row that its own transaction inserts ahead of the scan

## Summary

In MVCC mode, a covering index scan does not return an index entry that its own transaction inserts ahead of the scan position, if the index has entries in the B-tree (after a checkpoint). SQLite returns the new row. When all index entries are still in version chains (no checkpoint), Turso also returns it.

Autofixer found this while it reviewed https://github.com/tursodatabase/turso/pull/10715. That PR moves MVCC table read cursors to `BTreeCursor`. Index cursors still use `MvccLazyCursor`, so the problem is outside that PR.

## Reproduction

The scan and the insert run on one connection, with their steps interleaved. The CLI and `.sqltest` cannot express this, so this is a Rust test for `core/mvcc/database/tests.rs`:

```rust
#[test]
fn mvcc_index_scan_sees_its_own_insert_ahead_of_the_scan() {
    let db = MvccTestDb::new();
    let conn = &db.conn;
    conn.execute("PRAGMA mvcc_checkpoint_threshold = -1").unwrap();
    conn.execute("CREATE TABLE t(id INTEGER PRIMARY KEY, v TEXT)").unwrap();
    conn.execute("CREATE INDEX i ON t(v)").unwrap();
    conn.execute(
        "INSERT INTO t VALUES (1,'a'),(2,'b'),(3,'c'),(4,'d'),(6,'f'),(7,'g'),(8,'h'),(9,'i')",
    )
    .unwrap();
    conn.execute("PRAGMA wal_checkpoint(TRUNCATE)").unwrap();

    conn.execute("BEGIN").unwrap();
    let mut scan = conn.prepare("SELECT v FROM t WHERE v > ''").unwrap();
    let mut rows: Vec<String> = Vec::new();
    let mut written = false;
    loop {
        if !written && rows.len() == 3 {
            conn.execute("INSERT INTO t VALUES (5, 'e')").unwrap();
            written = true;
        }
        match scan.step().unwrap() {
            StepResult::Row => {
                let row = scan.row().unwrap();
                rows.push(row.get_value(0).to_text().unwrap().to_string());
            }
            StepResult::IO => scan.get_pager().io.step().unwrap(),
            StepResult::Done => break,
            other => panic!("unexpected step result {other:?}"),
        }
    }
    assert_eq!(rows.join(","), "a,b,c,d,e,f,g,h,i");
}
```

The scan uses the plan `SEARCH t USING COVERING INDEX i (v>?)`.

## Expected

`a,b,c,d,e,f,g,h,i`. SQLite 3.45.1 returns this through the C API, with the same plan and the same interleaving.

## Actual

`a,b,c,d,f,g,h,i`. A new query after the scan returns `e`.

| Checkpoint | `UPDATE t SET v = v WHERE id IN (2, 8)` before the transaction | Transaction | Scan |
|---|---|---|---|
| yes | no | `BEGIN` | misses `e` |
| yes | no | `BEGIN CONCURRENT` | misses `e` |
| yes | yes | `BEGIN` | misses `e` |
| yes | yes | `BEGIN CONCURRENT` | misses `e` |
| no | no | `BEGIN CONCURRENT` | returns `e` |
| no | yes | `BEGIN CONCURRENT` | returns `e` |

## Notes

- SQLite documents that changes that the same connection makes while a `SELECT` runs can be visible or not ("undefined", https://www.sqlite.org/isolation.html). Thus this is a compatibility difference, not a broken guarantee. But in Turso, the result depends on whether a checkpoint ran.
- https://github.com/tursodatabase/turso/pull/10715 fixes the same problem for MVCC table scans. Each transaction counts its writes to table rows, and the reader positions its version-chain iterator again when the count changed.
- Reproduced at 012a550d (the branch of https://github.com/tursodatabase/turso/pull/10715). In this scenario, the scan and the insert use only `MvccLazyCursor`, which that branch does not change."""
