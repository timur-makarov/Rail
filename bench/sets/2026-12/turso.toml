[[situation]]
id = "turso-31"
request = """
SQLite compatibility: type-name normalization changes column affinity and CAST behavior

## Summary

Turso accepts valid SQLite type declarations but normalizes their spelling
during parsing. Because the normalized type name is subsequently used to
determine column affinity and CAST behavior, this produces observable
differences from SQLite.

In particular, Turso may store a value using a different SQLite storage
class or produce a different CAST result for the same SQL.

This is a runtime SQLite compatibility issue, not merely a difference in
SQL formatting or AST representation.

## Reproduction

The following SQL is accepted by both SQLite and Turso without errors.

```sql
CREATE TABLE t (a BLOB/*INT*/REAL);

INSERT INTO t VALUES ('123');

PRAGMA table_info(t);

SELECT typeof(a), quote(a) FROM t;

SELECT
    typeof(CAST('123' AS BLOB/*INT*/REAL)),
    quote(CAST('123' AS BLOB/*INT*/REAL));
```

### Expected behavior (SQLite 3.50.4)

`PRAGMA table_info(t)`:

```text
0|a|BLOB/*INT*/REAL|0||0
```

Stored value:

```text
integer|123
```

CAST result:

```text
integer|123
```

SQLite retains the original declared type spelling, including the
intervening comment.

The `INT` substring affects SQLite's affinity determination, even
though it occurs inside a SQL comment in the type declaration.

### Actual behavior (Turso)

`PRAGMA table_info(t)`:

```text
0|a|BLOB REAL|0||0
```

Stored value:

```text
text|'123'
```

CAST result:

```text
blob|X'313233'
```

Turso removes the comment while reconstructing the type name, producing
`BLOB REAL`. This changes both column affinity and CAST behavior.

### Additional reproducer: quoted type component

```sql
CREATE TABLE t (a "BLOB" INTEGER);

INSERT INTO t VALUES ('123');

PRAGMA table_info(t);

SELECT typeof(a), quote(a) FROM t;

SELECT typeof(CAST('123' AS "BLOB" INTEGER));
```

Observed differences:

| Operation | SQLite 3.50.4 | Turso |
|---|---|---|
| Declared type | `BLOB` | `"BLOB" INTEGER` |
| Stored value | `text / '123'` | `integer / 123` |
| CAST result | `blob` | `integer` |

SQLite's type-name dequoting behavior differs from Turso's handling
of reconstructed type tokens.

## Tested versions

The behavior was reproduced using local, open-source builds:

| Engine | Version / commit |
|---|---|
| SQLite | 3.50.4 |
| Turso 0.8.1 | `8549c16595d2faf1bdd6ee24aee0be8bfabb3d4a` |
| Turso main | `c5dc0e59c431e4900d3324ddbfe04c36b73a1492` (2026-10-11) |

The Turso 0.8.1 commit was identified from the published
`turso_parser 0.8.1` crate's `.cargo_vcs_info.json`.
The parser source SHA-256 was also verified against that published crate.

Both tested Turso commits produced identical results.

Environment:

- Ubuntu 24.04.5 LTS, Linux x86_64
- Rust 1.99.0
- SQLite amalgamation 3.50.4
- Fresh in-memory database for each test

Turso was built locally:

```sh
cargo +stable build --locked -p turso_cli --bin tursodb
```

Execution:

```sh
sqlite3 -batch :memory: < case.sql

tursodb --quiet --output-mode list --vfs memory :memory: < case.sql
```

No cloud service or account was involved.

## Root cause analysis

The relevant paths were traced in the Turso 0.8.1 sources.

### 1. Type-name reconstruction in the parser

The lexer recognizes comments, and the parser skips them.

`parse_type()` reconstructs the type name from the remaining tokens,
inserting spaces between successive components.

Consequently:

```text
BLOB/*INT*/REAL
```

becomes:

```text
BLOB REAL
```

Relevant sources:

- [Parser: parse_type()](https://github.com/tursodatabase/turso/blob/8549c16595d2faf1bdd6ee24aee0be8bfabb3d4a/sqlite/parser/src/parser.rs#L1233-L1318)
- [Parser: skipped tokens](https://github.com/tursodatabase/turso/blob/8549c16595d2faf1bdd6ee24aee0be8bfabb3d4a/sqlite/parser/src/parser.rs#L364-L384)
- [Lexer: comment handling](https://github.com/tursodatabase/turso/blob/8549c16595d2faf1bdd6ee24aee0be8bfabb3d4a/sqlite/parser/src/lexer.rs#L493-L549)

### 2. Column affinity uses the reconstructed type name

The schema implementation passes the parsed type name to the type
classification logic and retains it as the declared type string.

Relevant sources:

- [Column::from_definition()](https://github.com/tursodatabase/turso/blob/8549c16595d2faf1bdd6ee24aee0be8bfabb3d4a/core/schema.rs#L5466-L5476)
- [Column::new() affinity handling](https://github.com/tursodatabase/turso/blob/8549c16595d2faf1bdd6ee24aee0be8bfabb3d4a/core/schema.rs#L5391-L5400)
- [type_from_name()](https://github.com/tursodatabase/turso/blob/8549c16595d2faf1bdd6ee24aee0be8bfabb3d4a/core/util.rs#L980-L1008)
- [Affinity::affinity()](https://github.com/tursodatabase/turso/blob/8549c16595d2faf1bdd6ee24aee0be8bfabb3d4a/core/vdbe/affinity.rs#L186-L210)

### 3. CAST uses the same normalized representation

CAST translation also derives affinity from the parsed type name.

- [CAST translator](https://github.com/tursodatabase/turso/blob/8549c16595d2faf1bdd6ee24aee0be8bfabb3d4a/core/translate/expr/translator.rs#L625-L634)

### 4. SQLite retains different type-name semantics

SQLite uses the original type span and applies its own dequoting rules.

Relevant SQLite 3.50.4 sources:

- [Type-name grammar](https://github.com/sqlite/sqlite/blob/version-3.50.4/src/parse.y#L340-L355)
- [Column type processing](https://github.com/sqlite/sqlite/blob/version-3.50.4/src/build.c#L1551-L1573)
- [CAST grammar](https://github.com/sqlite/sqlite/blob/version-3.50.4/src/parse.y#L1188-L1192)
- [CAST type processing](https://github.com/sqlite/sqlite/blob/version-3.50.4/src/expr.c#L954-L965)

## Impact

Applications using valid SQLite type spellings containing comments,
quoted components, or other significant lexical details may observe:

- Different column affinities
- Different stored value types
- Different CAST results
- Different declared types reported by `PRAGMA table_info`

These differences can affect application behavior and compatibility
with existing SQLite schemas.

Although the reproducer uses unusual type declarations, they are valid
SQLite syntax and produce well-defined observable behavior.

## Expected resolution

Preserve SQLite-compatible type-name semantics through parsing and
affinity determination.

The implementation does not necessarily need to preserve the original
SQL formatting, but it must retain enough information to reproduce
SQLite's declared-type, affinity, and CAST behavior.

Regression tests comparing the same SQL against stock SQLite would help
prevent similar issues.

## Additional investigation

A broader comparison covering 17 type spellings was performed against
SQLite 3.50.4, Turso 0.8.1, and Turso main.

The investigation includes:
- Exact build and execution commands
- Version and commit verification
- Declared-type, storage-class, and CAST comparisons
- Matching control cases
- Source-level root cause analysis

Full results:
https://gist.github.com/kazuk/8c37d84a026b46ac86c40c611dcf0d0e"""
