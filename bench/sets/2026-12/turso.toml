# turso-26: A backward index scan returns rows twice when another cursor writes the same index during the scan; it
# must match SQLite.
# issue opened 2026-09-23, fix opened 2026-10-24, merge commit; source files: core/storage/btree.rs (18 lines);
# request from body (never edited).
# reading notes: Text names the cause in detail; FK-cascade repro lives in a sqltest, the hidden test is the API
# variant.
# added to the candidate's hidden tests: sqlite/conformance/sqlite-sqltests/btree-backward-scan.sqltest
[[situation]]
id = "turso-26"
request = """
Backward index scan returns rows again after another cursor writes the same index

A backward scan of an index returns rows two times after another cursor writes the same index during the scan. The write can come from an FK action in the same statement, or from a different statement on the same connection.

```sql
PRAGMA foreign_keys=ON;
CREATE TABLE p(id INTEGER PRIMARY KEY, v INTEGER);
CREATE TABLE c(id INTEGER PRIMARY KEY, pid INTEGER REFERENCES p(id) ON DELETE CASCADE, b TEXT);
CREATE INDEX cb ON c(b);
WITH RECURSIVE s(x) AS (SELECT 1 UNION ALL SELECT x + 1 FROM s WHERE x < 20)
INSERT INTO c(id, pid, b) SELECT x, NULL, printf('%02d', x) || printf('%.800c', '.') FROM s;
INSERT INTO p(id, v) VALUES (-1, NULL);
INSERT INTO c(id, pid, b) VALUES (99, -1, 'zz');
-- The SELECT reads index cb backward. Each row that it returns goes into p,
-- so p keeps the scan order. At child 10, the REPLACE deletes p(-1), and the
-- cascade deletes child 99 from cb.
INSERT OR REPLACE INTO p(id, v) SELECT CASE WHEN id = 10 THEN -1 END, id FROM c ORDER BY b DESC;
SELECT group_concat(v, ' ') FROM (SELECT v FROM p WHERE id <> -1 ORDER BY id);
-- Turso:  99 20 19 18 17 16 15 14 13 12 11 9 8 7 11 9 8 7 6 5 4 3 2 1
-- SQLite: 99 20 19 18 17 16 15 14 13 12 11 9 8 7 6 5 4 3 2 1
```

Row 10 goes into `p(-1)`, so the last query does not show it.

The API gives the same result. A statement steps `SELECT b FROM t ORDER BY b DESC` on 2000 rows with an index on `b`. After each 97th row, the same connection executes `INSERT INTO t(b) VALUES (<a value larger than all rows>)`. Turso returns rows again, and the scan does not end. SQLite returns 2000, 1999, ..., 1.

Tested on main at `c415be85` with SQLite 3.45.1. Open PR #9193 does not change this result.

### Cause

A saved cursor position is always restored with a forward seek, but a backward scan needs the backward form of the page stack.

1. A save always uses `SeekOp::GE` (`core/storage/btree.rs:7735`), and `restore_context` seeks with it (`btree.rs:6474`).
2. On an index b-tree, a forward seek into the left child of interior cell j sets the parent cell index to j (`btree.rs:2419`). A backward seek or a backward move sets j-1 (`btree.rs:2420`, and the retreat in `get_prev_record`).
3. When `get_prev_record` leaves a leaf through its left edge, it returns the parent cell at the stored index (`btree.rs:1423`). After a restore, that cell is j, which comes after the leaf. The scan then reads the same leaf again.

A temporary print showed `parent cell index=1` after the restore on leaf page 6. The next move to the root page returned root cell 1 (row 11) again. The second move returned cell 0, and from there the scan was correct.

Backward scans of table b-trees with the same writes gave the same results as SQLite, because the parent cell index of a table b-tree does not change with the direction.

### Related

- #4803 (cursor invalidation infrastructure).
- Two ignored regression tests, `test_backward_index_scan_does_not_repeat_rows_after_fk_cascade` and `test_backward_index_scan_does_not_repeat_rows_after_insert_between_steps`, are in `tests/integration/query_processing/test_write_path.rs` on branch `claude/vibrant-cray-34jq3u`."""
