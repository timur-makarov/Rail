# turso-37: ALTER TABLE ADD/DROP COLUMN writes a non-literal DEFAULT without parentheses into the stored table SQL, so
# the database no longer opens; the default must be parenthesized.
# issue opened 2026-10-07, fix opened 2026-10-17, merge commit; source files: postgres/parser/translator.rs (85
# lines); request from body (never edited).
# reading notes: text names the fix (to_sql must parenthesize non-literal defaults); PR fixes it in the postgres
# translator path
[[situation]]
id = "turso-37"
request = """
ALTER TABLE writes a non-literal DEFAULT without parentheses into the table SQL

```sh
tursodb -q -m list --experimental-custom-types t.db "CREATE DOMAIN dm AS text DEFAULT lower('X'); CREATE TABLE t(a INTEGER) STRICT; ALTER TABLE t ADD COLUMN b dm; SELECT sql FROM sqlite_schema WHERE name='t';"
tursodb -q -m list --experimental-custom-types t.db "SELECT * FROM t;"
```

Actual:

```
CREATE TABLE t (a INTEGER, b dm DEFAULT lower ('X')) STRICT
Error: near "(": syntax error
```

The second command fails each time the file opens. `CREATE TYPE ty BASE text ENCODE value DECODE value DEFAULT lower('X')` with `ADD COLUMN b ty` gives the same result.

Expected: the table SQL keeps parentheses around the default, `b dm DEFAULT (lower ('X'))`, and the file opens again. sqlite3 keeps the parentheses of a non-literal default:

```sh
sqlite3 :memory: "CREATE TABLE t(a); ALTER TABLE t ADD COLUMN b DEFAULT (lower('X')); SELECT sql FROM sqlite_schema;"
CREATE TABLE t(a, b DEFAULT (lower('X')))
```

The PostgreSQL frontend has the same problem after ADD COLUMN or DROP COLUMN on a table with a non-literal default:

```sh
tursopg -q p.db "CREATE TABLE t (id serial PRIMARY KEY, a int); ALTER TABLE t ADD COLUMN b int"
tursopg -q p.db "SELECT * FROM t"
```

Actual:

```
Error: near "(": syntax error
```

After the ALTER, the table SQL is:

```
CREATE TABLE t (id INTEGER PRIMARY KEY DEFAULT nextval ('t_id_seq'), a INTEGER, b INTEGER) STRICT
```

`ALTER TABLE t DROP COLUMN a` gives the same error. A column with `DEFAULT now()` or `DEFAULT lower('X')` also gives this error. A column with `DEFAULT 1+2` gives `near "+": syntax error`. A table with only literal defaults opens again with no error.

Expected (PostgreSQL): the ALTER succeeds. In a new session, `SELECT * FROM t` returns:

```
 id | a | b
----+---+---
(0 rows)
```

In SQLite syntax, a column DEFAULT is a literal, a signed number, or an expression in parentheses. `BTreeTable::to_sql` writes the DEFAULT expression with no parentheses. A default that comes from a domain, a type, or the PostgreSQL translator has no parentheses in the AST. Thus the written SQL does not parse. `to_sql` must put parentheses around a non-literal default.

Code: `core/schema.rs` `BTreeTable::to_sql`"""
