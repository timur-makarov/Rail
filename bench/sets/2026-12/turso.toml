# turso-42: In MVCC mode VACUUM panics after a TRUNCATE checkpoint when rows were never checkpointed (dropped table,
# or delete before first passive checkpoint).
# issue opened 2026-10-09, fix opened 2026-10-10, merge commit; source files:
# core/mvcc/database/checkpoint_state_machine.rs (236 lines); request from body (never edited).
# reading notes: tests add a DROP INDEX scenario beyond the two in the issue; text names the probable cause
[[situation]]
id = "turso-42"
request = """
MVCC: VACUUM panics with "MVCC VACUUM reset requires checkpointed table versions to be cleared"

In `journal_mode=mvcc`, VACUUM panics after a TRUNCATE checkpoint in two cases:

1. A table has rows that were never checkpointed, and the table is dropped before the checkpoint.
2. With `--experimental-mvcc-passive-checkpoint`, a row is deleted before the first checkpoint.

Tested on main at `b1c4445` with the debug CLI.

### Case 1: DROP TABLE of rows that were never checkpointed

```sh
tursodb -q -m list --experimental-vacuum vac.db <<'EOF'
PRAGMA journal_mode='mvcc';
CREATE TABLE u(x);
INSERT INTO u VALUES (1);
DROP TABLE u;
PRAGMA wal_checkpoint(TRUNCATE);
VACUUM;
EOF
```

Result:

```
thread 'main' panicked at core/mvcc/database/mod.rs:4894:9:
MVCC VACUUM reset requires checkpointed table versions to be cleared
```

Expected: VACUUM completes.

### Case 2: passive checkpoint, DELETE before the first checkpoint

```sh
tursodb -q -m list vac2.db "PRAGMA journal_mode='mvcc';"
tursodb -q -m list --experimental-vacuum --experimental-mvcc-passive-checkpoint vac2.db \\
  "CREATE TABLE t(id INTEGER PRIMARY KEY, a INT); INSERT INTO t VALUES(1,1),(2,2); DELETE FROM t WHERE id=2; PRAGMA wal_checkpoint(TRUNCATE); VACUUM; SELECT * FROM t;"
```

Result: the same panic. Expected: `1|1`. Without `--experimental-mvcc-passive-checkpoint`, the same SQL gives `1|1`.

### Probable cause of case 1 (from code reading only)

The checkpoint does not write the rows of a table in `destroyed_tables`, so these versions keep `materialized_at = ORIGIN`. GC drops a last current version only when `materialized_at` is set. Thus `drop_unused_row_versions()` keeps them, and the assert in `reset_after_vacuum` fails.

Related: #8068 (a different VACUUM panic in MVCC, with an active reader)."""
