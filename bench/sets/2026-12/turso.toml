# turso: tursodatabase/turso, rust, proposed project of set 2026-12 (fulltest PLAN sections 3 and 4).
# Settings: written by reading the project's CI and docs at the oldest and newest start commit, nothing run;
# every command marked `unverified` is for the admission session to try and fix. Notes: notes/turso.md.
# Situations: every candidate of bench-candidates/turso.toml (REPORT-window-rule.md, 2026-11-26), in its order,
# 45 of its 63, drawn by a shuffle seeded with 20261126 (Python random.Random), stratified by
# kind: each kind's share of 45 by largest remainder, then the first of its shuffled list: crash 6, missing behaviour 3, race 5, wrong result 31.
# half is `work` for every candidate until the split after admission and the hardness runs (cloud/README.md).
# hidden_tests: the fix's changed files (start..fix, compare API) that match [project] tests or the travel
# globs ["*/snapshots/*.snap", "sqlite/conformance/database/*", "testing/sqltests/database/*"],
# and not ["Cargo.toml", "*/Cargo.toml", "Cargo.lock", "*/build.rs", "testing/sqltest/src/*", "testing/sqltests/src/*"]; deleted files left out.
# self_filed: the issue's author opened the fix. bot_filed: the issue's author is an automation account
# (a login ending in bot or -ci, or turso-github-handyman, roboturso). security_trap: the reading pass's
# flag for a request whose natural fix invites a flaw. kind race is the race flag.

# tursodatabase/turso on Rail's bench. Shared Rust choices: rust-common.md; test runner: rust-test-files.py, embedded
# in test_files with a turso hook (nextest; .sqltest files and their snapshots through the sqltest runner; the C API
# test). Read at the newest start 2cacdb46a2 (turso-01, 2026-11-24) and the oldest 8ef452a3c9 (turso-63, 2026-07-07);
# the starts of turso-60..63 (July 7-12) keep the older layout, read at 78f35283c3 (turso-60): testing/sqltests with
# its `test-runner` binary, no postgres/ crates.
# Nothing here was run.

[project]
name = "turso"
repo = "https://github.com/tursodatabase/turso"
language = "rust"
package = "turso"
# Same globs as turso.travel.json "tests". "*/tests/*" covers every crate's tests/ folder (postgres/tests,
# sync/engine/tests, bindings/*/tests, testing/stress/tests); "tests/*" is the core_tester crate.
tests = ["tests/*", "*/tests/*", "*/tests.rs", "*_tests.rs", "*.sqltest", "*.test", "testing/cli_tests/*"]
clash = "path"

[commands]
# from: rust-common.md; rust-toolchain.toml (channel 1.88, components clippy, rustfmt, rust-analyzer) is the same blob
# at all 63 start commits; Cargo.lock@2cacdb46a2 (848 packages, no git sources; pg_query 18.1.0 runs bindgen, so the
# sqltest runner and the postgres crates need libclang; rusqlite is "bundled"); cargo-nextest as in
# .github/workflows/rust.yml@2cacdb46a2 (taiki-e/install-action@nextest), installed the way
# nextest's site/src/docs/installation/pre-built-binaries.md says.
# unverified: never run; rustup on the bench's PATH is assumed (brief: "likely"); apt-get for libclang-dev assumes
# the Ubuntu machine as root; that aws-lc-sys 0.46 (via rustls in the turso crate) builds without cmake.
setup = '''
set -euo pipefail
command -v rustup >/dev/null || { echo "bench: rustup is not on PATH"; exit 1; }
mkdir -p "$CARGO_HOME/bin" "$RUSTUP_HOME"
read -r tc comps tgts < <(python3 - <<'PY'
import os, tomllib
f = next((n for n in ("rust-toolchain.toml", "rust-toolchain") if os.path.exists(n)), None)
d = {}
if f:
    t = open(f).read()
    try: d = tomllib.loads(t).get("toolchain", {})
    except tomllib.TOMLDecodeError: d = {"channel": t.strip()}
print(d.get("channel", "stable"), ",".join(d.get("components", [])) or "-", ",".join(d.get("targets", [])) or "-")
PY
)
args=(--profile minimal --component rustfmt,clippy)
if [ "$comps" != - ]; then args+=(--component "$comps"); fi
if [ "$tgts" != - ]; then args+=(--target "$tgts"); fi
rustup toolchain install "$tc" "${args[@]}"
rustup default >/dev/null 2>&1 || rustup default "$tc"
cargo --version
# libclang: pg_query's build script runs bindgen (the sqltest runner and the postgres crates depend on it).
if ! ldconfig -p 2>/dev/null | grep libclang >/dev/null; then
  export DEBIAN_FRONTEND=noninteractive
  apt-get update -qq && apt-get install -y -qq --no-install-recommends libclang-dev
fi
# cargo-nextest: CI runs every Rust test with it, one process per test; cargo finds it in $CARGO_HOME/bin.
if [ ! -x "$CARGO_HOME/bin/cargo-nextest" ]; then
  curl -LsSf https://get.nexte.st/0.9/linux | tar zxf - -C "$CARGO_HOME/bin"
fi
cargo nextest --version
CARGO_NET_OFFLINE=false cargo fetch --locked
cargo metadata --offline --format-version 1 >/dev/null
'''
# from: .github/workflows/rust.yml@2cacdb46a2 (cargo nextest run ... --no-fail-fast; conn-raw-api job:
# `cargo nextest run -p turso_core --features conn_raw_api`); tests/Cargo.toml@2cacdb46a2 ([[test]]
# integration_tests = integration/mod.rs, default features made for testing); sqlite/conformance/Makefile@2cacdb46a2
# (run-one: `sqltest run $(FILE)`, default backend rust, cwd sqlite/conformance) and testing/sqltests/Makefile@78f35283c3
# (`cargo run --bin test-runner`, cwd testing/sqltests); testing/sqltest/docs/{cli-usage,snapshot-testing}.md
# (--backend rust, --snapshot-mode no: missing or different snapshots fail, nothing written);
# postgres/conformance/Makefile (run-one-embedded, else run-one, read at run time: the pg backend's name changed
# pg -> tursopg -> tursopg-embedded between Oct 12 and Nov); .github/workflows/c-compat.yml@2cacdb46a2 (the C test).
# unverified: never run. The runner and the hook were tested on a synthetic workspace with cargo test (nextest is the
# same selectors and filters after --, per nextest's site/src/docs/selecting.md).
test_files = '''
set -o pipefail
export CARGO_INCREMENTAL=0 CI=true INSTA_UPDATE=no
python3 - {files} <<'PY'
# bench: run only the given Rust test files. Each .rs file goes to the cargo target that compiles it (read from
# `cargo metadata`): an integration test target (--test NAME), the library (--lib) or a binary (--bin NAME), with a
# libtest filter for the file's module path (or its test function names), so only that file's tests run; child modules
# kept in other files are skipped unless they are listed too. Data files and helper modules with no test in them
# travel but are not run. Exits non-zero when a file can't be placed, when nothing in the list can run, or when a call
# runs no test (an empty run would pass vacuously).
import json, os, re, subprocess, sys

RUNNER = "test"   # "test": cargo test; "nextest": cargo nextest run (same selectors and filters after --)
ALL_ARGS = []     # cargo args for every call, e.g. ["--all-features"]
PKG_ARGS = {}     # package name -> extra cargo args, e.g. {"ruff_linter": ["--all-features"]}

files = [f for f in sys.argv[1:] if f]
meta = json.loads(subprocess.run(["cargo", "metadata", "--no-deps", "--offline", "--format-version", "1"],
                                 check=True, capture_output=True, text=True).stdout)
root = meta["workspace_root"]
members = set(meta["workspace_members"])
TARGETS = []  # dicts: pid, pkg, sel (cargo args), src, dir (the crate root's folder); paths relative to root
for p in meta["packages"]:
    if p["id"] not in members:
        continue
    for t in p["targets"]:
        kinds = set(t["kind"])
        if "test" in kinds:
            sel = ["--test", t["name"]]
        elif kinds & {"lib", "rlib", "proc-macro", "cdylib", "staticlib", "dylib"}:
            sel = ["--lib"]
        elif "bin" in kinds:
            sel = ["--bin", t["name"]]
        else:
            continue  # build scripts, examples, benches
        if t.get("required-features"):
            sel += ["--features", ",".join(t["required-features"])]
        src = os.path.relpath(t["src_path"], root)
        TARGETS.append({"pid": p["id"], "pkg": p["name"], "sel": sel, "src": src, "dir": os.path.dirname(src)})


def read(path):
    try:
        with open(os.path.join(root, path), errors="replace") as f:
            return f.read()
    except OSError:
        return ""


def place(path):
    """The targets compiling `path`: the target whose crate root it is, else those whose crate root folder is the
    deepest one holding it; among several, those whose root declares the file's top module, a library before a
    binary."""
    exact = [t for t in TARGETS if t["src"] == path]
    if exact:
        return exact
    holding = [t for t in TARGETS if t["dir"] == "" or path.startswith(t["dir"] + "/")]
    if not holding:
        return []
    deepest = max(len(t["dir"]) for t in holding)
    cands = [t for t in holding if len(t["dir"]) == deepest]
    if len(cands) > 1:
        top = os.path.relpath(path, cands[0]["dir"]).split("/")[0]
        top = top[:-3] if top.endswith(".rs") else top
        declaring = [t for t in cands if re.search(rf"\bmod\s+{re.escape(top)}\b|#\[path\s*=\s*\"[^\"]*{re.escape(top)}",
                                                    read(t["src"]))]
        cands = declaring or cands
        libs = [t for t in cands if t["sel"][0] == "--lib"]
        cands = libs or cands
    return cands


TEST_ATTR = re.compile(r"#\[\s*(?:[\w:]+::)?(?:test|tokio::test|test_case|rstest|case|quickcheck|proptest)\b")


def test_fns(path):
    """Test function names in a file: a `fn` soon after an attribute naming a test."""
    names, armed = [], 0
    for line in read(path).splitlines():
        s = line.strip()
        if TEST_ATTR.search(s):
            armed = 8
        m = re.match(r"(?:pub(?:\([^)]*\))?\s+)?(?:async\s+)?fn\s+(\w+)", s)
        if m and armed:
            names.append(m.group(1))
            armed = 0
        elif armed and s and not s.startswith(("#", "//")):
            armed -= 1
    return names


def module_path(path, t):
    rel = os.path.relpath(path, t["dir"])[:-3].split("/")
    if rel[-1] == "mod":
        rel = rel[:-1]
    return "::".join(rel)


def child_modules(path):
    """Modules the file declares that live in other files (`mod x;`, not `mod x { ... }`)."""
    return re.findall(r"^\s*(?:#\[[^\]]*\]\s*)*(?:pub(?:\([^)]*\))?\s+)?mod\s+(\w+)\s*;", read(path), re.M)


# turso: nextest as CI runs it (one process per test); turso_core's unit tests with conn_raw_api as CI's
# conn-raw-api job runs them; .sqltest files (and the snapshots they own) through the sqltest runner, Rust backend;
# the C API test through its Makefile; what needs another language or a cfg flag travels but is not run.
RUNNER = "nextest"
PKG_ARGS = {"turso_core": ["--features", "conn_raw_api"]}
SQLTEST = {}   # (manifest, bin, cwd, extra args) -> [paths relative to cwd]
SQLTEST_COUNT = r"(\d+) passed"


def sqltest_runner():
    """(manifest, bin) of the sqltest runner at this commit: testing/sqltest (from late July 2026), else the older
    testing/sqltests."""
    import tomllib
    for d in ("testing/sqltest", "testing/sqltests"):
        man = os.path.join(root, d, "Cargo.toml")
        if os.path.exists(man):
            with open(man, "rb") as fh:
                m = tomllib.load(fh)
            bins = [b["name"] for b in m.get("bin", []) if "name" in b]
            return man, (bins[0] if bins else m["package"]["name"])
    return None, None


def pg_command(rel):
    """postgres/conformance: the Makefile's own one-file recipe (embedded backend when there is one), with the
    tursopg server built first when the recipe needs it. Returns (prebuild argv or None, runner args)."""
    import shlex
    text = read("postgres/conformance/Makefile")
    recipe = None
    for target in ("run-one-embedded", "run-one"):
        m = re.search(rf"^{target}:[^\n]*\n\t([^\n]+)", text, re.M)
        if m:
            recipe = m.group(1)
            break
    if recipe is None:
        return None, None
    pre = None
    if "$(TURSOPG)" in recipe:
        pkg = re.search(r"^build-tursopg:[^\n]*\n\t[^\n]*--package\s+(\S+)", text, re.M)
        pre = ["cargo", "build", "--package", pkg.group(1) if pkg else "tursopg"]
    recipe = recipe.replace("$(TURSOPG)", os.path.join(root, "target", "debug", "tursopg")).replace("$(FILE)", rel)
    recipe = re.sub(r"^\s*\$\((?:SQLTEST|TEST_RUNNER)\)\s*", "", recipe)
    recipe = re.sub(r"\$\([A-Z_]+\)", "", recipe)
    return pre, shlex.split(recipe)


def add_sqltest(path):
    man, binname = sqltest_runner()
    if not man:
        print(f"bench: {path}: no sqltest runner in this tree", flush=True)
        return
    if path.startswith("postgres/conformance/"):
        cwd = os.path.join(root, "postgres/conformance")
        pre, args = pg_command(os.path.relpath(os.path.join(root, path), cwd))
        if args is None:
            print(f"bench: {path}: postgres/conformance/Makefile has no run-one recipe", flush=True)
            return
        if pre and pre not in [o[0] for o in other]:
            other.insert(0, (pre, root))
        other.append((["cargo", "run", "--manifest-path", man, "--bin", binname, "--", *args], cwd, SQLTEST_COUNT))
        return
    if path.startswith(("sqlite/conformance/", "testing/shared-sqltests/")) and os.path.isdir(
            os.path.join(root, "sqlite/conformance")):
        cwd = os.path.join(root, "sqlite/conformance")
    elif path.startswith("testing/sqltests/") and os.path.exists(os.path.join(root, "testing/sqltests/Cargo.toml")):
        cwd = os.path.join(root, "testing/sqltests")
    else:
        cwd = os.path.join(root, os.path.dirname(path))
    key = (man, binname, cwd)
    rel = os.path.relpath(os.path.join(root, path), cwd)
    if rel not in SQLTEST.setdefault(key, []):
        SQLTEST[key].append(rel)


def project_hook(path, runs, other):
    if path.endswith(".sqltest"):
        if os.path.exists(os.path.join(root, path)):
            add_sqltest(path)
        else:
            print(f"bench: {path} is not in the tree", flush=True)
        return True
    if path.endswith(".snap") and "/snapshots/" in path:
        folder = os.path.dirname(os.path.dirname(path))
        stem = os.path.basename(path).split("__")[0]
        owner = os.path.join(folder, stem + ".sqltest")
        owners = [owner] if os.path.exists(os.path.join(root, owner)) else sorted(
            os.path.join(folder, n) for n in os.listdir(os.path.join(root, folder)) if n.endswith(".sqltest"))
        for o in owners:
            add_sqltest(o)
        if not owners:
            print(f"bench: {path}: no .sqltest next to its snapshots folder", flush=True)
        return True
    if path.startswith("bindings/c/tests/") and path.endswith(".c"):
        script = ("cargo build -p turso_sqlite3 --features capi && cd bindings/c/tests && make clean && "
                  "make LIBS='-L../../../target/debug -lturso_sqlite3' && LD_LIBRARY_PATH=../../../target/debug ./sqlite3-tests")
        if not any(o[0][-1] == script for o in other):
            other.append((["bash", "-c", script], root))
        return True
    if path.endswith(".rs") and re.match(r"\s*#!\[cfg\((?:shuttle|loom)\)\]", read(path)):
        print(f"bench: {path} needs RUSTFLAGS --cfg shuttle/loom: it travels, it is not run", flush=True)
        return True
    if path.endswith((".test", ".tcl")):
        print(f"bench: {path} is a Tcl test (needs tclsh and the Tcl extension): it travels, it is not run", flush=True)
        return True
    if not path.endswith(".rs") and re.search(r"\.(py|js|mjs|cjs|ts|java|kt|go|cs|dart|swift|c|h)$", path):
        print(f"bench: {path} is a test in another language: it travels, it is not run", flush=True)
        return True
    return False


def project_finish(runs, other):
    for (man, binname, cwd), rels in sorted(SQLTEST.items()):
        other.append((["cargo", "run", "--manifest-path", man, "--bin", binname, "--", "run", *rels,
                       "--backend", "rust", "--snapshot-mode", "no"], cwd, SQLTEST_COUNT))


runs = {}    # (pid, pkg, sel) -> {"filters": set, "skips": set}, or None for the whole target
other = []   # (argv, cwd[, count regex]) a project hook adds
placed, errors = [], []
for f in files:
    if project_hook(f, runs, other):
        continue
    if not f.endswith(".rs"):
        print(f"bench: {f} is a data file: it travels, it is not run", flush=True)
        continue
    ts = place(f)
    if not ts:
        errors.append(f"{f}: no cargo target of this workspace compiles it")
        continue
    placed.append((f, ts))
listed = {}
for f, ts in placed:
    for t in ts:
        listed.setdefault((t["pid"], t["pkg"], tuple(t["sel"])), set()).add(f)
for f, ts in placed:
    fns = test_fns(f)
    for t in ts:
        key = (t["pid"], t["pkg"], tuple(t["sel"]))
        skips = []
        if f == t["src"]:
            if t["sel"][0] == "--test" and len(listed[key]) == 1 and (fns or child_modules(f)):
                runs[key] = None          # the test target is this file (and the modules it declares): all of it
                continue
            filt = fns                    # a crate root: its own test functions only
        elif fns:
            mp = module_path(f, t)
            filt = [mp + "::"]
            others = {module_path(g, t) for g in listed[key] if g != f}
            skips = [f"{mp}::{c}::" for c in child_modules(f)
                     if not any(o == f"{mp}::{c}" or o.startswith(f"{mp}::{c}::") for o in others)]
        else:
            filt = []
        if not filt:
            print(f"bench: {f} holds no test of {t['pkg']} {' '.join(t['sel'])}: it travels, it is not run", flush=True)
            continue
        if key in runs and runs[key] is None:
            continue
        r = runs.setdefault(key, {"filters": set(), "skips": set()})
        r["filters"] |= set(filt)
        r["skips"] |= set(skips)
project_finish(runs, other)
for e in errors:
    print(f"bench: {e}", flush=True)
if errors:
    sys.exit(2)
if not runs and not other:
    print("bench: nothing in the list can run", flush=True)
    sys.exit(2)


def stream(cmd, cwd, count=None):
    """Run cmd, echo its output, return (exit code, tests that ran: passed + failed, ignored ones left out). `count`
    is a hook command's own regex whose groups, summed, count its tests."""
    proc = subprocess.Popen(cmd, cwd=cwd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, errors="replace")
    ran = 0
    for line in proc.stdout:
        sys.stdout.write(line)
        m = re.search(r"test result: (?:\x1b\[[\d;]*m)*\w+(?:\x1b\[[\d;]*m)*\. (\d+) passed; (\d+) failed", line)  # libtest, libtest-mimic, kitest
        n = re.search(r"Summary \[[^\]]*\]\s+(\d+) tests? run", line)               # nextest
        o = re.search(count, line) if count else None
        if m:
            ran += int(m.group(1)) + int(m.group(2))
        elif n:
            ran += int(n.group(1))
        elif o:
            ran += sum(int(g) for g in o.groups() if g)
    sys.stdout.flush()
    return proc.wait(), ran


status = 0
for (pid, pkg, sel), r in sorted(runs.items(), key=lambda kv: (kv[0][1], kv[0][2])):
    sub = ["nextest", "run"] if RUNNER == "nextest" else ["test"]
    cmd = ["cargo", *sub, "-p", pid, *sel, *ALL_ARGS, *PKG_ARGS.get(pkg, []), "--no-fail-fast"]
    if RUNNER == "nextest":
        cmd += ["--no-tests=fail"]
    cmd += ["--"]
    if r:
        cmd += sorted(r["filters"])
        for s in sorted(r["skips"]):
            cmd += ["--skip", s]
    print("bench: " + " ".join(c if c != pid else pkg for c in cmd), flush=True)
    code, ran = stream(cmd, root)
    if code != 0:
        status = 1
    elif ran == 0:
        print(f"bench: no test ran for {pkg} {' '.join(sel)}", flush=True)
        status = 1
for cmd, cwd, *count in other:
    print(f"bench: (in {os.path.relpath(cwd, root)}) " + " ".join(cmd), flush=True)
    code, ran = stream(cmd, cwd, *count)
    if code != 0:
        status = 1
    elif count and ran == 0:
        print("bench: no test ran for " + " ".join(cmd), flush=True)
        status = 1
sys.exit(status)
PY
'''
# from: rust.yml@2cacdb46a2 (nextest, --no-fail-fast, CI's filter `not binary(fuzz_tests) and not binary(pending_byte_tests)`
# for core_tester, the conn-raw-api job for turso_core).
# unverified: never run; times are estimates (turso_core unit tests: cold build 6-10 min, run 1-3 min; core_tester:
# cold build 10-15 min, run 2-5 min on 4 cores).
# A changed path outside every workspace crate (".": docs, Makefile, .github, Cargo.lock) or in a crate outside the
# workspace runs turso_core's unit tests.
test_package = '''
set -o pipefail
export CARGO_INCREMENTAL=0 CI=true INSTA_UPDATE=no
pkg={package}
name=$(python3 - "$pkg" <<'PY'
import json, os, subprocess, sys
m = json.loads(subprocess.run(["cargo", "metadata", "--no-deps", "--offline", "--format-version", "1"],
                              capture_output=True, text=True, check=True).stdout)
want = os.path.realpath(os.path.join(m["workspace_root"], sys.argv[1], "Cargo.toml"))
print(next((p["name"] for p in m["packages"]
            if p["id"] in m["workspace_members"] and os.path.realpath(p["manifest_path"]) == want), ""))
PY
) || exit 1
if [ -z "$name" ]; then
  echo "bench: '$pkg' is no workspace crate: turso_core's unit tests instead"
  name=turso_core
fi
args=(-p "$name" --no-fail-fast --no-tests=pass)
case "$name" in
  turso_core) args+=(--features conn_raw_api) ;;
  core_tester) args+=(-E 'not binary(fuzz_tests) and not binary(pending_byte_tests)') ;;
esac
echo "bench: cargo nextest run ${args[*]}"
cargo nextest run "${args[@]}"
'''
package_of = "nearest:Cargo.toml"
# from: nextest's own lines in a public turso CI log (job 139504363042, rust.yml, 2026-11-25:
# "  TRY 3 FAIL [   3.858s] (3776/3776) turso_whopper fts::tests::...") and testing/sqltest/src/output/pretty.rs@2cacdb46a2
# ("  [FAIL] name   (3ms)", also ERROR and MISMATCH, coloured by owo-colors). The name is "BINARY TEST" for nextest,
# the .sqltest test name for the runner.
failed = '^\s*(?:(?:TRY \d+ )?(?:FAIL|SIGSEGV|SIGABRT|SIGBUS|SIGKILL|SIGILL|SIGFPE|TIMEOUT|LEAK-FAIL|ABORT) +\[ *[\d.]+s *\] +(?:\([^)]*\) +)?|\[(?:\x1b\[[\d;]*m)*(?:FAIL|ERROR|MISMATCH)(?:\x1b\[[\d;]*m)*\] +)(\S+(?: (?![(\x1b])\S+)?)'
timeout_minutes = 60
env = { CARGO_HOME = "/srv/rail-bench/cache/rust/cargo", RUSTUP_HOME = "/srv/rail-bench/cache/rust/rustup", CARGO_NET_OFFLINE = "true", RUSTUP_AUTO_INSTALL = "0", CARGO_PROFILE_DEV_DEBUG = "line-tables-only", CARGO_TERM_COLOR = "never", BASH_DEFAULT_TIMEOUT_MS = "1800000", BASH_MAX_TIMEOUT_MS = "7200000" }
[rail.config.commands]
# from: rust-common.md section 6; the worktree needs nothing but the shared toolchain, registry and cargo-nextest.
# unverified: never run.
setup = '''
set -euo pipefail
cargo --version
cargo nextest --version
cargo metadata --offline --format-version 1 >/dev/null
'''
# from: rust.yml@2cacdb46a2 (cargo-fmt-check job: `cargo fmt --check`; nextest as above); sqltest.yml (sqltest-rust job).
# unverified: never run. Clippy (CI: --workspace --all-features --all-targets -D warnings) is left out: a second full
