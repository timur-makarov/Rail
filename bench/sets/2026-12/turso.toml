index-method: backing B-tree writes survive transaction rollback, corrupting the index

Index-method backing-B-tree writes (vector, likely FTS) survive transaction rollback. After a statement that modified an index-method index fails or is rolled back, the backing B-trees keep the deletions, leaving the index inconsistent with the table. `PRAGMA integrity_check` reports the row missing from the index.

Found while auditing #10866, but **this reproduces on main** through plain `ROLLBACK` and through autocommit error rollback, so it is independent of that PR's changes.

## Reproducer (explicit ROLLBACK)

```console
$ tursodb --experimental-index-method :memory:
```

```sql
CREATE TABLE v(id INTEGER PRIMARY KEY, e);
CREATE INDEX vi ON v USING toy_vector_sparse_ivf (e);
INSERT INTO v VALUES(1, vector32_sparse('[1,0,0]'));
BEGIN;
UPDATE v SET e='zz' WHERE id=1;  -- the method rejects 'zz' after deleting the old entries
ROLLBACK;
PRAGMA integrity_check;
```

Output on main:

```
Runtime error: Internal error: first value must be sparse vector
┌────────────────────────────────────────────┐
│ integrity_check                            │
├────────────────────────────────────────────┤
│ row 1 missing from index vi_stats          │
├────────────────────────────────────────────┤
│ row 1 missing from index vi_inverted_index │
└────────────────────────────────────────────┘
```

## Reproducer (autocommit — no explicit transaction at all)

```sql
CREATE TABLE v(id INTEGER PRIMARY KEY, e);
CREATE INDEX vi ON v USING toy_vector_sparse_ivf (e);
INSERT INTO v VALUES(1, vector32_sparse('[1,0,0]'));
UPDATE v SET e='zz' WHERE id=1;
PRAGMA integrity_check;
```

Same corruption: the failed statement's implicit-transaction rollback does not restore the index entries either.

## Expected

The rollback (explicit, implicit, or a statement savepoint) restores the backing B-trees along with every other page the transaction dirtied, so the row and its index entries stay consistent and `integrity_check` reports `ok`.

After #10866, statements that write index-method indexes get a statement savepoint (the method can reject a value after the statement already removed the row's old entries), and `tests/integration/index_method/mod.rs` has `rejected_index_method_value_keeps_row_and_index_consistent` with a comment pointing here: once this bug is fixed, that test should also assert `integrity_check`.

