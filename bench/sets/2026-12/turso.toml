# turso-39: The sqltest EXPLAIN snapshot formatter should not treat a subroutine Return (p2 = 0) as a loop end when
# indenting, as SQLite's shell does.
# issue opened 2026-10-16, fix opened 2026-10-16, merge commit; source files: testing/sqltest/src/snapshot/mod.rs (37
# lines); request from body (never edited).
# reading notes: text names the fix; tests are regenerated whitespace-only snapshots of the formatter output (test
# tooling, not engine)
[[situation]]
id = "turso-39"
request = """
sqltest snapshot formatter indents EXPLAIN output for every subroutine Return (p2 = 0)

The sqltest snapshot formatter (`testing/sqltest/src/snapshot/mod.rs`, `calculate_row_indents`) treats every `Return` as the end of a loop that starts at its `p2`:

```rust
if *p2 < addr {
    loop_ranges.push((*p2, addr));
```

A subroutine's `Return` has `p2 = 0`, so every opcode from address 0 up to that `Return` is indented one more level, `Init` included. Each subroutine adds another level. SQLite's shell (`shell.c.in`, the EXPLAIN indentation logic) ignores a `Return` whose `p2` is 0.

This is already visible on main: snapshots of queries with correlated subqueries (which compile to `Gosub`/`Return`) show `Init` indented, for example `sqlite/conformance/sqlite-sqltests/snapshot_tests/indexes/snapshots/indexes__index-for-correlated-max-materialized-cte-bytecode.snap`:

```
   0    Init              0  38   0                0  Start at 38
  ...
  33    Return           10   0   1                0
```

