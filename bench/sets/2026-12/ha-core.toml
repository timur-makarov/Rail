request = """
Statistic card excludes the first daily change when no previous reference statistic exists

### The problem

When using the statistic card with stat_type: _change_ over a calendar year, the first daily change of the year is excluded from the displayed total if there is no statistic available immediately before the start of the selected period.

The displayed value is therefore lower than the sum of the daily change values for that year.

### What version of Home Assistant Core has the issue?

2026.11.2

### What was the last working version of Home Assistant Core?

_No response_

### What type of installation are you running?

