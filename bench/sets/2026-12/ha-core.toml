# ha-core-19: Shelly RPC firmware update entity stays in progress forever if the final OTA event is missed; clear it
# when the device reconnects.
# issue opened 2026-11-17, fix opened 2026-11-17, squash (or single commit); source files:
# homeassistant/components/shelly/coordinator.py, homeassistant/components/shelly/update.py (20 lines); request from
