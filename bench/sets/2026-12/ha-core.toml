# ha-core-33: Tomorrow.io never schedules periodic polling because the update interval is computed as zero before the
# first API call.
# issue opened 2026-11-06, fix opened 2026-11-07, squash (or single commit); source files:
# homeassistant/components/tomorrowio/coordinator.py (11 lines); request from body (never edited).
# reading notes: Hidden test is a conftest change (request count 0 until first call) that makes the existing
# update-interval tests bite; text names the fix.
[[situation]]
id = "ha-core-33"
request = """
Tomorrow.io: zero initial API request count disables scheduled polling (2026.11.0)

### The problem
The built-in Tomorrow.io integration stops polling after initial setup, while weather entities remain available and retain stale values. Reloading the integration refreshes the data once, and a manual `homeassistant.update_entity` also works, but neither establishes periodic polling.

### Home Assistant version and installation
- Core: **2026.11.0**
- Installation: **Home Assistant OS** in a VM
- Architecture: **aarch64**, machine `qemuarm-64`
- Integration: **Tomorrow.io** (built-in)
- Integration documentation: https://www.home-assistant.io/integrations/tomorrowio/

### Reproduction and observed results
1. Set up the Tomorrow.io integration.
2. Observe that the weather entity remains available (e.g. `sunny`) but does not report updates for extended periods (once over 20 hours).
3. Reloading the config entry immediately refreshes the data, but the problem recurs.
4. Manually call:
   ```yaml
   action: homeassistant.update_entity
   data:
     entity_id: weather.tomorrow_io_home_daily_2
   ```
   The entity reports a fresh timestamp immediately (observed at 2026-11-06 13:48:02 UTC).
5. With debug logging enabled for `homeassistant.components.tomorrowio`, no `Fetching data for ... locations` messages appeared in the inspected 35-minute window.

### Source-level root cause in 2026.11.0
`pytomorrowio.TomorrowioV4.__init__` initializes:
```python
self._rate_limits = CIMultiDict()
self._num_api_requests = 0
```
`homeassistant/components/tomorrowio/__init__.py` creates the coordinator **before** its first API refresh:
```python
api = TomorrowioV4(...)
coordinator = TomorrowioDataUpdateCoordinator(hass, entry, api)
await coordinator.async_config_entry_first_refresh()
```
The coordinator constructor calls `calculate_update_interval(..., api.num_api_requests, api.max_requests_per_day)`. With `num_api_requests == 0`, the formula returns `timedelta(0)` regardless of the daily API limit:
```python
minutes = ceil((24 * 60 * num_locations * num_api_requests) / (max_requests_per_day * 0.9))
return timedelta(minutes=minutes)
```
`homeassistant/helpers/update_coordinator.py` then sets:
```python
self._update_interval_seconds = value.total_seconds() if value else None
```
Because `timedelta(0)` is falsey, `_update_interval_seconds` becomes `None`; `_schedule_refresh()` returns early when it is `None`. Consequently **no periodic refresh is scheduled**. The first refresh populates the API's request count but does not recalculate the coordinator's update interval.

### Expected behavior
Periodic refresh should be scheduled with a nonzero interval, accounting for the actual Tomorrow.io API rate limits and request count.

### Suggested direction
Initialize the coordinator with a valid nonzero interval or calculate/recalculate the interval after the first API request, then schedule periodic polling.

### Workaround
A watchdog automation calls `homeassistant.update_entity` if an available weather entity has not reported for 30 minutes, and separately reloads the config entry if it remains unavailable for 5 minutes.

No API key, location coordinates, or private configuration identifiers are included."""
