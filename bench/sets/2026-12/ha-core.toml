-- | -- | -- | --
2025 | 48.833860   km | 5210.217659   km | 5161.38   km
2026 | 49.410519   km | 4539.319444   km | 4489.91   km
</body>
</html>

In both cases, the difference between the expected and displayed values exactly matches the first daily change of the year.
The statistics-graph card displays the expected total when using the same daily statistics.

**TECHNICAL ANALYSIS**
The Lovelace statistic card does not calculate the change itself.

In _home-assistant/frontend_, _src/panels/lovelace/cards/hui-statistic-card.ts_ retrieves the selected period and calls **fetchStatistic**().

The actual calculation is performed in the Core repository: _homeassistant/components/recorder/statistics.py_

The **statistic_during_period()** function calculates the overall change using the difference between the newest and oldest cumulative sum values.

The relevant functions are:
- **get_oldest_sum_statistic()**
- **get_newest_sum_statistic()**

The observed results suggest that, when no reference statistic exists before the selected period, the first available statistic inside the period is used as the starting cumulative reference. This causes its daily change to be excluded from the calculated total.

The fact that the discrepancy exactly matches the first daily change in both years supports this explanation.

**EXPECTED BEHAVIOR**
The statistic card should include all daily changes occurring within the selected period, including the first day.

The annual change returned by recorder/statistic_during_period should be consistent with the sum of the daily change values for that same period, even when no cumulative reference statistic exists before its start.

