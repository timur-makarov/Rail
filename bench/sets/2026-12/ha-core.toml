# reading notes: text names the fix.
[[situation]]
id = "ha-core-19"
request = """
Shelly (gen 2+) firmware update entity stuck in in_progress forever when the ota_error/ota_success event is missed

### The problem

**HA version:** 2026.11.1 (same code present in `dev`)
**Integration:** shelly
**Devices:** Shelly 2PM Gen4 (fw 2.1.1 → 2.2.1), Shelly Pro 3EM (fw 2.2.0 → 2.2.1)
**Description:**
`RpcUpdateEntity._ota_in_progress` is set to `True` after a successful `trigger_ota_update()` RPC and is only cleared by `ota_error`/`ota_success` websocket events from the device (`_ota_progress_callback`). If the device goes offline exactly when the OTA finishes/fails (reboot, rollback, brief Wi-Fi drop), the terminal event is never received and the update entity stays `in_progress: true` (with a frozen `update_percentage`) forever. The frontend then disables the Install buttons and "Update all"; the only workaround is reloading the config entry (or restarting HA), which recreates the entity.

There is no reconciliation when the device reconnects (`RpcUpdateType.INITIALIZED` refreshes device info, so `installed_version`/`latest_version` are correct, but the `in_progress` flag is untouched) and there is no timeout.

**Observed:** 4 devices attempted the same update over 3 days; each time the OTA progressed to 96–100 % (`ota_progress` events were flowing), the device rebooted and came back with the **old** firmware, and the update entity remained stuck at `in_progress: true` with the last progress percentage frozen. Retrying after a config entry reload succeeded on all 4 devices.

**Steps to reproduce:**
1. Trigger a firmware install on a gen2+ Shelly.
2. While it is downloading, drop the device↔HA websocket connection (reboot the device or cut its network) so no terminal OTA event reaches HA.
3. Bring the device back with the old firmware. The update entity stays `in_progress: true` (frozen `update_percentage`), Install disabled.

**Expected:** the entity should stop reporting "in progress" once the device reconnects (with either the old or the new firmware) after an install, even if `ota_error`/`ota_success` was never received.

**Suggested fix:** store the target version in `async_install`; on `RpcUpdateType.INITIALIZED` (device re-initialized) compare `installed_version` with the target and clear `in_progress` in both cases (optionally raising a repair issue/log on mismatch).

**Related:** #97093 (older "keeps spinning" report, resolved by #99534 adding OTA progress — the missed-terminal-event edge case remained).


