id = "ha-core-07"
request = """
myUplink binary sensor raises KeyError when a data point is missing from an update

### The problem

When the myUplink API leaves a data point out of a response, `MyUplinkDevicePointBinarySensor.is_on` raises `KeyError` on every coordinator update until the point comes back. On one install this logged 447 errors between 15:30 and 15:46 on 2026-10-29, all for point `43161` (a NIBE F750):

```
ERROR (MainThread) [homeassistant.components.myuplink.coordinator] Unexpected error updating listener ... for myuplink
Traceback (most recent call last):
  File "/usr/src/homeassistant/homeassistant/helpers/update_coordinator.py", line 696, in _handle_coordinator_update
  ...
  File "/usr/src/homeassistant/homeassistant/components/binary_sensor/__init__.py", line 113, in state
  File "/usr/src/homeassistant/homeassistant/components/myuplink/binary_sensor.py", line 142, in is_on
KeyError: '43161'
```

The traceback is from 2026.10.4 (line 142). The same unguarded lookup is at line 144 in 2026.11.0, 2026.11.1 and `dev`:

```python
device_point = self.coordinator.data.points[self.device_id][self.point_id]
```

The sensor platform already handles this (`MyUplinkDevicePointSensor.native_value` uses `.get(self.point_id)` and returns `None`). `MyUplinkEnumSensor.native_value` (`sensor.py` line 336 on `dev`) indexes the same way, and so do the switch, number and select platforms.

Suggested fix: use `.get(self.point_id)` and return `None` (state unknown) when the point is missing, as the sensor platform does.

