### Possible cause

The transient `requests.exceptions.ConnectionError` raised during `listener.initialize()` may not be converted into a retryable config-entry setup exception. DNS failures, connection failures and timeouts during initialization may need to be treated as temporary setup failures so Home Assistant can retry with its normal backoff behavior.

Related older reports: #129451 and #161195. This report differs because the startup without networking and subsequent recovery were reproduced under controlled conditions."""
