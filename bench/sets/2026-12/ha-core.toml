# ha-core: home-assistant/core, python, proposed project of set 2026-12 (fulltest PLAN sections 3 and 4).
# Settings: written by reading the project's CI and docs at the oldest and newest start commit, nothing run;
# every command marked `unverified` is for the admission session to try and fix. Notes: notes/ha-core.md.
# Situations: every candidate of bench-candidates/ha-core.toml (REPORT-window-rule.md, 2026-11-26), in its order,
# 45 of its 147, drawn by a shuffle seeded with 20261126 (Python random.Random), stratified by
# kind: each kind's share of 45 by largest remainder, then the first of its shuffled list: crash 9, missing behaviour 4, race 1, wrong result 31.
# half is `work` for every candidate until the split after admission and the hardness runs (cloud/README.md).
# hidden_tests: the fix's changed files (start..fix, compare API) that match [project] tests or the travel
# globs ["packages/pytest-homeassistant/**"],
# and not []; deleted files left out.
# self_filed: the issue's author opened the fix. bot_filed: the issue's author is an automation account
# (a login ending in bot or -ci, or turso-github-handyman, roboturso). security_trap: the reading pass's
# flag for a request whose natural fix invites a flaw. kind race is the race flag.

# home-assistant/core for Rail's bench. Read-only work of 2026-11-26: nothing here was run; see ha-core.md.
# Oldest start read: 5eada1d995bfca2c324350b92e8c79101054fe8b (2026-07-02); newest: f487f4d13781c049ece0b2c5fb56deea73882c1d
# (2026-11-25). Shorthand below: OLD = 54ad0665a16fc214cdc0bd9aa3684decaa5c6004 (also 2026-07-02), NEW = f487f4d1.
#
# The one idea every command shares: the venv is NOT inside the copy. It is built once per distinct set of inputs in
# $BENCH_CACHE/venvs/KEY (hardlinked from the uv cache, so it costs directory entries, not file data), and the copy
# holds only a symlink `.venv` -> that folder. The editable installs' .pth files are rewritten to RELATIVE paths
# (../../../..), which Python joins to the site-packages path it reached through the copy's own `.venv` symlink, so
# every copy, and every Rail worktree that links the same venv, imports its own homeassistant. Commands also set
# PYTHONPATH to the copy, for subprocesses and console scripts.

[project]
name = "ha-core"
repo = "https://github.com/home-assistant/core"
language = "python"
package = "homeassistant"
tests = ["tests/**", "packages/*/tests/**"]

[commands]
# unverified: composed from CI's venv recipe; the shared-venv layout, the .pth rewrite, the apt names on Ubuntu 24.04
#   and the per-line fallback have not been run anywhere.
# from: .github/actions/restore-or-build-venv/action.yml@NEW ("uv venv venv --python"; "uv pip install -r
#   requirements.txt"; "-r requirements_all.txt -r requirements_test.txt"; "-e . -e packages/hassfest
#   -e packages/pytest-homeassistant --config-settings editable_mode=compat"; apt: bluez ffmpeg libturbojpeg0 ...),
#   .github/workflows/ci.yaml@OLD (same steps inline, "-e ." only), script/bootstrap@NEW, .python-version@both,
#   ci.yaml@NEW "python3 -m script.translations develop --all" before every pytest job.
setup = '''
set -euo pipefail
# Network is on only here. Every later command runs offline.
unset UV_OFFLINE UV_PYTHON_DOWNLOADS
# No UV_COMPILE_BYTECODE here (unlike the other Python projects): ~1,200 packages would get ~100k fresh .pyc files
# per venv, new inodes and about a GB each; Python writes the .pyc of what a test imports on first use instead.
export UV_CACHE_DIR="$BENCH_CACHE/uv" UV_PYTHON_INSTALL_DIR="$BENCH_CACHE/python" UV_PYTHON_PREFERENCE=only-managed \
       UV_LINK_MODE=hardlink UV_NO_PROGRESS=1
root=$PWD

# 1. The OS packages HA's CI installs before building its venv (best effort; needs root and apt).
if [ "$(id -u)" = 0 ] && command -v apt-get >/dev/null 2>&1; then
  want_pkgs=""
  for p in bluez ffmpeg libturbojpeg libturbojpeg0 libxml2-utils libudev-dev pkg-config g++ \
           libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev; do
    dpkg -s "$p" >/dev/null 2>&1 || want_pkgs="$want_pkgs $p"
  done
  if [ -n "$want_pkgs" ]; then
    apt-get update -qq || true
    for p in $want_pkgs; do
      DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends "$p" >/dev/null 2>&1 \
        || echo "bench: apt could not install $p (continuing)"
    done
  fi
fi

# 2. Python: the version .python-version names (3.14.5 at the oldest start, 3.14.10 at the newest), into $BENCH_CACHE.
pyver=$(tr -d '[:space:]' < .python-version)
uv python install "$pyver" || uv python install "${pyver%.*}"
py=$(uv python find "$pyver" 2>/dev/null || uv python find "${pyver%.*}")

# 3. Packages as they were on the start commit's day: git archive stamped every file with the commit's time.
newer=$(date -u -d "@$(stat -c %Y pyproject.toml)" +%Y-%m-%dT%H:%M:%SZ)

# 4. The venv, in $BENCH_CACHE, named by a hash of everything that decides its contents; built once, under a lock.
#    The date is left out of the key: requirements_all/requirements_test pin every package (==) and
#    package_constraints.txt most transitive ones, so starts with the same files share one venv (75 distinct days
#    among 147 starts; the files change most days, so expect several dozen venvs, each ~25k directories).
key=$( { echo "ha-venv-2 $py"
         cat .python-version requirements.txt requirements_all.txt requirements_test.txt \
             requirements_test_pre_commit.txt homeassistant/package_constraints.txt pyproject.toml
         cat packages/*/pyproject.toml packages/*/setup.py 2>/dev/null || true; } | sha256sum | cut -c1-16)
venv="$BENCH_CACHE/venvs/$key"
mkdir -p "$BENCH_CACHE/venvs"
exec 9>"$venv.lock"
flock 9
if [ ! -f "$venv/.bench-ok" ]; then
  rm -rf "$venv"
  uv venv -q --python "$py" "$venv"
  pip=(uv pip install -q --no-config --python "$venv/bin/python" --exclude-newer "$newer")
  "${pip[@]}" -r requirements.txt
  if ! "${pip[@]}" -r requirements_all.txt -r requirements_test.txt; then
    echo "bench: the full install failed; installing the requirements one at a time" >&2
    : > "$venv/bench-skipped.txt"
    grep -hE '^[A-Za-z0-9]' requirements_all.txt requirements_test.txt requirements_test_pre_commit.txt |
      while IFS= read -r req; do
        "${pip[@]}" -c homeassistant/package_constraints.txt "$req" >/dev/null 2>&1 || echo "$req" >> "$venv/bench-skipped.txt"
      done
    echo "bench: skipped $(wc -l < "$venv/bench-skipped.txt") requirements, listed in $venv/bench-skipped.txt" >&2
  fi
  eds=(-e .)
  for d in packages/hassfest packages/pytest-homeassistant; do [ -f "$d/pyproject.toml" ] && eds+=(-e "$d"); done
  "${pip[@]}" "${eds[@]}" --config-settings editable_mode=compat
  # The editable installs wrote this copy's absolute path into .pth files; make them relative to site-packages.
  "$venv/bin/python" - "$root" <<'PY'
import os, sys, sysconfig
roots = {sys.argv[1], os.path.realpath(sys.argv[1])}
sp = sysconfig.get_paths()["purelib"]
for name in sorted(os.listdir(sp)):
    if not name.endswith(".pth"):
        continue
    path = os.path.join(sp, name)
    with open(path) as f:
        lines = f.read().splitlines()
    out, hit = [], False
    for line in lines:
        s = line.strip()
        for r in roots:
            if s == r or s.startswith(r + os.sep):
                out.append(os.path.normpath(os.path.join("..", "..", "..", "..", os.path.relpath(s, r))))
                hit = True
                break
        else:
            out.append(line)
    if hit:
        os.unlink(path)
        with open(path, "w") as f:
            f.write("\n".join(out) + "\n")
        print("bench: made", name, "relative:", out)
    elif any(r in l for l in lines for r in roots):
        sys.exit(f"bench: {name} still names the setup path")
PY
  touch "$venv/.bench-ok"
fi
flock -u 9
ln -sfn "$venv" .venv
grep -qxF '/.venv' .git/info/exclude 2>/dev/null || echo '/.venv' >> .git/info/exclude

# 5. English translations from strings.json, as CI makes them before pytest (gitignored output).
export PYTHONPATH="$root:$root/packages/pytest-homeassistant:$root/packages/hassfest"
.venv/bin/python -m script.translations develop --all >/dev/null

# 6. One pack instead of ~35k loose git objects in every copy (inodes).
git -c gc.auto=0 repack -a -d -q && git prune-packed -q || true

# 7. Smoke: this copy's homeassistant is the one imported, and pytest loads HA's plugin.
.venv/bin/python -c 'import homeassistant, sys; assert homeassistant.__file__.startswith(sys.argv[1]), homeassistant.__file__' "$root"
.venv/bin/python -m pytest -qq --co -p no:sugar tests/test_core.py >/dev/null
df -h "$BENCH_CACHE" . || true
df -i . || true
'''
# unverified: the flags are CI's (-b -X dev -m pytest -qq --timeout --numprocesses -o console_output_style=count
#   -p no:sugar), but --timeout is 60 here, not 9, and the mapping of snapshots/fixtures to test modules is mine.
# from: .github/workflows/ci.yaml@NEW (pytest-full and pytest-partial jobs), ci.yaml@OLD (same flags).
# Snapshot files (tests/components/X/snapshots/test_Y.ambr) run test_Y.py; a conftest.py runs its whole integration
# folder; a fixture file runs its folder only when no module of that folder is in the list (five candidates hide
# only snapshots, fixtures or a conftest.py).
test_files = '''
set -o pipefail
export PYTHONPATH="$PWD:$PWD/packages/pytest-homeassistant:$PWD/packages/hassfest"
.venv/bin/python -m script.translations develop --all >/dev/null || exit 1
mods=(); dirs=(); force=()
for f in {files}; do
  case "$f" in tests/*) ;; *) continue ;; esac
  b=${f##*/}; d=${f%/*}
  case "$f" in tests/components/*/*) c=${f#tests/components/}; home="tests/components/${c%%/*}" ;; *) home=$d ;; esac
  case "$b" in
    test_*.py) mods+=("$f") ;;
    *.ambr) m="${d%/snapshots}/${b%.ambr}.py"
            if [ -f "$m" ]; then mods+=("$m"); else dirs+=("${d%/snapshots}"); fi ;;
    conftest.py) force+=("$home") ;;
    *) dirs+=("$home") ;;
  esac
done
keep=()
for m in "${mods[@]}"; do
  inside=""
  for d in "${force[@]}"; do case "$m" in "$d"/*) inside=1 ;; esac; done
  [ -n "$inside" ] || keep+=("$m")
done
for d in "${dirs[@]}"; do
  covered=""
  for m in "${mods[@]}" "${force[@]}"; do case "$m" in "$d"|"$d"/*) covered=1 ;; esac; done
  [ -n "$covered" ] || force+=("$d")
done
mapfile -t args < <(printf '%s\n' "${keep[@]}" "${force[@]}" | grep . | sort -u)
if [ ${#args[@]} -eq 0 ]; then echo "bench: no tests among the given files"; exit 1; fi
exec .venv/bin/python -b -X dev -m pytest -qq -rfE -p no:sugar -o console_output_style=count --timeout=60 \
  --numprocesses=4 "${args[@]}"
'''
# unverified: CI runs a whole integration folder the same way (pytest-partial: tests/components/${TEST_GROUP}); the
#   walk-up and the core subset for "." are mine. A large integration (mqtt, zha, recorder) can take 10-15 minutes.
# from: .github/workflows/ci.yaml@NEW lines 1593-1605 (pytest-partial), 1037-1050 (pytest-full, --dist=loadfile).
test_package = '''
set -o pipefail
export PYTHONPATH="$PWD:$PWD/packages/pytest-homeassistant:$PWD/packages/hassfest"
.venv/bin/python -m script.translations develop --all >/dev/null || exit 1
p={package}
d=tests; [ "$p" = . ] || d="tests/$p"
while [ "$d" != tests ] && [ "$d" != tests/components ] && [ ! -d "$d" ]; do d=${d%/*}; done
case "$d" in
  tests|tests/components) set -- tests/test_core.py tests/test_config_entries.py tests/test_setup.py tests/test_loader.py ;;
  *) set -- "$d" ;;
esac
exec .venv/bin/python -b -X dev -m pytest -qq -rfE -p no:sugar -o console_output_style=count --timeout=60 \
  --numprocesses=4 --dist=loadfile "$@"
'''
# homeassistant/components/NAME/x.py -> components/NAME; homeassistant/helpers/template/extensions/state.py ->
# helpers/template/extensions (test_package walks up to the nearest existing tests/ folder); homeassistant/core.py,
# CODEOWNERS and the like -> "." (a core subset of about four minutes).
package_of = 'regex:^homeassistant/(.+)/[^/]+$'
# pytest's short summary (-rfE): "FAILED path::test[param] - reason", "ERROR path - reason" (collection errors).
failed = '^(?:FAILED|ERROR) (\S.*?)(?: - .*)?$'
timeout_minutes = 90
env = { UV_OFFLINE = "1", UV_PYTHON_DOWNLOADS = "never", PYTHONASYNCIODEBUG = "1", BASH_DEFAULT_TIMEOUT_MS = "1800000", BASH_MAX_TIMEOUT_MS = "7200000" }
[rail.config.commands]
# unverified: no project source; it re-creates what bench setup left in the copy root (the .venv link and the
# gitignored translations), offline.
# from: ci.yaml@NEW "python3 -m script.translations develop --all"; the venv link is this file's own design.
setup = '''
set -euo pipefail
main="$(git rev-parse --path-format=absolute --git-common-dir)/.."
[ -e .venv ] || ln -s "$(readlink "$main/.venv")" .venv
export PYTHONPATH="$PWD:$PWD/packages/pytest-homeassistant:$PWD/packages/hassfest"
.venv/bin/python -m script.translations develop --all >/dev/null
'''
# unverified: ruff on changed files is what prek runs in CI (ruff pinned in requirements_test_pre_commit.txt); the
#   test selection (changed integrations + tests/test_core.py) is mine.
# from: .pre-commit-config.yaml via requirements_test_pre_commit.txt@NEW, ci.yaml@NEW pytest flags.
verify = '''
set -o pipefail
export PYTHONPATH="$PWD:$PWD/packages/pytest-homeassistant:$PWD/packages/hassfest"
base="${RAIL_BASE:-refs/heads/main}"
mapfile -t changed < <( { git diff --name-only "$base" --; git ls-files --others --exclude-standard; } | grep . | sort -u)
.venv/bin/python -m script.translations develop --all >/dev/null || exit 1
py=(); targets=(tests/test_core.py)
for f in "${changed[@]}"; do
  case "$f" in *.py) [ -f "$f" ] && py+=("$f") ;; esac
  case "$f" in
    homeassistant/components/*/*|tests/components/*/*)
      c=${f#*/components/}; c=${c%%/*}; [ -d "tests/components/$c" ] && targets+=("tests/components/$c") ;;
    homeassistant/*/*)
      d="tests/${f#homeassistant/}"; d=${d%/*}
      while [ "$d" != tests ] && [ ! -d "$d" ]; do d=${d%/*}; done
      [ "$d" = tests ] || targets+=("$d") ;;
    tests/*test_*.py) [ -f "$f" ] && targets+=("$f") ;;
    tests/*/*) [ -d "${f%/*}" ] && targets+=("${f%/*}") ;;
  esac
done
if [ ${#py[@]} -gt 0 ]; then
  .venv/bin/python -m ruff check --force-exclude --quiet "${py[@]}" || exit 1
  .venv/bin/python -m ruff format --force-exclude --check --quiet "${py[@]}" || exit 1
fi
mapfile -t targets < <(printf '%s\n' "${targets[@]}" | sort -u)
exec .venv/bin/python -b -X dev -m pytest -qq -rfE -p no:sugar -o console_output_style=count --timeout=60 \
  --numprocesses=4 --dist=loadfile "${targets[@]}"
'''
timeout_secs = 900
setup_timeout_secs = 600
verify_timeout_secs = 1800

# The bench's additions, the same for every project file of this set:
# - [commands] env BASH_DEFAULT_TIMEOUT_MS and BASH_MAX_TIMEOUT_MS: the Bash tool limits Rail's own
#   .claude/settings.json gives its worker, given to every child, so a plain arm's Bash tool is not cut at
#   two minutes while Rail's runs for thirty.
# - [rail.config.worker] ladder: the Rail arm of the first run (PLAN section 6, owner 2026-11-25): Sonnet 5.5
#   medium, then Opus 5.5 medium. It sits here because an arm file can give only one rung (bench/arms.py);
#   person_ladder and contract stay as Rail's seed has them.
# - [rail.config.claim] stale_minutes: above the longest Rail command's limit plus save_minutes (10), as
#   `rail docs config` asks.
[rail.config.worker]
ladder = ["claude-sonnet-5-5:medium", "claude-opus-5-5:medium"]

[rail.config.claim]
stale_minutes = 45

