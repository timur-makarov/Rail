# ha-core-11: A failing Miele filling-levels endpoint should not block config entry setup, only the filling-level
# sensors.
# issue opened 2026-11-20, fix opened 2026-11-22, squash (or single commit); source files:
# homeassistant/components/miele/__init__.py, homeassistant/components/miele/diagnostics.py,
# homeassistant/components/miele/sensor.py (62 lines); request from body (never edited).
# reading notes: filed by fixer; text names the fix; small doubt on diagnostics expecting {} for filling_levels.
[[situation]]
id = "ha-core-11"
request = """
Miele: 503 from /v1/devices/fillingLevels blocks config entry setup, taking every Miele entity offline

### The problem

After a Home Assistant restart on 2026-11-20 at 13:00 ET, the Miele config entry went into `setup_retry` and has stayed there (still failing at 18:12). Every retry fails with `503 Service Temporarily Unavailable` from `GET /v1/devices/fillingLevels`. The `/v1/devices` call made just before it succeeds. Because the filling-levels call is part of setup, **every** Miele entity is unavailable (status, program, finish time, doors, etc.), not just the filling-level sensors. Before the restart everything was working; the washing machine's finish time was updating at 12:58.

Root cause in the code (tag 2026.11.2; dev is identical as of 2026-11-20):

- `async_setup_entry` calls `async_config_entry_first_refresh()` on both coordinators. The second one, `MieleAuxDataUpdateCoordinator`, only fetches filling levels, so any error from that endpoint becomes `ConfigEntryNotReady`:
  https://github.com/home-assistant/core/blob/2026.11.2/homeassistant/components/miele/__init__.py#L58-L60
- `MieleAuxDataUpdateCoordinator._async_update_data` calls `get_filling_levels()` with no error handling:
  https://github.com/home-assistant/core/blob/2026.11.2/homeassistant/components/miele/coordinator.py#L161-L167
- By contrast, the main coordinator already treats `get_actions()` as optional and catches `ClientResponseError` / `TimeoutError`:
  https://github.com/home-assistant/core/blob/2026.11.2/homeassistant/components/miele/coordinator.py#L88-L105

The endpoint was flaky for days before this, but while the entry was loaded that only made the level sensors blink. `MieleAuxEntity` availability is the aux coordinator's `last_update_success`, and `sensor.dishwasher_salt_level` went `unavailable` 479 times between Nov 11 and the Nov 20 restart (about 17 hours in total), often alternating on every 60-second poll. The restart happened during a bad stretch, and from then on the same endpoint kept the whole integration down.

Expected: a failing filling-levels endpoint should only affect the filling-level sensors, the same way a failing actions endpoint only affects actions.

Possible fix: make the aux coordinator's first refresh non-fatal. Note that the sensor platform reads `aux_coordinator.data.filling_levels` directly during setup, so it would also need to handle having no aux data yet, for example by adding the aux sensors from a coordinator listener once data first arrives, as it already does for devices:
https://github.com/home-assistant/core/blob/2026.11.2/homeassistant/components/miele/sensor.py#L924-L931

### What version of Home Assistant Core has the issue?

core-2026.11.2

### What was the last working version of Home Assistant Core?

