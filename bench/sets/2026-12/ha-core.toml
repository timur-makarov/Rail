### Integration causing the issue

_No response_

### Link to integration documentation on our website

_No response_

### Diagnostics information

**ACTUAL BEHAVIOR**
The first daily change is missing from the total displayed by the statistic card.

**STEPS TO REPRODUCE**
1. Create an external statistic with daily long-term statistics.
2. Ensure that the statistic has a cumulative sum and a daily change.
3. Do not provide a reference statistic immediately before January 1.
4. Display the statistic using a Lovelace statistic card with stat_type: change and a yearly period.
5. Compare the card value with the sum of the daily change values for the same year, for example using statistics-graph.

Observed results:
