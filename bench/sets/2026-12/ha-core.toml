### Expected behaviour

An entry sensor explicitly reported offline by SimpliSafe should not be presented as an available, closed door without an indication that its state cannot currently be trusted. For example, the door entity could become `unavailable` while that device's offline flag is true, and recover when the device reconnects.

### Steps to reproduce

1. Use the built-in SimpliSafe integration with a V3 system and an entry sensor that SimpliSafe currently reports as offline.
2. Download the integration diagnostics and verify that the affected sensor has `offline: true`.
3. Inspect that sensor's door entity in Developer Tools > States.
4. Observe that the entity can remain available with state `off` / Closed despite the offline diagnostic.

