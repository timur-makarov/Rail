### Additional information

- The entry was set up via Home Assistant Cloud account linking. Raspberry Pi 4, HAOS 18.5, pymiele 0.6.3.
- A second HA instance (core-2026.11.1, same Miele code, same Miele account but its own config entry and token, loaded since 2026-11-12) has logged no fillingLevels errors in that time. The 503s may be token- or region-specific (this instance is in the US, the other in Germany), but I haven't been able to establish which.
