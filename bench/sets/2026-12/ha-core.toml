[[situation]]
id = "ha-core-12"
request = """
InfluxDB sensor: IndexError on an empty Flux table drops the entity

### The problem

`InfluxFluxSensorData.update()` (`homeassistant/components/influxdb/sensor.py:307-313`) checks `if not tables` but not empty tables. When a Flux query returns a table with no rows, `tables[0].records[0]` raises `IndexError`. On the first update the platform aborts the entity ("influxdb: Error on device update!") and it is not added until a restart; later failures log "Update for ... fails" and keep the old value.

Suggested fix: take the first record across all tables and, with none, warn as for no results.

