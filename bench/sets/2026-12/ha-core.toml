# ha-core-12: InfluxDB Flux sensors should handle empty tables instead of raising IndexError.
# issue opened 2026-11-16, fix opened 2026-11-20, squash (or single commit); source files:
# homeassistant/components/influxdb/sensor.py (8 lines); request from body (never edited).
