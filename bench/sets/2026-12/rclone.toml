### What is the problem you are having with rclone?

`rclone config update myremote token '<json>'` on an OAuth remote stores the token and then runs the backend's post config, which asks `config_refresh_token` ("Token already configured - replace it?", default yes) about the token it was just given.

- Interactively (the plain CLI) `config update` auto-answers confirm questions with their default, so rclone goes straight into the browser OAuth flow (`Waiting for code...`) to replace the token that was passed on the command line. Completing that flow overwrites the token; the only way to keep it is to abort the command.
- With `--non-interactive` the token is written, but the caller gets the `config_refresh_token` question back as a JSON blob and has to `--continue` with `false`. Answering with the default replaces the token.

The documented way round this is to add `config_refresh_token=false`, which works. But a token passed explicitly can only mean "store this one", so asking whether to replace it, and interactively starting a browser flow to do so, is a footgun. I hit it while scripting a token re-seed and ended up editing `rclone.conf` instead; the forum thread https://forum.rclone.org/t/44932 shows another user needing the same `config_refresh_token=false` dance.

