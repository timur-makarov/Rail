request = """
drime: listing a directory with more than 20,000 entries never finishes

### Before you start

- [x] I have searched the [forum](https://forum.rclone.org/) and the existing issues for this problem.
- [x] I have tested with the [latest beta or stable](https://rclone.org/commands/rclone_selfupdate/) release and can still reproduce the problem.
- [x] This is a reproducible bug, not a usage question (questions belong on the forum).

### Associated forum post URL

_No response_

### What is the problem you are having with rclone?

Listing a Drime directory with more than 20,000 entries never finishes. rclone asks for the same page over and over and memory grows until the process is killed.

Drime returns 250 entries per page to an `rclone/*` User-Agent and won't page past 20,000 entries. Asking for page 81 returns page 80 again with `current_page: 80` and `last_page: 81`. `listAll` only stops when `current_page == last_page` and asks for `current_page + 1` next, so it requests page 81 forever.

On a Synology NAS a sync to a crypt remote on top of Drime made 1,108 identical requests in 4 minutes before it hit the 2G memory limit of its cgroup and was killed (exit 137).

The loop came with #9391 (306fb0a30) in v1.74.0. Before that large listings stopped early without an error, so sync uploaded the files it couldn't see again and some directories ended up with up to 5 copies of a file. Uploads make duplicates on their own as well: before each upload rclone looks the file up by listing the whole directory, and it doesn't find a file past the limit.

Steps to reproduce:

1. Find a Drime directory with more than 20,000 entries. Other User-Agents get 100 entries per page and hit the limit at 2,500 entries, so a directory with a few thousand entries works too if you add `--user-agent=probe/1.0`.
2. Run `rclone lsf -vv --dump headers --user-agent=probe/1.0 drime:dir`
3. After page 25 every request asks for page 26 and gets page 25 back, and the command never returns.

### rclone version

