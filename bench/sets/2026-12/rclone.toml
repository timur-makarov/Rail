# rclone-19: A VFS cache reader waiting for a range beyond the shrunk item size but within the source size should be
# released instead of blocking forever.
# issue opened 2026-08-14, fix opened 2026-08-14, squash (or single commit); source files:
# vfs/vfscache/downloaders/downloaders.go (6 lines); request from body (never edited).
# reading notes: filed by fixer; issue already contains the downloaders test and a suggested fix (text names the fix);
# deadlock tests use 30s safety timeouts
[[situation]]
id = "rclone-19"
request = """
vfs/vfscache: reader deadlocks forever when item size drops below the read offset

#### The associated forum post URL from `https://forum.rclone.org`

Not posted to the forum: this is a reproducible deadlock with a unit test, so filing directly.

#### What is the problem you are having with rclone?

With `--vfs-cache-mode full`, a reader can block forever inside `Downloaders.Download`. No downloader is started, no request is made to the backend, no error is produced and nothing is logged at any log level, including `-vv`. On a mount the reading process sits in uninterruptible sleep (`D` state) and cannot be killed.

The cause is that two halves of the waiter machinery decide "is this waiter satisfied" and "should we download" using two different file sizes.

`_dispatchWaiters` clips the waiter range against `dls.src.Size()`, the size of the `fs.Object` snapshot taken when the `Downloaders` was constructed:

```go
r := waiter.r
r.Clip(dls.src.Size())
if dls.item.HasRange(r) {
```

`_ensureDownloader` decides whether to start a downloader from `dls.item.FindMissing(r)`, and `Item.FindMissing` clips against `item.info.Size` instead:

```go
outr = item.info.Rs.FindMissing(r)
outr.Clip(item.info.Size)
```

`Range.Clip` collapses a range to `{0, 0}` when the clip point is below `r.Pos`, and `Ranges.Present` returns true for an empty range. So when

```
item.info.Size < readOffset <= dls.src.Size()
```

the download side collapses the range to empty, concludes there is nothing to fetch and returns without starting a downloader, while the wake side does not collapse it and concludes the waiter is not satisfied. The waiter stays queued forever:

- no downloader runs, so no bytes ever arrive
- no error is ever produced, so `errorCount` never moves and the `maxErrorCount` breaker never trips and never calls `_closeWaiters`
- the 5s background kicker re-evaluates both predicates every 5s and changes nothing

`item.info.Size` and `dls.src.Size()` drift apart because `dls.src` is frozen at construction while `item.info.Size` is re-derived afterwards, notably by the shrink check in `Item.readAt` which calls `_truncate(item.o.Size())`, and by `_checkObject` plus `_getSize` on reopen. `Item.open` calls `_checkObject` before the `item.opens != 1` early return, but only rebuilds `item.downloaders` when `opens == 1`, so a second open of an already open file refreshes `item.o` and `item.info.Size` while leaving the old frozen `dls.src` in place.

This was introduced by f3f743c3f "vfs: fix download loop when file size shrunk", which added both halves of the asymmetry in the same commit: the `r.Size == 0` early return in `_ensureDownloader` and the `r.Clip(dls.src.Size())` in `_dispatchWaiters`. That commit correctly fixed the case where `src` itself shrinks, and opened this one.

#### What is your rclone version (output from `rclone version`)

rclone v1.74.4, and current master (387b4b5e1).

#### Which OS you are using and how many bits (e.g. Windows 7, 64 bit)

Linux 6.12 x86_64. The bug is platform independent and reproduces in a unit test on any platform.

#### Which cloud storage system are you using? (e.g. Google Drive)

Originally seen on a WebDAV remote, but the reproducers below use the local backend only. Nothing about this is backend specific.

#### The command you were trying to run (e.g. `rclone copy /tmp remote:tmp`)

```
rclone mount remote: /mnt/point --allow-other --vfs-cache-mode full
```

The reader was a media scanner reading near the end of a large file.

#### A log from the command with the `-vv` flag

There is no log to attach, and that is part of the report: the deadlocked state is completely silent at every level. The only nearby debug line is in `Item._ensure`, emitted once per call and logged against `nil` rather than the object, so it is not even attributable to the file.

#### How to replicate the issue

Two failing tests, both on the local backend, no special remote needed.

`vfs/vfscache/downloaders/downloaders_test.go`, inside `TestDownloaders`:

```go
	t.Run("DownloadBeyondItemSize", func(t *testing.T) {
		item := &testItem{
			t:    t,
			size: 1024 * 1024,
		}
		opt := vfscommon.Opt
		dls := New(ctx, item, &opt, remote, src)
		defer cancel(dls)

		done := make(chan error, 1)
		go func() {
			done <- dls.Download(ranges.Range{Pos: 40 * 1024 * 1024, Size: 250})
		}()

		select {
		case err := <-done:
			assert.NoError(t, err)
		case <-time.After(30 * time.Second):
			t.Fatal("Download did not return: the waiter was never dispatched")
		}
	})
```

On master this fails with `Download did not return: the waiter was never dispatched`.

I also have an item level test that drives the real `vfscache.Item` through the whole lifecycle (open at full size, cache the head, shrink `info.Size` via `_truncate`, park a reader on a tail range, observe the deadlock) which fails the same way. Both are in the PR.

#### Suggested fix

Wake a waiter when `FindMissing` reports nothing left to download for it, in addition to the existing check. `_ensureDownloader` starts a downloader only when `FindMissing` is non empty, so a waiter with nothing missing has nothing that could ever wake it. This is purely additive to the existing condition, so it cannot regress the shrink case that f3f743c3f fixed. PR attached."""
