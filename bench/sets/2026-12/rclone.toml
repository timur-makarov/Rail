The Drive metadata path starts bounded concurrent permission fetches, but `getPermission` holds the global permission-cache mutex across each Drive API request.

## Evidence

- [`backend/drive/metadata.go:108-136`](https://github.com/rclone/rclone/blob/17629d67b26904d102d9072c66ba95cf08a51316/backend/drive/metadata.go#L108-L136) and [`metadata.go:384-410`](https://github.com/rclone/rclone/blob/17629d67b26904d102d9072c66ba95cf08a51316/backend/drive/metadata.go#L384-L410): `parseMetadata` creates bounded tasks, while `permissionsMu` remains locked through `Permissions.Get(...).Do()`.
