# rclone-06: When a multipart upload is rejected early by the server, the upload must stop reading the source so
# closing it does not deadlock against the pump goroutine.
# issue opened 2026-10-22, fix opened 2026-10-24, squash (or single commit); source files:
# backend/imagekit/client/upload.go, backend/pcloud/pcloud.go, backend/pikpak/pikpak.go, backend/seafile/webapi.go,
