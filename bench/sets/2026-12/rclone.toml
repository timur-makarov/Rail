id = "rclone-04"
request = """
fs: SizeSuffix serialisation round trip is lossy — values change when written out and read back (1046 becomes 1045)

### Before you start

- [x] I have searched the [forum](https://forum.rclone.org/) and the existing issues for this problem.
- [x] I have tested with the latest beta or stable release and can still reproduce the problem.
- [x] This is a reproducible bug, not a usage question (questions belong on the forum).

### Associated forum post URL

_No response_

### What is the problem you are having with rclone?

`SizeSuffix.stringRoundTrip()` in `fs/sizesuffix.go` is documented as turning a SizeSuffix "into a string which Set parses back to the same value", but the underlying `string()` formats with `%.3f`, so the round trip is lossy for any value needing more than 3 decimal places in its scaled form.

Reproduction (unit test in package `fs`):

```go
var y SizeSuffix
_ = y.Set(SizeSuffix(1046).stringRoundTrip())
// y == 1045, expected 1046

var z SizeSuffix
_ = z.Set(SizeSuffix(123456789012345678).stringRoundTrip())
// z == 123457176585107408, drift of +387572761730 bytes
```

The scaled value is printed to 3 decimal places ("1.021Ki" for 1046) and `Set` then truncates, so the value silently changes. At larger scales the drift grows: 2^60+1 round trips with a delta of -1, and values near 2^60 + 2^40 drift by over 1 TiB.

This serialisation is on real paths:
- `fs/registry.go` `Option.String()` returns `x.stringRoundTrip()` for SizeSuffix options, so option values written out (config, `rclone config dump`, help defaults) and read back change value.
- `fs/bwtimetable.go` `BwTimetable.String()` serialises Tx/Rx limits with `stringRoundTrip()`, so a reported bandwidth limit fed back in (the rc `core/bwlimit` pattern) changes: a 1046 B/s limit comes back as 1045 B/s.

Expected: for every non-negative SizeSuffix, `Set(x.stringRoundTrip()) == x`, as the doc comment promises.
