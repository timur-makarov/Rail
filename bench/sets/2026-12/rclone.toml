# rclone-01: With --name-transform, files moved to --backup-dir or renamed with --suffix should keep their destination
# name instead of having the transform applied again.
# issue opened 2026-11-13, fix opened 2026-11-13, squash (or single commit); source files: fs/operations/operations.go
# (6 lines); request from body (never edited).
# reading notes: text names the cause and the code path; issue author is a maintainer, not the fixer
[[situation]]
id = "rclone-01"
request = """
sync: --backup-dir and --suffix apply --name-transform to the backup's name

### Before you start

- [x] I have searched the [forum](https://forum.rclone.org/) and the existing issues for this problem.
- [x] I have tested with the latest beta or stable release and can still reproduce the problem.
- [x] This is a reproducible bug, not a usage question (questions belong on the forum).

### Associated forum post URL

_No response_

### What is the problem you are having with rclone?

With `--name-transform`, every file that `sync`, `copy`, or `move` moves into `--backup-dir` gets the transform applied to its name. A replaced `p-file.txt` is backed up as `p-p-file.txt`, and a deleted `other.txt`, a file the transform never touched, is backed up as `p-other.txt`. The [docs](https://rclone.org/docs/#backup-dir-string) say these files are moved "in their original hierarchy".

```sh
mkdir -p /tmp/bknt/src /tmp/bknt/dst /tmp/bknt/bak
printf NEW_LONGER > /tmp/bknt/src/file.txt
printf OLD > /tmp/bknt/dst/p-file.txt
printf X > /tmp/bknt/dst/other.txt
rclone sync /tmp/bknt/src /tmp/bknt/dst --backup-dir /tmp/bknt/bak --name-transform prefix=p-
ls /tmp/bknt/bak
```

Expected: `other.txt` and `p-file.txt`. Actual: `p-other.txt` and `p-p-file.txt`. Exit 0, and nothing is lost, but the backups are renamed. With a transform like `base64encode`, the deleted `other.txt` is backed up as `b3RoZXIudHh0`, which has to be decoded to find. With `all,`, directories are transformed too (`p-p-sub/p-p-file.txt`). `--suffix .bak` gives `p-p-file.txt.bak`, both with `--backup-dir` and without it (where the backup stays in the destination).

Cause: `MoveBackupDir` builds the backup's name from the destination object's name, which is already final, and passes it to `operations.Move`:

https://github.com/rclone/rclone/blob/b0ef5f6a6eca641a6bfb55bc05ef1595f4105d07/fs/operations/operations.go#L2043-L2048

`operations.move` applies the transform to whatever name it's given:

https://github.com/rclone/rclone/blob/b0ef5f6a6eca641a6bfb55bc05ef1595f4105d07/fs/operations/operations.go#L437-L439

The `overwritten` lookup in `MoveBackupDir` uses the untransformed name, so it never finds an earlier backup at the transformed name. On local, the move replaces it anyway, as it does without a transform. I haven't tested a backend that allows duplicate names.

Replaced files reach `MoveBackupDir` from `sync` [here](https://github.com/rclone/rclone/blob/b0ef5f6a6eca641a6bfb55bc05ef1595f4105d07/fs/sync/sync.go#L404) and deleted files through [`DeleteFileWithBackupDir`](https://github.com/rclone/rclone/blob/b0ef5f6a6eca641a6bfb55bc05ef1595f4105d07/fs/operations/operations.go#L565-L582). I reproduced it with `sync`, `copy`, and `move`, local to local, on `v1.76.0`, master b0ef5f6a6, and #10333. `--copy-dest` isn't affected. It has been this way since `--name-transform` was added in 013c56329 (`v1.70`).

