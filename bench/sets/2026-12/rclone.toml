id = "rclone-09"
request = """
pikpak: HTTP error status on download is not checked, 502 HTML body is returned as file data

#### The associated forum post URL from `https://forum.rclone.org`

None found. Related but not identical reports (0-byte / `sizes differ`):
- https://forum.rclone.org/t/pikpak-copy-corrupted-on-transfer/46421
- https://forum.rclone.org/t/errors-occurring-in-the-copy-and-mount-commands-in-pikpak/46837

#### What is the problem you are having with rclone?

When the PikPak download node answers a ranged GET with `502 Bad Gateway`, the pikpak backend does not treat it as an error. The 163-byte HTML error page is handed to the reader as file content and rclone exits 0.

With `rclone mount --vfs-cache-mode full` the HTML bytes are written into the VFS cache and the range can be marked as downloaded, so the bad data is served again until the cache item is removed. Media files then fail to decode or contain an HTML page in the middle of the stream. The same range fetched a moment later from the same file returned correct bytes, so the cloud object itself was not corrupt.

Code path (checked on v1.75.0, and the same functions are unchanged in v1.75.1, v1.75.2 and master at 81e7372f):
- `backend/pikpak/pikpak.go` `open`: after `client.Do(req)` the response goes through `shouldRetry`, and no HTTP status check is made on the download response.
- `shouldRetry`: when `err == nil` it returns success regardless of `resp.StatusCode`, so a 502 is never retried or turned into an error.

The changelog fix for truncated PikPak uploads is about the upload input ending early and does not touch this path.

Suggested fix: in the download path, treat a non-2xx status as an error (close the body and go through the retry logic, so 5xx is retried), and check that a 206 `Content-Range` matches the request.

#### What is your rclone version (output of `rclone version`)

v1.75.0 (linux/arm64) reproduced. Source of v1.75.1, v1.75.2 and master compared, not run.

#### Which OS you are using and how many bits

Ubuntu 24.04, arm64.

#### Which cloud storage system are you using?

PikPak (native `pikpak` backend)

#### The command you were using and why

Mount (long running):
```
