#### How to reproduce

The 502 comes from the PikPak side intermittently, so I cannot trigger it on demand. A test with an `httptest` server that returns 502 with a small HTML body for the download URL should show the body being returned by `open`, with no error.

Additional observation: with the same account, copying files directly also failed intermittently with `corrupted on transfer: sizes differ` (destination 163 bytes), and the same files copied fine later.

