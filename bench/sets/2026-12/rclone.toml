# rclone-18: Directory walks should stop promptly and return context canceled when the job's context is cancelled,
# instead of listing the whole tree.
# issue opened 2026-08-17, fix opened 2026-08-17, squash (or single commit); source files: backend/local/local.go,
# fs/walk/walk.go (10 lines); request from oldest of 2 edit records.
# reading notes: filed by fixer; text names the cause; test uses a 10s safety timeout only
[[situation]]
id = "rclone-18"
request = """
walk: directory traversal ignores context cancellation - rc job/stop on operations/size has no effect

### Before you start

- [x] I have searched the [forum](https://forum.rclone.org/) and the existing issues for this problem.
- [x] I have tested with the latest beta or stable release and can still reproduce the problem.
- [x] This is a reproducible bug, not a usage question (questions belong on the forum).

### Associated forum post URL

None — I searched the forum and existing issues and found no report of this (see "Prior art" below).

### What is the problem you are having with rclone?

Cancelling an async RC job that walks a directory tree has no effect on the traversal itself. `job/stop` cancels the job's context and returns immediately, but the concurrent walkers created by `walk()` keep pulling list jobs from the channel and keep listing the entire tree until it is exhausted, at full CPU.

Measured with the official `v1.75.0` binary on macOS arm64 against a local tree of 1,260,000 files (6000 directories × 210 files): after `job/stop` is acknowledged, the `rclone rcd` process keeps burning ~570% CPU for ~4 more seconds and the job eventually finishes with `success=true`. The cancellation is effectively ignored.

Reproducer:

```bash
# build a big local tree
mkdir -p bigtree; for i in $(seq 1 6000); do mkdir -p bigtree/d$i; for j in $(seq 1 210); do printf x > bigtree/d$i/f$j.txt; done; done

rclone rcd --rc-addr 127.0.0.1:5571 --rc-user probe --rc-pass probe &
sleep 1
JOB=$(curl -sf -u probe:probe -X POST http://127.0.0.1:5571/operations/size -d fs=bigtree -d _async=true | jq -r .jobid)
sleep 2
curl -sf -u probe:probe -X POST http://127.0.0.1:5571/job/stop -d "jobid=$JOB"
# watch the rcd process keep burning CPU, then finish with success=true
```

Root cause: the checker loop inside `walk()` (`fs/walk/walk.go`, the `walkN` path used when the backend has no native `ListR`, e.g. local/alias) only selects on the `in` channel and the internal `quit` signal. Nothing observes `ctx.Done()`. The context-propagation effort (#3257) added a `ctx` parameter to `walk()`, but the checkers never watch it, so any cancellation arriving mid-walk is invisible to them.

Additionally, the local backend's `List` never checks its context, so once a single huge directory (millions of entries) is being enumerated, cancellation cannot take effect until that enumeration completes.

Expected: after `job/stop`, the walk stops promptly and the job finishes with `error=context canceled`.

The same blind spot affects `operations/list` with `recurse=true` and any other RC command that goes through `walk()` against a backend without native `ListR`. With `--use-listr`-style paths on backends that have `ListR`, cancellation works because the context is propagated to the backend.

### Prior art

I searched the tracker and the forum before filing:

- #3257 is the completed context-propagation effort; this gap looks like a leftover from it — `walk()` received a `ctx` parameter but its checkers never observe `ctx.Done()`.
- The 2020 forum report of `job/stop` not stopping an sftp transfer is a different mechanism (backend-level cancellation, pre-#3257).
- #9416 is a channel deadlock in `fs/walk` under `--fast-list` — same file, distinct bug (deadlock during normal operation, not ignored cancellation).

No existing issue or PR reports the walker ignoring context cancellation.

### rclone version

```
rclone v1.75.0
- os/version: darwin 27.0 (64 bit)
- os/kernel: 27.0.0 (arm64)
- os/type: darwin
- os/arch: arm64
- go/version: go1.26.2
- go/linking: dynamic
- go/tags: none
```

I also checked current master (`fs/walk/walk.go`): the checker loop still has no `ctx.Done()` observation, so the bug is present in master.

### Which OS you are using

macOS 27.0 (arm64). The repro is OS-independent — the affected code is pure Go concurrency logic with no platform-specific path.

### Which cloud storage system are you using? (eg Google Drive)

Local filesystem (no `ListR` implementation, which is what routes `operations/size` through the affected `walkN` path).

### The command you were trying to run (eg `rclone copy /tmp remote:tmp`)

Async RC `operations/size` against a local remote, cancelled via `job/stop` (see reproducer above).

### A log from the command with the `-vv` flag

From the reproducer above, polling `job/status` every second after `job/stop`: the job stays `finished=false` with the process at ~570% CPU for ~4 s, then reports `finished=true, success=true` — the walk ran to completion despite the acknowledged cancellation. No error or suspicious entry appears in the log at any point, which is likely why this has gone unnoticed: the cancelled job looks successful, it just keeps burning CPU in silence.

#### How to use GitHub

* Please use buttons (not links) in the toolbar to upload files, and copy/paste logs into fenced code blocks (triple backticks) instead of screenshots of text — thank you!*"""
