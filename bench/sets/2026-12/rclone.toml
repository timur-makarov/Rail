# rclone-24: Creating a stats group per rc sync/move call should not leak an averageLoop goroutine when the job does
# no transfers.
# issue opened 2026-07-01, fix opened 2026-07-02, squash (or single commit); source files:
# fs/accounting/stats_groups.go (9 lines); request from body (never edited).
# reading notes: test reads internal stats.average.started, which existed before the fix
[[situation]]
id = "rclone-24"
request = """
Goroutine leak in accounting.(*StatsInfo).averageLoop when a new stats group is created per rc sync/move call

### Before you start

- [x] I have searched the [forum](https://forum.rclone.org/) and the existing issues for this problem.
- [x] I have tested with the latest beta or stable release and can still reproduce the problem.
- [x] This is a reproducible bug, not a usage question (questions belong on the forum).

### Associated forum post URL

https://forum.rclone.org/t/goroutine-leak-in-accounting-statsinfo-averageloop/51321

### What is the problem you are having with rclone?

A long-running `rclone rcd` daemon leaks one `accounting.(*StatsInfo).averageLoop` goroutine per `rc sync/move` call, growing unbounded until the process is OOM-killed.

We run `rclone rcd` as a persistent daemon and a systemd timer fires `rclone rc sync/move` once per minute per mapping (6 mappings) to flush local spool directories to S3. Because each rc call gets a **new stats group** (`job/N`), and that group's `averageLoop` goroutine is **never stopped**, goroutines accumulate 1:1 with the number of calls.

After ~7 days of uptime the daemon held **~61k goroutines / ~640 MB RSS**, while the actual work in that period was only **7 transfers / 4.7 MB** — i.e. the memory is almost entirely leaked accounting state, not working set.

The three numbers all converge on the call count, which pins it to "one leak per rc call":

```
uptime / interval * mappings = 611046s / 60 * 6  ≈ 61,100 calls
latest job id                                     = 61,143
go_goroutines                                     = 61,128
```

The pprof goroutine profile shows essentially all of them stuck in a single stack:

```
$ curl -s "http://127.0.0.1:5572/debug/pprof/goroutine?debug=1" | head
goroutine profile: total 61155
61147 @ 0x48e6ce 0x46a665 0xa26325 0x496bc1
#    0xa26324    github.com/rclone/rclone/fs/accounting.(*StatsInfo).averageLoop+0x144    fs/accounting/stats.go:352
```

`core/memstats` confirms it is live, retained memory (not runtime high-water mark — `HeapReleased` is tiny):

```
$ rclone rc --url http://127.0.0.1:5572 core/memstats
HeapAlloc   : 437,477,392   (~437 MB live)
HeapObjects : 3,759,816
StackInuse  : 126,648,320   (~126 MB, i.e. the 61k goroutine stacks)
Sys         : 686,316,968
```

`core/group-list` keeps growing with `job/N` groups, and `go_goroutines` grows ~1 per call and never drops, even across the rc job-expiry window.

**This looks like the same leak as #8571** (fixed 2025-06-04), which stopped `averageLoop` from auto-starting in `NewStats`. We are running a version that already contains that change, yet the leak still reproduces — so either #8571 does not cover the "create a fresh stats group per rc `sync/move` call" path, or it has regressed. The trigger here is repeated rc calls that each create a new group whose `averageLoop` is started (at group creation) but, because the job does no transfers (empty spool most of the time), `transferring`/`checking` never go non-empty→empty and `_stopAverageLoop()` is never reached.


### rclone version

rclone v1.74.1
- os/version: rocky8 x86_64
- os/kernel: 
- os/type: linux
- os/arch: x86_64
- go/version: <fill in>
- go/linking: dynamic
- go/tags: none

### Operating system

Linux

### Which cloud storage system are you using?

S3

### Output of `rclone config redacted`

```ini
[s3remote]
type = s3
provider = AWS
env_auth = true
region = ap-northeast-1
profile = default
```

### The command you were trying to run

```shell
# Daemon (long-running):
rclone rcd \\
  --config /etc/rclone/rclone.conf \\
  --rc-addr 127.0.0.1:5572 \\
  --rc-no-auth \\
  --rc-enable-metrics \\
  --use-json-log \\
  --log-level INFO

# Fired once per minute per mapping by a systemd timer (no _group):
rclone rc --url http://127.0.0.1:5572 sync/move \\
  srcFs=/data/spool dstFs=s3remote:mybucket/prefix \\
  deleteEmptySrcDirs=true _async=false \\
  _config='{"MinAge":"30s","Transfers":16,"Checkers":8,"UseServerModTime":true,"Update":true}'
```

### A log from the command with the `-vv` flag

```shell
$ curl -s "http://127.0.0.1:5572/debug/pprof/goroutine?debug=1" | head -40
  goroutine profile: total 61155
  61147 @ 0x48e6ce 0x46a665 0xa26325 0x496bc1
  #    0xa26324    github.com/rclone/rclone/fs/accounting.(*StatsInfo).averageLoop+0x144github.com/rclone/rclone/fs/accounting/stats.go:352
```

### Anything else?

- Related: #8571 (previous averageLoop leak fix), forum thread #51321.
- The leak reproduces even when every job transfers nothing (empty source), which suggests the `averageLoop` started at stats-group creation is never stopped for zero-transfer rc jobs, and that abandoned per-`job/N` groups keep their goroutine.
- Impact scales with rc call frequency on a long-lived `rcd`; a per-minute timer over multiple mappings makes it OOM within days."""
