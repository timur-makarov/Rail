# rclone: rclone/rclone, go, reserve project of set 2026-12 (fulltest PLAN sections 3 and 4).
# Settings: written by reading the project's CI and docs at the oldest and newest start commit, nothing run;
# every command marked `unverified` is for the admission session to try and fix. Notes: notes/rclone.md.
# Situations: every candidate of bench-candidates/rclone.toml (REPORT-window-rule.md, 2026-11-26), in its order,
# all 24 of them.
# half is `work` for every candidate until the split after admission and the hardness runs (cloud/README.md).
# hidden_tests: the fix's changed files (start..fix, compare API) that match [project] tests or the travel
# globs ["testdata/*", "*/testdata/*"],
# and not []; deleted files left out.
# self_filed: the issue's author opened the fix. bot_filed: the issue's author is an automation account
# (a login ending in bot or -ci, or turso-github-handyman, roboturso). security_trap: the reading pass's
# flag for a request whose natural fix invites a flaw. kind race is the race flag.

# rclone: settings for Rail's bench (no [[situation]] tables; those are written elsewhere).
# Read at the oldest start c1b5756eec76b9f0f7ee4da43fdbcae9cb73a2db (rclone-24, go 1.25.0) and the newest
# 554ddb5de24f0e396aa4aa8afc97f4a039206f66 (rclone-01, go 1.26.0). See rclone.md for what was read and why.
# Go mechanics shared by the four Go projects: GO-COMMON.md (BASH_ENV sources $BENCH_CACHE/go-env.sh, which sets the
# absolute GOMODCACHE and GOCACHE that the literal [commands] env table cannot hold).

[project]
name = "rclone"
repo = "https://github.com/rclone/rclone"
language = "go"
package = "github.com/rclone/rclone"
tests = ["*_test.go"]
# clash: the Go default "dir". See rclone.md: vfs/, fs/sync/, fs/operations/ and backend/chunker/ keep helpers,
# TestMain or the TestIntegration runner in other _test.go files, so "dir" can drop a file the hidden tests need.
clash = "dir"
build_dirs = []

[commands]
# from: Makefile@554ddb5de2 (quicktest: RCLONE_CONFIG="/notfound" go test ./...), AGENTS.md@554ddb5de2,
#       go.mod@c1b5756eec (go 1.25.0) and @554ddb5de2 (go 1.26.0); toolchain caching from Go 1.24.7 cmd/go source.
# unverified: never run; the offline toolchain switch and the vet warm-up are reasoned from source, not tried.
setup = '''
set -euo pipefail
mkdir -p "$BENCH_CACHE"
t=$(mktemp "$BENCH_CACHE/.go-env.XXXXXX")
printf '%s\n' 'export GOMODCACHE="$BENCH_CACHE/gomod"' 'export GOCACHE="$BENCH_CACHE/gocache"' > "$t"
mv -f "$t" "$BENCH_CACHE/go-env.sh"
. "$BENCH_CACHE/go-env.sh"
export GOPROXY=https://proxy.golang.org,direct
go version
go mod download
go list -deps -test ./... > /dev/null
go build ./...
go vet ./... > /dev/null 2>&1 || echo "setup: go vet ./... reports problems at this start (not fatal)"
git diff --quiet -- go.mod go.sum || { git diff --stat -- go.mod go.sum; git checkout -- go.mod go.sum; }
if [ -n "$(git status --porcelain)" ]; then git status --porcelain | head -20; echo "setup left changes in the copy"; exit 1; fi
'''
# from: Makefile@554ddb5de2 quicktest (go test, RCLONE_CONFIG=/notfound, -timeout 20m); selection by -run is ours.
# unverified: the -run selection, the InternalTest fallback (rclone-07) and the "no tests to run" guard are untried.
test_files = '''
. "$BENCH_CACHE/go-env.sh"
list=""
for f in {files}; do
  case "$f" in *_test.go) ;; *) continue ;; esac
  [ -f "$f" ] || continue
  n=$(grep -ohE '^func (Test|Fuzz|Example)[A-Za-z0-9_]*\(' "$f" | sed -E 's/^func //; s/\($//' | grep -vx TestMain | paste -sd'|' -)
  if [ -z "$n" ] && grep -qE '^func \([A-Za-z_]+ \*Fs\) InternalTest\(' "$f"; then n=TestIntegration; fi
  list="$list$(dirname "$f") ${n:-.*}"$'\n'
done
[ -n "$list" ] || { echo "no Go test file among: {files}"; exit 2; }
rc=0
for d in $(printf '%s' "$list" | cut -d' ' -f1 | sort -u); do
  names=$(printf '%s' "$list" | awk -v d="$d" '$1 == d { print $2 }' | paste -sd'|' -)
  out=$(go test -count=1 -timeout 20m "./$d" -run "^($names)\$" 2>&1); st=$?
  printf '%s\n' "$out"
  if [ $st -eq 0 ] && grep -q 'no tests to run' <<< "$out"; then echo "FAIL: no hidden test ran in ./$d"; st=1; fi
  [ $st -eq 0 ] || rc=1
done
exit $rc
'''
# from: Makefile@554ddb5de2 quicktest; AGENTS.md@554ddb5de2 ("go test -v ./backend/memory/").
# unverified: the walk-up to the nearest folder with Go files and the "." case (go build ./... then the root package).
test_package = '''
. "$BENCH_CACHE/go-env.sh"
p={package}
while [ "$p" != . ] && ! compgen -G "$p/*.go" > /dev/null; do p=$(dirname "$p"); done
if [ "$p" = . ]; then go build ./... && go test -count=1 -timeout 20m .; else go test -count=1 -timeout 20m "./$p"; fi
'''
# The folder of the changed file, cut at testdata/ (a Go package is a folder); a root file gives ".".
package_of = 'regex:^(.*?)(?:/testdata/.*|/[^/]*)$'
# from: Go's testing output: "--- FAIL: TestX (0.00s)", subtests indented "    --- FAIL: TestX/sub (0.00s)".
failed = '^\s*--- FAIL: (\S+)'
timeout_minutes = 30
# GOMODCACHE/GOCACHE are not here: the table is set literally and Go wants absolute paths. go-env.sh sets them.
# GOSUMDB must stay sum.golang.org: a cached golang.org/toolchain module is still checked against the (cached)
# checksum database, and GOSUMDB=off makes that check fail. RCLONE_CONFIG=/notfound is what CI's quicktest sets: it
# makes fstests skip every backend integration test that needs a configured remote (fstests.go Run, "quicktest only").
env = { GOTOOLCHAIN = "auto", GOPROXY = "off", GOSUMDB = "sum.golang.org", GOFLAGS = "-mod=mod", BASH_ENV = "$BENCH_CACHE/go-env.sh", RCLONE_CONFIG = "/notfound", BASH_DEFAULT_TIMEOUT_MS = "1800000", BASH_MAX_TIMEOUT_MS = "7200000", GOMODCACHE = "/srv/rail-bench/cache/rclone/gomod", GOCACHE = "/srv/rail-bench/cache/rclone/gocache" }
[rail.config.commands]
# Rail's setup in a new worktree, offline: modules and build cache are shared through $BENCH_CACHE, so this only
# checks that the toolchain and modules resolve offline and warms the worktree's build.
# from: AGENTS.md@554ddb5de2 ("go build"). unverified: offline in a fresh worktree not tried.
setup = '''
. "$BENCH_CACHE/go-env.sh"
go version && go build ./...
'''
# Fast part always: gofmt of changed .go files and go build ./... . Then go vet and go test of each changed package.
# from: Makefile@554ddb5de2 (quicktest, check: golangci-lint with govet enable-all minus fieldalignment/shadow in
# .golangci.yml@554ddb5de2, so plain go vet is a subset). unverified: golangci-lint left out (not installed, and its
# "latest" version in CI cannot be pinned offline); timings estimated.
verify = '''
set -euo pipefail
. "$BENCH_CACHE/go-env.sh"
base="${RAIL_BASE:-refs/heads/main}"
changed=$( { git diff --name-only "$base" --; git ls-files --others --exclude-standard; } | grep -vE '^\.(rail|claude)/' | sort -u || true)
gofiles=$(printf '%s\n' "$changed" | grep -E '\.go$' | while read -r f; do if [ -f "$f" ]; then echo "$f"; fi; done || true)
if [ -n "$gofiles" ]; then
  bad=$(printf '%s\n' "$gofiles" | xargs gofmt -l)
  if [ -n "$bad" ]; then echo "gofmt -w needed on: $bad"; exit 1; fi
fi
go build ./...
pkgs=$(printf '%s\n' "$changed" | while read -r f; do
  [ -n "$f" ] || continue
  d=$(dirname "$f"); d=${d%%/testdata*}
  while [ "$d" != . ] && ! compgen -G "$d/*.go" > /dev/null; do d=$(dirname "$d"); done
  echo "./$d"
done | sort -u || true)
if [ -n "$pkgs" ]; then
  go vet $pkgs
  go test -count=1 -timeout 20m $pkgs
fi
'''
timeout_secs = 1800
setup_timeout_secs = 900
verify_timeout_secs = 2400

