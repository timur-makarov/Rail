```
Direct reproduction of the response, ranged read through rclone with headers dumped:
```
rclone cat pik:path/to/file.mp4 --offset 0 --count 4096 -vv --dump headers
```

#### A log from the command with the `-vv` flag

Trimmed headers from two consecutive ranged reads of different files on different nodes. File names removed.

Good response:
