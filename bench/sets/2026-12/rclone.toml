### What is the problem you are having with rclone?

After removing a directory's contents and then the directory itself, `vfs/forget` no longer clears the root's directory cache. Files added outside rclone stay invisible until the cache expires, or, for `vfs/forget` and the cache cleanup, until the removed directory's cleanup timer fires, 2 × `--dir-cache-time` later. The same applies to anything that relies on `ForgetAll`, e.g. `vfs/forget dir=...` on an ancestor.

