# rclone-02: When a --name-transform fails for a top-level file, rclone should keep the original name instead of
# producing an empty name.
# issue opened 2026-11-13, fix opened 2026-11-13, squash (or single commit); source files: lib/transform/transform.go
# (9 lines); request from body (never edited).
# reading notes: text names the fix (return original name as soon as a transform fails)
[[situation]]
id = "rclone-02"
request = """
lib/transform: a top-level file gets an empty name when its transform fails

### Before you start

- [x] I have searched the [forum](https://forum.rclone.org/) and the existing issues for this problem.
- [x] I have tested with the latest beta or stable release and can still reproduce the problem.
- [x] This is a reproducible bug, not a usage question (questions belong on the forum).

### Associated forum post URL

_No response_

### What is the problem you are having with rclone?

When a `--name-transform` fails for a file, rclone logs an error and is supposed to keep the file's original name. That works for files in subdirectories, but a file at the top level of the transfer gets an empty name instead. On local, the copy then fails. On bucket-based remotes, the file is written to the destination path itself, outside the destination.

Local (the copy fails, and nothing is lost):

```sh
mkdir -p /tmp/ntroot/src/sub
echo x > /tmp/ntroot/src/photo.jpeg
echo x > /tmp/ntroot/src/sub/photo.jpeg
rclone copy /tmp/ntroot/src /tmp/ntroot/dst --name-transform truncate_keep_extension=3
find /tmp/ntroot/dst -type f
```

`.jpeg` is longer than the limit, so the transform fails for both files. `sub/photo.jpeg` is copied under its original name, as expected. The top-level `photo.jpeg` isn't copied at all: rclone tries to rename its partial file onto the destination root (`rename $T/dst/.645a37c3.partial $T/dst: file exists`), and then fails with `partial file rename failed: can't move object - incompatible remotes`. `copy`, `sync`, and `convmv` all exit 1.

A bucket-based remote (shown here with `memory`, which needs a single process, so through `rcd`):

```sh
mkdir -p /tmp/ntbucket && echo x > /tmp/ntbucket/photo.jpeg
rclone rcd --rc-no-auth --rc-addr 127.0.0.1:5599 &
rclone rc --url http://127.0.0.1:5599/ sync/move --json '{"srcFs":"/tmp/ntbucket","dstFs":":memory:bkt/dir","_config":{"NameTransform":["truncate_keep_extension=3"]}}'
rclone rc --url http://127.0.0.1:5599/ operations/list --json '{"fs":":memory:","remote":"bkt","opt":{"recurse":true}}'
kill %1
```

The `move` returns `{}`, and `/tmp/ntbucket` is now empty. The file has become the object `bkt/dir`, a file with the same name as the destination directory, one level above it. If several top-level files fail, they all map to the same empty name, so only the first is moved; the others log `Duplicate object found in source - ignoring`. I only tested `memory`, but S3 builds its keys the same way (`bucket.Join("bkt/dir", "")` is `bkt/dir`), so I'd expect the same there.

Cause: when a transform returns an error, `Path` logs it and carries on with the empty string that `transformPath` returned:

https://github.com/rclone/rclone/blob/b0ef5f6a6eca641a6bfb55bc05ef1595f4105d07/lib/transform/transform.go#L66-L69

The only thing that restores the original name is the segment-count check at the end. It works for `sub/photo.jpeg` → `""` (1 slash vs 0), but `photo.jpeg` → `""` has 0 slashes either way, so `Path` returns `""`:

https://github.com/rclone/rclone/blob/b0ef5f6a6eca641a6bfb55bc05ef1595f4105d07/lib/transform/transform.go#L74-L78

The logged error is also misleading. In the `baseOnly` branch, the error from `transformPathSegment` (here, "extension is longer than the truncation limit") is never checked; `validateSegment` rejects the empty result instead, so the log says `transform cannot render path segments empty`:

https://github.com/rclone/rclone/blob/b0ef5f6a6eca641a6bfb55bc05ef1595f4105d07/lib/transform/transform.go#L92-L97

A fix would be for `Path` to return the original name as soon as a transform fails. The existing tests only check failing transforms with a directory in the path (`stories/photo.jpeg`), which is why they pass.

