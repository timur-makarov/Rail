Only the request lines are shown. Page 26 was requested 383 times in about 2 minutes before I stopped it. The directory has 2,762 entries.

### Anything else?

What I found out about the API while looking into this, with read-only requests:

- `orderBy=created_at&orderDir=asc` and `desc` work. `orderBy=id` is ignored.
- `filters` is ignored in every encoding I tried, so the `created_at` windowing Duplicati used doesn't work for us. `paginate=cursor` and the like make no difference either.
- `known_total` in the listing response is the real number of entries in the directory and matches `GET /folders/{id}/count`. `total` and `last_page` are made up while paging.
- `query=<name>` returns the direct children of `folderId` whose name contains it, including ones past the limit. Without `folderId` it searches the whole drive.
- Entries created in the same second don't come back in the same order in `asc` and `desc`.

Other clients have hit the same limit: duplicati/duplicati#7285 and essare/drime-s3#8. A Duplicati user also reported it in a comment on #9391.

I have a fix ready: return an error at the limit instead of looping, look single files up with `query`, list oldest first and then newest first so directories with up to about 40,000 entries list completely, and set `DuplicateFiles` so `rclone dedupe` can clean up. I'll open a PR linked to this issue."""
