request = """
touch: --timestamp fails on documented example "17.10.30" and common date formats

### Before you start

- [x] I have searched the [forum](https://forum.rclone.org/) and the existing issues for this problem.
- [x] I have tested with the latest beta or stable release and can still reproduce the problem.
- [x] This is a reproducible bug, not a usage question (questions belong on the forum).

### Associated forum post URL

_No response_

### What is the problem you are having with rclone?

The `rclone touch --timestamp` flag fails when using the format explicitly given as an example in the command help and documentation (`17.10.30`). It also fails on standard `YYYY-MM-DD` dates and RFC 3339 UTC timestamps ending in `Z`.

In `cmd/touch/touch.go`, the help text states:
```text
Times may be specified as one of:

- 'YYMMDD' - e.g. 17.10.30
- 'YYYY-MM-DDTHH:MM:SS' - e.g. 2006-01-02T15:04:05
- 'YYYY-MM-DDTHH:MM:SS.SSS' - e.g. 2006-01-02T15:04:05.123456789
```

In the implementation, `defaultLayout` is set to `"060102"` (without dots), and layout selection is determined strictly by string length:

```go
func parseTimeArgument(timeString string) (time.Time, error) {
	layout := defaultLayout
	if len(timeString) == len(layoutDateWithTime) {
		layout = layoutDateWithTime
	} else if len(timeString) > len(layoutDateWithTime) {
		layout = layoutDateWithTimeNano
	}
	if localTime {
		return time.ParseInLocation(layout, timeString, time.Local)
	}
	return time.Parse(layout, timeString)
}
```

Because of this:
1. The documented example `17.10.30` has length 8 (`< 19`), falling back to `defaultLayout` (`"060102"`). `time.Parse` errors with:
   `parsing time "17.10.30" as "060102": cannot parse ".10.30" as "01"`
2. Standard date inputs like `2024-05-01` have length 10 (`< 19`), falling back to `"060102"`. `time.Parse` errors with:
   `parsing time "2024-05-01" as "060102": cannot parse "-05-01" as "01"`
3. RFC 3339 timestamps ending with `Z` like `2024-05-01T12:00:00Z` have length 20 (`> 19`), which selects `layoutDateWithTimeNano` (`"2006-01-02T15:04:05.999999999"`), expecting a subsecond decimal `.` and erroring on `Z`.


