[[situation]]
id = "rclone-06"
request = """
Transfers hang forever (0 B/s, no sockets) when a multipart upload fails: deadlock between AsyncReader.Abandon and lib/rest.MultipartUpload

### Before you start

- [x] I have searched the forum and the existing issues for this problem.
- [x] I have tested with the latest stable release (v1.75.2) and can still reproduce the problem.
- [x] This is a reproducible bug, not a usage question.

### What is the problem you are having with rclone?

During a large `rclone copy` to Seafile, transfers stop forever: the stats show `0 B/s`, the files
stay open at a fixed read position, the rclone process has **no open sockets** left, nothing is
logged (no ERROR, no retry), and `--timeout` never fires. It happened many times during one copy of
~1 TB, always on transfers of large files (hundreds of MB to several GB), several transfers of the
same process at once.

At the same time the server answered some of these multipart uploads with `HTTP 400` after 40–70 s
(in our case the server's temporary upload storage ran full under several parallel multi-GB
uploads). So the trigger is a server that rejects a multipart upload before it has read the whole
body.

A goroutine dump (`--rc`, `/debug/pprof/goroutine?debug=2`) of a stuck process shows the same
pair for every stuck transfer (shortened, v1.75.2):

```
goroutine 77 [sync.Mutex.Lock, 9 minutes]:
sync.(*Mutex).Lock(...)
github.com/rclone/rclone/fs/asyncreader.(*AsyncReader).Abandon(...)        fs/asyncreader/asyncreader.go:290
github.com/rclone/rclone/fs/asyncreader.(*AsyncReader).Close(...)          fs/asyncreader/asyncreader.go:305
github.com/rclone/rclone/fs/accounting.(*Account).Close(...)               fs/accounting/accounting.go:579
github.com/rclone/rclone/fs/operations.(*copy).updateOrPut(...)            fs/operations/copy.go:230
github.com/rclone/rclone/fs/operations.(*copy).manualCopy(...)             fs/operations/copy.go:281
github.com/rclone/rclone/fs/operations.(*copy).copy(...)                   fs/operations/copy.go:321
github.com/rclone/rclone/fs/operations.Copy(...)                           fs/operations/copy.go:426
github.com/rclone/rclone/fs/sync.(*syncCopyMove).pairCopyOrMove(...)       fs/sync/sync.go:518

goroutine 1379 [select, 9 minutes]:
io.(*pipe).write(...)                                                      io/pipe.go:86
io.(*PipeWriter).Write(...)                                                io/pipe.go:161
mime/multipart.(*part).Write(...)                                          mime/multipart/writer.go:209
github.com/rclone/rclone/fs/accounting.(*accountWriteTo).Write(...)        fs/accounting/accounting.go:524
github.com/rclone/rclone/fs/asyncreader.(*AsyncReader).WriteTo(...)        fs/asyncreader/asyncreader.go:179
github.com/rclone/rclone/fs/accounting.(*Account).WriteTo(...)             fs/accounting/accounting.go:540
io.Copy(...)
github.com/rclone/rclone/lib/rest.MultipartUpload.func2()                  lib/rest/rest.go:613
created by github.com/rclone/rclone/lib/rest.MultipartUpload in goroutine 77

goroutine 1378 [select, 9 minutes]:
github.com/rclone/rclone/lib/rest.MultipartUpload.func1()                  lib/rest/rest.go:582
created by github.com/rclone/rclone/lib/rest.MultipartUpload in goroutine 77
```

My reading of it: the upload call has returned (with the error) and the transfer goroutine closes
the source (`Account.Close` → `AsyncReader.Abandon`), which waits for `AsyncReader.mu`. That lock is
held by `AsyncReader.WriteTo`, called from the pump goroutine of `lib/rest.MultipartUpload`, which is
blocked writing into the `io.Pipe` that feeds the request body. Nothing reads from or closes the pipe
reader any more after the request failed, and the context is not cancelled, so `func1` never closes
the writer either. Both sides wait forever.

The connection was HTTP/2 (TLS endpoint); I did not test whether HTTP/1.1 behaves differently.

**Workaround:** `--buffer-size 0` (no AsyncReader). With it the same copy ran on without hangs,
failed uploads are retried as expected.

A possible fix might be closing the multipart body reader (the `io.ReadCloser` returned by
`MultipartUpload`) when the request returns, or closing the pipe in `MultipartUpload` once the
caller is done, so the pump goroutine gets `io.ErrClosedPipe` and releases the lock — but I have not
tried this.

I don't have a minimal stand-alone reproducer yet. It should be reproducible with any server that
answers a multipart upload early with an error while the request body is still being sent, with the
default `--buffer-size`.

Note: the binary is v1.75.2 with the change from #10163 applied (Seafile `last_modify` on upload).
