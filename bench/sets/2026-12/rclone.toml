# rclone-14: Bandwidth limits below 1 KiB printed by BwTimetable.String lose their unit and are read back 1024 times
# larger; the string form should round trip.
# issue opened 2026-09-22, fix opened 2026-09-22, squash (or single commit); source files: fs/bwtimetable.go,
