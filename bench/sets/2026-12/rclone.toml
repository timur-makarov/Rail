# reading notes: text names the fix (remove stale chunks after new ones are in place, as put does)
[[situation]]
id = "rclone-07"
request = """
chunker: server-side copy over an existing file leaves its old chunks

### Before you start

- [x] I have searched the [forum](https://forum.rclone.org/) and the existing issues for this problem.
- [x] I have tested with the latest beta or stable release and can still reproduce the problem.
- [x] This is a reproducible bug, not a usage question (questions belong on the forum).

### Associated forum post URL

_No response_

### What is the problem you are having with rclone?

When `chunker` server-side copies or moves a file over an existing one, it never removes the existing file's chunks beyond the new chunk count. The copy reports success, but the destination can no longer be read:

- **A small (non-chunked) file over a chunked one:** the destination's metadata object is overwritten with the plain data, but its old chunks remain, so chunker reads the data as metadata and fails with `invalid metadata: invalid json`.
- **Fewer chunks over more** (e.g. 6 bytes over 9 bytes with `chunk_size = 3b`): the old last chunk remains, and opening fails with `metadata doesn't match file size`.
- **More or equal chunks over fewer:** fine.

**Repro** (`memory` inside one `rcd`, so the wrapped backend has server-side `Copy`):

```sh
T=$(mktemp -d); printf hi > $T/small; printf HELLO2 > $T/big
rclone rcd --rc-addr localhost:15572 --rc-no-auth & RCD=$!
sleep 2
C=':chunker,remote=":memory:base",chunk_size=3b:'
RC="rclone rc --url http://localhost:15572/"
$RC operations/copyfile srcFs=$T srcRemote=small dstFs="$C" dstRemote=a.txt
$RC operations/copyfile srcFs=$T srcRemote=big dstFs="$C" dstRemote=b.txt
$RC operations/copyfile srcFs="$C" srcRemote=a.txt dstFs="$C" dstRemote=b.txt
$RC operations/list fs=:memory:base remote="" | grep '"Name"'
$RC operations/copyfile srcFs="$C" srcRemote=b.txt dstFs=$T dstRemote=out
kill $RCD
```

The third call succeeds. The listing then shows `b.txt` next to the old `b.txt.rclone_chunk.001` and `b.txt.rclone_chunk.002`, and the last call fails with `can't open: invalid metadata: invalid json`. `operations/movefile` gives the same results, and after a move the source is gone too.

**Cause**

[`copyOrMove`](https://github.com/rclone/rclone/blob/35a03a47e00e2cadec744f977e5fa9d851127016/backend/chunker/chunker.go#L1681) copies each source chunk straight to its final name and the metadata object over `remote`, but it never removes the destination's existing chunks. `put` does this cleanup with [`removeOldChunks`](https://github.com/rclone/rclone/blob/35a03a47e00e2cadec744f977e5fa9d851127016/backend/chunker/chunker.go#L1502):

https://github.com/rclone/rclone/blob/35a03a47e00e2cadec744f977e5fa9d851127016/backend/chunker/chunker.go#L1294

`copyOrMove` has no equivalent.

This affects chunker over any backend whose server-side `Copy` overwrites (`memory`, `s3`, ...), on every platform. Over `local` on macOS it's currently hidden by #10117, because local's `Copy` fails when the destination exists. Once #10121 fixes that, chunker over `local` on macOS hits this too: the bisync integration tests on `TestChunkerChunk3bLocal` then fail `rclone_args`, `resync`, and `resync_modes` with `invalid metadata: invalid json`, which is how this was found.

**Fix idea**

When the destination object exists, remove its chunks that the copy didn't overwrite, as `put` does. Do it only after the new chunks and metadata are in place, so a failed copy doesn't destroy the old file. #10118 is about the same function's error handling, so the two fixes will touch the same code.

**Workaround**

Delete the destination before copying over it.

