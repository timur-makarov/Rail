Range: bytes=0-4095
HTTP/1.1 206 Partial Content
Content-Length: 4096
Content-Range: bytes 0-4095/232551974
Content-Type: application/octet-stream
```
Bad response, rclone exit code 0, 163 bytes written as the file content:
