# nushell-06: `to md --pretty` pads columns by UTF-8 byte length, misaligning tables with CJK or emoji.
# issue opened 2026-11-14, fix opened 2026-11-14, squash (or single commit); source files:
# crates/nu-command/src/formats/to/md.rs (63 lines); request from body (never edited).
# reading notes: filed by fixer; text names the fix (unicode-width in named functions).
[[situation]]
id = "nushell-06"
request = """
`to md --pretty` pads columns by UTF-8 byte length, misaligning CJK and emoji tables

`to md --pretty` is documented to vertically align items, but the column widths and the padding are computed with `str::len()` (UTF-8 byte length). A wide character pushes the borders out of line:

```
| a      | b    |
| ------ | ---- |
| 你好 | z    |
| x      | long |
```

CJK takes two display columns and three UTF-8 bytes; emoji has the same mismatch. ASCII tables are unaffected, and the data itself is unchanged. Markdown renderers drop the padding spaces, so this only shows up in the raw `--pretty` text.

This was already named, not newly found. On 2026-10-06, in the review of #19165 (`to nuon --pretty`), fdncred wrote:

> One more thing outside this diff. `to md --pretty` has the same byte-width bug. That's not for this PR, but whatever measure we settle on here should probably go there too.

That PR settled on `unicode-width` (terminal display width) with the padding written out by hand, and that is what landed. Nothing has carried the same measure over to `to md --pretty`.

The change is in `crates/nu-command/src/formats/to/md.rs`: measure with `unicode_width::UnicodeWidthStr::width()` where the column width and the padding are computed (`collect_headers`, `table`, `get_padded_string`, `get_centered_string`), and pad with `saturating_sub`. `unicode-width` is already a `nu-command` dependency. ASCII output stays byte-identical. Only `--pretty` layout for wide characters changes.

Known limits, pre-existing and left out on purpose: `unicode-width` does not account for Arabic lam-alef ligatures (#18054), and ANSI escapes, tabs and embedded newlines are still counted raw (#19197).

A PR follows."""
