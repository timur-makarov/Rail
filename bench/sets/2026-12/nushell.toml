# nushell-30: `run` should bind script flags by name, like direct script invocation, not by declaration order.
# issue opened 2026-07-06, fix opened 2026-07-06, squash (or single commit); source files:
# crates/nu-command/src/misc/run.rs (14 lines); request from body (never edited).
[[situation]]
id = "nushell-30"
request = """
`run` binds flags by declaration position instead of by name

### Bug report form

- [x] I have done a basic search of the issue tracker to find any existing issues that are similar.
- [x] I have checked that my version is at least the latest stable release available via my installation method.

### Describe the bug

When a script's `def main` declares more than one flag, `run` (new in 0.114.0) assigns a passed flag to the **first declared flag slot**, ignoring the flag's name.

Two follow-on effects:

1. If the first declared flag takes a value, a passed *switch* consumes the next argument as that value, shifting all positional arguments by one (surfacing as confusing `Can't convert` / `Missing parameter` errors).
2. The value bypasses type checking: a string ends up in an `int`-typed flag without error.

Calling the same script directly (`nu repro.nu --beta`) binds flags by name correctly, so this is specific to `run`.

`run --help`'s own example passes a flag by name (`"test" | run format.nu --prefix ">>>"`) — it works only when the passed flag happens to be the first one declared.


### How to reproduce

`repro.nu`:

```nushell
def main [--alpha: int, --beta] { {alpha: $alpha, beta: $beta} }
```

```nushell
> "" | run repro.nu --beta
# actual:   {alpha: true, beta: false}   <- --beta landed on --alpha
# expected: {alpha: null, beta: true}

> "" | run repro.nu --beta positional
# actual:   {alpha: "positional", beta: false}
#           <- --beta treated as the value-taking --alpha, ate the next arg;
#              also no type error despite --alpha: int receiving a string
# expected: error (repro.nu has no positional parameters)

> nu repro.nu --beta
# correct:  {alpha: null, beta: true}
```

Declaration order is what decides: with `def main [--beta, --alpha: int]`, `run repro.nu --beta` works — and `run repro.nu --alpha 3` then wrongly sets `beta: true`.


### Expected behavior

`run` should bind flags to parameters by name, exactly like a direct script invocation, and enforce the declared flag types.


### Configuration

| key                | value                      |
| ------------------ | -------------------------- |
| version            | 0.114.0                    |
| build_target       | aarch64-unknown-linux-gnu  |
| build_time         | 2026-07-04 20:53:43 +00:00 |
| build_rust_channel | release                    |"""
