# nushell-19: `length`, `columns` and `is-empty` swallow error values from a `where` stream and return wrong answers.
# issue opened 2026-08-29, fix opened 2026-09-06, squash (or single commit); source files:
# crates/nu-command/src/filters/columns.rs, crates/nu-command/src/filters/empty.rs,
# crates/nu-command/src/filters/length.rs (45 lines); request from body (never edited).
# reading notes: issue prefers `where` erroring; tests check the consumers, including an each/error make case
[[situation]]
id = "nushell-19"
request = """
`where` emits error values that `length`, `columns` and `is-empty` silently swallow

### Describe the bug

When a `where` predicate raises a type error, `where` emits a stream of error values
rather than failing. Some downstream consumers propagate that error correctly, but
`length`, `columns` and `is-empty` silently consume the error values and return a
**wrong answer with exit code 0**.

The practical consequence is silent data loss: a pipeline can report that a filter
matched N rows and then produce nothing (or everything), with no error anywhere.

### How to reproduce

```nushell
# `size` is a filesize; `150` is an int. The comparison is a type error.
[[name size]; [a 100b] [b 200b]] | where size <= 150 | describe
# => list<error> (stream)
```

Consumers disagree about what to do with that stream:

| pipeline | expected | actual |
|---|---|---|
| `... \\| where size <= 150 \\| length` | error, or `1` | **`2`** |
| `... \\| where size <= 150 \\| columns` | error | **`empty list`** |
| `... \\| where size <= 150 \\| is-empty` | error | **`false`** |
| `... \\| where size <= 150 \\| first` | error | error ✅ |
| `... \\| where size <= 150 \\| get name` | error | error ✅ |
| `... \\| where size <= 150 \\| to json` | error | error ✅ |
| `... \\| where size <= 150 \\| to nuon` | error | error ✅ |

`length` returning `2` is the most damaging: it reports the *unfiltered* row count,
so the filter looks like it ran and matched everything.

The correct comparison behaves properly:

```nushell
[[name size]; [a 100b] [b 200b]] | where size <= 150b | length
# => 1
```

Not specific to `filesize` — any incompatible predicate type does it:

```nushell
[[d]; [1sec] [2sec]]   | where d <= 5 | length   # => 2
[[a]; ["x"] ["y"]]     | where a <= 5 | length   # => 2
```

Outside of `where`, the same comparison errors immediately, as expected:

```nushell
100b <= 150
# Error: nu::shell::operator_incompatible_types
#   x Types 'filesize' and 'int' are not compatible for the '<=' operator.
```

### Expected behavior

`where` should surface the predicate's type error. Failing that, every consumer of a
`list<error>` stream should propagate rather than silently counting or discarding the
error values.

### How I found it

Filtering `idx files` (whose `size` column is a `filesize`) with an int bound:

```nushell
idx files | where size <= 2000000 | length          # => 2466  (looks fine)
idx files | where size <= 2000000 | each { ... }    # => produces nothing
idx files | where size <= 2MB     | each { ... }    # => works
```

The `length` check reported all 2466 rows surviving the filter, so the filter appeared
correct, while the actual pipeline silently wrote an empty table and exited 0.

### Configuration

```
version | 0.115.0
platform | x86_64-unknown-linux-gnu (NixOS, Linux 6.18.45)
```

Reproduced with `nu --no-config-file`.

### Possibly related

- #14462 — `sort-by {length}` on a list of strings silently returns the original list
- #15618 — `find` silences errors"""
