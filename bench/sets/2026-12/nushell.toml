# nushell: nushell/nushell, rust, proposed project of set 2026-12 (fulltest PLAN sections 3 and 4).
# Settings: written by reading the project's CI and docs at the oldest and newest start commit, nothing run;
# every command marked `unverified` is for the admission session to try and fix. Notes: notes/nushell.md.
# Situations: every candidate of bench-candidates/nushell.toml (REPORT-window-rule.md, 2026-11-26), in its order,
# all 30 of them.
# half is `work` for every candidate until the split after admission and the hardness runs (cloud/README.md).
# hidden_tests: the fix's changed files (start..fix, compare API) that match [project] tests or the travel
# globs ["tests/*", "crates/*/tests/*"],
# and not ["src/*", "crates/*/src/*", "Cargo.toml", "Cargo.lock", "crates/*/Cargo.toml", "tests/fixtures/nuplayground/*"]; deleted files left out.
# self_filed: the issue's author opened the fix. bot_filed: the issue's author is an automation account
# (a login ending in bot or -ci, or turso-github-handyman, roboturso). security_trap: the reading pass's
# flag for a request whose natural fix invites a flaw. kind race is the race flag.

# nushell/nushell on Rail's bench. Shared Rust choices: rust-common.md; test runner: rust-test-files.py (embedded
# below with a nushell hook for mod.rs files). Commands checked against .github/workflows/ci.yml, CONTRIBUTING.md,
# Cargo.toml and crates/nu-test-support at the newest start (1a76df9156, nushell-01) and the oldest
# (57a036c4b0, nushell-30); nothing here was run.

[project]
name = "nushell"
repo = "https://github.com/nushell/nushell"
language = "rust"
package = "nu"
# Integration tests: tests/main.rs (package nu) and crates/*/tests/main.rs (or tests/*.rs where a crate keeps
# autotests), each with its modules in subfolders. Fixtures and assets under the same folders travel too
# (nushell.travel.json); unit tests inside src/ files are source and never hidden.
tests = ["tests/*.rs", "crates/*/tests/*.rs"]
clash = "path"

[commands]
# from: rust-common.md (toolchain pin rust-toolchain.toml@1a76df9156: 1.98.1; @57a036c4b0: 1.95.0) and Cargo.lock
# unverified: run on no machine; rustup on the bench's PATH is assumed (brief: "likely").
setup = '''
set -euo pipefail
command -v rustup >/dev/null || { echo "bench: rustup is not on PATH"; exit 1; }
mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
read -r tc comps tgts < <(python3 - <<'PY'
import os, tomllib
f = next((n for n in ("rust-toolchain.toml", "rust-toolchain") if os.path.exists(n)), None)
d = {}
if f:
    t = open(f).read()
    try: d = tomllib.loads(t).get("toolchain", {})
    except tomllib.TOMLDecodeError: d = {"channel": t.strip()}
print(d.get("channel", "stable"), ",".join(d.get("components", [])) or "-", ",".join(d.get("targets", [])) or "-")
PY
)
args=(--profile minimal --component rustfmt,clippy)
[ "$comps" != - ] && args+=(--component "$comps")
[ "$tgts" != - ] && args+=(--target "$tgts")
rustup toolchain install "$tc" "${args[@]}"
rustup default >/dev/null 2>&1 || rustup default "$tc"
cargo --version
# Cargo.lock holds a git dependency (reedline from [patch.crates-io]); fetch puts it in $CARGO_HOME/git.
CARGO_NET_OFFLINE=false cargo fetch --locked
cargo metadata --offline --format-version 1 >/dev/null
'''
# from: CONTRIBUTING.md@1a76df9156 ("cargo test --package nu-command --test tests -- commands::<command>"); Cargo.toml
# [[test]] tests/main.rs harness = false (kitest via nu-test-support); crates/nu-test-support/src/harness/{mod,deps}.rs.
# unverified: never run. Old-style `nu!(...)` tests (deprecated macros, still used in e.g. commands/ls.rs and run.rs in
# July) run target/debug/nu and put target/debug (testbins) on PATH without building them, so the command builds nu
# (and testbins) first when a listed file uses them; tests marked #[deps(NU)] get nu built by the harness itself.
test_files = '''
set -o pipefail
export CARGO_INCREMENTAL=0 INSTA_UPDATE=no CI=true
need=0
for f in {files}; do
  case "$f" in *.rs) [ -f "$f" ] && grep -qE '\bnu(_with_std|_with_plugins)?!\s*\(' "$f" && need=1 ;; esac
done
if [ "$need" = 1 ]; then
  pk=(-p nu); [ -f crates/testbins/Cargo.toml ] && pk+=(-p testbins)
  echo "bench: old-style nu! tests: cargo build ${pk[*]}"
  cargo build "${pk[@]}" || exit 1
fi
python3 - {files} <<'PY'
# bench: run only the given Rust test files. Each .rs file goes to the cargo target that compiles it (read from
# `cargo metadata`): an integration test target (--test NAME), the library (--lib) or a binary (--bin NAME), with a
# libtest filter for the file's module path (or its test function names), so only that file's tests run. Data files
# and helper modules with no test in them travel but are not run. Exits non-zero when a file can't be placed, when
# nothing in the list can run, or when a run executes no test (an empty run would pass vacuously).
import json, os, re, subprocess, sys

files = [f for f in sys.argv[1:] if f]
meta = json.loads(subprocess.run(["cargo", "metadata", "--no-deps", "--offline", "--format-version", "1"],
                                 check=True, capture_output=True, text=True).stdout)
root = meta["workspace_root"]
members = set(meta["workspace_members"])
TARGETS = []  # dicts: pid, pkg, sel (cargo args), src, dir (the crate root's folder); paths relative to root
for p in meta["packages"]:
    if p["id"] not in members:
        continue
    for t in p["targets"]:
        kinds = set(t["kind"])
        if "test" in kinds:
            sel = ["--test", t["name"]]
        elif kinds & {"lib", "rlib", "proc-macro", "cdylib", "staticlib", "dylib"}:
            sel = ["--lib"]
        elif "bin" in kinds:
            sel = ["--bin", t["name"]]
        else:
            continue  # build scripts, examples, benches
        if t.get("required-features"):
            sel += ["--features", ",".join(t["required-features"])]
        src = os.path.relpath(t["src_path"], root)
        TARGETS.append({"pid": p["id"], "pkg": p["name"], "sel": sel, "src": src, "dir": os.path.dirname(src)})


def read(path):
    try:
        with open(os.path.join(root, path), errors="replace") as f:
            return f.read()
    except OSError:
        return ""


def place(path):
    """The targets compiling `path`: the target whose crate root it is, else those whose crate root folder is the
    deepest one holding it; among several, those whose root declares the file's top module, a library before a
    binary."""
    exact = [t for t in TARGETS if t["src"] == path]
    if exact:
        return exact
    holding = [t for t in TARGETS if t["dir"] == "" or path.startswith(t["dir"] + "/")]
    if not holding:
        return []
    deepest = max(len(t["dir"]) for t in holding)
    cands = [t for t in holding if len(t["dir"]) == deepest]
    if len(cands) > 1:
        top = os.path.relpath(path, cands[0]["dir"]).split("/")[0]
        top = top[:-3] if top.endswith(".rs") else top
        declaring = [t for t in cands if re.search(rf"\bmod\s+{re.escape(top)}\b|#\[path\s*=\s*\"[^\"]*{re.escape(top)}",
                                                    read(t["src"]))]
        cands = declaring or cands
        libs = [t for t in cands if t["sel"][0] == "--lib"]
        cands = libs or cands
    return cands


TEST_ATTR = re.compile(r"#\[\s*(?:[\w:]+::)?(?:test|tokio::test|test_case|rstest|case|quickcheck|proptest)\b")


def test_fns(path):
    """Test function names in a file: a `fn` soon after an attribute naming a test."""
    names, armed = [], 0
    for line in read(path).splitlines():
        s = line.strip()
        if TEST_ATTR.search(s):
            armed = 8
        m = re.match(r"(?:pub(?:\([^)]*\))?\s+)?(?:async\s+)?fn\s+(\w+)", s)
        if m and armed:
            names.append(m.group(1))
            armed = 0
        elif armed and s and not s.startswith(("#", "//")):
            armed -= 1
    return names


def module_path(path, t):
    rel = os.path.relpath(path, t["dir"])[:-3].split("/")
    if rel[-1] == "mod":
        rel = rel[:-1]
    return "::".join(rel)


# Per-project hook (nushell): a directory module's mod.rs (tests/shell/mod.rs, tests/modules/mod.rs) holds tests of
# its own AND declares submodules full of other tests; the module filter `shell::` would run all of them. Filter by the
# file's own top-level fns instead (`shell::NAME`; a helper fn's filter just matches nothing). Tests inside inline
# `mod x { }` blocks of a mod.rs are not seen.
def project_hook(path, runs, other):
    if not path.endswith("/mod.rs") or not os.path.isfile(os.path.join(root, path)):
        return False
    text = read(path)
    fns = re.findall(r"^(?:async\s+)?fn\s+(\w+)", text, re.M)
    ts = [t for t in place(path) if t["src"] != path]
    if not fns or not ts or not TEST_ATTR.search(text):
        return False  # no test of its own: the default prints that it travels and is not run
    for t in ts:
        key = (t["pid"], t["pkg"], tuple(t["sel"]))
        mp = module_path(path, t)
        if runs.get(key, ()) is not None:
            runs[key] = set(runs.get(key, ())) | {f"{mp}::{fn}" for fn in fns}
    print(f"bench: {path}: running its own {len(fns)} top-level fns, not its submodules", flush=True)
    return True


runs = {}    # (pid, pkg, sel) -> set of filters, or None for the whole target
other = []   # commands a project hook adds: lists of argv
placed, errors = [], []
for f in files:
    if project_hook(f, runs, other):
        continue
    if not f.endswith(".rs"):
        print(f"bench: {f} is a data file: it travels, it is not run", flush=True)
        continue
    ts = place(f)
    if not ts:
        errors.append(f"{f}: no cargo target of this workspace compiles it")
        continue
    placed.append((f, ts))
listed = {}
for f, ts in placed:
    for t in ts:
        listed.setdefault((t["pid"], t["pkg"], tuple(t["sel"])), set()).add(f)
for f, ts in placed:
    fns = test_fns(f)
    for t in ts:
        key = (t["pid"], t["pkg"], tuple(t["sel"]))
        if f == t["src"]:
            if t["sel"][0] == "--test" and len(listed[key]) == 1 and (fns or re.search(r"^\s*(pub\s+)?mod\s+\w+\s*;",
                                                                                      read(f), re.M)):
                runs[key] = None          # the test target is this file (and the modules it declares): all of it
                continue
            filt = fns                    # a crate root: its own test functions only
        elif fns:
            filt = [module_path(f, t) + "::"]
        else:
            filt = []
        if not filt:
            print(f"bench: {f} holds no test of {t['pkg']} {' '.join(t['sel'])}: it travels, it is not run", flush=True)
            continue
        if runs.get(key, ()) is not None:
            runs[key] = set(runs.get(key, ())) | set(filt)
for e in errors:
    print(f"bench: {e}", flush=True)
if errors:
    sys.exit(2)
if not runs and not other:
    print("bench: nothing in the list can run", flush=True)
    sys.exit(2)


def stream(cmd, cwd):
    """Run cmd, echo its output, return (exit code, tests run)."""
    proc = subprocess.Popen(cmd, cwd=cwd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, errors="replace")
    ran = 0
    for line in proc.stdout:
        sys.stdout.write(line)
        # passed + failed from libtest's (and libtest-mimic's, kitest's) summary: `running N` counts ignored tests too
        m = re.search(r"test result: (?:\x1b\[[\d;]*m)*\w+(?:\x1b\[[\d;]*m)*\. (\d+) passed; (\d+) failed", line)
        if m:
            ran += int(m.group(1)) + int(m.group(2))
    sys.stdout.flush()
    return proc.wait(), ran


status = 0
for (pid, pkg, sel), filt in sorted(runs.items(), key=lambda kv: (kv[0][1], kv[0][2])):
    cmd = ["cargo", "test", "-p", pid, *sel, "--no-fail-fast", "--", *sorted(filt or [])]
    print("bench: " + " ".join(["cargo", "test", "-p", pkg, *cmd[4:]]), flush=True)
    code, ran = stream(cmd, root)
    if code != 0:
        status = 1
    elif ran == 0:
        print(f"bench: no test ran for {pkg} {' '.join(sel)} {sorted(filt or [])}", flush=True)
        status = 1
for cmd in other:
    print("bench: " + " ".join(cmd), flush=True)
    code, _ = stream(cmd, root)
    if code != 0:
        status = 1
sys.exit(status)
PY
'''
# from: CONTRIBUTING.md@1a76df9156 ("cargo test --workspace"), narrowed to one member; rust-common.md section 5.
# unverified: never run. {package} is a folder; "." is the root package `nu` (src/, tests/, Cargo.toml, Cargo.lock):
# its own suite, bounded (~15-25 min cold). A folder that is not a workspace member (crates/*/fuzz) has nothing to run.
test_package = '''
set -o pipefail
export CARGO_INCREMENTAL=0 INSTA_UPDATE=no CI=true
dir={package}
name=$(python3 - "$dir" <<'PY'
import json, os, subprocess, sys
m = json.loads(subprocess.run(["cargo", "metadata", "--no-deps", "--offline", "--format-version", "1"],
                              check=True, capture_output=True, text=True).stdout)
want = os.path.realpath(os.path.join(sys.argv[1], "Cargo.toml"))
print(next((p["name"] for p in m["packages"]
            if p["id"] in m["workspace_members"] and os.path.realpath(p["manifest_path"]) == want), ""))
PY
) || exit 1
if [ -z "$name" ]; then echo "bench: $dir is not a workspace member: nothing to test"; exit 0; fi
if grep -rqE --include='*.rs' --exclude-dir=target '\bnu(_with_std|_with_plugins)?!\s*\(' "$dir"; then
  pk=(-p nu); [ -f crates/testbins/Cargo.toml ] && pk+=(-p testbins)
  if grep -rqE --include='*.rs' --exclude-dir=target '\bnu_with_plugins!\s*\(' "$dir"; then
    for p in crates/nu_plugin_*/; do p=${p%/}; p=${p#crates/}; [ "$p" = nu_plugin_polars ] || pk+=(-p "$p"); done
  fi
  echo "bench: old-style nu! tests: cargo build ${pk[*]}"
  cargo build "${pk[@]}" || exit 1
fi
cargo test -p "$name" --tests --no-fail-fast
'''
package_of = "nearest:Cargo.toml"
# libtest and kitest (nu-test-support's harness) print the same per-test line; kitest adds "timed out".
failed = '^test (.+?) \.\.\. (?:FAILED|timed out)'
# A cold build of the nu binary plus a test target is the bulk of the workspace: 10-20 min on 4 cores (estimate).
timeout_minutes = 60

[commands.env]
BASH_DEFAULT_TIMEOUT_MS = "1800000"
BASH_MAX_TIMEOUT_MS = "7200000"
CARGO_HOME = "/srv/rail-bench/cache/rust/cargo"
RUSTUP_HOME = "/srv/rail-bench/cache/rust/rustup"
CARGO_NET_OFFLINE = "true"
RUSTUP_AUTO_INSTALL = "0"
CARGO_PROFILE_DEV_DEBUG = "line-tables-only"
CARGO_TERM_COLOR = "never"

[rail.config.commands]
# from: rust-common.md section 6. unverified: never run. The worktree needs nothing from the main checkout: toolchain
# and crates are in the shared cache. This checks that every crate resolves offline.
setup = '''
set -euo pipefail
cargo --version
cargo metadata --offline --format-version 1 >/dev/null
'''
# from: .github/workflows/ci.yml@1a76df9156 (lint job: cargo fmt --all --check; root job: cargo test --workspace
# --all-targets), made affected-aware. unverified: never run. Fixed part: cargo fmt --all --check (seconds). Then the
# tests of every workspace member holding a changed .rs/.toml/.nu file (a change at the root, src/ or tests/ is the
# package nu). No clippy: CI's `clippy --workspace --all-targets` with warnings denied is a second full build.
verify = '''
set -euo pipefail
export CARGO_INCREMENTAL=0
base="${RAIL_BASE:-refs/heads/main}"
cargo fmt --all -- --check
changed=$( { git diff --name-only "$base" --; git ls-files --others --exclude-standard; } | sort -u \
  | grep -E '\.(rs|toml|nu)$|^Cargo\.lock$' || true)
if [ -z "$changed" ]; then echo "verify: no Rust change against $base"; exit 0; fi
names=$(printf '%s\n' "$changed" | python3 -c '
import json, os, subprocess, sys
m = json.loads(subprocess.run(["cargo", "metadata", "--no-deps", "--offline", "--format-version", "1"],
                              check=True, capture_output=True, text=True).stdout)
member = {os.path.realpath(os.path.dirname(p["manifest_path"])): p["name"]
          for p in m["packages"] if p["id"] in m["workspace_members"]}
out = set()
for path in sys.stdin.read().split():
    d = os.path.dirname(os.path.realpath(path))
    while True:
        if d in member:
            out.add(member[d]); break
        if os.path.realpath(d) == os.path.realpath(m["workspace_root"]) or d == os.path.dirname(d):
            break
        d = os.path.dirname(d)
print(" ".join(sorted(out)))')
if [ -z "$names" ]; then echo "verify: no workspace member changed"; exit 0; fi
pk=(); for n in $names; do pk+=(-p "$n"); done
dirs=$(printf '%s\n' "$changed" | cut -d/ -f1-2 | sort -u)
if grep -rqsE --include='*.rs' --exclude-dir=target '\bnu(_with_std|_with_plugins)?!\s*\(' $dirs; then
  bp=(-p nu); [ -f crates/testbins/Cargo.toml ] && bp+=(-p testbins)
  cargo build "${bp[@]}"
fi
echo "verify: cargo test ${pk[*]} --tests"
cargo test "${pk[@]}" --tests --no-fail-fast
'''
timeout_secs = 1800
setup_timeout_secs = 600
verify_timeout_secs = 3000

# The bench's additions, the same for every project file of this set:
# - [commands] env BASH_DEFAULT_TIMEOUT_MS and BASH_MAX_TIMEOUT_MS: the Bash tool limits Rail's own
#   .claude/settings.json gives its worker, given to every child, so a plain arm's Bash tool is not cut at
#   two minutes while Rail's runs for thirty.
# - [rail.config.worker] ladder: the Rail arm of the first run (PLAN section 6, owner 2026-11-25): Sonnet 5.5
#   medium, then Opus 5.5 medium. It sits here because an arm file can give only one rung (bench/arms.py);
#   person_ladder and contract stay as Rail's seed has them.
# - [rail.config.claim] stale_minutes: above the longest Rail command's limit plus save_minutes (10), as
#   `rail docs config` asks.
[rail.config.worker]
ladder = ["claude-sonnet-5-5:medium", "claude-opus-5-5:medium"]

[rail.config.claim]
stale_minutes = 65

# nushell-01: With an extern signature for cargo, `cargo -Zscript x` is rejected as 'only the last flag can take args'
# instead of passing the attached short-flag value through.
# issue opened 2026-11-22, fix opened 2026-11-23, squash (or single commit); source files:
# crates/nu-parser/src/parse_calls.rs (90 lines); request from body (never edited).
# reading notes: Tests also check strict extern type errors for attached values and multibyte flag batches; these
# follow naturally. Uses existing cococo testbin.
[[situation]]
id = "nushell-01"
request = """
REPL error "only the last flag can take args" for a short flag with an argument not separated by a space

### Bug report form

- [x] I have done a basic search of the issue tracker to find any existing issues that are similar.
- [x] I have checked that my version is at least the latest stable release available via my installation method.

### Describe the bug

After I installed completions for cargo:

```nushell
let dir = $nu.user-autoload-dirs | first; mkdir $dir; generate completions 'cargo' | save --force ($dir | path join cargo.nu)
```

the following stopped working:

```nushell
V:\\tmp> cargo -Zscript fp_asm.rs
Error: nu::parser::only_last_flag_in_batch_can_take_arg

  × Only the last flag in a short flag batch can take an argument.
   ╭─[repl_entry #3:1:8]
 1 │ cargo -Zscript fp_asm.rs
   ·        ┬
   ·        ╰── only the last flag can take args
   ╰────
```

Separating the arg (`-Z script`) still works. Without the completions installed, the REPL doesn't complain, and the joined arg (`Zscript`) works just fine.

### How to reproduce

1. Install completions for cargo:

```nushell
let dir = $nu.user-autoload-dirs | first; mkdir $dir; generate completions 'cargo' | save --force ($dir | path join cargo.nu)
```

2. Attempt to run cargo with a flag with args, placing the arg directly after the flag, e.g. `cargo -Zscript test.rs`. This should start showing a repl error, and fail when executed. Running the command with the argument separated, `cargo -Z script test.rs`, does not fail.
3. Try to run the same command _without_ completions installed. The command should execute without issue in both cases.

### Expected behavior

The REPL should parse and allow short flags with arguments directly after them. I believe that entering the argument without a separating space is quite common, cargo parses it correctly, and the Cargo book lists both examples (`-Zscript` example [here](https://doc.rust-lang.org/nightly/cargo/reference/unstable.html#script)).

### Configuration

| key                  | value                                                                                                                                            |
| -------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------ |
| version              | 0.117.1                                                                                                                                          |
| major                | 0                                                                                                                                                |
| minor                | 117                                                                                                                                              |
| patch                | 1                                                                                                                                                |
| branch               | main                                                                                                                                             |
| commit_hash          | 3d8a9cc6e093ae5c5ddcb179f3b72934b20fece8                                                                                                         |
| build_os             | windows-x86_64                                                                                                                                   |
| build_target         | x86_64-pc-windows-msvc                                                                                                                           |
| rust_version         | rustc 1.102.0-nightly (5f4effd57 2026-11-13)                                                                                                     |
| rust_channel         | nightly-x86_64-pc-windows-msvc                                                                                                                   |
| cargo_version        | cargo 1.102.0-nightly (ede6cefea 2026-11-11)                                                                                                     |
| build_time           | 2026-11-19 21:00:50 +01:00                                                                                                                       |
| build_rust_channel   | release                                                                                                                                          |
| allocator            | standard                                                                                                                                         |
| features             | dap, default, full, lsp, mcp, network, plugin, rustls-tls, sqlite, system-clipboard, trash-support                                               |
| installed_plugins    | dns 4.0.9, formats 0.105.1, gstat 0.105.1, inc 0.105.1, polars 0.105.1, query 0.105.1                                                            |
| experimental_options | example=false, dc-glob=false, reorder-cell-paths=true, pipefail=true, enforce-runtime-annotations=true, native-clip=false, cell-path-types=false |"""
start = "1a76df915653a5e2dad31bb24c7faca4b51b6aa3"
fix = "a349f3257ca2bf9313bfde89c94920ebc3c7a8a4"
