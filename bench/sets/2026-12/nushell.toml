broken symlink for config.nu prevents nushell from starting entirely

## Description:
If ~/.config/nushell/config.nu targets to a broken symlink, it fails to start completely. It doesn't fallback to default config, and no recovery mechanism. On a system where nushell is the only thing that is starting the desktop environment from tty1, it locks the user out entirely.

## Reproduction:
1. Set nushell as default shell
2. Symlink ~/.config/nushell/config.nu to a file that no longer exists (e.g., repo was moved)
3. Log out
