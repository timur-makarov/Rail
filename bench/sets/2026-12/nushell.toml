# nushell-02: A circular module import reached through a `..` path segfaults instead of raising the circular-import
# parse error.
# issue opened 2026-07-26, fix opened 2026-07-26, squash (or single commit); source files:
# crates/nu-parser/src/parse_module.rs, crates/nu-parser/src/parse_source.rs,
# crates/nu-protocol/src/engine/state_working_set.rs (134 lines); request from body (never edited).
# reading notes: Text points at the likely cause (paths not canonicalized). Extra tests cover source cycles and
# symlinks with the existing error code.
[[situation]]
id = "nushell-02"
request = """
Segfault on circular import

### Bug report form

- [x] I have done a basic search of the issue tracker to find any existing issues that are similar.
- [x] I have checked that my version is at least the latest stable release available via my installation method.

### Describe the bug

https://github.com/nushell/nushell/blob/3a299f3fcec508404cd77111b88766224941212e/crates/nu-protocol/src/engine/state_working_set.rs#L1224

my guess: doesn't canonicalize paths?

### How to reproduce

```nu
# /tmp/nucrash/c/mod.nu
export module i
```

```nu
# /tmp/nucrash/c/i/mod.nu
use ../mod.nu
```

