id = "nushell-05"
request = """
[Bug]: flatten silently drops list columns after empty nested records

### Bug report form

- [x] I have done a basic search of the issue tracker to find any existing issues that are similar.
- [x] I have checked that my version is at least the latest stable release available via my installation method.

### Describe the bug

The `flatten` command can silently discard list or nested-table columns when an earlier field contains an empty nested record (`{}`).

The issue occurs because `flatten` records the position of an expanded column using the input record's field index rather than its position in the output record.

When an earlier nested record is empty, it contributes no fields to the output. Consequently, the recorded position can exceed the output record's length, causing the subsequent list or nested-table column to be omitted entirely.

A related issue occurs when an earlier nested record contains multiple fields: the following list column can be inserted in the middle of those expanded fields, producing an incorrect column order.

This results in silent data loss or incorrectly ordered output without an error or warning.

I reproduced this behavior against the unmodified upstream Nushell implementation and verified a proposed fix with regression tests.

### How to reproduce

Run the following commands in Nushell:

**Case 1: Empty nested record before a list**

```nushell
{a: {}, b: [1, 2]} | flatten | to nuon
```

Actual output:

```nushell
[{}, {}]
```

Expected output:

```nushell
[[b]; [1], [2]]
```

**Case 2: Empty record and scalar before a list**

```nushell
{a: {}, id: 42, tags: [dev, ops]} | flatten | to nuon
```

Actual output:

```nushell
[[id]; [42], [42]]
```

Expected output:

```nushell
[[id, tags]; [42, dev], [42, ops]]
```

**Case 3: Multiple fields in a nested record before a list**

```nushell
{a: {x: 1, y: 2}, b: [3, 4], c: 5} | flatten | to nuon
```

Actual output:

```nushell
[[x, b, y, c]; [1, 3, 2, 5], [1, 4, 2, 5]]
```

Expected output:

```nushell
[[x, y, b, c]; [1, 2, 3, 5], [1, 2, 4, 5]]
```

The first two cases demonstrate silent loss of list data. The third demonstrates incorrect column ordering.

### Expected behavior

The `flatten` command should preserve all list and nested-table columns when expanding nested records, including when preceding records are empty.

It should also preserve the correct column order when a preceding nested record expands into multiple fields.

No input data should be silently discarded during flattening.

