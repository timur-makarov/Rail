# nushell-16: `idx search` caps at 200 matches per file and rounds `--limit` to multiples of 200; `--limit N` should
# return at most N and allow more.
# issue opened 2026-08-29, fix opened 2026-09-23, squash (or single commit); source files:
# crates/nu-command/src/filesystem/idx/state.rs (6 lines); request from body (never edited).
# reading notes: serial tests building a local index
[[situation]]
id = "nushell-16"
request = """
`idx search` silently caps at 200 matches per file; `--limit` is quantised to 200 and cannot raise it

### Describe the bug

`idx search` silently truncates at **200 matches per file**, and no `--limit` value can
raise it. Separately, `--limit` is rounded up to a multiple of 200, so it can't lower
the result count below 200 either. The help text describes `--limit` as "Maximum number
of matches to collect", which matches neither behaviour.

Truncation is silent — no warning, no indication in the output that results are
incomplete.

### How to reproduce

One file, 1000 matching lines:

```nushell
mkdir /tmp/idxcap
1..1000 | each {|i| $"line ($i) match" } | str join "\\n" | save -f /tmp/idxcap/big.txt
cd /tmp/idxcap
idx init . --wait --no-watch | ignore

idx search match --limit 100000 | length            # => 200   (expected 1000)
idx search match --limit 100000 | get line_number | math max   # => 200
```

`rg -c match /tmp/idxcap/big.txt` reports `1000`.

The cap is per file, not global. With three such files (3000 matching lines total),
the ceiling is 600 = 3 × 200:

```nushell
idx search match --limit 100000
    | group-by relative_path
    | items {|k v| {file: $k, rows: ($v | length)} }
# => a.txt 200, b.txt 200, c.txt 200
```

### `--limit` is quantised to 200

Same three files, 3000 real matches:

| `--limit` | rows returned |
|---|---|
| 1 | 200 |
| 10 | 200 |
| 200 | 200 |
| 201 | 400 |
| 400 | 400 |
| 401 | 600 |
| 600 | 600 |
| 601 | 600 |
| 100000 | 600 |

So the effective count is `min(ceil(limit / 200) * 200, 200 * files_with_matches)`.
`--limit 1` returns 200 rows; `--limit 100000` returns 600 out of 3000.

### Expected behavior

