# nushell-05: `flatten` drops list columns after an empty nested record and misorders columns after a multi-field
# nested record.
# issue opened 2026-11-12, fix opened 2026-11-12, squash (or single commit); source files:
# crates/nu-command/src/filters/flatten.rs (23 lines); request from body (never edited).
