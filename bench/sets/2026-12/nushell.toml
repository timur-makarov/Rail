## Expected behavior:
Nushell should either ignore broken symlinks and fall back to built-in defaults

## Current workaround:
None from login screen. Requires live USB or another OS to fix the symlink.

## Suggestion:
When config.nu or env.nu path resolves to a broken symlink, treat it the same as a missing file — use defaults and print a warning. A broken symlink is functionally identical to a missing file; there's no reason for a hard failure."""
