### Issue Details

Hey — found this while setting up Caddy on NixOS with Defined Networking (Nebula-based mesh VPN) for internal-only reverse proxying. `skip_install_trust` silently doesn't work in one specific configuration shape, which cost a fair bit of debugging time to trace back to `#7211`/`#7238`. Repro below is minimal and confirmed against a real deployment. Happy to provide more detail if useful.

If it's helpful context for prioritization: this combination (auto_https off + explicit per-site `tls internal` + skip_install_trust) is a pretty natural shape for anyone running Caddy as an internal-only reverse proxy in a sandboxed/unprivileged environment (containers, NixOS systemd hardening, etc.) where writing to the OS trust store isn't possible — i.e. exactly the audience #7211 was trying to fix for.

---

# Issue: `skip_install_trust` has no effect on CAs created by an explicit site-level `tls internal` directive (follow-up to #7211)

`#7238` correctly fixed `skip_install_trust` for the *implicit/default* CA path when `auto_https off` is set (per `buildPKIApp()`'s `!autoHTTPSOff` check). However, an explicit **site-level `tls internal`** directive creates its own CA through a different code path that doesn't check `skip_install_trust` at all — so trust-store installation is still attempted and fails silently in restricted/sandboxed environments (e.g. an unprivileged NixOS systemd service without `certutil` or write access to the system trust store).

## Repro Caddyfile

```caddyfile
{
    auto_https off
    skip_install_trust
}

localhost:8080 {
    respond "plain http, no tls"
}

internal.example.com {
    respond "explicit tls internal site"
    tls internal
}
```

## Expected

No attempt to install trust into the OS store for the CA created for `internal.example.com`, matching what `skip_install_trust` does for the implicit-CA path.

## Actual

```
{"level":"error","logger":"pki.ca.local","msg":"failed to install root certificate","error":"failed to execute tee: exit status 1","certificate_file":"storage:pki/authorities/local/root.crt"}
```

The certificate itself still gets generated and Caddy continues running (non-fatal), but the option is silently ignored for this path, and the error log gives no indication `skip_install_trust` was even relevant — it just looks like a generic, unrelated `tee` failure.

## Environment

- Caddy version: 2.11.4
- OS: NixOS (unprivileged systemd service, no `certutil`, read-only-ish trust store paths)
- Deployment: `services.caddy` NixOS module, Caddyfile adapter

