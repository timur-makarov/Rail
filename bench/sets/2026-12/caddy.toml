# caddy-13: With request_buffers/response_buffers unlimited, a body read error (e.g. request_body max_size) should not
# be forwarded as a complete body.
# issue opened 2026-10-13, fix opened 2026-10-13, squash (or single commit); source files:
# modules/caddyhttp/reverseproxy/reverseproxy.go (22 lines); request from body (never edited).
# reading notes: filed by fixer; text names the fix; integration test uses local servers.
[[situation]]
id = "caddy-13"
request = """
reverseproxy: `request_buffers unlimited` forwards a body cut off by `request_body max_size` as complete (200, not 413)

### Issue Details

With `request_buffers unlimited` (or `response_buffers unlimited`), a read error on the body is ignored, and whatever was read before the error is sent on as the whole body.

Version: v2.11.7 (release binary) and master at d293dcfe.

```
{
	admin localhost:18419
	auto_https off
}
:18414 {
	request_body {
		max_size 10
	}
	reverse_proxy 127.0.0.1:18410 {
		request_buffers unlimited
	}
}
:18415 {
	request_body {
		max_size 10
	}
	reverse_proxy 127.0.0.1:18410 {
		request_buffers 1MB
	}
}
```

The upstream on 18410 replies with the number of body bytes it received and the `Content-Length` it was sent.

```
$ head -c 100 /dev/zero | tr '\\0' a | curl -s -w ' %{http_code}\\n' --data-binary @- localhost:18414/
upstream got 10 bytes, content-length 10 200
$ head -c 100 /dev/zero | tr '\\0' a | curl -s -w ' %{http_code}\\n' --data-binary @- localhost:18415/
 413
```

Expected 413 on both, as with no `request_buffers` at all. With `unlimited`, the upload is cut to 10 bytes, sent upstream with `Content-Length: 10`, and the client gets 200.

The response side has the same problem: when the upstream sends a chunked response and closes the connection before the final chunk, `response_buffers unlimited` delivers what it got as a complete 200. Without `response_buffers`, or with a finite size, the client sees the transfer fail (`curl: (18) transfer closed with outstanding read data remaining`).

Cause: `bufferedBody` in `modules/caddyhttp/reverseproxy/reverseproxy.go` does `written, _ = io.Copy(buf, originalBody)` for a negative limit; the TODO above it notes the error is dropped. The limited branch already falls back to the original body on a read error.

This is the same failure as #7691 (`{http.request.body}` returning a truncated body past `max_size`), which #7969 fixed for the placeholders.

I have a small patch with tests (the unlimited case handles a read error the way the limited case does) and can open a PR if this sounds right.

