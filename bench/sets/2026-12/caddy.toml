# caddy-02: try_files {path} {path}/ =404 should serve the site root / from the root directory index again, as in
# v2.11.7.
# issue opened 2026-11-09, fix opened 2026-11-09, squash (or single commit); source files:
# modules/caddyhttp/fileserver/matcher.go (8 lines); request from body (never edited).
# reading notes: Clear regression report with table; integration test uses local caddytest server.
[[situation]]
id = "caddy-02"
request = """
try_files {path} {path}/ =404 returns 404 for the site root / since v2.11.8 (static site; subdirs still served)

### 1. What happened?

Since v2.11.8, `try_files {path} {path}/ =404` returns 404 for the site root `/` on a plain static site, while directory subpaths (`/ru/`), explicit files (`/index.html`) and the 404 path all keep working. v2.11.7 serves `/` fine. Still broken on v2.11.9 and on master.

We hit this in production: the site's Docker image base floated from v2.11.7 to v2.11.9 during a routine rebuild and the homepage alone went dark (fronted by a CDN, so the 404 got cached sitewide for `/`). Because every subpage kept answering 200, the breakage slipped past spot checks for hours.

### 2. What did you expect to happen?

`/` should be served from `<root>/index.html` like on v2.11.7 — the `{path} {path}/` candidate pair resolving `/` via the root directory + index lookup.

### 3. How can it be reproduced?

Caddyfile:

```caddyfile
:8091 {
	root * /srv
	route {
		try_files {path} {path}/ =404
		file_server
	}
}
```

Files: `/srv/index.html` (`<h1>root</h1>`) and `/srv/ru/index.html` (`<h1>ru</h1>`).

Stock images `caddy:2.11.7-alpine` / `caddy:2.11.8-alpine` / `caddy:2.11.9-alpine`, plus master built via `xcaddy build master` (`v2.11.8-0.20261108222245-fcfdef43c566`):

| request | 2.11.7 | 2.11.8 | 2.11.9 | master |
|---|---|---|---|---|
| `/`          | 200 | 404 | 404 | 404 |
| `/ru/`       | 200 | 200 | 200 | 200 |
| `/index.html`| 200 | 200 | 200 | 200 |
| `/nope`      | 404 | 404 | 404 | 404 |

### 4. Further details

Suspected cause: the file-matcher semantics change in #8326 (plus #8352) — a candidate ending in `/` now only matches a directory. The candidate `/` (empty path relative to the site root) appears to no longer match the root directory itself, so both `{path}` and `{path}/` fail for `/` and `=404` wins; real subdirectories still match their candidates, hence the selective breakage of the homepage only.

The related regressions fixed after v2.11.9 (#8353 / #8367 php_fastcgi index, #8382 browse) were fastcgi/browse-specific; the plain static `try_files` + `file_server` case is still broken on master.

Workarounds that restore `/` on v2.11.9:
- explicit index candidate: `try_files {path} {path}/ /index.html =404`;
- explicit root rewrite: `@root path /` + `rewrite @root /index.html`.

Question: is the root directory intended to stop matching a `/`-ending candidate? If the new semantics are intended, the `try_files` docs should call out that `{path} {path}/` alone no longer serves `/` (this idiom is all over static-site examples); if not, `/` should match as a directory candidate."""
