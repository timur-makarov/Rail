# caddy-06: basic_auth should reject accounts whose usernames collide only after {env.*} placeholder expansion.
# issue opened 2026-09-19, fix opened 2026-11-01, squash (or single commit); source files:
# modules/caddyhttp/caddyauth/basicauth.go (6 lines); request from body (never edited).
