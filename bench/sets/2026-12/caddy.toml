id = "caddy-15"
request = """
caddyhttp: `try_files` with a `?query` item and `=404` returns 404 for every request

### Issue Details

If `try_files` has an item with a query string and ends with a status code, every request gets that status code, even when an earlier item matches an existing file.

Version: v2.11.7 (release binary) and master at 093fd4b7.

```
{
	admin localhost:9298
	auto_https off
}
:9220 {
	root * www
	try_files {path} {path}.html?{query} =404
	file_server
}
:9221 {
	root * www
	try_files {path} {path}.html =404
	file_server
}
```

`www/` has `style.css` and `about.html`.

```
$ curl -s -o /dev/null -w '%{http_code}\\n' localhost:9220/style.css
404
$ curl -s -o /dev/null -w '%{http_code}\\n' localhost:9220/about
404
$ curl -s -o /dev/null -w '%{http_code}\\n' localhost:9221/style.css
200
$ curl -s -o /dev/null -w '%{http_code}\\n' localhost:9221/about
200
```

Expected: 200 for both files on :9220, and 404 only for a missing file, like :9221.

Cause: because of the query string, `try_files` is split into three routes in the same group (`{path}`, `{path}.html` + `?{query}`, `=404`), so only the first matching one runs. But `wrapRoute` in `modules/caddyhttp/routes.go` runs a route's matchers before it checks whether its group is already satisfied. After the first route matches and rewrites, the `=404` route's file matcher still runs, and `=404` makes the matcher return an error, which ends the request.

The same ordering also lets a skipped route's matcher overwrite placeholders. `rewrite` directives are grouped the same way:

```
:9231 {
	@x path_regexp x ^/x/(.*)$
	@y path_regexp x ^/(.*)$
	rewrite @x /one/{re.x.1}
	rewrite @y /two/{re.x.1}
	respond "path={path} cap={re.x.1}"
}
```

```
$ curl -s localhost:9231/x/q
path=/one/q cap=one/q
```

Only the first `rewrite` runs, but `@y` still runs against the rewritten path and sets `{re.x.1}` to `one/q` instead of `q`.

I have a small patch with a test (check the group before running the matchers) and can open a PR if this sounds right.

