Bug: mTLS not requesting certificate when using non standard port

### Issue Details

This is a minimal reproduction of the Caddyfile which shows the issue.
```
(mtls) {
	tls {
		client_auth {
			mode verify_if_given
			trust_pool file /tmp/root.crt
		}
	}
}

abc.domain.com, abc.domain.com:2000 {
	import mtls

	respond "first"
}

domain.domain.com {
	import mtls

	respond "second"
}

ghi.domain.com, ghi.domain.com:2000 {
	import mtls

	respond "third"
}
```

When accessing https://ghi.domain.com:2000, the certificate is not requested. I have managed to find the issue when running `caddy adapt --pretty`. These are the things I noticed:

1. With the above config, the server `srv0` which is for port 2000, contains only `abc.domain.com` in the `tls_connection_policies > match > sni`.
2. Changing the port to 5000 will move the server with port 5000 to `srv1` which contains both `abc.domain.com` and `ghi.domain.com` in the `tls_connection_policies > match > sni`. I believe this is because it is sorted by port number in alphabetical order but not sure why it is fixed when it is the second server.
3. Removing import mtls from `domain.domain.com` will fix the issue.
4. Removing the route `domain.domain.com` will fix the issue.
5. Inlining the TLS config instead of using a snippet will not fix the issue.
6. Making `ghi.domain.com` the first domain in the caddy file will make `ghi.domain.com` the only one available in the `tls_connection_policies > match > sni`.
7. Splitting the routes so they are not joined together with commas will fix the issue. i.e. duplicate `abc.domain.com` and have `abc.domain.com:2000` in another route to fix it.
8. Changing the middle route from `domain.domain.com` to `def.domain.com` will cause all 3 to appear in the `tls_connection_policies > match > sni` for port 2000 even though `def.domain.com` is not supposed to be exposed on port 2000.

After finding the issue in the output of `caddy adapt --pretty`, I have not tested all of the above to see what the real behaviour is but I assume the JSON output should be enough to detect the issue. I can provide the JSON output of each if required.

