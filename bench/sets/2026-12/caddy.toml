# caddy: caddyserver/caddy, go, proposed project of set 2026-12 (fulltest PLAN sections 3 and 4).
# Settings: written by reading the project's CI and docs at the oldest and newest start commit, nothing run;
# every command marked `unverified` is for the admission session to try and fix. Notes: notes/caddy.md.
# Situations: every candidate of bench-candidates/caddy.toml (REPORT-window-rule.md, 2026-11-26), in its order,
# all 29 of them.
# half is `work` for every candidate until the split after admission and the hardness runs (cloud/README.md).
# hidden_tests: the fix's changed files (start..fix, compare API) that match [project] tests or the travel
# globs ["*/testdata/*", "testdata/*", "caddytest/caddytest.go", "caddytest/*.crt", "caddytest/*.key", "caddytest/*.cer", "caddytest/*.pem", "internal/testmocks/*"],
# and not []; deleted files left out.
# self_filed: the issue's author opened the fix. bot_filed: the issue's author is an automation account
# (a login ending in bot or -ci, or turso-github-handyman, roboturso). security_trap: the reading pass's
# flag for a request whose natural fix invites a flaw. kind race is the race flag.

# caddy: settings for Rail's bench (no [[situation]] tables; those are written elsewhere).
# Read at the oldest start b2be548275c99cd061ec1c2f9c27eedae64a17b8 (caddy-29, go 1.25.1) and the newest
# 16618f454ca6f78f37dfd85a90573d8ffd43c1c8 (caddy-01, go 1.26.0), plus ci.yml at five starts between. See caddy.md.
# Go mechanics shared by the four Go projects (GO-COMMON.md): the [commands] env table is set literally, so the
# absolute GOMODCACHE and GOCACHE live in $BENCH_CACHE/go-env.sh, which setup writes and every bash shell sources
# through BASH_ENV (and every command below sources it again, explicitly).

[project]
name = "caddy"
repo = "https://github.com/caddyserver/caddy"
language = "go"
package = "github.com/caddyserver/caddy/v2"
# Go test files, and the Caddyfile adapt cases: TestCaddyfileAdaptToJSON runs every file in caddyfile_adapt/ as a
# subtest named after the file (.caddyfiletest and a few .txt).
tests = ["*_test.go", "caddytest/integration/caddyfile_adapt/*"]
# clash: the Go default "dir", so an arm's new test file in a hidden test's folder cannot redeclare a hidden Test or
# helper name. Its cost (caddy.md): the grade deletes, not reverts, an arm's edited sibling test file, and three hidden
# files need a sibling: caddy-17 (encode_harness_test.go helpers), caddy-27 (resetDynamicHosts in
# dynamic_upstreams_test.go), caddy-04 (TestMain in formatter_test.go).
clash = "dir"
build_dirs = []

[commands]
# from: .github/workflows/ci.yml@16618f454c ("Get dependencies": go get -v -t -d ./...; env GOFLAGS
#       -tags=nobadger,nomysql,nopgx), go.mod@b2be548275 (go 1.25.1) and @16618f454c (go 1.26.0), no toolchain line;
#       the offline toolchain switch from Go 1.24.7's cmd/go source (toolchain/select.go, modfetch/fetch.go, sumdb.go).
# unverified: never run; module download by go mod download + go list -deps -test instead of CI's go get, and the
#       offline switch to the cached go1.25.1/go1.26.0 is reasoned from source, not tried.
setup = '''
set -euo pipefail
mkdir -p "$BENCH_CACHE"
t=$(mktemp "$BENCH_CACHE/.go-env.XXXXXX")
printf '%s\n' 'export GOMODCACHE="$BENCH_CACHE/gomod"' 'export GOCACHE="$BENCH_CACHE/gocache"' > "$t"
mv -f "$t" "$BENCH_CACHE/go-env.sh"
. "$BENCH_CACHE/go-env.sh"
size=$(du -sm "$GOCACHE" 2>/dev/null | cut -f1 || true)
if [ "${size:-0}" -gt 6000 ]; then echo "setup: GOCACHE is ${size} MB, cleaning it"; go clean -cache; fi
export GOPROXY=https://proxy.golang.org,direct
go version
go mod download
go list -deps -test ./... > /dev/null
GOPROXY=off go list -deps -test ./... > /dev/null
git diff --quiet -- go.mod go.sum || { git diff --stat -- go.mod go.sum; git checkout -- go.mod go.sum; }
if [ -n "$(git status --porcelain)" ]; then git status --porcelain | head -20; echo "setup left changes in the copy"; exit 1; fi
'''
# from: AGENTS.md@16618f454c ("Integration tests: go test ./caddytest/integration/...", no -short: caddytest's
#       InitServer skips every integration test under -short); the -run selection of the hidden files' own Test names
#       and the caddyfile_adapt subtest selection are ours.
# unverified: never run. The two guards (a run that ran nothing, and caddytest's "failed integration prerequisites"
#       skip when port 2999/9080/9443 is taken) turn a silent skip into a failure.
test_files = '''
. "$BENCH_CACHE/go-env.sh"
list=""
for f in {files}; do
  [ -f "$f" ] || continue
  case "$f" in
    caddytest/integration/caddyfile_adapt/*)
      n=$(basename "$f" | sed 's/[.]/\\./g')
      list="$list""adapt $n"$'\n' ;;
    *_test.go)
      n=$(grep -ohE '^func (Test|Fuzz|Example)[A-Za-z0-9_]*\(' "$f" | sed -E 's/^func //; s/\($//' | grep -vx TestMain | paste -sd'|' -)
      list="$list$(dirname "$f") ${n:-.*}"$'\n' ;;
  esac
done
[ -n "$list" ] || { echo "no Go test file or adapt case among: {files}"; exit 2; }
rc=0
for d in $(printf '%s' "$list" | cut -d' ' -f1 | sort -u); do
  names=$(printf '%s' "$list" | awk -v d="$d" '$1 == d { print $2 }' | paste -sd'|' -)
  if [ "$d" = adapt ]; then
    pkg=./caddytest/integration; run="^TestCaddyfileAdaptToJSON\$/^($names)\$"
  else
    pkg="./$d"; run="^($names)\$"
  fi
  out=$(go test -count=1 -v -run "$run" "$pkg" 2>&1); st=$?
  printf '%s\n' "$out"
  if grep -qE 'no tests to run|\[no test files\]' <<< "$out"; then echo "FAIL: no hidden test ran in $pkg"; st=1; fi
  if grep -q 'failed integration prerequisites' <<< "$out"; then echo "FAIL: caddytest skipped (ports 2999/9080/9443 taken?)"; st=1; fi
  [ $st -eq 0 ] || rc=1
done
exit $rc
'''
# from: .github/workflows/ci.yml@16618f454c ("go test -coverprofile=cover-profile.out -short -race ./...": -short
#       kept, -race and coverage left out); AGENTS.md@16618f454c ("go test -race -short ./...").
# unverified: never run; the walk up to the nearest folder holding .go files is ours.
test_package = '''
. "$BENCH_CACHE/go-env.sh"
p={package}
while [ "$p" != . ] && ! compgen -G "$p/*.go" > /dev/null; do p=$(dirname "$p"); done
go test -count=1 -short "./$p"
'''
# The folder of the changed file, cut at testdata/ (a Go package is a folder); a root file gives "." (the root
# package caddy, about 20 s).
package_of = 'regex:^(.*?)(?:/testdata/.*|/[^/]*)$'
# from: Go's testing output: "--- FAIL: TestX (0.00s)", subtests indented "    --- FAIL: TestX/sub (0.00s)".
failed = '^\s*--- FAIL: (\S+)'
timeout_minutes = 30
# from: ci.yml@16618f454c env GOFLAGS '-tags=nobadger,nomysql,nopgx' and GODEBUG http2xconnect=1 (CI sets it from
# about 2026-10-09; older toolchains ignore an unknown GODEBUG key). GOMODCACHE/GOCACHE are not here: the table is
# set literally and Go wants absolute paths; go-env.sh sets them. GOSUMDB must stay sum.golang.org: a cached
# golang.org/toolchain module is still checked against the (cached) checksum database, and GOSUMDB=off fails that.
env = { GOTOOLCHAIN = "auto", GOPROXY = "off", GOSUMDB = "sum.golang.org", GOFLAGS = "-mod=mod -tags=nobadger,nomysql,nopgx", GODEBUG = "http2xconnect=1", BASH_ENV = "$BENCH_CACHE/go-env.sh", BASH_DEFAULT_TIMEOUT_MS = "1800000", BASH_MAX_TIMEOUT_MS = "7200000", GOMODCACHE = "/srv/rail-bench/cache/caddy/gomod", GOCACHE = "/srv/rail-bench/cache/caddy/gocache" }
[rail.config.commands]
# Rail's setup in a new worktree, offline: modules, toolchain and build cache are shared through $BENCH_CACHE, so
# this only checks that the toolchain and modules resolve offline, and compiles the worktree once.
# from: AGENTS.md@16618f454c (Build & Test: go build). unverified: offline in a fresh worktree not tried.
setup = '''
. "$BENCH_CACHE/go-env.sh"
go version && go build ./...
'''
# Fast part always: gofmt of the changed .go files and go build ./... . Then go vet and go test -short of each
# package the branch changes against $RAIL_BASE.
# from: AGENTS.md@16618f454c (go test -race -short ./...; golangci-lint run, which enables govet), lint.yml@16618f454c
# (golangci-lint "latest"). unverified: golangci-lint left out (not installed, CI's version is "latest", so it cannot
# be pinned offline); plain go vet is the part of it that ships with Go; timings estimated.
verify = '''
set -euo pipefail
. "$BENCH_CACHE/go-env.sh"
base="${RAIL_BASE:-refs/heads/main}"
changed=$( { git diff --name-only "$base" --; git ls-files --others --exclude-standard; } | grep -vE '^\.(rail|claude)/' | sort -u || true)
gofiles=$(printf '%s\n' "$changed" | grep -E '\.go$' | while read -r f; do if [ -f "$f" ]; then echo "$f"; fi; done || true)
if [ -n "$gofiles" ]; then
  bad=$(printf '%s\n' "$gofiles" | xargs gofmt -l)
  if [ -n "$bad" ]; then echo "gofmt -w needed on: $bad"; exit 1; fi
fi
go build ./...
pkgs=$(printf '%s\n' "$changed" | while read -r f; do
  [ -n "$f" ] || continue
  d=$(dirname "$f"); d=${d%%/testdata/*}; d=${d%/testdata}
  while [ "$d" != . ] && ! compgen -G "$d/*.go" > /dev/null; do d=$(dirname "$d"); done
  echo "./$d"
done | sort -u || true)
if [ -n "$pkgs" ]; then
  go vet $pkgs
  go test -count=1 -short $pkgs
fi
'''
timeout_secs = 1800
setup_timeout_secs = 900
verify_timeout_secs = 1800

# The bench's additions, the same for every project file of this set:
# - [commands] env BASH_DEFAULT_TIMEOUT_MS and BASH_MAX_TIMEOUT_MS: the Bash tool limits Rail's own
#   .claude/settings.json gives its worker, given to every child, so a plain arm's Bash tool is not cut at
#   two minutes while Rail's runs for thirty.
# - [commands] env GOMODCACHE and GOCACHE: the paths go-env.sh exports, written out for the store
#   /srv/rail-bench (BENCH_STORE), so a child's Go finds the cached modules and toolchain even if its shell
#   does not read BASH_ENV.
# - [rail.config.worker] ladder: the Rail arm of the first run (PLAN section 6, owner 2026-11-25): Sonnet 5.5
#   medium, then Opus 5.5 medium. It sits here because an arm file can give only one rung (bench/arms.py);
#   person_ladder and contract stay as Rail's seed has them.
# - [rail.config.claim] stale_minutes: above the longest Rail command's limit plus save_minutes (10), as
#   `rail docs config` asks.
[rail.config.worker]
ladder = ["claude-sonnet-5-5:medium", "claude-opus-5-5:medium"]

[rail.config.claim]
stale_minutes = 45

# caddy-01: Clearing a handler read deadline after reading the body should not re-arm read_body as a hard deadline
# that cancels long requests and truncates their responses.
# issue opened 2026-11-10, fix opened 2026-11-10, squash (or single commit); source files:
# modules/caddyhttp/idletimeout.go, modules/caddyhttp/server.go (14 lines); request from body (never edited).
# reading notes: Body is HTML-pasted and truncated but readable; text names the cause; server test uses 100ms/300ms
# timing with wide margin.
[[situation]]
id = "caddy-01"
request = """
v2.11.9: clearing a handler read deadline installs read_body as a hard deadline, truncating responses of requests longer than read_body (regression from #8284)

### Issue Details

<html>
<body>
<!--StartFragment--><p style="white-space: pre-wrap; margin-top: 0.1em; margin-bottom: 0.2em; unicode-bidi: plaintext; color: rgb(248, 248, 242); font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif; font-size: 13px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: start; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; background-color: rgb(33, 34, 44); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;">Since v2.11.9, a handler that calls <code style="font-family: monospace; color: rgb(215, 186, 125); background: none 0% 0% / auto repeat scroll padding-box border-box rgba(255, 255, 255, 0.1); padding: 2px 4px; border-radius: 3px; word-break: break-word; font-size: 0.9em;">http.ResponseController(w).SetReadDeadline(time.Time{})</code> after reading the request body gets a hard read deadline of request start + <code style="font-family: monospace; color: rgb(215, 186, 125); background: none 0% 0% / auto repeat scroll padding-box border-box rgba(255, 255, 255, 0.1); padding: 2px 4px; border-radius: 3px; word-break: break-word; font-size: 0.9em;">read_body</code> installed on the connection. When the request runs longer than <code style="font-family: monospace; color: rgb(215, 186, 125); background: none 0% 0% / auto repeat scroll padding-box border-box rgba(255, 255, 255, 0.1); padding: 2px 4px; border-radius: 3px; word-break: break-word; font-size: 0.9em;">read_body</code>, net/http's background read hits that deadline and cancels the request context. Every write after that is dropped. The client gets <code style="font-family: monospace; color: rgb(215, 186, 125); background: none 0% 0% / auto repeat scroll padding-box border-box rgba(255, 255, 255, 0.1); padding: 2px 4px; border-radius: 3px; word-break: break-word; font-size: 0.9em;">200</code>, a truncated body, and a cleanly terminated chunked stream. Nothing is logged.</p><p style="white-space: pre-wrap; margin-top: 0.1em; margin-bottom: 0.2em; unicode-bidi: plaintext; color: rgb(248, 248, 242); font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif; font-size: 13px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: start; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; background-color: rgb(33, 34, 44); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;">FrankenPHP hits this on every request that reads <code style="font-family: monospace; color: rgb(215, 186, 125); background: none 0% 0% / auto repeat scroll padding-box border-box rgba(255, 255, 255, 0.1); padding: 2px 4px; border-radius: 3px; word-break: break-word; font-size: 0.9em;">php://input</code>. In <code style="font-family: monospace; color: rgb(215, 186, 125); background: none 0% 0% / auto repeat scroll padding-box border-box rgba(255, 255, 255, 0.1); padding: 2px 4px; border-radius: 3px; word-break: break-word; font-size: 0.9em;">go_read_post</code> it sets a deadline before each body read (<code style="font-family: monospace; color: rgb(215, 186, 125); background: none 0% 0% / auto repeat scroll padding-box border-box rgba(255, 255, 255, 0.1); padding: 2px 4px; border-radius: 3px; word-break: break-word; font-size: 0.9em;">request_body_timeout</code>) and clears it at the end. Frameworks like Slim 3 read <code style="font-family: monospace; color: rgb(215, 186, 125); background: none 0% 0% / auto repeat scroll padding-box border-box rgba(255, 255, 255, 0.1); padding: 2px 4px; border-radius: 3px; word-break: break-word; font-size: 0.9em;">php://input</code> on every request, GET included, so any slow endpoint is affected, in both classic and worker mode.</p><p style="white-space: pre-wrap; margin-top: 0.1em; margin-bottom: 0.2em; unicode-bidi: plaintext; color: rgb(248, 248, 242); font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif; font-size: 13px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: start; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; background-color: rgb(33, 34, 44); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;"><strong>Cause</strong></p><p style="white-space: pre-wrap; margin-top: 0.1em; margin-bottom: 0.2em; unicode-bidi: plaintext; color: rgb(248, 248, 242); font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif; font-size: 13px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: start; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; background-color: rgb(33, 34, 44); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;">In <code style="font-family: monospace; color: rgb(215, 186, 125); background: none 0% 0% / auto repeat scroll padding-box border-box rgba(255, 255, 255, 0.1); padding: 2px 4px; border-radius: 3px; word-break: break-word; font-size: 0.9em;">IdleTimeoutReader.SetReadDeadline</code>, a zero deadline clears <code style="font-family: monospace; color: rgb(215, 186, 125); background: none 0% 0% / auto repeat scroll padding-box border-box rgba(255, 255, 255, 0.1); padding: 2px 4px; border-radius: 3px; word-break: break-word; font-size: 0.9em;">handlerDeadline</code>, but <code style="font-family: monospace; color: rgb(215, 186, 125); background: none 0% 0% / auto repeat scroll padding-box border-box rgba(255, 255, 255, 0.1); padding: 2px 4px; border-radius: 3px; word-break: break-word; font-size: 0.9em;">ceilingLocked()</code> then returns <code style="font-family: monospace; color: rgb(215, 186, 125); background: none 0% 0% / auto repeat scroll padding-box border-box rgba(255, 255, 255, 0.1); padding: 2px 4px; border-radius: 3px; word-break: break-word; font-size: 0.9em;">HardDeadline</code>. That value is installed with <code style="font-family: monospace; color: rgb(215, 186, 125); background: none 0% 0% / auto repeat scroll padding-box border-box rgba(255, 255, 255, 0.1); padding: 2px 4px; border-radius: 3px; word-break: break-word; font-size: 0.9em;">Ctrl.SetReadDeadline</code> even though the body has already been fully read. Before #8284, the call went straight to the connection and a zero value removed the deadline. The PR description says "A zero deadline removes the ceiling", but in practice it re-arms <code style="font-family: monospace; color: rgb(215, 186, 125); background: none 0% 0% / auto repeat scroll padding-box border-box rgba(255, 255, 255, 0.1); padding: 2px 4px; border-radius: 3px; word-break: break-word; font-size: 0.9em;">read_body</code>.</p><p style="white-space: pre-wrap; margin-top: 0.1em; margin-bottom: 0.2em; unicode-bidi: plaintext; color: rgb(248, 248, 242); font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif; font-size: 13px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: start; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; background-color: rgb(33, 34, 44); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;"><strong>Reproduction</strong> (FrankenPHP 1.13.5 / Caddy 2.11.9, also with FrankenPHP built against Caddy 2.11.7 for comparison)</p><div class="codeBlockWrapper_-a7MRw" style="position: relative; margin: 8px 0px; color: rgb(248, 248, 242); font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif; font-size: 13px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: start; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: normal; background-color: rgb(33, 34, 44); text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;"><button class="copyButton_CEmTFw copyButton_-a7MRw" title="Copy code" aria-label="Copy code to clipboard" style="color: rgb(248, 248, 242); font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif; font-size: 13px; background: none 0% 0% / auto repeat scroll padding-box border-box rgb(40, 42, 54); border: 0.666667px solid rgba(248, 248, 242, 0.2); cursor: pointer; opacity: 0; display: flex; border-radius: 4px; justify-content: center; align-items: center; padding: 4px; transition: opacity 0.15s, background 0.15s; position: absolute; top: 4px; right: 4px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" data-slot="icon" class="copyIcon_CEmTFw"><path fill-rule="evenodd" d="M15.988 3.012A2.25 2.25 0 0 1 18 5.25v6.5A2.25 2.25 0 0 1 15.75 14H13.5v-3.379a3 3 0 0 0-.879-2.121l-3.12-3.121a3 3 0 0 0-1.402-.791 2.252 2.252 0 0 1 1.913-1.576A2.25 2.25 0 0 1 12.25 1h1.5a2.25 2.25 0 0 1 2.238 2.012ZM11.5 3.25a.75.75 0 0 1 .75-.75h1.5a.75.75 0 0 1 .75.75v.25h-3v-.25Z" clip-rule="evenodd"></path><path d="M3.5 6A1.5 1.5 0 0 0 2 7.5v9A1.5 1.5 0 0 0 3.5 18h7a1.5 1.5 0 0 0 1.5-1.5v-5.879a1.5 1.5 0 0 0-.44-1.06L8.44 6.439A1.5 1.5 0 0 0 7.378 6H3.5Z"></path></svg></button><pre style="overflow-x: auto; white-space: pre; color: rgb(248, 248, 242); background: none 0% 0% / auto repeat scroll padding-box border-box rgba(10, 10, 10, 0.4); box-sizing: border-box; border-radius: 4px; max-width: 100%; margin: 0px; padding: 8px;"><code class="language-caddyfile" style="font-family: monospace; color: inherit; background: 0px 0px; padding: 0px; border-radius: 3px; word-break: break-word; font-size: 0.9em;">{
	servers {
		timeouts {
			read_body 60s
		}
	}
}
:8080 {
	root * /app/public
