id = "pandas-09"
request = """
BUG: Index comparison with itself skips nullable dtype semantics (numpy bool instead of boolean with NA)

### Pandas version checks

- [x] I have checked that this issue has not already been reported.

- [x] I have confirmed this bug exists on the [latest version](https://pandas.pydata.org/docs/whatsnew/index.html) of pandas.

- [x] I have confirmed this bug exists on the [main branch](https://pandas.pydata.org/docs/dev/getting_started/install.html#installing-the-development-version-of-pandas) of pandas.


### Reproducible Example

```python
#
import pandas as pd

idx = pd.Index([1, pd.NA], dtype="Int64")

idx != idx
# array([False,  True])            <- numpy bool, True at the NA position

idx != idx.copy()
# <BooleanArray> [False, <NA>]  dtype: boolean

pd.Series([1, pd.NA], dtype="Int64") != pd.Series([1, pd.NA], dtype="Int64")
# 0    False
# 1     <NA>
# dtype: boolean
```

### Issue Description

Index._cmp_method has a fastpath for self.is_(other) that builds a plain np.ones/np.zeros bool array and sets the NA positions to False (for ==, <=, >=) or True (for !=), regardless of the index dtype. For nullable dtypes this gives a different dtype and different values from every other comparison path:

|  | idx != idx (identity fastpath) | idx != idx.copy() |
| --- | --- | --- |
| Int64 | ndarray[bool] [False, True] | BooleanArray [False, <NA>] |
| Float64 | ndarray[bool] [False, True] | BooleanArray [False, <NA>] |
| boolean | ndarray[bool] [False, True] | BooleanArray [False, <NA>] |
| string | ndarray[bool] [False, True] | ArrowExtensionArray bool[pyarrow] [False, <NA>] |
| float64 | ndarray[bool] [False, True] | ndarray[bool] [False, True] |

Series, IntegerArray and the non-identity Index path all return boolean dtype with <NA> where a value is missing. Only the identity fastpath differs. Same for ==, <= and >=.
Came up in #70869, where a test pinning the current fastpath output was dropped per review ("this looks buggy. dont we expect the Int64 case to return with boolean dtype?").

### Expected Behavior

idx != idx returns the same result as idx != idx.copy(): for extension dtypes, the array's own comparison result (boolean / bool[pyarrow] with <NA> at missing positions). The fastpath can stay for numpy dtypes, where its output already matches the slow path.

