# metadata cannot round-trip such subtypes; it should convert and round-trip.
# issue opened 2026-09-01, fix opened 2026-09-02, squash (or single commit); source files:
# pandas/core/arrays/arrow/extension_types.py, pandas/core/arrays/interval.py, pandas/core/dtypes/dtypes.py (52
