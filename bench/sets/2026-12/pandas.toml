id = "pandas-11"
request = """
BUG: interval_range silently produces empty intervals and incorrect interval counts for large int64 values

### Pandas version checks

- [x] I have checked that this issue has not already been reported.

- [x] I have confirmed this bug exists on the [latest version](https://pandas.pydata.org/docs/whatsnew/index.html) of pandas.

- [x] I have confirmed this bug exists on the [main branch](https://pandas.pydata.org/docs/dev/getting_started/install.html#installing-the-development-version-of-pandas) of pandas.


### Reproducible Example

```python
import pandas as pd

start = 2**53

result = pd.interval_range(
    start=start,
    end=start + 4,
    freq=1,
)

print("Pandas version:", pd.__version__)
print("Number of intervals:", len(result))
print("Generated intervals:", result.tolist())
print("Empty intervals:", result.is_empty.tolist())

expected = [
    (start + i, start + i + 1)
    for i in range(4)
]

print("Expected interval boundaries:", expected)
```

### Issue Description

`pd.interval_range()` can silently generate incorrect intervals when numeric endpoints are large integers, particularly around `2**53`, where floating-point precision becomes insufficient to represent consecutive integers accurately.

For example, consider:

```python
pd.interval_range(
    start=2**53,
    end=2**53 + 4,
    freq=1,
)
```

This operation should produce four consecutive, nonempty intervals, each with a width of one.

However, in the reproduced failure, pandas returns only three intervals, all having identical left and right boundaries.

**Observed behavior:**

```text
Number of intervals: 3

(9007199254740992, 9007199254740992]
(9007199254740992, 9007199254740992]
(9007199254740992, 9007199254740992]

Empty intervals: [True, True, True]
```

**Potential root cause:**

The numeric interval-generation logic in `pandas/core/indexes/interval.py` contains the following implementation:

```python
breaks = np.arange(
    start,
    end + (freq * 0.1),
    freq,
)
```

The expression `end + (freq * 0.1)` introduces floating-point arithmetic into range generation.

For sufficiently large integer endpoints, this can cause the generated boundaries to lose precision because consecutive integers cannot always be represented exactly using `float64`.

The resulting boundaries may collapse to identical values.

The subsequent conversion back to integer types cannot recover the original precision.

**Impact:**

This behavior can cause:

* Silent generation of incorrect interval boundaries.
* Incorrect numbers of intervals.
* Zero-width intervals despite a positive frequency.
* Potentially incorrect results in downstream interval-based operations.

Because no exception is raised, applications may unknowingly continue processing an invalid `IntervalIndex`.

The issue is particularly relevant to applications using large integer timestamps, identifiers, or numerical ranges.

**Suggested direction for investigation:**

Consider preserving integer arithmetic when `start`, `end`, and `freq` are all integers, avoiding unnecessary floating-point conversions when constructing interval boundaries.

Regression tests should cover integer endpoints near and above `2**53`, including verification of interval count, boundary accuracy, and nonempty intervals.


### Expected Behavior

`pd.interval_range()` should preserve integer precision and generate the correct number of intervals when integer endpoints and integer frequencies are provided.

For the following input:

```python
pd.interval_range(
    start=2**53,
    end=2**53 + 4,
    freq=1,
)
```

The expected result is four consecutive intervals:

```text
(9007199254740992, 9007199254740993]
(9007199254740993, 9007199254740994]
(9007199254740994, 9007199254740995]
(9007199254740995, 9007199254740996]
```

Expected properties:

```text
Number of intervals: 4

Empty intervals:
[False, False, False, False]
```

Each interval should have a width of exactly one.

The generated boundaries should remain accurate regardless of the magnitude of the input integers, provided the values are representable within the supported integer dtype.

The function should not silently lose precision, generate zero-width intervals, or return fewer intervals than expected.


