# pandas-01: Styler.set_tooltips with as_title_attribute=True puts titles on the wrong cells when rows are hidden and
# raises IndexError when the last row is hidden or the body is trimmed by max_rows.
# issue opened 2026-10-17, fix opened 2026-10-21, squash (or single commit); source files:
# pandas/io/formats/style_render.py (23 lines); request from body (never edited).
# reading notes: text names cause and fix approach; likely AI-drafted report; tests also cover max_columns trimming, a
# natural extension
[[situation]]
id = "pandas-01"
request = """
BUG: Styler title-mode tooltips misplaced or IndexError when rows are hidden

### Pandas version checks

- [x] I have checked that this issue has not already been reported.

- [x] I have confirmed this bug exists on the [latest version](https://pandas.pydata.org/docs/whatsnew/index.html) of pandas.

- [ ] I have confirmed this bug exists on the [main branch](https://pandas.pydata.org/docs/dev/getting_started/install.html#installing-the-development-version-of-pandas) of pandas.

### Reproducible Example

```python
import pandas as pd

df = pd.DataFrame({"A": [1, 2, 3], "B": [4, 5, 6]}, index=["a", "b", "c"])
tt = pd.DataFrame({"A": ["ta", "tb", ""], "B": ["", "", ""]}, index=df.index)

html = (
    df.style.set_uuid("t")
    .hide(["a"])
    .set_tooltips(tt, as_title_attribute=True)
    .to_html()
)
print("hide(['a']), title mode, cells with a title:")
for line in html.splitlines():
    if "title=" in line:
        print("  ", line.strip())
print("expected: one title, title=\\"tb\\" on row 'b' column A; 'ta' belongs to the hidden row 'a'")
print()

big = pd.DataFrame({"A": range(5)})
big_tt = pd.DataFrame({"A": [f"t{i}" for i in range(5)]})
cases = [
    ("hide(['c'])", lambda: df.style.hide(["c"]), tt, {}),
    ("5 rows, to_html(max_rows=2)", lambda: big.style, big_tt, {"max_rows": 2}),
]
for label, make, tips, kw in cases:
    for as_title in [False, True]:
        try:
            make().set_tooltips(tips, as_title_attribute=as_title).to_html(**kw)
            result = "rendered"
        except Exception as err:
            result = f"{type(err).__name__}: {err}"
        print(f"{label}, as_title_attribute={as_title} -> {result}")
print("expected: both modes render")
```

### Issue Description

With `set_tooltips(..., as_title_attribute=True)`, hiding a row puts the tooltips on the wrong cells: after `hide(["a"])`, row b shows row a's tooltip `"ta"`, row a's empty tooltip appears as `title=""` on row b, and row b's tooltip lands on row c. Hiding the last row, or trimming with `max_rows`, raises `IndexError: list index out of range`. The default span mode renders the same inputs correctly.

Output on 3.0.6 (jinja2 3.1.6):

```
hide(['a']), title mode, cells with a title:
   <td id="T_t_row1_col0" class="data row1 col0"  title="ta">2</td>
   <td id="T_t_row1_col1" class="data row1 col1"  title="">5</td>
   <td id="T_t_row2_col0" class="data row2 col0"  title="tb">3</td>
expected: one title, title="tb" on row 'b' column A; 'ta' belongs to the hidden row 'a'

hide(['c']), as_title_attribute=False -> rendered
hide(['c']), as_title_attribute=True -> IndexError: list index out of range
5 rows, to_html(max_rows=2), as_title_attribute=False -> rendered
5 rows, to_html(max_rows=2), as_title_attribute=True -> IndexError: list index out of range
expected: both modes render
```

`Tooltips._translate` in title mode (`pandas/io/formats/style_render.py` 2400-2413 at 03e5d938ad, added in #56981 for 3.0.0) loops over every row of `tt_data` and indexes `d["body"]` with that raw row number. `_translate_body` (705-710) has already left out hidden rows, and `_check_trim` (757-762) cuts the body at `max_rows` or `max_elements`, so the body is shorter than `tt_data` and every index below a hidden or trimmed row is off. The condition at 2404-2408 is `not mask or hidden_row or hidden_col`, while the span mode (2379-2383) uses `not (mask or hidden_row or hidden_col)`, so every cell of a hidden row or column is selected, masked or not; that is what pushes the index past the body. `test_tooltip.py` only hides an index level.

A fix would follow the span branch: walk the rendered body rows with their original row index (the `row_tup` that `_translate_body` already carries), skip masked and hidden cells, and stop at the trimmed length. A hidden-row test and a trimmed test in title mode would cover it.

I ran this on pandas 3.0.6. I have not run it on a main build, but the code cited above is unchanged on main at 03e5d938ad.

### Expected Behavior

Title mode renders whatever span mode renders. In the first case only row b, column A gets a title, `title="tb"`; hiding row c and `max_rows=2` render without an error.

### Installed Versions

<details>

```

INSTALLED VERSIONS
------------------
commit                : 2905718b126579d2cf0fe5bae05bd75facb67d77
python                : 3.12.3
python-bits           : 64
OS                    : Linux
OS-release            : 7.1.5-76070105-generic
Version               : #202607241434~1787955023~24.04~38a419f SMP PREEMPT_DYNAMIC Fri A
machine               : x86_64
processor             : x86_64
byteorder             : little
LC_ALL                : None
