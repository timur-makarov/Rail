# Settings: written by reading the project's CI and docs at the oldest and newest start commit, nothing run;
# every command marked `unverified` is for the admission session to try and fix. Notes: notes/pandas.md.
# Situations: every candidate of bench-candidates/pandas.toml (REPORT-window-rule.md, 2026-11-26), in its order,
# all 29 of them.
# half is `work` for every candidate until the split after admission and the hardness runs (cloud/README.md).
# hidden_tests: the fix's changed files (start..fix, compare API) that match [project] tests or the travel
# globs ["pandas/conftest.py"],
# and not ["pandas/_testing/**", "pandas/_libs/**"]; deleted files left out.
# self_filed: the issue's author opened the fix. bot_filed: the issue's author is an automation account
# (a login ending in bot or -ci, or turso-github-handyman, roboturso). security_trap: the reading pass's
# flag for a request whose natural fix invites a flaw. kind race is the race flag.

# pandas-dev/pandas for Rail's bench. Read-only work of 2026-11-26: nothing here was run; see pandas.md.
# Oldest start read: 518f2a3cb9504555b40c1d5aaab4690245a7d265 (2026-08-14); newest: 717bcd3eda554a0b2e826889f9e30efbd88f00cd
# (2026-11-22). Shorthand below: OLD = 518f2a3c, NEW = 717bcd3e.
#
# pandas is Cython/C/C++ built with meson-python; CI builds it as an editable install (pip install -e . with
# builddir=build/ENV), which records absolute paths and rebuilds on import: unusable once the copy moves. Here:
# - the venv lives in $BENCH_CACHE/venvs/KEY (hash of its inputs; hardlinked from the uv cache) and the copy holds a
#   symlink `.venv` to it; pandas itself is NOT installed in it (CI also uninstalls the pandas that dependencies pull);
# - setup builds a wheel once (pip wheel --no-build-isolation, builddir=build/bench) and unpacks only the compiled
#   modules (*.so, gitignored) and pandas/_version_meson.py (put in .git/info/exclude) into the source tree, so
#   `python -m pytest` from the root imports the copy's own pandas;
# - setup writes two helpers into .git/bench/ (git keeps .git out of every diff; Rail worktrees share it):
#   build.sh hashes every .pyx/.pxd/.pxi.in/.c/.h/.cpp/meson.build file and, when the hash differs from the last
#   build in this checkout (a change touched compiled code: 7 of the 29 candidate fixes do), rebuilds offline and
#   puts the new modules in place; targets.sh maps source paths to pandas/tests targets.

[project]
name = "pandas"
repo = "https://github.com/pandas-dev/pandas"
language = "python"
package = "pandas"
tests = ["pandas/tests/**"]
build_dirs = ["build"]

[commands]
# unverified: no project source does it this way; CI uses pixi (conda-forge) and an editable build.
# from: pixi.toml@NEW [tasks.build-pandas] ("python -m pip install ... . --no-build-isolation --no-deps
#   --config-settings builddir=build/$PIXI_ENVIRONMENT_NAME"), [tasks.uninstall-pandas], requirements-dev.txt@OLD and
#   @NEW (the pip list of the same environment, docs tooling dropped), pyproject.toml@NEW [build-system],
#   meson.build@NEW (_version_meson.py, subprojects fast_float and xsimd fetched by meson wraps).
setup = '''
set -euo pipefail
# Network is on only here. Every later command runs offline.
unset UV_OFFLINE UV_PYTHON_DOWNLOADS
export UV_CACHE_DIR="$BENCH_CACHE/uv" UV_PYTHON_INSTALL_DIR="$BENCH_CACHE/python" UV_PYTHON_PREFERENCE=only-managed \
       UV_LINK_MODE=hardlink UV_COMPILE_BYTECODE=1 UV_NO_PROGRESS=1
root=$PWD

# 1. Compilers and ccache (ccache, if there, makes the offline rebuilds of later copies faster). Best effort.
if [ "$(id -u)" = 0 ] && command -v apt-get >/dev/null 2>&1; then
  want_pkgs=""
  for p in g++ pkg-config ccache; do dpkg -s "$p" >/dev/null 2>&1 || want_pkgs="$want_pkgs $p"; done
  if [ -n "$want_pkgs" ]; then
    apt-get update -qq || true
    DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $want_pkgs >/dev/null 2>&1 \
      || echo "bench: apt could not install$want_pkgs (continuing)"
  fi
fi

# 2. Python 3.13 from uv (with headers, for the build). pandas supports 3.11-3.14; CI tests all four.
uv python install 3.13
py=$(uv python find 3.13)

# 3. Packages as they were on the start commit's day: git archive stamped every file with the commit's time.
newer=$(date -u -d "@$(stat -c %Y pyproject.toml)" +%Y-%m-%dT%H:%M:%SZ)
req=$(mktemp); breq=$(mktemp); trap 'rm -f "$req" "$breq"' EXIT
grep -vE '^(sphinx|nbsphinx|pydata-sphinx-theme|numpydoc|nbconvert|notebook|ipywidgets|jupyterlite|pandoc|asv|mypy|pre-commit|types-|scipy-stubs|py-rattler|PyQt5|pytest-qt|https?:)' \
  requirements-dev.txt > "$req"
python3 -c 'import sys, tomllib; print("\n".join(tomllib.load(open("pyproject.toml", "rb"))["build-system"]["requires"]))' > "$breq"

# 4. The venv, in $BENCH_CACHE, named by a hash of its inputs; built once, under a lock.
key=$( { echo "pandas-venv-1 $py $newer"; cat "$req" "$breq"; } | sha256sum | cut -c1-16)
venv="$BENCH_CACHE/venvs/$key"
mkdir -p "$BENCH_CACHE/venvs"
exec 9>"$venv.lock"
flock 9
if [ ! -f "$venv/.bench-ok" ]; then
  rm -rf "$venv"
  uv venv -q --python "$py" "$venv"
  uv pip install -q --no-config --python "$venv/bin/python" --exclude-newer "$newer" -r "$req" -r "$breq" pip
  uv pip uninstall -q --python "$venv/bin/python" pandas || true
  touch "$venv/.bench-ok"
fi
flock -u 9
ln -sfn "$venv" .venv
for x in /.venv /pandas/_version_meson.py; do grep -qxF "$x" .git/info/exclude || echo "$x" >> .git/info/exclude; done

# 5. The helpers, kept in .git/bench/ so they travel with every copy and stay out of every diff.
mkdir -p .git/bench
cat > .git/bench/build.sh <<'SH'
#!/usr/bin/env bash
# Written by the bench's setup. Makes pandas' compiled modules in this checkout match its compiled sources, offline:
# nothing to do when the sources hash to what build/bench.stamp says; else build a wheel and unpack its *.so files.
set -euo pipefail
root=$(git rev-parse --show-toplevel)
cd "$root"
sum=$( { find pandas -type f \( -name '*.pyx' -o -name '*.pxd' -o -name '*.pxi.in' -o -name '*.c' -o -name '*.h' \
           -o -name '*.cpp' -o -name '*.hpp' -o -name meson.build \) -print0 | LC_ALL=C sort -z | xargs -0 sha1sum
         sha1sum meson.build generate_pxi.py generate_version.py
         if [ -f meson.options ]; then sha1sum meson.options; fi; } | sha1sum | cut -c1-40)
if [ "$(cat build/bench.stamp 2>/dev/null)" = "$sum" ] && compgen -G 'pandas/_libs/lib.*.so' >/dev/null; then exit 0; fi
echo "bench: pandas' compiled sources differ from the last build here; building (several minutes)" >&2
export PATH="$root/.venv/bin:$PATH"
if command -v ccache >/dev/null 2>&1; then
  export CCACHE_DIR="${BENCH_CACHE:-$root/build}/ccache" CCACHE_BASEDIR="$root" CCACHE_NOHASHDIR=true
fi
[ "$(cat build/bench/.bench-root 2>/dev/null)" = "$root" ] || rm -rf build/bench
rm -rf build/bench-dist
mkdir -p build
.venv/bin/python -m pip wheel . -q --no-build-isolation --no-deps --no-index -w build/bench-dist -Cbuilddir=build/bench >&2
echo "$root" > build/bench/.bench-root
.venv/bin/python - build/bench-dist <<'PY'
import glob, os, sys, zipfile
(whl,) = glob.glob(os.path.join(sys.argv[1], "pandas-*.whl"))
n = 0
with zipfile.ZipFile(whl) as z:
    for name in z.namelist():
        if name.startswith("pandas/") and (name.endswith(".so") or name == "pandas/_version_meson.py"):
            if os.path.lexists(name):
                os.unlink(name)
            with open(name, "wb") as f:
                f.write(z.read(name))
            n += 1
print(f"bench: put {n} built files in place", file=sys.stderr)
PY
rm -rf build/bench-dist
echo "$sum" > build/bench.stamp
SH
cat > .git/bench/targets.sh <<'SH'
#!/usr/bin/env bash
# Written by the bench's setup. Prints the pandas/tests targets for the given paths (or package_of packages, which are
# paths without their extension); nothing for docs; a small core set for what it cannot place.
cd "$(git rev-parse --show-toplevel)"
smoke="pandas/tests/test_common.py pandas/tests/frame/test_constructors.py pandas/tests/series/test_constructors.py"
map() {
  local p=${1%%.*} rel r b d f
  case "$p" in
    ""|.) echo "$smoke"; return ;;
    doc/*|web/*|asv_bench/*) return ;;
    pandas/tests/*)
      if [ -f "$p.py" ]; then echo "$p.py"; return; fi
      d=$p; while [ "$d" != pandas/tests ] && [ ! -d "$d" ]; do d=${d%/*}; done
      if [ "$d" = pandas/tests ]; then echo "$smoke"; else echo "$d"; fi; return ;;
    pandas/*) ;;
    *) echo "$smoke"; return ;;
  esac
  rel=${p#pandas/}; rel=${rel#core/}; rel=${rel#_libs/}
  case "$rel" in
    testing|_testing|_testing/*) echo pandas/tests/util; return ;;
    io/parsers|io/parsers/*) echo pandas/tests/io/parser; return ;;
    lib) echo pandas/tests/libs; return ;;
    conftest|__init__) echo "$smoke"; return ;;
    methods/*) b=${rel#methods/}; f=""
               for d in frame series; do [ -f "pandas/tests/$d/methods/test_$b.py" ] && f="$f pandas/tests/$d/methods/test_$b.py"; done
               if [ -n "$f" ]; then echo "$f"; return; fi ;;
  esac
  r=$rel
  while [ -n "$r" ]; do
    if [ -d "pandas/tests/$r" ]; then echo "pandas/tests/$r"; return; fi
    b=${r##*/}; if [ "$b" = "$r" ]; then d=""; else d=${r%/*}; fi
    f="pandas/tests/${d:+$d/}test_$b.py"
    if [ -f "$f" ]; then echo "$f"; return; fi
    r=$d
  done
  echo "$smoke"
}
for a in "$@"; do map "$a"; done | tr ' ' '\n' | grep . | sort -u
SH

# 6. Build once with the network (meson fetches the fast_float and xsimd wraps into subprojects/, gitignored), then
#    drop the build folder: its absolute paths are useless in a moved copy. The stamp stays.
bash .git/bench/build.sh
rm -rf build/bench

# 7. Smoke: the copy's own pandas, with its compiled modules, is the one imported.
PYTHONPATH="$root" .venv/bin/python -c 'import pandas, sys; assert pandas.__file__.startswith(sys.argv[1]), pandas.__file__; print("bench: pandas", pandas.__version__)' "$root"
df -h "$BENCH_CACHE" . || true
'''
# unverified: the flags are CI's ("python -m pytest -r fE ... -m <markers>"); -n 0 (CI: auto, single_cpu at 0) and
#   the markers deselected here (network: needs internet or moto/S3; db: needs MySQL/Postgres services) are mine.
# from: pixi.toml@NEW [tasks.ci-test-pandas], .github/actions/run-tests/action.yml@NEW,
#   .github/workflows/unit-tests.yml@NEW (pytest_marker_expression "not slow and not network and not single_cpu").
test_files = '''
