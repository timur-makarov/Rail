request = """
BUG: dateutil timezones raise AttributeError with python-dateutil 3.0

### Pandas version checks

- [x] I have checked that this issue has not already been reported.

- [x] I have confirmed this bug exists on the [latest version](https://pandas.pydata.org/docs/whatsnew/index.html) of pandas.

- [x] I have confirmed this bug exists on the [main branch](https://pandas.pydata.org/docs/dev/getting_started/install.html#installing-the-development-version-of-pandas) of pandas.


### Reproducible Example

```python
import pandas as pd

pd.Timestamp("2020-01-01").tz_localize("dateutil/US/Pacific")
```

### Issue Description

With `python-dateutil 3.0.0` (released 2026-10-21), using any `dateutil/...` timezone raises `AttributeError: 'NoneType' object has no attribute 'total_seconds'`. The same code works with `python-dateutil 2.9.0.post0`. It also fails on main (`nightly 3.2.0.dev0+371.gbb4297c4e6`). The pip-based CI jobs are currently failing on it too, for example the `dateutil/US/Pacific` tests in `pandas/tests/arithmetic/test_datetime64.py`.

The cause seems to be `treat_tz_as_dateutil` in `pandas/_libs/tslibs/timezones.pyx`. It detects dateutil timezones by checking for the private attributes `_trans_list` and `_trans_idx`. In dateutil 3.0, `tzfile` moved to `dateutil.tz._tzfile` and no longer has `_trans_list`. So the check returns `False` and `get_dst_info` treats the timezone as having a fixed offset. It calls `utcoffset(None)`, which returns `None` for these timezones, and that leads to the error.

A short-term fix could be pinning `python-dateutil<3`. A longer-term fix would be updating pandas to work with the new dateutil internals.

