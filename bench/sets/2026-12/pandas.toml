# pandas-02: `1 in pd.CategoricalIndex(range(1, 11))` returns False for the first category although the value is in
# the index.
# issue opened 2026-11-19, fix opened 2026-11-21, squash (or single commit); source files:
# pandas/core/indexes/category.py (6 lines); request from oldest of 8 edit records.
# reading notes: test also asserts the engine is not built (`_engine` not in `_cache`), which an existing pre-fix test
# already requires
[[situation]]
id = "pandas-02"
request = """
CategoricalIndex.__contains__ returns False for the first category

### Pandas version checks

- [x] I have checked that this issue has not already been reported.

- [x] I have confirmed this bug exists on the [latest version](https://pandas.pydata.org/docs/whatsnew/index.html) of pandas.

- [ ] I have confirmed this bug exists on the [main branch](https://pandas.pydata.org/docs/dev/getting_started/install.html#installing-the-development-version-of-pandas) of pandas.


### Reproducible Example

```python
import pandas as pd
print(pd.__version__)
index = pd.CategoricalIndex(range(1, 11), ordered=True, name='index')
print(index)
print(index.tolist())
print(1 in index) #First index returns false despite being valid
print(5 in index)
