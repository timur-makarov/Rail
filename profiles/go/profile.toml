# The Go profile. rail init reads it when a tracked manifest below marks Go, and writes what it holds into the
# project's own files (rail docs languages). After init the project's files are the project's.

manifests = ["go.mod"]                                     # file names, matched in any folder
domains = ["proxy.golang.org", "sum.golang.org"]           # the module proxy and the checksum database
generated = ["**/*.pb.go"]                                 # protobuf and gRPC output, left out of the size count
migration_paths = []
tests = ["**/*_test.go", "**/testdata/**"]

# The commands rail init writes into [commands] when the project's config is new: `setup`, and the parts of
# `verify`. Each part names the tool it needs on the machine; `audit` runs only on a change that touches go.sum.
# -race needs cgo and a C compiler. The repository's own commands win over these (rail docs languages).
[[managers]]
name = "go"
lockfile = "go.sum"
setup = "go mod download"
verify = [
  { part = "format", tool = "gofmt", run = 'test -z "$(gofmt -l .)"' },
  { part = "lint", tool = "go", run = "go vet ./..." },
  { part = "lint", tool = "golangci-lint", run = "golangci-lint run" },
  { part = "tests", tool = "go", run = "go test -race ./..." },
  { part = "audit", tool = "govulncheck", run = "govulncheck ./..." },
]

[[rules]]
id = "no-new-go-suppressions"
files = "**/*.go"
forbid = ["//nolint", "t.Skip("]
fix = "Fix the cause instead of silencing the check."
why = "the Go profile: a linter silenced, or a test skipped"
